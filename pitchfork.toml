stop_signal = "SIGINT"

# ── off-chain-agent container (podman) ──────────────────────────────────────
# Build first with: mise run off-chain-agent-image

[daemons.off-chain-agent-container]
run = '''
exec podman run --rm \
  -e APP_ENV -e RUST_LOG \
  -e VIDEO_PROCESSING_WORKER_ENABLED -e VIDEO_PROCESSING_DEDUP_DELAY_SECONDS \
  -e VIDEO_PROCESSING_WORKER_BATCH_SIZE -e VIDEO_PROCESSING_WORKER_PARALLELISM \
  -e VIDEO_PROCESSING_WORKER_TICK_SECONDS -e VIDEO_PROCESSING_MAX_DEDUP_ATTEMPTS \
  -e VIDEO_PROCESSING_MAX_NSFW_ENQUEUE_ATTEMPTS -e VIDEO_PROCESSING_MAX_NSFW_POLL_ATTEMPTS \
  -e VIDEO_PROCESSING_MAX_NSFW_JOB_RETRIES -e VIDEO_PROCESSING_NSFW_POLL_DELAY_SECONDS \
  -e REPORT_APPROVED_NSFW_BAN_ENABLED -e NSFW_API_BASE_URL -e OFF_CHAIN_AGENT_URL \
  -e BACKEND_ADMIN_IDENTITY -e LEADERBOARD_REDIS_URL -e SERVICE_CANISTER_MIGRATION_REDIS_URL \
  -e STORJ_INTERFACE_TOKEN -e GOOGLE_CHAT_REPORT_SPACE_URL -e GOOGLE_SA_KEY \
  -e YRAL_MOBILE_SERVICE_ACCOUNT_KEY -e YRAL_OFF_CHAIN_USER_MIGRATION_API_KEY \
  -e YRAL_METADATA_NOTIFICATION_API_KEY -e NSFW_INTERNAL_REQUEST_HMAC_SECRET \
  -e DRAGONFLY_REDIS_STORE_PASSWORD -e DRAGONFLY_REDIS_STORE_HOSTS \
  -e DRAGONFLY_REDIS_STORE_CA_CERT -e DRAGONFLY_REDIS_STORE_CLIENT_CERT \
  -e DRAGONFLY_REDIS_STORE_CLIENT_KEY \
  -p 50051:50051 test/off-chain-agent
'''
dir = "apps/off-chain-agent"
mise = true
ready_http = "http://localhost:50051/healthz"
stop_signal = "SIGINT"