#:schema https://pitchfork.jdx.dev/schema.json

# Process manager for long-running dev daemons.
# Uses pitchfork's built-in mise integration (mise = true) to wrap commands
# with `mise x --`, which activates tools and env vars from mise.toml.
# Secrets are injected via `fnox exec` inside the command.
#
# All daemons have auto = ["start", "stop"] so they auto-start when entering
# the project directory and auto-stop when leaving (requires
# `pitchfork activate bash` in ~/.bashrc).
#
# Usage:
#   pitchfork start yral-auth          # start the dev server
#   pitchfork stop yral-auth           # stop it
#   pitchfork list                     # see all daemons
#   pitchfork logs yral-auth --tail     # follow logs
#   pitchfork start --all              # start everything
#   pitchfork stop --all               # stop everything
#

[settings.general]
mise = true

[settings.web]
auto_start = true  # Start web UI automatically with supervisor
bind_port = 3120  # Default port (default: 3120)
bind_address = "127.0.0.1"  # Default: localhost only

# ── hello-world dev server (Trunk serve, CSR WASM) ──────────────────────────
# Leptos CSR demo app served by Trunk with hot reload.
# Port 8080 is hardcoded in Trunk's default config.

[daemons.hello-world]
run = "trunk serve --port 8082"
dir = "apps/hello-world"
ready_http = "http://localhost:8082/healthz"
auto = ["start", "stop"]

# ── my-website container (podman) ────────────────────────────────────────────

[daemons.my-website-container]
run = '''
exec podman run --rm \
  -p 8080:80 test/my-website
'''

# ── off-chain-agent dev server (release binary) ─────────────────────────────
# Runs the pre-built musl binary with env vars from mise + secrets from fnox.
# Build first with: mise run off-chain-agent-build
# Port 50051 is hardcoded in the binary.

[daemons.off-chain-agent]
run = "exec fnox exec -- ./target/x86_64-unknown-linux-musl/release/icp-off-chain-agent"
dir = "apps/off-chain-agent"
ready_http = "http://localhost:50051/healthz"
stop_signal = "SIGINT"
auto = ["start", "stop"]

# ── off-chain-agent container (podman) ──────────────────────────────────────
# Build first with: mise run off-chain-agent-image

[daemons.off-chain-agent-container]
run = '''
exec fnox exec -- podman run --rm \
  -e APP_ENV -e RUST_LOG \
  -e OFF_CHAIN_AGENT_URL \
  -e BACKEND_ADMIN_IDENTITY -e LEADERBOARD_REDIS_URL -e SERVICE_CANISTER_MIGRATION_REDIS_URL \
  -e GOOGLE_SA_KEY \
  -e YRAL_OFF_CHAIN_USER_MIGRATION_API_KEY -e YRAL_METADATA_NOTIFICATION_API_KEY \
  -e DRAGONFLY_REDIS_STORE_PASSWORD -e DRAGONFLY_REDIS_STORE_HOSTS \
  -e DRAGONFLY_REDIS_STORE_CA_CERT -e DRAGONFLY_REDIS_STORE_CLIENT_CERT \
  -e DRAGONFLY_REDIS_STORE_CLIENT_KEY \
  -p 50051:50051 test/off-chain-agent
'''
dir = "apps/off-chain-agent"
ready_http = "http://localhost:50051/healthz"
stop_signal = "SIGINT"

# ── SpacetimeDB standalone server ───────────────────────────────────────────
# Local SpacetimeDB instance for the yral-database-spacetime module.
# Required by `spacetimedb-cli dev` (which publishes to http://127.0.0.1:3000).
# In-memory mode — data is lost on restart, which is fine for dev.

[daemons.spacetimedb]
run = "exec spacetimedb-cli start --in-memory --listen-addr 127.0.0.1:3000"
ready_http = "http://127.0.0.1:3000/v1/health"
stop_signal = "SIGINT"
retry = 3
auto = ["start", "stop"]

# ── SpacetimeDB local dev (in-memory, auto-publishes module) ────────────────
# Used by the `dev` group. Starts the local server, publishes the module,
# and stays running. Data is lost on restart (in-memory).
#
# JWT key configuration: the local server verifies JWTs using yral-auth's
# public ES256 key (JWT_PUB_EC_PEM from mise.toml [env]). The PEM is written
# to a temp file before starting, then passed via --jwt-pub-key-path. This
# makes yral-auth-minted JWTs valid SpacetimeDB tokens — the server derives
# a deterministic Identity from the iss + sub claims.
#
# The private key (JWT_EC_PEM) lives in fnox.toml (age-encrypted). Tests and
# the yral-auth-dev daemon decrypt it via `fnox exec`.

[daemons.spacetimedb-dev]
run = '''
JWT_PUB_FILE=$(mktemp /tmp/spacetimedb-jwt-pub-XXXXXX.pem) && \
JWT_PRIV_FILE=$(mktemp /tmp/spacetimedb-jwt-priv-XXXXXX.pem) && \
printf '%s' "$JWT_PUB_EC_PEM" > "$JWT_PUB_FILE" && \
fnox get JWT_EC_PEM --non-interactive > "$JWT_PRIV_FILE" && \
exec spacetimedb-cli start --in-memory --listen-addr 127.0.0.1:3000 --non-interactive --jwt-pub-key-path "$JWT_PUB_FILE" --jwt-priv-key-path "$JWT_PRIV_FILE"
'''
ready_http = "http://127.0.0.1:3000/v1/health"
stop_signal = "SIGINT"
retry = 3
auto = ["start", "stop"]

[daemons.spacetimedb-dev.hooks]
# Publish the module to the local server once it's ready.
# --env dev loads spacetime.dev.json (server: local) on top of spacetime.json.
on_ready = "spacetimedb-cli build -p apps/yral-database-spacetime && spacetimedb-cli publish --env dev --yes --server local yral-database-spacetime-4lbo7"

# ── yral-auth dev server (release binary) ──────────────────────────────────
# Runs the pre-built musl binary with env vars from mise + secrets from fnox.
# Build first with: mise run yral-auth-build
# dir ensures mise x -- loads the per-app mise.toml [env] (plaintext values).
# fnox exec loads secrets from fnox.toml (age-encrypted).

[daemons.yral-auth]
run = "exec fnox exec -- ./target/x86_64-unknown-linux-musl/release/yral-auth"
dir = "apps/yral-auth"
ready_http = "http://localhost:8080/healthz"
stop_signal = "SIGINT"
auto = ["start", "stop"]
env = { LEPTOS_SITE_ADDR = "0.0.0.0:8080" }

# ── yral-auth container (podman) ───────────────────────────────────────────
# Runs the container image with env vars passed through from mise + fnox.
# Build first with: mise run yral-auth-image

[daemons.yral-auth-container]
run = '''
exec fnox exec -- podman run --rm \
  -e APP_ENV -e GOOGLE_CLIENT_ID -e GOOGLE_CLIENT_SECRET \
  -e APPLE_CLIENT_ID -e APPLE_TEAM_ID -e APPLE_KEY_ID -e APPLE_AUTH_KEY_PEM \
  -e JWT_EC_PEM -e JWT_PUB_EC_PEM \
  -e CLIENT_JWT_ED_PEM -e CLIENT_JWT_PUB_ED_PEM \
  -e COOKIE_KEY -e WHATSAPP_API_KEY \
  -e DRAGONFLY_REDIS_STORE_PASSWORD -e DRAGONFLY_REDIS_STORE_HOSTS \
  -e DRAGONFLY_REDIS_STORE_CA_CERT -e DRAGONFLY_REDIS_STORE_CLIENT_CERT \
  -e DRAGONFLY_REDIS_STORE_CLIENT_KEY \
  -p 8080:8080 test/yral-auth
'''
dir = "apps/yral-auth"
ready_http = "http://localhost:8080/healthz"
stop_signal = "SIGINT"

# ── yral-auth dev (local SpacetimeDB, port 8080) ───────────────────────────
# Dev variant: points SPACETIMEDB_URL to local server (127.0.0.1:3000).
# Depends on spacetimedb-dev being ready (module is published via on_ready hook).
# Build first with: mise run yral-auth-build

[daemons.yral-auth-dev]
run = "exec fnox exec -- ./target/x86_64-unknown-linux-musl/release/yral-auth"
dir = "apps/yral-auth"
ready_http = "http://localhost:8080/healthz"
stop_signal = "SIGINT"
depends = ["spacetimedb-dev"]
auto = ["start", "stop"]
env = { LEPTOS_SITE_ADDR = "0.0.0.0:8080", SPACETIMEDB_URL = "http://127.0.0.1:3000", SPACETIMEDB_DB_NAME = "yral-database-spacetime-4lbo7" }

# ── yral-metadata dev server (release binary) ──────────────────────────────
# Runs the pre-built musl binary with env vars from mise + secrets from fnox.
# Build first with: mise run yral-metadata-build

[daemons.yral-metadata]
run = "exec fnox exec -- ./target/x86_64-unknown-linux-musl/release/yral-metadata-server"
dir = "apps/yral-metadata"
ready_http = "http://localhost:7000/healthz"
stop_signal = "SIGINT"
auto = ["start", "stop"]

# ── yral-metadata container (podman) ────────────────────────────────────────
# Build first with: mise run yral-metadata-image

[daemons.yral-metadata-container]
run = '''
exec fnox exec -- podman run --rm \
  -e APP_ENV -e RUST_LOG -e BIND_ADDRESS \
  -e JWT_PUBLIC_KEY -e YRAL_AUTH_PUBLIC_KEY -e BACKEND_ADMIN_IDENTITY \
  -e DRAGONFLY_REDIS_STORE_PASSWORD -e DRAGONFLY_REDIS_STORE_HOSTS \
  -e DRAGONFLY_REDIS_STORE_CA_CERT -e DRAGONFLY_REDIS_STORE_CLIENT_CERT \
  -e DRAGONFLY_REDIS_STORE_CLIENT_KEY \
  -p 7000:7000 test/yral-metadata
'''
dir = "apps/yral-metadata"
ready_http = "http://localhost:7000/healthz"
stop_signal = "SIGINT"

# ── yral-web dev server (release binary) ─────────────────────────────────
# Runs the pre-built musl binary with env vars from mise + secrets from fnox.
# Build first with: mise run yral-web-build
# dir ensures mise x -- loads the per-app mise.toml [env] (plaintext values).
# fnox exec loads secrets from fnox.toml (age-encrypted) + root fnox.toml (Dragonfly).

[daemons.yral-web]
run = "exec fnox exec -- ../../target/x86_64-unknown-linux-musl/prod-release/yral-web"
dir = "apps/yral-web"
ready_http = "http://localhost:8080/healthz"
stop_signal = "SIGINT"
auto = ["start", "stop"]
env = { LEPTOS_SITE_ADDR = "0.0.0.0:8080", LEPTOS_SITE_ROOT = "../../target/site" }

# ── yral-web container (podman) ──────────────────────────────────────────
# Build first with: mise run yral-web-image

[daemons.yral-web-container]
# fnox exec decrypts secrets from fnox.toml into the env so podman's -e VAR
# (without =value) copies them from the parent process into the container.
# mise = true wraps the whole command with `mise x --` for tools + plaintext [env].
run = '''
exec fnox exec -- podman run --rm \
  -e APP_ENV -e LEPTOS_ENV -e LEPTOS_SITE_ADDR -e LEPTOS_HASH_FILES \
  -e GOOGLE_CLIENT_ID -e GOOGLE_REDIRECT_URL -e YRAL_AUTH_REDIRECT_URL \
  -e YRAL_AUTH_CLIENT_ID \
  -e COOKIE_KEY -e HON_WORKER_JWT -e BACKEND_ADMIN_IDENTITY \
  -e CF_TOKEN -e CF_ACCOUNT_ID \
  -e HETZNER_S3_ACCESS_KEY -e HETZNER_S3_SECRET_KEY \
  -e GRPC_AUTH_TOKEN -e YRAL_AUTH_CLIENT_SECRET -e YRAL_AUTH_MIGRATION_ES256_PEM \
  -e DRAGONFLY_REDIS_STORE_PASSWORD -e DRAGONFLY_REDIS_STORE_HOSTS \
  -e DRAGONFLY_REDIS_STORE_CA_CERT -e DRAGONFLY_REDIS_STORE_CLIENT_CERT \
  -e DRAGONFLY_REDIS_STORE_CLIENT_KEY \
  -p 8080:8080 test/yral-web
'''
dir = "apps/yral-web"
ready_http = "http://localhost:8080/healthz"
stop_signal = "SIGINT"

# ── yral-web dev (local SpacetimeDB, port 8081) ─────────────────────────
# Dev variant: points SPACETIMEDB_URL to local server, uses port 8081 to
# avoid conflict with yral-auth-dev on 8080.
# Build first with: mise run yral-web-build

[daemons.yral-web-dev]
run = "exec fnox exec -- ../../target/x86_64-unknown-linux-musl/prod-release/yral-web"
dir = "apps/yral-web"
ready_http = "http://localhost:8081/healthz"
stop_signal = "SIGINT"
depends = ["spacetimedb-dev", "yral-auth-dev"]
auto = ["start", "stop"]
env = { LEPTOS_SITE_ADDR = "0.0.0.0:8081", LEPTOS_SITE_ROOT = "../../target/site", SPACETIMEDB_URL = "http://127.0.0.1:3000", SPACETIMEDB_DB_NAME = "yral-database-spacetime-4lbo7", GOOGLE_REDIRECT_URL = "http://127.0.0.1:8081/auth/google_redirect", YRAL_AUTH_REDIRECT_URL = "http://127.0.0.1:8081/auth/yral_redirect" }

# ── yral-web watch (cargo leptos watch, hot reload, debug) ──────────────
# Runs cargo leptos watch for hot-reload development. Rebuilds server + WASM
# on file change, live-reloads the browser. Uses debug profiles (fast rebuilds).
# No pre-build needed — cargo leptos watch handles building + serving.
# fnox exec loads secrets from fnox.toml (age-encrypted) + root fnox.toml (Dragonfly).

[daemons.yral-web-watch]
run = "exec fnox exec -- cargo leptos --manifest-path ssr/Cargo.toml watch --hot-reload --bin-features ssr,oauth-ssr"
dir = "apps/yral-web"
ready_output = "Serving at"
stop_signal = "SIGINT"
auto = ["start", "stop"]
env = { LEPTOS_SITE_ADDR = "0.0.0.0:8080" }

# ── Dev group ───────────────────────────────────────────────────────────────
# Start all dev servers with: pitchfork start --group dev
# Dependency order: spacetimedb-dev → (publish module via on_ready hook) →
# yral-auth-dev → yral-web-dev

[groups.dev]
daemons = ["spacetimedb-dev", "yral-auth-dev", "yral-web-dev"]
