#:schema https://fnox.jdx.dev/schema.json

# Secrets for local development — age-encrypted ciphertext, safe to commit.
# Plaintext values are in mise.toml [env]; only secrets go here.
#
# One-time setup:
#   1. mise run bootstrap  — extracts infra SSH key to .yral-infra-ed25519 (repo-local, gitignored)
#   2. fnox set <KEY> --provider age  — encrypt each secret into this file
#   3. Verify: fnox get GITHUB_TOKEN
#
# FNOX_AGE_KEY_FILE is set in mise.toml [env] (./.yral-infra-ed25519) — fnox picks it up automatically.

[providers.age]
type = "age"
# Uses the infra SSH key (Ansible vault_github_actions_ssh_private_key).
# The private key is extracted to ./.yral-infra-ed25519 (repo-local, gitignored) by mise run bootstrap.
# To add team members, append their ssh-ed25519 public key and run: fnox reencrypt -p age
recipients = [
    "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM/H7Jp2RgC1xtg1nyzpmhzOTmUz3n+PQPsk83BzUskg github-actions@yral.com",
]

[secrets]
# GitHub PAT for Flux (source: Ansible vault_github_flux_token)
GITHUB_TOKEN= { provider = "age", value = "", description = "GitHub PAT for Flux", if_missing = "error" }

# Cloudflare API token for DNS management (source: vault_cloudflare_api_token)
CLOUDFLARE_API_TOKEN= { provider = "age", value = "", description = "Cloudflare API token for DNS management", if_missing = "error" }

# Hetzner S3 secret key (source: vault_hetzner_s3_secret_key)
AWS_SECRET_ACCESS_KEY= { provider = "age", value = "", description = "Hetzner S3 secret key", if_missing = "error" }

ACTIONS_IDENTITY_PEM= { provider = "age", value = "" }


# ── Consolidated per-app secrets ───────────────────────────────────────────
# The following secrets were consolidated from per-app fnox.toml files.
# Duplicate-named secrets (BACKEND_ADMIN_IDENTITY) were prefixed with the app name.

# yral-auth
COOKIE_KEY= { provider = "age", value = "", description = "Cookie signing/encryption key", if_missing = "error" }
GOOGLE_CLIENT_SECRET= { provider = "age", value = "", description = "Google OAuth client secret", if_missing = "error" }
APPLE_AUTH_KEY_PEM= { provider = "age", value = "", description = "Apple OAuth private key PEM", if_missing = "error" }
JWT_EC_PEM= { provider = "age", value = "", description = "JWT ES256 private key PEM for signing auth tokens", if_missing = "error" }
CLIENT_JWT_ED_PEM= { provider = "age", value = "", description = "JWT Ed25519 private key PEM for signing client secrets", if_missing = "error" }
WHATSAPP_API_KEY= { provider = "age", value = "", description = "WhatsApp API key (optional — phone auth)", if_missing = "warn" }
SPACETIMEDB_ADMIN_TOKEN= { provider = "age", value = "", description = "yral-auth JWT used as SpacetimeDB admin token for KV store REST calls. Set with: fnox set SPACETIMEDB_ADMIN_TOKEN --provider age", if_missing = "warn" }

# off-chain-agent
OFF_CHAIN_AGENT_BACKEND_ADMIN_IDENTITY= { provider = "age", value = "", description = "IC backend admin identity (ED25519 PEM private key)", default = "", if_missing = "warn" }
YRAL_OFF_CHAIN_USER_MIGRATION_API_KEY= { provider = "age", value = "", description = "User migration API key", default = "", if_missing = "warn" }
YRAL_METADATA_NOTIFICATION_API_KEY= { provider = "age", value = "", description = "Notification API key (optional)", default = "", if_missing = "warn" }
NAITIK_MULTI_SERVICE_API_JWT_TOKEN= { provider = "age", value = "", description = "Naitik multi-service JWT (optional)", default = "", if_missing = "warn" }
YRAL_HON_WORKER_JWT= { default = "", description = "HON worker JWT (optional)", if_missing = "warn" }
ANALYTICS_SERVER_TOKEN= { default = "", description = "Analytics server token", if_missing = "warn" }
BTC_REWARDS_GCHAT_WEBHOOK_URL= { default = "", description = "BTC rewards GChat webhook URL", if_missing = "warn" }
YRAL_METADATA_TOKEN= { provider = "age", value = "" }

# yral-web
HON_WORKER_JWT= { provider = "age", value = "", description = "Worker JWT token for off-chain-agent gRPC auth", default = "", if_missing = "warn" }
YRAL_LEGACY_BACKEND_ADMIN_IDENTITY= { provider = "age", value = "", description = "IC backend admin identity (secp256k1 EC PEM private key)", if_missing = "error" }
HETZNER_S3_ACCESS_KEY= { provider = "age", value = "", description = "Hetzner S3 access key for profile storage", default = "", if_missing = "warn" }
HETZNER_S3_SECRET_KEY= { provider = "age", value = "", description = "Hetzner S3 secret key for profile storage", default = "", if_missing = "warn" }
YRAL_AUTH_CLIENT_SECRET= { provider = "age", value = "", description = "Yral-auth OAuth client secret (feature: oauth-ssr)", if_missing = "warn" }

# yral-metadata
JWT_PUBLIC_KEY= { provider = "age", value = "", description = "Ed25519 public key PEM for JWT validation", default = "", if_missing = "warn" }
YRAL_AUTH_PUBLIC_KEY= { provider = "age", value = "", description = "yral-auth public key PEM for JWT verification", default = "", if_missing = "warn" }
YRAL_METADATA_BACKEND_ADMIN_IDENTITY= { provider = "age", value = "", description = "IC backend admin identity (Secp256k1 PEM private key)", default = "", if_missing = "warn" }
