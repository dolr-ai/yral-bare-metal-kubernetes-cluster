# ── yral-ios (App Store distribution) ─────────────────────────────────────
# Apple-canonical TestFlight/App Store signing via xcodebuild + altool.
# Recreated from scratch 2026-09-01 (Sarvesh's original key material was
# lost — new cert/profile under team 2UL556KNXC, new ASC key GT9767YMH6).
# Values set via stdin:  base64 -i <file> | tr -d '\n' | fnox set <KEY> --provider age
#
# IMPORTANT — YRAL_IOS_DIST_CERT_P12_BASE64 must be a LEGACY-format p12:
# macOS `security import` rejects OpenSSL 3's default algorithms
# (PBES2/AES-256-CBC/SHA-256 MAC) with "MAC verification failed". Export with
# `openssl pkcs12 -export -legacy` (SHA1/RC2 — the format Apple's own
# Keychain Access produces). To recreate the p12 from cert + key:
#   openssl pkcs12 -export -legacy -inkey distribution.key -in distribution.cer \
#     -out Yral-Dist.p12 -passout pass:'<password>'
# and store that file's base64 here. YRAL_IOS_CERT_PASSWORD is that password.
# NOTE: placeholder entries with default="" must be deleted before
# fnox set — a set on an entry that has a default does not overwrite it.
# Identifiers (not secret) live in mise.toml [env]:
#   YRAL_ASC_KEY_ID=GT9767YMH6, YRAL_ASC_ISSUER_ID=6ddd2cf0-9212-47e6-9f69-69cb16412c45