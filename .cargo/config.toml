# Use the git CLI for fetching git dependencies instead of libgit2.
# This allows SSH agent authentication to work for git dependencies that
# reference submodules with SSH URLs (e.g. the mobile Rust agent's
# yral-canisters-client dependency which triggers a submodule fetch of
# apps/website via git@github.com:dolr-ai/website.git).
# Without this, rust-analyzer and cargo fail with "no authentication methods
# succeeded" when trying to fetch the submodule.
[net]
git-fetch-with-cli = true
