# Use the git CLI for fetching git dependencies instead of libgit2.
# This lets SSH agent authentication work for git operations that use SSH URLs
# — including the git submodules this repo still checks out (e.g.
# apps/yral-rishi-agent via git@github.com:...). Without this, rust-analyzer and
# cargo fail with "no authentication methods succeeded".
[net]
git-fetch-with-cli = true
