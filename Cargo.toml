bb8 = "0.9.1"
candid = "0.10.32"
chrono = "0.4"
chrono-tz = "0.10"
ciborium = "0.2.2"
circular-buffer = "0.1.7"
codee = "0.3.0"
comrak = "0.54.0"
config = "0.14.0"
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
crc32fast = "1.4.0"
dotenv = "0.15.0"
elsa = "1.11.2"
