[workspace]
resolver = "3"
members = [
  "apps/hello-world",
  "apps/my-website",
  "apps/off-chain-agent",
  "apps/task-runner",
  "apps/yral-auth",
  "apps/yral-database-spacetime",
  "apps/yral-database-spacetime/bindings",
  "apps/yral-metadata/client",
  "apps/yral-metadata/server",
  "apps/yral-metadata/types",
  "apps/yral-web/ssr",
  "apps/yral-web/ssr/src/auth",
  "apps/yral-web/ssr/src/component",
  "apps/yral-web/ssr/src/consts",
  "apps/yral-web/ssr/src/page",
  "apps/yral-web/ssr/src/state",
  "apps/yral-web/ssr/src/utils",
]

exclude = [
  # Gradle project with a Rust submodule — not part of this workspace because
  # git submodules are not present in shallow clones (Shipwright/BuildKit).
  "apps/yral-mobile/shared/rust/rust-agent/rust-agent-uniffi",
]

