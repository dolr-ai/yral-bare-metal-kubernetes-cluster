yral-metadata-client = { path = "apps/yral-metadata/client", default-features = false }
yral-metadata-types = { path = "apps/yral-metadata/types" }

# Profile for yral-web release binary (from apps/yral-web/Cargo.toml)
[profile.prod-release]
inherits = "release"
debug = 1
lto = true

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
