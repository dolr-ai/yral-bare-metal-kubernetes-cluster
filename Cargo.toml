[workspace]
resolver = "3"
members = ["apps/task-runner", "apps/yral-database-spacetime"]

# All apps under apps/ are independent Cargo workspaces (not members of this root workspace).
# Submodules: apps/website, apps/yral, apps/yral-backend-canister, apps/yral-mobile
# Native dirs: apps/yral-auth, apps/yral-legacy, apps/yral-metadata, apps/off-chain-agent, apps/yral-common
exclude = [
    "apps/yral-legacy",
    "apps/off-chain-agent",
    "apps/website",
    "apps/yral",
    "apps/yral-auth",
    "apps/yral-backend-canister",
    "apps/yral-common",
    "apps/yral-metadata",
    "apps/yral-mobile",
]

[workspace.dependencies]
anyhow = "1.0.103"
hex = "0.4.3"
log = "0.4.33"
reqwest = "0.13.4"
spacetimedb = { version = "2.6.1" }
spacetimedb-sdk = { version = "2.6.1" }
