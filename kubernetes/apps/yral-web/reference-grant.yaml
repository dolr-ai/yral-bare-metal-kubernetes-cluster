# Allows HTTPRoutes in kube-system (where the Gateway lives) to reference
# Services in the yral-web namespace as backends.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-kube-system-httproutes
  namespace: yral-web
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
  to:
    - group: ""
      kind: Service