# ReferenceGrant — allows HTTPRoute in kube-system to reference my-website:80.
#
# The HTTPRoute for saikat.dev lives in kube-system (with the other routes)
# but needs to route to my-website:80 in the my-website namespace.
# Without this ReferenceGrant, Cilium Gateway returns HTTP 500 (RefNotPermitted).
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-httproute-to-my-website
  namespace: my-website
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
  to:
    - group: ""
      kind: Service
      name: my-website