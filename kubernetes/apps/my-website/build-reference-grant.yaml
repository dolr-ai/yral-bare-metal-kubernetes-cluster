# ReferenceGrant — allows HTTPRoute in kube-system to reference the
# Tekton EventListener Service (el-my-website-build-listener) in my-website namespace.
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-httproute-to-my-website-build-listener
  namespace: my-website
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
  to:
    - group: ""
      kind: Service
      name: el-my-website-build-listener