# Flux ImagePolicy — selects the latest my-website image tag.
#
# Tags are timestamp-prefixed: YYYYMMDDHHMMSS-<short-sha>
# Alphabetical ascending picks the most recent build (chronological = alphabetical).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: my-website
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: my-website
  policy:
    alphabetical:
      order: asc
  filterTags:
    pattern: '^\d{14}-[0-9a-f]{8}$'