# my-website Service — ClusterIP with ExternalDNS annotation.
#
# The external-dns annotation tells ExternalDNS to create an A record for
# saikat.dev in PowerDNS pointing to this service's ClusterIP (or the gateway
# node IPs, depending on configuration).
#
# ExternalDNS watches this annotation and syncs the record to PowerDNS via
# the HTTP API.
---
apiVersion: v1
kind: Service
metadata:
  name: my-website
  namespace: my-website
  annotations:
    external-dns.alpha.kubernetes.io/hostname: saikat.dev
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: my-website