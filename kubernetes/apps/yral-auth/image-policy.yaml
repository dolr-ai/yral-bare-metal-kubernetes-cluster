# Flux ImagePolicy — selects the latest image tag for yral-auth.
#
# Policy: semver descending, picks the newest timestamp tag.
# Tags are timestamp-based (YYYYMMDD.HHMMSS) from Shipwright BuildRuns.
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: yral-auth
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: yral-auth
  policy:
    semver:
      range: '>=0.0.0'