# Flux ImagePolicy — selects the :latest tag for yral-auth.
#
# Every Shipwright BuildRun overwrites the :latest tag with a new digest.
# Flux detects the digest change and updates the deployment automatically.
# This is the simplest approach — no timestamp or SHA tags to manage.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: yral-auth
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: yral-auth
  policy:
    alphabetical:
      order: desc
  filterTags:
    pattern: '^latest$'