# Flux ImagePolicy — selects the latest image tag for yral-auth.
#
# Tags are timestamp-prefixed: YYYYMMDDHHMMSS-<short-sha>
# (e.g. 20260716021700-a2e4e7b8). Alphabetical descending picks the
# most recent build since timestamp prefix ensures chronological sorting.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: yral-auth
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: yral-auth
  policy:
    alphabetical:
      order: desc
  filterTags:
    pattern: '^\d{14}-[0-9a-f]{8}$'