# Flux ImagePolicy — selects the latest image tag for yral-auth.
#
# Policy: alphabetical descending, picks the newest tag.
# Tags are timestamp-based (YYYYMMDD.HHMMSS) from Shipwright BuildRuns.
# Timestamps sort correctly in alphabetical descending order.
# No :latest tag — only timestamp tags are produced by BuildRuns.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: yral-auth
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: yral-auth
  policy:
    alphabetical:
      order: desc
  filterTags:
    pattern: '^[0-9]{8}\.[0-9]{6}$'