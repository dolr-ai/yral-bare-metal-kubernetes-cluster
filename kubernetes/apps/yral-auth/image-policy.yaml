# Flux ImagePolicy — selects the latest image tag for yral-auth.
#
# Tags are Git commit SHAs (40 hex chars) from Shipwright BuildRuns
# triggered by Tekton EventListener on git push. Alphabetical descending
# picks the newest SHA. The ImageRepository detects new SHA tags on each
# scan (unlike :latest where only the digest changes).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: yral-auth
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: yral-auth
  policy:
    alphabetical:
      order: desc
  filterTags:
    pattern: '^[0-9a-f]{40}$'