# Flux ImagePolicy — selects the latest image tag for yral-auth.
#
# Policy: alphabetical descending, picks the newest tag.
# Tags are Git commit SHAs (40 hex chars) from Shipwright BuildRuns
# triggered by Tekton EventListener on git push.
# Full SHAs sort correctly in alphabetical descending order.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: yral-auth
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: yral-auth
  policy:
    alphabetical:
      order: desc
  filterTags:
    pattern: '^[0-9a-f]{40}$'