---
# ServiceAccount for the Tekton EventListener.
# Needs permissions to create BuildRuns in the yral-auth namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-trigger-sa
  namespace: yral-auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-trigger-role
  namespace: yral-auth
rules:
  - apiGroups: ["shipwright.io"]
    resources: ["buildruns", "builds"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["triggerbindings", "triggertemplates", "eventlisteners", "triggers", "interceptors"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-trigger-binding
  namespace: yral-auth
subjects:
  - kind: ServiceAccount
    name: tekton-trigger-sa
    namespace: yral-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-trigger-role
---
# ClusterRole for the Tekton EventListener — needs cluster-scope read access
# to ClusterInterceptor and ClusterTriggerBinding resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-trigger-clusterrole
rules:
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["clusterinterceptors", "clustertriggerbindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-trigger-clusterbinding
subjects:
  - kind: ServiceAccount
    name: tekton-trigger-sa
    namespace: yral-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-trigger-clusterrole
---
# TriggerBinding extracts fields from the GitHub push event payload.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push-binding
  namespace: yral-auth
spec:
  params:
    - name: repo-url
      value: $(body.repository.html_url)
    - name: revision
      value: $(body.ref)
    - name: commit-sha
      value: $(body.after)
---
# TriggerTemplate creates a BuildRun with the commit SHA as the image tag.
# The SHA is unique per push, so Flux ImageRepository always detects it as
# a new tag (unlike :latest where only the digest changes).
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: yral-auth-buildrun-template
  namespace: yral-auth
spec:
  params:
    - name: repo-url
      description: The Git repository URL
    - name: revision
      description: The Git ref (e.g. refs/heads/main)
    - name: commit-sha
      description: The commit SHA, used as the image tag
  resourcetemplates:
    - apiVersion: shipwright.io/v1beta1
      kind: BuildRun
      metadata:
        generateName: yral-auth-auto-
        namespace: yral-auth
        labels:
          app: yral-auth
          trigger: github-push
      spec:
        build:
          name: yral-auth
        output:
          image: harbor.yral.com/yral-auth/yral-auth:$(tt.params.commit-sha)
---
# EventListener receives GitHub push events and creates BuildRuns.
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: yral-auth-build-listener
  namespace: yral-auth
spec:
  serviceAccountName: tekton-trigger-sa
  triggers:
    - name: github-push
      bindings:
        - kind: TriggerBinding
          ref: github-push-binding
      template:
        ref: yral-auth-buildrun-template
      interceptors:
        - name: filter-push-main
          ref:
            name: cel
          params:
            - name: filter
              value: "body.ref == 'refs/heads/main'"
