apiVersion: apps/v1
kind: Deployment
metadata:
  name: yral-auth
  namespace: yral-auth
  annotations:
    secret.reloader.stakater.com/reload: "yral-auth-secrets"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: yral-auth
  template:
    metadata:
      labels:
        app: yral-auth
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: yral-auth
          image: harbor.yral.com/yral-auth/yral-auth:20260716090334-e6b427f1 # {"$imagepolicy": "flux-system:yral-auth"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: yral-auth-config
            - secretRef:
                name: yral-auth-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
