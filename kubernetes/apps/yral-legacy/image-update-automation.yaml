# Flux ImageUpdateAutomation — writes the latest image tag selected by
# the yral-legacy ImagePolicy back into the Deployment manifest in git.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: yral-legacy
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore: update yral-legacy image tag
    push:
      branch: main
  update:
    path: ./kubernetes/apps/yral-legacy
    strategy: Setters