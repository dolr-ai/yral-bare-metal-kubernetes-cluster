# Flux ImagePolicy — selects the latest image tag for yral-legacy.
#
# Tags are Git commit SHAs (40 hex chars) from Shipwright BuildRuns
# triggered by Tekton EventListener on git push. Alphabetical descending
# picks the newest SHA.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: yral-legacy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: yral-legacy
  policy:
    alphabetical:
      order: desc
  filterTags:
    pattern: '^[0-9a-f]{40}$'