# Shipwright Build CR for yral-legacy.
#
# Defines how to build the yral-legacy image from source using BuildKit.
# Source: the monorepo (dolr-ai/yral-bare-metal-kubernetes-cluster) at apps/yral-legacy/
# Strategy: buildkit (ClusterBuildStrategy, rootless BuildKit)
# Output: harbor.yral.com/yral-legacy/yral-legacy
#
# BuildRuns are created automatically by the Tekton EventListener on git push
# to main. The EventListener overrides the output image tag with the Git
# commit SHA. Flux ImagePolicy detects the new SHA tag and updates the deployment.
---
apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  name: yral-legacy
  namespace: yral-legacy
spec:
  source:
    type: Git
    git:
      url: https://github.com/dolr-ai/yral-bare-metal-kubernetes-cluster.git
      revision: main
      cloneSecret: github-clone-secret
    contextDir: apps/yral-legacy
  strategy:
    name: buildkit
    kind: ClusterBuildStrategy
  paramValues:
    - name: dockerfile
      value: Dockerfile.buildkit
    - name: cache
      value: registry
  output:
    image: harbor.yral.com/yral-legacy/yral-legacy
    pushSecret: harbor-pull-secret
  retention:
    succeededLimit: 3
    failedLimit: 3
    ttlAfterSucceeded: 1h
    ttlAfterFailed: 24h