apiVersion: apps/v1
kind: Deployment
metadata:
  name: yral-legacy
  namespace: yral-legacy
  annotations:
    secret.reloader.stakater.com/reload: "yral-legacy-secrets"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: yral-legacy
  template:
    metadata:
      labels:
        app: yral-legacy
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: yral-legacy
          image: harbor.yral.com/yral-legacy/yral-legacy:20260716094310-8b83c689 # {"$imagepolicy": "flux-system:yral-legacy"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: yral-legacy-config
            - secretRef:
                name: yral-legacy-secrets
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
