apiVersion: apps/v1
kind: Deployment
metadata:
  name: timer-counter
  namespace: timer-counter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: timer-counter
  template:
    metadata:
      labels:
        app: timer-counter
    spec:
      containers:
        - name: timer-counter
          image: ghcr.io/saikatdas0790/timer-counter:ts-20260306140374-ecbb5a3 # {"$imagepolicy": "flux-system:timer-counter"}
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
