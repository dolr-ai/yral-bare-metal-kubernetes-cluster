apiVersion: apps/v1
kind: Deployment
metadata:
  name: off-chain-agent
  namespace: off-chain-agent
  annotations:
    secret.reloader.stakater.com/reload: "off-chain-agent-secrets"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: off-chain-agent
  template:
    metadata:
      labels:
        app: off-chain-agent
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: off-chain-agent
          image: harbor.yral.com/off-chain-agent/off-chain-agent:20260815103948-c20d5ae0 # {"$imagepolicy": "flux-system:off-chain-agent"}
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
              name: http
          envFrom:
            - configMapRef:
                name: off-chain-agent-config
            - secretRef:
                name: off-chain-agent-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
