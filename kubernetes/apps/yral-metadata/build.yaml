# Shipwright Build CR for yral-metadata.
#
# Defines how to build the yral-metadata image from source using BuildKit.
# Source: the monorepo (dolr-ai/yral-bare-metal-kubernetes-cluster) at apps/yral-metadata/
# Strategy: buildkit (ClusterBuildStrategy, rootless BuildKit)
# Output: harbor.yral.com/yral-metadata/yral-metadata
---
apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  name: yral-metadata
  namespace: yral-metadata
spec:
  source:
    type: Git
    git:
      # SSH URL so the infra SSH key (github-ssh-secret) works for both
      # the main repo clone and submodule clones (submodules use SSH URLs).
      url: git@github.com:dolr-ai/yral-bare-metal-kubernetes-cluster.git
      revision: main
      cloneSecret: github-ssh-secret
    # No contextDir — use the full repo as build context (needed for local path deps)
    # contextDir defaults to repo root when omitted
  strategy:
    name: buildkit
    kind: ClusterBuildStrategy
  paramValues:
    - name: dockerfile
      value: apps/yral-metadata/Dockerfile.buildkit
    - name: cache
      value: registry
  output:
    image: harbor.yral.com/yral-metadata/yral-metadata
    pushSecret: harbor-pull-secret
  retention:
    succeededLimit: 3
    failedLimit: 3
    ttlAfterSucceeded: 1h
    ttlAfterFailed: 24h