# Restrict Hubble UI ingress to Cloudflare IPv4 CIDRs only.
#
# Why here and not on the Hetzner firewall:
#   The Hetzner Robot Firewall has a 50-rule limit and cannot distinguish between
#   services. Applying per-CIDR, per-service rules there would exhaust the limit
#   at cluster scale. CiliumNetworkPolicy is the correct primitive: it enforces
#   at the pod level, is GitOps-reconciled by Flux, and requires no node
#   reprovisioning when Cloudflare updates its CIDRs.
#
# Why fromCIDRSet works here:
#   The cilium-envoy DaemonSet runs with hostNetwork: true. Traffic from Cloudflare
#   arrives at the host network, and Cilium's transparent proxy preserves the
#   original Cloudflare source IP when forwarding to the hubble-ui pod. The
#   fromCIDRSet rules therefore match the real external source IPs.
#
# Effect:
#   - Ingress to port 80 on hubble-ui pods is allowed ONLY from Cloudflare IPs.
#   - All other ingress to port 80 is denied (CiliumNetworkPolicy default-deny).
#   - kubectl port-forward is unaffected (bypasses network policies via the
#     Kubernetes API server).
#
# Cloudflare CIDRs source: https://www.cloudflare.com/ips-v4
# Update this list when Cloudflare publishes new ranges.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-ui-cloudflare-only
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: hubble-ui
  ingress:
    - fromCIDRSet:
        - cidr: "173.245.48.0/20"
        - cidr: "103.21.244.0/22"
        - cidr: "103.22.200.0/22"
        - cidr: "103.31.4.0/22"
        - cidr: "141.101.64.0/18"
        - cidr: "108.162.192.0/18"
        - cidr: "190.93.240.0/20"
        - cidr: "188.114.96.0/20"
        - cidr: "197.234.240.0/22"
        - cidr: "198.41.128.0/17"
        - cidr: "162.158.0.0/15"
        - cidr: "104.16.0.0/13"
        - cidr: "104.24.0.0/14"
        - cidr: "172.64.0.0/13"
        - cidr: "131.0.72.0/22"
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
