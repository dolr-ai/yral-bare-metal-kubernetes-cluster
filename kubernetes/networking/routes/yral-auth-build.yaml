# Tekton EventListener HTTPRoute for yral-auth build triggers
#
# Exposes the Tekton EventListener at:
#   https://yral-auth-build.yral.com/
#
# GitHub push webhooks are sent to this endpoint. The EventListener creates
# a PipelineRun (trivial noop pipeline), which the Shipwright Triggers
# controller watches and uses to create a BuildRun.
#
# TLS: covered by existing wildcard *.yral.com cert (cert-manager, letsencrypt-prod).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yral-auth-build-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - yral-auth-build.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yral-auth-build
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - yral-auth-build.yral.com
  rules:
    - backendRefs:
        - name: el-yral-auth-build-listener
          namespace: yral-auth
          port: 8080