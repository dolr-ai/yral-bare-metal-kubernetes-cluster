# Longhorn UI HTTPRoute
#
# Exposes the Longhorn storage UI at https://longhorn-ui.yral.com via oauth2-proxy
# (Google Workspace SSO). Auth is enforced by oauth2-proxy; the longhorn-frontend
# Service itself is never exposed directly.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - longhorn-ui.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - longhorn-ui.yral.com
  rules:
    - backendRefs:
        - name: oauth2-proxy-longhorn-ui
          namespace: oauth2-proxy
          port: 4180
