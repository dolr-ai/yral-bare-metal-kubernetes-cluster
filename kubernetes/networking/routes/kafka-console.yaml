# Kafka Console (Redpanda Console) HTTPRoute
#
# Exposes Redpanda Console at https://kafka-console.yral.com via oauth2-proxy (Google Workspace SSO).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafka-console-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - kafka-console.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafka-console
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - kafka-console.yral.com
  rules:
    - backendRefs:
        - name: oauth2-proxy-kafka-console
          namespace: oauth2-proxy
          port: 4180
