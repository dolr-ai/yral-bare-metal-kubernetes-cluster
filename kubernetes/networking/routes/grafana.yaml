# Grafana HTTPRoute
#
# Exposes Grafana at https://grafana.yral.com via oauth2-proxy (Google Workspace SSO).
# oauth2-proxy passes X-Auth-Request-Email to Grafana; Grafana auth.proxy trusts it.
# Grafana's own login form is disabled — authentication is fully handled by oauth2-proxy.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - grafana.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - grafana.yral.com
  rules:
    - backendRefs:
        - name: oauth2-proxy-grafana
          namespace: oauth2-proxy
          port: 4180
