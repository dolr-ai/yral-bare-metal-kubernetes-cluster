# Allows HTTPRoutes in kube-system (where the Gateway lives) to reference
# the kafka-bridge Service in the kafka namespace as a backend.
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: kafka-bridge-gateway-access
  namespace: kafka
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
  to:
    - group: ""
      kind: Service
