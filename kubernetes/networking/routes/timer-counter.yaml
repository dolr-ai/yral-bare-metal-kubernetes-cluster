# timer-counter HTTPRoute
#
# Exposes timer-counter at https://timer-counter.saikat.yral.com via oauth2-proxy (Google Workspace SSO).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: timer-counter-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - timer-counter.saikat.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: timer-counter
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - timer-counter.saikat.yral.com
  rules:
    - backendRefs:
        - name: oauth2-proxy-timer-counter
          namespace: oauth2-proxy
          port: 4180
