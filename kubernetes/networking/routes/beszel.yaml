# Beszel hub HTTPRoute
#
# Exposes the Beszel hub at https://beszel.yral.com via the Cilium Gateway.
# Direct-to-Service (no oauth2-proxy) — Beszel has its own built-in auth.
#
# TLS is terminated by the Cilium Gateway using the wildcard *.yral.com certificate.
# The ReferenceGrant in the beszel namespace allows this HTTPRoute to reference
# the beszel Service as a backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: beszel-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - beszel.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: beszel
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - beszel.yral.com
  rules:
    - backendRefs:
        - name: beszel
          namespace: beszel
          port: 8090