# Beszel hub HTTPRoute
#
# Exposes the Beszel hub at https://beszel.yral.com via oauth2-proxy (Google
# Workspace SSO, @gobazzinga.io email domain, developer-admin group).
# Beszel's own login form is disabled — TRUSTED_AUTH_HEADER trusts the
# X-Forwarded-Email header from oauth2-proxy.
#
# TLS is terminated by the Cilium Gateway using the wildcard *.yral.com certificate.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: beszel-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - beszel.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: beszel
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - beszel.yral.com
  rules:
    - backendRefs:
        - name: oauth2-proxy-beszel
          namespace: oauth2-proxy
          port: 4180