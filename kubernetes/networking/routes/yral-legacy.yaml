# yral-legacy HTTPRoute
#
# Exposes the yral-legacy app at legacy.yral.com — a public user-facing
# Leptos SSR web application (formerly hot-or-not-web-leptos-ssr).
#
# TLS is terminated by the Cilium Gateway (web-gateway in kube-system)
# using the wildcard *.yral.com certificate.
# The ReferenceGrant in the yral-legacy namespace allows this HTTPRoute
# to reference yral-legacy:8080 as a backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yral-legacy-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - legacy.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yral-legacy
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - legacy.yral.com
  rules:
    - backendRefs:
        - name: yral-legacy
          namespace: yral-legacy
          port: 8080