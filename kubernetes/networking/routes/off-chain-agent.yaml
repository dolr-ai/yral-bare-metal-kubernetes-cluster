# off-chain-agent HTTPRoute
#
# Exposes the off-chain-agent gRPC API service at offchain.yral.com.
#
# TLS is terminated by the Cilium Gateway (web-gateway in kube-system)
# using the wildcard *.yral.com certificate.
# The ReferenceGrant in the off-chain-agent namespace allows this HTTPRoute
# to reference off-chain-agent:50051 as a backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: off-chain-agent-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - offchain.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: off-chain-agent
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - offchain.yral.com
  rules:
    - backendRefs:
        - name: off-chain-agent
          namespace: off-chain-agent
          port: 50051