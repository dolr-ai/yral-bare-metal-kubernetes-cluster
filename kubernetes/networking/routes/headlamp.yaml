# Headlamp Kubernetes UI HTTPRoute
#
# Exposes Headlamp at https://headlamp.yral.com via oauth2-proxy (Google Workspace SSO).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - headlamp.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - headlamp.yral.com
  rules:
    - backendRefs:
        - name: oauth2-proxy-headlamp
          namespace: oauth2-proxy
          port: 4180
