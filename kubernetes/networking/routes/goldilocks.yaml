# Goldilocks dashboard HTTPRoute
#
# Exposes the Goldilocks VPA recommendation UI at https://goldilocks.yral.com
# via oauth2-proxy (Google Workspace SSO).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goldilocks-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - goldilocks.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goldilocks
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - goldilocks.yral.com
  rules:
    - backendRefs:
        - name: oauth2-proxy-goldilocks
          namespace: oauth2-proxy
          port: 4180
