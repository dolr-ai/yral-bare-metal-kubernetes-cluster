# dashboard HTTPRoute
#
# Exposes the internal service dashboard at https://dashboard.yral.com via oauth2-proxy (Google Workspace SSO).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - dashboard.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - dashboard.yral.com
  rules:
    - backendRefs:
        - name: oauth2-proxy-dashboard
          namespace: oauth2-proxy
          port: 4180
