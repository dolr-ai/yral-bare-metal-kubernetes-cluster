# Ceph Dashboard HTTPRoute
#
# Exposes the Rook/Ceph manager dashboard at https://ceph.yral.com via
# oauth2-proxy (Google Workspace SSO).  The Ceph dashboard pod (rook-ceph-mgr)
# runs in the rook-ceph namespace; oauth2-proxy proxies to it directly.
# The wildcard *.yral.com DNS record covers this hostname automatically.
#
# Remember to add https://ceph.yral.com/oauth2/callback to the authorised
# redirect URIs in the Google Cloud OAuth app.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-dashboard-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - ceph.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-dashboard
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - ceph.yral.com
  rules:
    - backendRefs:
        - name: oauth2-proxy-ceph-dashboard
          namespace: oauth2-proxy
          port: 4180
