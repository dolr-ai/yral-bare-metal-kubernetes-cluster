# Tekton EventListener HTTPRoute for yral-web build triggers
#
# Exposes the Tekton EventListener at:
#   https://yral-web-build.yral.com/
#
# GitHub push webhooks are sent to this endpoint. The EventListener creates
# a BuildRun with the commit SHA as the output image tag.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yral-web-build-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - yral-web-build.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yral-web-build
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - yral-web-build.yral.com
  rules:
    - backendRefs:
        - name: el-yral-web-build-listener
          namespace: yral-web
          port: 8080