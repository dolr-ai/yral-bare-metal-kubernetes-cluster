apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kafka-bootstrap
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: kafka
  hostnames:
    - kafka.yral.com
  rules:
    - backendRefs:
        - name: kafka-cluster-kafka-external-bootstrap
          namespace: kafka
          port: 9094
---
