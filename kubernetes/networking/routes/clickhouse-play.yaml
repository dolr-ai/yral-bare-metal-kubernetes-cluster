# ClickHouse Play UI HTTPRoute
#
# Exposes the ClickHouse built-in Play UI at https://clickhouse-play.yral.com via oauth2-proxy
# (Google Workspace SSO, restricted to internal-dashboard-user@gobazzinga.io).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clickhouse-play-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - clickhouse-play.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clickhouse-play
  namespace: kube-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - clickhouse-play.yral.com
  rules:
    - backendRefs:
        - name: oauth2-proxy-clickhouse-play
          namespace: oauth2-proxy
          port: 4180
