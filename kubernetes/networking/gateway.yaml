# web-gateway — shared Gateway for all cluster services
#
# Handles:
#   - HTTP (port 80):  redirect to HTTPS (via HTTPRoute)
#   - HTTPS (port 443): TLS termination for all services
#
# Traffic path:
#   DNS *.yral.com → A records for all 5 CP IPv4 addresses (round-robin)
#   → any CP:80/443 (Cilium Envoy, hostNetwork mode — binds directly to host port)
#   → TLS terminated with Let's Encrypt wildcard cert (*.yral.com)
#   → backend pod
#
# TLS certificate:
#   Managed by cert-manager via DNS-01 challenge against Cloudflare API.
#   *.yral.com wildcard covers all *.yral.com hostnames; no per-service cert changes needed.
#   Wildcards only cover one subdomain level. If a service needs a deeper hostname
#   (e.g. foo.name.yral.com), either move it to *.yral.com or add a dedicated listener.
#
# Adding a new service: create an HTTPRoute — no Gateway changes needed.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.yral.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-yral-com-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: https-saikat-dev
      port: 443
      protocol: HTTPS
      hostname: "*.saikat.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-saikat-dev-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: kafka
      port: 9092
      protocol: TLS
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
