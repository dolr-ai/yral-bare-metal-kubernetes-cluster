# web-gateway — shared Gateway for all cluster services
#
# Handles:
#   - HTTP (port 80):  redirect to HTTPS (via HTTPRoute)
#   - HTTPS (port 443): TLS termination for all services
#
# Traffic path:
#   DNS *.yral.com → A records for all 5 CP IPv4 addresses (round-robin)
#   → any CP:80/443 (Cilium Envoy, hostNetwork mode — binds directly to host port)
#   → TLS terminated with Let's Encrypt wildcard cert (*.yral.com)
#   → backend pod
#
# TLS certificates:
#   Managed by cert-manager via DNS-01 challenge against Cloudflare API.
#   *.yral.com           — listener: https          — covers all *.yral.com hostnames
#   *.saikat.yral.com    — listener: saikat-https   — covers all *.saikat.yral.com hostnames
#   Wildcards only cover one subdomain level; add a new listener + cert for each new
#   second-level subdomain zone (e.g. *.name.yral.com).
#
# Adding a new service under *.yral.com: create an HTTPRoute, no Gateway changes needed.
# Adding a service under a new zone (e.g. *.alice.yral.com): add a listener here.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.yral.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-yral-com-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: saikat-https
      port: 443
      protocol: HTTPS
      hostname: "*.saikat.yral.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-saikat-yral-com-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
