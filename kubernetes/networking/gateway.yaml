# web-gateway — shared Gateway for all cluster services
#
# Handles:
#   - HTTP (port 80):  ACME HTTP-01 challenges + redirect to HTTPS (via HTTPRoute)
#   - HTTPS (port 443): TLS termination for all services
#
# Traffic path:
#   DNS *.yral.com → A records for all 5 CP IPv4 addresses (round-robin)
#   → any CP:80/443 (NodePort via Cilium Ingress Controller)
#   → Cilium Envoy (Gateway API implementation)
#   → cert-manager manages the TLS secret via the cert-manager.io/cluster-issuer annotation
#   → backend pod
#
# Adding a new service: create an HTTPRoute in the appropriate namespace.
# No changes to this Gateway are required.
#
# cert-manager annotation: automatically provisions and renews the TLS certificate
# for all hostnames present in attached HTTPRoutes on the HTTPS listener.
# Start with letsencrypt-staging and switch to letsencrypt-prod once verified.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: web-gateway-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
