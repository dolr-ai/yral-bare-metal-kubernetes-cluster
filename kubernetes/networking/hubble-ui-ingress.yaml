# Hubble UI Ingress
#
# Exposes the Cilium Hubble UI via the Cilium Ingress Controller.
# DNS: hubble.yral.com → A records for all 5 control-plane public IPs
# Traffic flow: client → CP IPv4:80 → NodePort → Cilium Envoy → hubble-ui pod
#
# Requires:
#   - Cilium Ingress Controller enabled (ingressController.enabled: true)
#   - At least one worker node for Hubble UI pod scheduling
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  ingressClassName: cilium
  rules:
    - host: hubble.yral.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
