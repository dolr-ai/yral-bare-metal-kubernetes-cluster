apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Entrypoint for Flux reconciliation of the yral-k8s cluster.
# flux bootstrap --path=./kubernetes/clusters/yral-k8s
#
# Ordering is enforced via dependsOn in the individual Flux Kustomization objects:
#   cilium         (no deps — already running, Flux just reconciles HelmRelease)
#   cert-manager   (no deps)
#   cert-manager-issuers  → dependsOn: cert-manager
#   networking     → dependsOn: cilium, cert-manager-issuers
resources:
  - flux-system/
  - app-dashboard.yaml
  - app-my-website.yaml
  - app-off-chain-agent.yaml
  - app-yral-auth.yaml
  - app-yral-metadata.yaml
  - app-yral-web.yaml
  - infrastructure-alloy.yaml
  - infrastructure-cert-manager-issuers.yaml
  - infrastructure-cert-manager.yaml
  - infrastructure-cilium.yaml
  - infrastructure-ci-e2e-reader.yaml
  - infrastructure-cloudnative-pg.yaml
  - infrastructure-coredns.yaml
  - infrastructure-dbx.yaml
  - infrastructure-external-dns.yaml
  - infrastructure-flux-receiver.yaml
  - infrastructure-gateway-api-crds.yaml
  - infrastructure-harbor.yaml
  - infrastructure-headlamp.yaml
  - infrastructure-kafka.yaml
  - infrastructure-kafka-bridge.yaml
  - infrastructure-kafka-connect.yaml
  - infrastructure-kafka-console.yaml
  - infrastructure-longhorn-backup.yaml
  - infrastructure-longhorn.yaml
  - infrastructure-loki.yaml
  - infrastructure-metrics-server.yaml
  - infrastructure-monitoring.yaml
  - infrastructure-nginx.yaml
  - infrastructure-oauth2-proxy.yaml
  - infrastructure-reloader.yaml
  - infrastructure-shipwright.yaml
  - infrastructure-snowplow.yaml
  - infrastructure-strimzi.yaml
  - infrastructure-tekton-pipelines.yaml
  - infrastructure-tekton-triggers.yaml
  - infrastructure-trivy-operator.yaml
  - infrastructure-velero.yaml
  - networking.yaml

