# Kafka Bridge — Flux Kustomization
#
# Deploys the Kafka Bridge (HTTP REST API for Kafka consumption) in the kafka namespace.
# Depends on infrastructure-kafka (needs Kafka cluster + UserOperator for kafka-bridge user).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-kafka-bridge
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/kafka-bridge
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infrastructure-kafka
