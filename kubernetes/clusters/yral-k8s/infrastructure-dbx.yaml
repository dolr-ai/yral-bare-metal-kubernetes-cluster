apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-dbx
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/dbx
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: networking
    - name: infrastructure-oauth2-proxy