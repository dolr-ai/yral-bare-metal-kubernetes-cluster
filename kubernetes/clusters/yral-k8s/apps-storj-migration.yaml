apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-storj-migration
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/storj-migration
  prune: true
  force: true
  wait: false
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: apps
