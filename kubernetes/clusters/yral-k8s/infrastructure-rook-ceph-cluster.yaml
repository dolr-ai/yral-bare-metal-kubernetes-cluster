apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-rook-ceph-cluster
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/rook-ceph/cluster
  prune: true
  # Long timeout: CephCluster initialisation can take 10-20 min on first deploy
  # while Rook bootstraps mons, reaches quorum, and brings up OSDs.
  wait: true
  timeout: 30m
  dependsOn:
    # CephCluster CRD must exist before the CephCluster CR is applied.
    - name: infrastructure-rook-ceph-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
