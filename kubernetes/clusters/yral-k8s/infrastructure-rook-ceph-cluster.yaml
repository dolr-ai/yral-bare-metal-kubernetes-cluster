apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-rook-ceph-cluster
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/rook-ceph/cluster
  prune: true
  # Ceph can remain in Progressing for extended periods during safe OSD update
  # loops (e.g., when some OSDs are not ok-to-stop). Do not block dependent
  # Kustomizations on this long-running internal state.
  wait: false
  timeout: 30m
  dependsOn:
    # CephCluster CRD must exist before the CephCluster CR is applied.
    - name: infrastructure-rook-ceph-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
