apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-clickhouse
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/clickhouse
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Must wait for the operator to install CRDs before applying ClickHouseInstallation.
  dependsOn:
    - name: infrastructure-clickhouse-operator
