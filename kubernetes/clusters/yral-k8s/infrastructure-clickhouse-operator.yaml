apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-clickhouse-operator
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/clickhouse-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # wait: true ensures the HelmRelease (and its CRDs) are fully installed before
  # infrastructure-clickhouse (which creates a ClickHouseInstallation CR) is applied.
  wait: true
  timeout: 5m
