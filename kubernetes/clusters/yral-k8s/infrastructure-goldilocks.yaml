apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-goldilocks
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/goldilocks
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-vpa
