apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-alloy
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/alloy
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: infrastructure-loki
  sourceRef:
    kind: GitRepository
    name: flux-system
