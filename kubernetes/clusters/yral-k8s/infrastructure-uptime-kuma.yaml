apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-uptime-kuma
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/uptime-kuma
  prune: true
  wait: true
  timeout: 10m
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: networking