apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/cloudnative-pg
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # wait: true ensures operator CRDs are installed before tenant Cluster CRs are applied.
  wait: true
  timeout: 10m
