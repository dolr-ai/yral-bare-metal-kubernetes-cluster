apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-ci-e2e-reader
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/ci-e2e-reader
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-kafka
