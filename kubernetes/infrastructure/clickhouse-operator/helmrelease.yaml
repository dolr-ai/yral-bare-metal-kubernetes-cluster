apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: clickhouse
spec:
  interval: 1h
  chart:
    spec:
      chart: altinity-clickhouse-operator
      version: "0.27.2"
      sourceRef:
        kind: HelmRepository
        name: altinity
        namespace: clickhouse
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
