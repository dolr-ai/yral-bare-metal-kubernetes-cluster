# Headlamp — Kubernetes UI
#
# A modern, user-friendly Kubernetes web UI.
# Exposed at https://headlamp.yral.com via oauth2-proxy (Google Workspace SSO).
#
# Chart: https://kubernetes-sigs.github.io/headlamp/
# Version: check latest at https://github.com/kubernetes-sigs/headlamp/releases
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 1h
  chart:
    spec:
      chart: headlamp
      version: "0.40.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: headlamp
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
