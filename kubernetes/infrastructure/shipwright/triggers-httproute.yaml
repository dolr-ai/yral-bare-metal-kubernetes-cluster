# HTTPRoute — Shipwright Triggers webhook endpoint
#
# Exposes the Shipwright Triggers webhook at:
#   https://shipwright-triggers.yral.com/
#
# GitHub webhooks are sent to this endpoint. The Triggers controller matches
# incoming events against Build resources with spec.trigger.when rules and
# creates BuildRuns automatically.
#
# TLS: covered by existing wildcard *.yral.com cert (cert-manager, letsencrypt-prod).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shipwright-triggers-redirect
  namespace: shipwright-build
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - shipwright-triggers.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shipwright-triggers
  namespace: shipwright-build
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - shipwright-triggers.yral.com
  rules:
    - backendRefs:
        - name: shipwright-triggers
          port: 80