# Allow ingress to Shipwright Triggers from the Cilium Gateway.
#
# cilium-envoy (the Cilium Gateway proxy) runs with hostNetwork: true, so its
# traffic arrives at the backend pod appearing as a node IP. Per AGENTS.md:
# never rely on fromCIDRSet/namespaceSelector/podSelector for gateway-originated
# traffic. Use an explicit ingress rule with only a ports: clause.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-from-gateway
  namespace: shipwright-build
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shipwright-triggers
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: http