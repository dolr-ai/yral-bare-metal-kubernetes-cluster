apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# kube-bench — CIS Kubernetes Benchmark scanner.
#
# Flux reconciles the namespace + the two recurring CronJobs (weekly CIS audits
# on a control-plane node and a worker node). Results stream to pod logs →
# Loki (via Alloy) → Grafana.
#
# The job-*.yaml files are intentionally NOT listed here — they are on-demand
# diagnostics applied manually for ad-hoc audits (see their header comments).
resources:
  - namespace.yaml
  - cronjob-control-plane.yaml
  - cronjob-worker.yaml