# kube-bench on worker nodes.
#
# Runs the CIS Kubernetes Benchmark "node" section (kubelet config) against a
# worker node. A worker only runs the kubelet, so only the node section of the
# benchmark applies here — the control-plane checks are handled by the
# kube-bench-control-plane CronJob.
#
# Requires hostPID + read-only hostPath mounts of the kubelet / CNI / systemd
# directories kube-bench inspects. Read-only — the pod cannot mutate host state.
#
# Pins to a worker node via nodeSelector (kubeadm auto-applies the
# node-role.kubernetes.io/worker label to non-control-plane nodes).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kube-bench-worker
  namespace: kube-bench
spec:
  # Weekly, 03:30 UTC on Sunday — 30 min after the CP scan so they don't overlap.
  schedule: "30 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: kube-bench
        spec:
          restartPolicy: Never
          hostPID: true
          nodeSelector:
            node-role.kubernetes.io/worker: ""
          containers:
            - name: kube-bench
              image: docker.io/aquasec/kube-bench:v0.16.0
              imagePullPolicy: IfNotPresent
              # On a worker, only the "node" (kubelet) section is relevant.
              # kube-bench auto-detects the K8s version and selects the matching
              # CIS benchmark — no --benchmark flag needed.
              command: ["kube-bench", "--targets", "node"]
              volumeMounts:
                - name: var-lib-cni
                  mountPath: /var/lib/cni
                  readOnly: true
                - name: var-lib-kubelet
                  mountPath: /var/lib/kubelet
                  readOnly: true
                - name: etc-systemd
                  mountPath: /etc/systemd
                  readOnly: true
                - name: lib-systemd
                  mountPath: /lib/systemd
                  readOnly: true
                - name: etc-kubernetes
                  mountPath: /etc/kubernetes
                  readOnly: true
                - name: usr-bin
                  mountPath: /usr/local/mount-from-host/bin
                  readOnly: true
                - name: etc-cni-netd
                  mountPath: /etc/cni/net.d
                  readOnly: true
                - name: opt-cni-bin
                  mountPath: /opt/cni/bin
                  readOnly: true
          volumes:
            - name: var-lib-cni
              hostPath:
                path: /var/lib/cni
                type: DirectoryOrCreate
            - name: var-lib-kubelet
              hostPath:
                path: /var/lib/kubelet
                type: DirectoryOrCreate
            - name: etc-systemd
              hostPath:
                path: /etc/systemd
                type: DirectoryOrCreate
            - name: lib-systemd
              hostPath:
                path: /lib/systemd
                type: DirectoryOrCreate
            - name: etc-kubernetes
              hostPath:
                path: /etc/kubernetes
                type: DirectoryOrCreate
            - name: usr-bin
              hostPath:
                path: /usr/bin
                type: DirectoryOrCreate
            - name: etc-cni-netd
              hostPath:
                path: /etc/cni/net.d
                type: DirectoryOrCreate
            - name: opt-cni-bin
              hostPath:
                path: /opt/cni/bin
                type: DirectoryOrCreate