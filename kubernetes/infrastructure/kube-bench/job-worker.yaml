# On-demand kube-bench Job for worker nodes.
#
# NOT referenced by the Flux Kustomization (see kustomization.yaml) — this is a
# one-shot diagnostic, not state Flux should reconcile. To run an ad-hoc audit:
#   kubectl apply -f job-worker.yaml -n kube-bench
#   kubectl logs -n kube-bench job/kube-bench-worker-adhoc
#   kubectl delete -f job-worker.yaml -n kube-bench   # clean up when done
#
# The recurring CronJob (cronjob-worker.yaml) handles scheduled audits.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench-worker-adhoc
  namespace: kube-bench
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: kube-bench
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
        - name: kube-bench
          image: docker.io/aquasec/kube-bench:v0.16.0
          imagePullPolicy: IfNotPresent
          command: ["kube-bench", "--benchmark", "cis-2.0", "--targets", "node"]
          volumeMounts:
            - name: var-lib-cni
              mountPath: /var/lib/cni
              readOnly: true
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true
            - name: lib-systemd
              mountPath: /lib/systemd
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            - name: usr-bin
              mountPath: /usr/local/mount-from-host/bin
              readOnly: true
            - name: etc-cni-netd
              mountPath: /etc/cni/net.d
              readOnly: true
            - name: opt-cni-bin
              mountPath: /opt/cni/bin
              readOnly: true
      volumes:
        - name: var-lib-cni
          hostPath:
            path: /var/lib/cni
            type: DirectoryOrCreate
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
            type: DirectoryOrCreate
        - name: etc-systemd
          hostPath:
            path: /etc/systemd
            type: DirectoryOrCreate
        - name: lib-systemd
          hostPath:
            path: /lib/systemd
            type: DirectoryOrCreate
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
            type: DirectoryOrCreate
        - name: usr-bin
          hostPath:
            path: /usr/bin
            type: DirectoryOrCreate
        - name: etc-cni-netd
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: opt-cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate