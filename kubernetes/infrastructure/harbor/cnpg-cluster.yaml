# CloudNativePG Cluster for Harbor — 3-instance HA with streaming replication.
#
# Bootstrap: logical import (initdb.import) from Harbor's internal DB
#            (harbor-database.harbor.svc:5432) via pg_dump/pg_restore.
#            This is the CNPG-recommended approach for external PostgreSQL migrations.
#            Ref: https://cloudnative-pg.io/docs/1.29/database_import/
#
# 3 instances on Longhorn (1 primary + 2 replicas) with built-in streaming
# replication. CNPG manages the PKI (TLS certs for streaming_replica user),
# failover, and WAL archiving automatically.
#
# Harbor connects via the -rw endpoint (harbor-db-rw.harbor.svc:5432).
# Database: registry, User: postgres.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4

  # Superuser credentials (used by Harbor core and dbx to connect)
  superuserSecret:
    name: harbor-db-superuser

  # Logical import of the `registry` database from Harbor's internal PostgreSQL.
  # Uses pg_dump -Fd / pg_restore --no-acl --no-owner under the hood.
  # The source DB must be the same or older major version (18.3 → 18.4 is fine).
  bootstrap:
    initdb:
      database: registry
      owner: postgres
      import:
        type: monolith
        databases:
          - registry
        roles:
          - postgres
        source:
          externalCluster: harbor-internal-db

  storage:
    storageClass: longhorn
    size: 10Gi

  externalClusters:
    - name: harbor-internal-db
      connectionParameters:
        host: harbor-database.harbor.svc
        port: "5432"
        user: postgres
        dbname: postgres
        sslmode: disable
      password:
        name: harbor-db-source-password
        key: password