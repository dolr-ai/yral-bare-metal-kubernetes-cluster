# CloudNativePG Cluster for Harbor — migrated from Harbor's internal PostgreSQL.
#
# Bootstrap: logical import (initdb.import) from Harbor's internal DB
#            (harbor-database.harbor.svc:5432) via pg_dump/pg_restore.
#            This is the CNPG-recommended approach for external PostgreSQL migrations.
#            Ref: https://cloudnative-pg.io/docs/1.29/database_import/
#
# Cutover procedure:
#   1. CNPG cluster imports the `registry` database from harbor-database
#   2. Wait for import to complete (kubectl get cluster -n harbor harbor-db)
#   3. Scale down Harbor core/jobservice/registry (stop writes to old DB)
#   4. Update Harbor HelmRelease: database.type: external, host: harbor-db-rw
#   5. Scale Harbor back up — Harbor now connects to CNPG on Longhorn
#   6. Remove harbor-database StatefulSet + Ceph PVC (Helm handles this when type=external)
#
# Harbor connects via the -rw endpoint (harbor-db-rw.harbor.svc:5432).
# Database: registry, User: postgres (matches Harbor's internal DB config).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4

  # Superuser credentials (used by Harbor core and dbx to connect)
  superuserSecret:
    name: harbor-db-superuser

  # Logical import of the `registry` database from Harbor's internal PostgreSQL.
  # Uses pg_dump -Fd / pg_restore --no-acl --no-owner under the hood.
  # The source DB must be the same or older major version (18.3 → 18.4 is fine).
  bootstrap:
    initdb:
      database: registry
      owner: postgres
      import:
        type: monolith
        databases:
          - registry
        roles:
          - postgres
        source:
          externalCluster: harbor-internal-db

  storage:
    storageClass: longhorn
    size: 10Gi

  externalClusters:
    - name: harbor-internal-db
      connectionParameters:
        host: harbor-database.harbor.svc
        port: "5432"
        user: postgres
        dbname: postgres
        sslmode: disable
      password:
        name: harbor-db-replication
        key: password