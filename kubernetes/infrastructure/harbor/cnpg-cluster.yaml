# CloudNativePG Cluster for Harbor — 2-instance HA with streaming replication.
#
# Bootstrap: fresh initdb. Harbor's old internal PostgreSQL (harbor-database)
#            was removed by Helm when database.type switched to external.
#            Harbor core re-initializes its schema on first connect (migrations
#            run automatically via the `core` pod's init container).
#
# 2 instances (1 primary + 1 replica) with built-in streaming replication.
# Uses longhorn-1replica StorageClass per the storage replication policy —
# CNPG has native app-layer replication (streaming), so Longhorn 2-replica
# would be redundant write amplification.
#
# Harbor connects via the -rw endpoint (harbor-db-rw.harbor.svc:5432).
# Database: registry, User: postgres.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4

  # Superuser credentials (used by Harbor core and dbx to connect).
# enableSuperuserAccess must be true — otherwise CNPG ignores the
# superuserSecret and sets the postgres password to NULL, breaking
# password auth. See AGENTS.md "CNPG Superuser Password Management".
  enableSuperuserAccess: true
  superuserSecret:
    name: harbor-db-superuser

  # Fresh initdb — Harbor core runs schema migrations on first connect.
  # The old Harbor internal DB was removed by Helm when we switched to
  # database.type: external, so there's no source to import from.
  bootstrap:
    initdb:
      database: registry
      owner: postgres

  storage:
    storageClass: longhorn-1replica
    size: 10Gi