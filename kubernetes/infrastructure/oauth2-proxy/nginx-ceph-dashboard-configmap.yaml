apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ceph-dashboard
  namespace: oauth2-proxy
data:
  # nginx.conf.tmpl: @@CEPH_DASHBOARD_TOKEN@@ is replaced at container startup
  # by the alpine init container using sed. @@ delimiters avoid all regex-special
  # characters; nginx variables ($host, etc.) are left untouched.
  nginx.conf.tmpl: |
    worker_processes 1;

    events {
        worker_connections 1024;
    }

    http {
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 80;

            location / {
                proxy_pass http://rook-ceph-mgr-dashboard.rook-ceph.svc.cluster.local:7000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                # Prevent upstream gzip so sub_filter can see the raw HTML
                proxy_set_header Accept-Encoding "";
                proxy_buffering on;
                proxy_buffer_size 16k;
                proxy_buffers 8 64k;
                proxy_busy_buffers_size 128k;

                # Strip the upstream CSP and add our own (frame-ancestors preserved,
                # no script-src restriction needed for internal tool)
                proxy_hide_header Content-Security-Policy;
                add_header Content-Security-Policy "frame-ancestors 'self'" always;

                # Inject auto-login script into every HTML page.
                # Sets dashboard_token + dashboard_username in localStorage before
                # Angular initialises — Angular's auth guard finds a valid token
                # and skips the login page entirely.
                sub_filter_types text/html;
                sub_filter '</head>' '<script>(function(){try{localStorage.setItem("dashboard_token","@@CEPH_DASHBOARD_TOKEN@@");localStorage.setItem("dashboard_username","proxy-admin");}catch(e){}})();</script></head>';
                sub_filter_once on;
            }
        }
    }
