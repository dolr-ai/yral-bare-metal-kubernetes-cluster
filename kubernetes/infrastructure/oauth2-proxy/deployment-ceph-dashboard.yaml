apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-ceph-dashboard
  namespace: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy-ceph-dashboard
  template:
    metadata:
      labels:
        app: oauth2-proxy-ceph-dashboard
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.1
          args:
            - --provider=google
            - --email-domain=gobazzinga.io
            - --google-group=developer-admin@gobazzinga.io
            - --google-admin-email=s@gobazzinga.io
            - --google-service-account-json=/etc/oauth2-proxy/service-account.json
            # The Rook mgr pod exposes the Ceph dashboard on port 7000 (ssl: false).
            # Service name is rook-ceph-mgr-dashboard in the rook-ceph namespace.
            - --upstream=http://rook-ceph-mgr-dashboard.rook-ceph.svc.cluster.local:7000
            - --http-address=0.0.0.0:4180
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_ceph_dashboard
            - --cookie-expire=720h
            - --redirect-url=https://ceph.yral.com/oauth2/callback
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: cookie-secret
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: service-account
              mountPath: /etc/oauth2-proxy
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: service-account
          secret:
            secretName: oauth2-proxy-secrets
            items:
              - key: service-account-json
                path: service-account.json
