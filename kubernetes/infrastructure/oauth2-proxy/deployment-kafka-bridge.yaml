# oauth2-proxy for Kafka Bridge — Basic Auth mode
#
# Validates `Authorization: Basic <base64(:token)>` header against an htpasswd file.
# No OAuth2/OIDC flow. Token is stored in kafka-bridge-token secret (SOPS-encrypted).
#
# Consumer sends token via:
#   curl -u ":your-secret-token" https://kafka-bridge.yral.com/...
#   Python: requests.post(..., auth=("", "your-secret-token"))
#
# Traffic path:
#   kafka-bridge.yral.com → Cilium Gateway (TLS term) → HTTPRoute → oauth2-proxy
#   → validates Basic Auth → forwards to kafka-bridge-bridge-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-kafka-bridge
  namespace: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy-kafka-bridge
  template:
    metadata:
      labels:
        app: oauth2-proxy-kafka-bridge
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.1
          args:
            - --provider=oidc
            - --upstream=http://kafka-bridge-bridge-service.kafka.svc.cluster.local:8080
            - --http-address=0.0.0.0:4180
            - --basic-auth-password-file=/etc/oauth2-proxy/htpasswd
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_kafka_bridge
            - --cookie-expire=720h
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: cookie-secret
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: htpasswd
              mountPath: /etc/oauth2-proxy
              readOnly: true
      volumes:
        - name: htpasswd
          secret:
            secretName: kafka-bridge-token
            items:
              - key: htpasswd
                path: htpasswd
