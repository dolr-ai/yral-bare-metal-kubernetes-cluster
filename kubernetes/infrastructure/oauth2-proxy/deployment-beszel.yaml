# oauth2-proxy for Beszel — gates access to @gobazzinga.io emails.
# Beszel's own login is disabled via TRUSTED_AUTH_HEADER=X-Forwarded-Email.
# No google-group restriction — all @gobazzinga.io users are allowed.
# The /api/beszel/agent-connect path is exempted via --skip-auth-regex because
# Beszel agents authenticate with their own token, not Google SSO.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-beszel
  namespace: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy-beszel
  template:
    metadata:
      labels:
        app: oauth2-proxy-beszel
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          args:
            - --provider=google
            - --email-domain=gobazzinga.io
            - --google-admin-email=s@gobazzinga.io
            - --google-service-account-json=/etc/oauth2-proxy/service-account.json
            - --upstream=http://beszel.beszel.svc.cluster.local:8090
            - --http-address=0.0.0.0:4180
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_beszel
            - --cookie-expire=720h
            - --redirect-url=https://beszel.yral.com/oauth2/callback
            - --skip-provider-button=true
            - --pass-user-headers=true
            # Beszel agents connect via WebSocket to /api/beszel/agent-connect
            # with their own token auth — bypass oauth2-proxy for this path.
            - --skip-auth-regex=^/api/beszel/agent-connect
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: cookie-secret
          ports:
            - containerPort: 4180
              name: http
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: service-account
              mountPath: /etc/oauth2-proxy
              readOnly: true
      volumes:
        - name: service-account
          secret:
            secretName: oauth2-proxy-secrets
            items:
              - key: service-account-json
                path: service-account.json