---
# Persistent storage for Metabase's embedded H2 application database.
# Stores dashboards, saved questions, user accounts, and connection config.
# Single RWO volume — Metabase runs as a single replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metabase-data
  namespace: metabase
spec:
  # 2 replicas: Metabase runs as a single pod with an embedded H2 database.
  # Switch to the default `longhorn` StorageClass once Metabase is migrated
  # to an external PostgreSQL with its own HA.
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
