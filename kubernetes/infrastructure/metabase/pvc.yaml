---
# Persistent storage for Metabase's embedded H2 application database.
# Stores dashboards, saved questions, user accounts, and connection config.
# Single RWO volume — Metabase runs as a single replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metabase-data
  namespace: metabase
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
