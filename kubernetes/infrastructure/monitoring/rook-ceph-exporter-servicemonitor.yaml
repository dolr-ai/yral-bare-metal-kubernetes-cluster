---
# ServiceMonitor for the Rook-Ceph exporter daemon (ceph_exporter).
#
# The ceph_exporter is a per-node DaemonSet deployed by Rook (one pod per worker,
# 35 pods in this cluster). It exposes Ceph daemon performance counters — per-OSD
# operation counts, throughput, latency histograms, bluestore stats — on port 9926.
# These are the metrics the Grafana Ceph OSD and Cluster dashboards need for
# throughput/IOPS/latency panels (ceph_osd_op_r, ceph_osd_op_w, ceph_osd_op_r_latency_*,
# ceph_osd_stat_bytes, ceph_bluestore_kv_commit_lat_*, etc.).
#
# The mgr prometheus module (scraped by rook-ceph-servicemonitor.yaml on port 9283)
# provides cluster/pool/PG health/status metrics but NOT the per-OSD performance
# counters. Both sources are needed for full dashboard coverage.
#
# Source: https://rook.io/docs/rook/latest/Storage-Configuration/Monitoring/ceph-monitoring/
# Rook auto-creates a ServiceMonitor for the exporter in the rook-ceph namespace,
# but like the mgr ServiceMonitor it lacks the `release: kube-prometheus-stack`
# label and is silently ignored by Prometheus. This committed one bridges that gap.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rook-ceph-exporter
  namespace: monitoring
  labels:
    # Required: Prometheus in kube-prometheus-stack only picks up ServiceMonitors
    # that match its serviceMonitorSelector: {release: kube-prometheus-stack}
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - rook-ceph
  selector:
    matchLabels:
      app: rook-ceph-exporter
      rook_cluster: rook-ceph
  endpoints:
    - port: ceph-exporter-http-metrics
      interval: 30s
      path: /metrics