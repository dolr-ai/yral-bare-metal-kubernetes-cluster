apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-google-chat-relay
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-google-chat-relay
    app.kubernetes.io/component: alerting
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-google-chat-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager-google-chat-relay
      annotations:
        # Restart the pod when the relay script ConfigMap changes
        reloader.stakater.com/auto: "true"
        configmap.reloader.stakater.com/reload: "alertmanager-google-chat-relay"
    spec:
      containers:
        - name: relay
          image: python:3.12-slim
          command: ["python3", "/app/relay.py"]
          env:
            - name: GOOGLE_CHAT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: monitoring-google-chat-secrets
                  key: GOOGLE_CHAT_WEBHOOK_URL
            - name: LISTEN_PORT
              value: "5001"
          ports:
            - containerPort: 5001
              name: http
          volumeMounts:
            - name: relay-script
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: relay-script
          configMap:
            name: alertmanager-google-chat-relay
            defaultMode: 0755
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager-google-chat-relay
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-google-chat-relay
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-google-chat-relay
    app.kubernetes.io/component: alerting
spec:
  selector:
    app.kubernetes.io/name: alertmanager-google-chat-relay
  ports:
    - name: http
      port: 5001
      targetPort: 5001
  type: ClusterIP