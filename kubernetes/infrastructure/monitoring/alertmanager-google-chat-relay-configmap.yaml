apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-google-chat-relay
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-google-chat-relay
    app.kubernetes.io/component: alerting
data:
  relay.py: |
    #!/usr/bin/env python3
    """Alertmanager → Google Chat webhook relay.

    Alertmanager's webhook_configs sends a structured JSON body (receiver, status,
    alerts, groupLabels, etc.) that Google Chat rejects with "Invalid JSON payload
    received. Unknown name ...". Google Chat webhooks expect {"text": "..."}.

    This relay receives Alertmanager's native webhook POST, formats the alert data
    into a plain-text message, and forwards it to Google Chat as {"text": "..."}.

    Uses only the Python standard library — no pip dependencies required.
    """

    import json
    import os
    import urllib.request
    from http.server import HTTPServer, BaseHTTPRequestHandler

    GOOGLE_CHAT_WEBHOOK_URL = os.environ.get("GOOGLE_CHAT_WEBHOOK_URL", "")
    LISTEN_PORT = int(os.environ.get("LISTEN_PORT", "5001"))


    def format_alerts(payload: dict) -> str:
        """Format an Alertmanager webhook payload into a Google Chat text message."""
        status = payload.get("status", "unknown")
        alerts = payload.get("alerts", [])
        common_labels = payload.get("commonLabels", {})

        if status == "firing":
            icon = "\U0001F525"
            status_text = "FIRING"
        else:
            icon = "\u2705"
            status_text = "RESOLVED"

        severity = common_labels.get("severity", "")
        severity_emoji = {"critical": "\U0001F534", "warning": "\U0001F7E1"}.get(severity, "")

        lines = [f"{icon} {severity_emoji} {status_text} — {len(alerts)} alert(s)"]

        if severity:
            lines.append(f"Severity: {severity}")
        namespace = common_labels.get("namespace", "")
        if namespace:
            lines.append(f"Namespace: {namespace}")

        lines.append("")

        for alert in alerts:
            labels = alert.get("labels", {})
            annotations = alert.get("annotations", {})
            alert_status = alert.get("status", "unknown")
            alert_name = labels.get("alertname", "unknown")

            status_icon = "\U0001F525" if alert_status == "firing" else "\u2705"
            line = f"{status_icon} {alert_name}"
            if labels.get("namespace"):
                line += f" ({labels['namespace']})"
            if labels.get("pod"):
                line += f" pod={labels['pod']}"
            lines.append(line)

            summary = annotations.get("summary", "")
            if summary:
                lines.append(f"  {summary}")
            description = annotations.get("description", "")
            if description:
                lines.append(f"  {description}")
            lines.append("")

        return "\n".join(lines).strip()


    class RelayHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            content_length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(content_length)

            try:
                payload = json.loads(body)
            except json.JSONDecodeError:
                self.send_response(400)
                self.end_headers()
                self.wfile.write(b"Invalid JSON")
                return

            text = format_alerts(payload)
            google_chat_payload = json.dumps({"text": text}).encode("utf-8")

            try:
                request = urllib.request.Request(
                    GOOGLE_CHAT_WEBHOOK_URL,
                    data=google_chat_payload,
                    headers={"Content-Type": "application/json"},
                    method="POST",
                )
                with urllib.request.urlopen(request, timeout=10) as response:
                    response.read()
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"OK")
            except Exception as error:
                print(f"Failed to forward to Google Chat: {error}", flush=True)
                self.send_response(502)
                self.end_headers()
                self.wfile.write(f"Relay error: {error}".encode("utf-8"))

        def do_GET(self):
            if self.path == "/health":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"OK")
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            print(f"{self.address_string()} - {format % args}", flush=True)


    if __name__ == "__main__":
        if not GOOGLE_CHAT_WEBHOOK_URL:
            raise SystemExit("GOOGLE_CHAT_WEBHOOK_URL environment variable is required")
        print(f"Starting Alertmanager → Google Chat relay on port {LISTEN_PORT}", flush=True)
        server = HTTPServer(("0.0.0.0", LISTEN_PORT), RelayHandler)
        server.serve_forever()