apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.18.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  timeout: 10m
  upgrade:
    remediation:
      retries: 3
  values:
    grafana:
      # Inject Google Chat webhook URL as an env var so the alerting
      # provisioning ConfigMap can reference it as $GOOGLE_CHAT_WEBHOOK_URL.
      envFromSecret: "monitoring-google-chat-secrets"

      # Auth proxy: oauth2-proxy handles authentication.
      # Grafana trusts X-Auth-Request-Email header forwarded by oauth2-proxy.
      # The login form and basic auth are disabled — no admin password needed.
      grafana.ini:
        server:
          # Required: Grafana uses root_url for post-login redirects.
          # Without this, auth.proxy sign-in redirects to a blank domain and loops back to /login.
          root_url: https://grafana.yral.com
        users:
          # All users who reach Grafana are already gated by the developer-admin Google group
          # via oauth2-proxy, so auto-assigning Admin is appropriate.
          auto_assign_org_role: Admin
        auth.proxy:
          enabled: true
          # oauth2-proxy --pass-user-headers=true forwards X-Forwarded-Email to the upstream.
          # (--set-xauthrequest only sets X-Auth-Request-* on the response, not the upstream request)
          header_name: X-Forwarded-Email
          header_property: email
          auto_sign_up: true
        auth:
          disable_login_form: true
        auth.basic:
          enabled: false

      # Disable default admin secret — login is disabled anyway.
      admin:
        existingSecret: ""
        userKey: ""
        passwordKey: ""

      # No persistent storage — dashboards and datasources come from ConfigMaps.
      persistence:
        enabled: false

      # Stakater Reloader watches this Deployment and rolls it when any referenced
      # ConfigMap or Secret changes (e.g. the grafana-datasource ConfigMap).
      # skipReload stops the sidecar from POSTing to Grafana's reload API (which
      # always 401s because basic auth is disabled); Reloader restarts the pod instead.
      podAnnotations:
        reloader.stakater.com/auto: "true"
        # Explicitly list the sidecar-discovered alert ConfigMaps so Reloader restarts
        # the pod when they change. The alerts sidecar cannot call the reload API
        # (basic auth is disabled), so pod restart is the correct reload mechanism.
        configmap.reloader.stakater.com/reload: "grafana-alerting-contact-point,grafana-alerting-notification-policy,grafana-alerting-rules-resource-saturation"

      sidecar:
        # Watches ConfigMaps labelled grafana_alert="1" and loads them as Grafana
        # unified alerting provisioning (contact points, notification policies, rules).
        alerts:
          enabled: true
          label: grafana_alert
          labelValue: "1"
          # Skip the reload API call (always 401s — basic auth disabled).
          # Reloader restarts the pod instead when alert ConfigMaps change.
          skipReload: true
        datasources:
          skipReload: true

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

      # Loki datasource — populated once the infrastructure-loki Kustomization is ready
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.loki.svc.cluster.local:3100
          access: proxy

    prometheus:
      prometheusSpec:
        # 15-day retention, matches default; adjust as needed.
        retention: 15d
        # Hard size cap: discard oldest blocks before hitting the filesystem
        # limit. Set to ~90% of PVC to leave headroom for in-progress blocks.
        retentionSize: 90GB

        # Store metrics on a PVC (btrfs subvolume on the node).
        storageSpec:
          volumeClaimTemplate:
            spec:
              # Single replica (default): no in-cluster HA, but Longhorn 2-replica
              # provides durable storage at the volume level. Prometheus is not
              # stateful enough to warrant a second replica — 15d retention is expendable.
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 100Gi

        resources:
          requests:
            cpu: 200m
            memory: 2Gi
          limits:
            cpu: 1000m
            memory: 8Gi

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

