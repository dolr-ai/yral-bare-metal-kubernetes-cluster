# PodMonitor for Flux controllers
#
# Flux controllers expose metrics on port http-prom (8080) but have no Services
# for their metrics endpoints. PodMonitor scrapes the pods directly.
# Source: https://github.com/fluxcd/flux2-monitoring-example/blob/main/monitoring/configs/podmonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: flux
    app.kubernetes.io/component: monitoring
    # Required: Prometheus in kube-prometheus-stack only picks up PodMonitors
    # that match its podMonitorSelector: {release: kube-prometheus-stack}
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - helm-controller
          - source-controller
          - kustomize-controller
          - notification-controller
          - image-automation-controller
          - image-reflector-controller
  podMetricsEndpoints:
    - port: http-prom
