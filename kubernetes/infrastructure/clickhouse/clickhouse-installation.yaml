# ClickHouseInstallation managed by Altinity operator.
# Single shard, single replica -- no Keeper/ZooKeeper needed (plain MergeTree, no replication)
#
# Schema init via startup_scripts (runs on every pod start, all queries are IF NOT EXISTS):
#   - snowplow.events_queue       Kafka engine (reads TSV from snowplow-enriched, 4 consumer threads)
#   - snowplow.events_v1          MergeTree storage (archived pre-enrichment table; drop when stable)
#   - snowplow.events_v2          MergeTree storage (canonical; enriched with geo+UA data)
#   - snowplow.events_mv          Materialized view piping queue -> events_v2 (canonical)
#   - snowplow.bad_rows_queue      Kafka engine (reads JSON from snowplow-enrich-bad)
#   - snowplow.bad_rows            MergeTree storage (enrichment bad rows for investigation)
#   - snowplow.bad_rows_mv         Materialized view piping bad_rows_queue -> bad_rows
#
# Metabase connection:
#   Host: clickhouse-analytics.clickhouse.svc.cluster.local
#   Port: 8123  Database: snowplow  Username: default  Password: (none)
#   Query table: snowplow.events_v2 (canonical, enriched)
apiVersion: "clickhouse.altinity.com/v1"
kind: ClickHouseInstallation
metadata:
  name: analytics
  namespace: clickhouse
spec:
  configuration:
    users:
      # Allow connections from any pod in the cluster (no password -- internal access only).
      default/networks/ip: "::/0"

    files:
      config.d/kafka.xml: |
        <clickhouse>
          <kafka>
            <security_protocol>SASL_PLAINTEXT</security_protocol>
            <sasl_mechanism>SCRAM-SHA-512</sasl_mechanism>
            <sasl_username>clickhouse-snowplow</sasl_username>
            <sasl_password from_env="KAFKA_SASL_PASSWORD"/>
            <auto_offset_reset>earliest</auto_offset_reset>
          </kafka>
        </clickhouse>

      config.d/startup-scripts.xml: |
        <clickhouse>
          <startup_scripts>
            <scripts>
              <query><![CDATA[CREATE DATABASE IF NOT EXISTS snowplow]]></query>
            </scripts>
            <scripts>
              <query><![CDATA[CREATE TABLE IF NOT EXISTS snowplow.events_queue (
              app_id String,
              platform String,
              etl_tstamp String,
              collector_tstamp String,
              dvce_created_tstamp String,
              event String,
              event_id String,
              txn_id String,
              name_tracker String,
              v_tracker String,
              v_collector String,
              v_etl String,
              user_id String,
              user_ipaddress String,
              user_fingerprint String,
              domain_userid String,
              domain_sessionidx String,
              network_userid String,
              geo_country String,
              geo_region String,
              geo_city String,
              geo_zipcode String,
              geo_latitude String,
              geo_longitude String,
              geo_region_name String,
              ip_isp String,
              ip_organization String,
              ip_domain String,
              ip_netspeed String,
              page_url String,
              page_title String,
              page_referrer String,
              page_urlscheme String,
              page_urlhost String,
              page_urlport String,
              page_urlpath String,
              page_urlquery String,
              page_urlfragment String,
              refr_urlscheme String,
              refr_urlhost String,
              refr_urlport String,
              refr_urlpath String,
              refr_urlquery String,
              refr_urlfragment String,
              refr_medium String,
              refr_source String,
              refr_term String,
              mkt_medium String,
              mkt_source String,
              mkt_term String,
              mkt_content String,
              mkt_campaign String,
              contexts String,
              se_category String,
              se_action String,
              se_label String,
              se_property String,
              se_value String,
              unstruct_event String,
              tr_orderid String,
              tr_affiliation String,
              tr_total String,
              tr_tax String,
              tr_shipping String,
              tr_city String,
              tr_state String,
              tr_country String,
              ti_orderid String,
              ti_sku String,
              ti_name String,
              ti_category String,
              ti_price String,
              ti_quantity String,
              pp_xoffset_min String,
              pp_xoffset_max String,
              pp_yoffset_min String,
              pp_yoffset_max String,
              useragent String,
              br_name String,
              br_family String,
              br_version String,
              br_type String,
              br_renderengine String,
              br_lang String,
              br_features_pdf String,
              br_features_flash String,
              br_features_java String,
              br_features_director String,
              br_features_quicktime String,
              br_features_realplayer String,
              br_features_windowsmedia String,
              br_features_gears String,
              br_features_silverlight String,
              br_cookies String,
              br_colordepth String,
              br_viewwidth String,
              br_viewheight String,
              os_name String,
              os_family String,
              os_manufacturer String,
              os_timezone String,
              dvce_type String,
              dvce_ismobile String,
              dvce_screenwidth String,
              dvce_screenheight String,
              doc_charset String,
              doc_width String,
              doc_height String,
              tr_currency String,
              tr_total_base String,
              tr_tax_base String,
              tr_shipping_base String,
              ti_currency String,
              ti_price_base String,
              base_currency String,
              geo_timezone String,
              mkt_clickid String,
              mkt_network String,
              etl_tags String,
              dvce_sent_tstamp String,
              refr_domain_userid String,
              refr_dvce_tstamp String,
              derived_contexts String,
              domain_sessionid String,
              derived_tstamp String,
              event_vendor String,
              event_name String,
              event_format String,
              event_version String,
              event_fingerprint String,
              true_tstamp String
              ) ENGINE = Kafka()
              SETTINGS
                  kafka_broker_list = 'kafka-cluster-kafka-bootstrap.kafka.svc:9092',
                  kafka_topic_list = 'snowplow-enriched',
                  kafka_group_name = 'clickhouse-snowplow-consumer',
                  kafka_format = 'TSV',
                  kafka_num_consumers = 4,
                  kafka_skip_broken_messages = 100]]></query>
            </scripts>
            <!-- events_v1 (formerly events) is the archived pre-enrichment table.
                 It exists on the cluster but is not managed by startup_scripts —
                 drop it manually once events_v2 is confirmed stable. -->
            <scripts>
              <query><![CDATA[CREATE MATERIALIZED VIEW IF NOT EXISTS snowplow.events_mv
              TO snowplow.events_v2
              AS SELECT * FROM snowplow.events_queue]]></query>
            </scripts>
            <!-- Bad rows: consume enrichment failures from snowplow-enrich-bad (JSON format).
                 Each bad row is a JSON object with failure info + original payload.
                 Stored as raw JSON for investigation; should be empty if enrichment is healthy. -->
            <scripts>
              <query><![CDATA[CREATE TABLE IF NOT EXISTS snowplow.bad_rows_queue (
                bad_row String
              ) ENGINE = Kafka()
              SETTINGS
                  kafka_broker_list = 'kafka-cluster-kafka-bootstrap.kafka.svc:9092',
                  kafka_topic_list = 'snowplow-enrich-bad',
                  kafka_group_name = 'clickhouse-snowplow-bad-consumer',
                  kafka_format = 'JSONAsString',
                  kafka_num_consumers = 2,
                  kafka_skip_broken_messages = 100]]></query>
            </scripts>
            <scripts>
              <query><![CDATA[CREATE TABLE IF NOT EXISTS snowplow.bad_rows (
                bad_row String,
                collector_tstamp DateTime DEFAULT now()
              ) ENGINE = MergeTree()
              PARTITION BY toYYYYMM(collector_tstamp)
              ORDER BY collector_tstamp
              TTL collector_tstamp + INTERVAL 1 MONTH
              SETTINGS ttl_only_drop_parts = 1]]></query>
            </scripts>
            <scripts>
              <query><![CDATA[CREATE MATERIALIZED VIEW IF NOT EXISTS snowplow.bad_rows_mv
              TO snowplow.bad_rows
              AS SELECT bad_row, now() AS collector_tstamp FROM snowplow.bad_rows_queue]]></query>
            </scripts>
            <scripts>
              <query><![CDATA[CREATE TABLE IF NOT EXISTS snowplow.events_v2 (
              app_id String,
              platform String,
              etl_tstamp String,
              collector_tstamp String,
              dvce_created_tstamp String,
              event String,
              event_id String,
              txn_id String,
              name_tracker String,
              v_tracker String,
              v_collector String,
              v_etl String,
              user_id String,
              user_ipaddress String,
              user_fingerprint String,
              domain_userid String,
              domain_sessionidx String,
              network_userid String,
              geo_country String,
              geo_region String,
              geo_city String,
              geo_zipcode String,
              geo_latitude String,
              geo_longitude String,
              geo_region_name String,
              ip_isp String,
              ip_organization String,
              ip_domain String,
              ip_netspeed String,
              page_url String,
              page_title String,
              page_referrer String,
              page_urlscheme String,
              page_urlhost String,
              page_urlport String,
              page_urlpath String,
              page_urlquery String,
              page_urlfragment String,
              refr_urlscheme String,
              refr_urlhost String,
              refr_urlport String,
              refr_urlpath String,
              refr_urlquery String,
              refr_urlfragment String,
              refr_medium String,
              refr_source String,
              refr_term String,
              mkt_medium String,
              mkt_source String,
              mkt_term String,
              mkt_content String,
              mkt_campaign String,
              contexts String,
              se_category String,
              se_action String,
              se_label String,
              se_property String,
              se_value String,
              unstruct_event String,
              tr_orderid String,
              tr_affiliation String,
              tr_total String,
              tr_tax String,
              tr_shipping String,
              tr_city String,
              tr_state String,
              tr_country String,
              ti_orderid String,
              ti_sku String,
              ti_name String,
              ti_category String,
              ti_price String,
              ti_quantity String,
              pp_xoffset_min String,
              pp_xoffset_max String,
              pp_yoffset_min String,
              pp_yoffset_max String,
              useragent String,
              br_name String,
              br_family String,
              br_version String,
              br_type String,
              br_renderengine String,
              br_lang String,
              br_features_pdf String,
              br_features_flash String,
              br_features_java String,
              br_features_director String,
              br_features_quicktime String,
              br_features_realplayer String,
              br_features_windowsmedia String,
              br_features_gears String,
              br_features_silverlight String,
              br_cookies String,
              br_colordepth String,
              br_viewwidth String,
              br_viewheight String,
              os_name String,
              os_family String,
              os_manufacturer String,
              os_timezone String,
              dvce_type String,
              dvce_ismobile String,
              dvce_screenwidth String,
              dvce_screenheight String,
              doc_charset String,
              doc_width String,
              doc_height String,
              tr_currency String,
              tr_total_base String,
              tr_tax_base String,
              tr_shipping_base String,
              ti_currency String,
              ti_price_base String,
              base_currency String,
              geo_timezone String,
              mkt_clickid String,
              mkt_network String,
              etl_tags String,
              dvce_sent_tstamp String,
              refr_domain_userid String,
              refr_dvce_tstamp String,
              derived_contexts String,
              domain_sessionid String,
              derived_tstamp String,
              event_vendor String,
              event_name String,
              event_format String,
              event_version String,
              event_fingerprint String,
              true_tstamp String
              ) ENGINE = MergeTree()
              PARTITION BY substring(collector_tstamp, 1, 7)
              ORDER BY (collector_tstamp, event_id)
              TTL parseDateTimeBestEffort(collector_tstamp) + INTERVAL 3 MONTH
              SETTINGS ttl_only_drop_parts = 1]]></query>
            </scripts>
          </startup_scripts>
        </clickhouse>

    clusters:
      - name: events
        templates:
          podTemplate: clickhouse-pod
          dataVolumeClaimTemplate: data-volume
        layout:
          shardsCount: 1
          replicasCount: 1

  templates:
    podTemplates:
      - name: clickhouse-pod
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:26.7.1.1315
              env:
                - name: KAFKA_SASL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-kafka-credentials
                      key: kafka-sasl-password
              resources:
                requests:
                  cpu: "2"
                  memory: "4Gi"
                limits:
                  cpu: "4"
                  memory: "8Gi"

    volumeClaimTemplates:
      - name: data-volume
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: ceph-block
          resources:
            requests:
              storage: 200Gi
