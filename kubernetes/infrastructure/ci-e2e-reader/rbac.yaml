apiVersion: v1
kind: Namespace
metadata:
  name: ci
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-e2e-reader
  namespace: ci
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-e2e-reader-token
  namespace: ci
  annotations:
    kubernetes.io/service-account.name: ci-e2e-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ci-e2e-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services/portforward"]
    verbs: ["create"]
---
# kafka namespace — Snowplow event delivery assertions
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-e2e-reader
  namespace: kafka
subjects:
  - kind: ServiceAccount
    name: ci-e2e-reader
    namespace: ci
roleRef:
  kind: ClusterRole
  name: ci-e2e-reader
  apiGroup: rbac.authorization.k8s.io
---
# clickhouse namespace — ready for future analytics assertions
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-e2e-reader
  namespace: clickhouse
subjects:
  - kind: ServiceAccount
    name: ci-e2e-reader
    namespace: ci
roleRef:
  kind: ClusterRole
  name: ci-e2e-reader
  apiGroup: rbac.authorization.k8s.io
