apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.19.1"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  # Upgrade strategy: never uninstall on failure — Cilium is CNI, pulling it
  # out would take down all pod networking. Instead, retry the upgrade.
  # 15m timeout: Cilium DaemonSet rolling update across all nodes takes >5m.
  timeout: 15m
  upgrade:
    remediation:
      retries: 3
  rollback:
    force: true
  values:
    cluster:
      name: yral-k8s-cluster
      id: 1

    kubeProxyReplacement: true
    k8sServiceHost: kubernetes-api.yral.com
    k8sServicePort: 6443

    ipam:
      mode: kubernetes

    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: true

    hubble:
      enabled: true
      relay:
        enabled: true
        replicas: 2
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 512Mi
      ui:
        enabled: true
        replicas: 1
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        ingress:
          enabled: false
      metrics:
        enabled:
          - dns:query
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction

    # IngressController disabled — Gateway API is the sole ingress mechanism.
    ingressController:
      enabled: false

    # Gateway API — hostNetwork mode for bare-metal port binding.
    # Cilium binds directly to ports 80/443 on every node.
    # Cloudflare proxy connects to origin port 443 → hits these pods on every CP node.
    gatewayAPI:
      enabled: true
      hostNetwork:
        enabled: true

    envoy:
      enabled: true
      # Required for hostNetwork mode with privileged ports (80, 443 < 1024).
      # Without NET_BIND_SERVICE, Envoy cannot bind to ports <= 1023.
      # ref: https://docs.cilium.io/en/v1.19/network/servicemesh/gateway-api/host-network-mode/#bind-to-privileged-port
      securityContext:
        capabilities:
          keepCapNetBindService: true
          envoy:
            - NET_BIND_SERVICE
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi

    operator:
      replicas: 2
      resources:
        limits:
          cpu: 1000m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 128Mi

    ipv4:
      enabled: true

    ipv6:
      enabled: false

    bgpControlPlane:
      enabled: false

    # SNAT mode: DSR is incompatible with Hetzner bare metal (VIPs not bound
    # to any local interface → packet reflection).
    loadBalancer:
      algorithm: maglev
      mode: snat

    socketLB:
      enabled: true

    hostFirewall:
      enabled: false

    bandwidthManager:
      enabled: true
      bbr: true

    localRedirectPolicy: true

    bpf:
      masquerade: true
      preallocateMaps: true

    endpointRoutes:
      enabled: true

    autoDirectNodeRoutes: false

    enableIPv4Masquerade: true
    enableIPv6Masquerade: false

    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 512Mi

    seccompPath: ""

    prometheus:
      enabled: true
      serviceMonitor:
        enabled: false

    healthChecking: true

    # VXLAN tunnel mode: encapsulates pod traffic, compatible with Hetzner L3 routing.
    # Native routing caused packet reflection (VIP responses re-routed to gateway).
    tunnelProtocol: vxlan
    routingMode: tunnel

    hostServices:
      enabled: true
      protocols: tcp,udp

    # SNAT mode for consistency with loadBalancer.mode.
    nodePort:
      enabled: true
      mode: snat

    externalIPs:
      enabled: true

    l7Proxy: true

    dnsProxy:
      enableTransparentMode: true

    policyEnforcementMode: default

    cni:
      chainingMode: none
      exclusive: true

    tolerations:
      - operator: Exists

    debug:
      enabled: false

    rollOutCiliumPods: true
