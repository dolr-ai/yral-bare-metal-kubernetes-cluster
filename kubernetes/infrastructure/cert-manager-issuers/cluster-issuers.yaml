# Let's Encrypt ClusterIssuers
#
# Two issuers:
#   letsencrypt-staging  — use while testing; no rate limits, certs are untrusted
#   letsencrypt-prod     — use for real services; browser-trusted, strict rate limits
#
# DNS-01 challenge flow:
#   cert-manager calls the Cloudflare API to create a _acme-challenge TXT record.
#   Let's Encrypt validates via DNS — works through Cloudflare orange-cloud proxy.
#   Supports wildcards (*.yral.com).
#
# Cloudflare API token secret:
#   Name: cloudflare-api-token, Namespace: cert-manager, Key: api-token
#   Managed by Flux via SOPS-encrypted cloudflare-api-token.sops.yaml in this directory.
#
# Switching from staging to prod:
#   1. Change cert-manager.io/cluster-issuer annotation on Gateway to letsencrypt-prod
#   2. Delete the TLS Secret so cert-manager re-issues it
#   3. cert-manager requests a prod cert automatically
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: infra@yral.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: infra@yral.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
