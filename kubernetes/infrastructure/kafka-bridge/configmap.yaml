# Kafka Bridge configuration template
#
# This is a template — $(KAFKA_BRIDGE_PASSWORD) is expanded by an init container
# using envsubst before the Bridge starts. The Strimzi Docker entrypoint does a
# plain tee copy without env var expansion.
#
# Note: The Bridge does NOT have built-in HTTP authentication.
# Auth is handled at the edge (Cilium Gateway / reverse proxy).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-bridge-config
  namespace: kafka
data:
  application.properties: |
    bridge.id=kafka-bridge

    # Apache Kafka common (shared by admin, producer, consumer)
    kafka.bootstrap.servers=kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
    kafka.security.protocol=SASL_PLAINTEXT
    kafka.sasl.mechanism=SCRAM-SHA-512
    kafka.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka-bridge" password="$(KAFKA_BRIDGE_PASSWORD)";

    # Apache Kafka producer
    kafka.producer.acks=all

    # Apache Kafka consumer
    kafka.consumer.auto.offset.reset=latest
    kafka.consumer.instance.timeout.ms=30000
    kafka.consumer.max.creators=10

    # HTTP listener
    http.host=0.0.0.0
    http.port=8080

    # HTTP management interface (health + metrics)
    http.management.port=8081

    # Enable consumer + producer
    http.consumer.enabled=true
    http.producer.enabled=true
