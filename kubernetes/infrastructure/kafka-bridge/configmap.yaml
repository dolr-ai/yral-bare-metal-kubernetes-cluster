# Kafka Bridge configuration
#
# Connects to internal Kafka cluster via SASL_PLAINTEXT (port 9092).
# All internal traffic is encrypted by Cilium WireGuard at the network layer.
#
# Consumer instance timeout: 30s (fast rebalance if a client crashes without cleanup).
# Max consumer creators: 10 (max concurrent consumer instances).
# Authentication: static bearer token (from KAFKA_BRIDGE_BEARER_TOKEN env var).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-bridge
  namespace: kafka
data:
  bridge.properties: |
    # Admin client
    admin.bootstrap.servers=kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
    admin.security.protocol=SASL_PLAINTEXT
    admin.sasl.mechanism=SCRAM-SHA-512
    admin.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka-bridge" password="$(KAFKA_BRIDGE_PASSWORD)";

    # Producer
    producer.bootstrap.servers=kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
    producer.security.protocol=SASL_PLAINTEXT
    producer.sasl.mechanism=SCRAM-SHA-512
    producer.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka-bridge" password="$(KAFKA_BRIDGE_PASSWORD)";

    # Consumer
    consumer.bootstrap.servers=kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
    consumer.security.protocol=SASL_PLAINTEXT
    consumer.sasl.mechanism=SCRAM-SHA-512
    consumer.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka-bridge" password="$(KAFKA_BRIDGE_PASSWORD)";
    consumer.instance.timeout.ms=30000
    consumers.max.creators=10

    # HTTP listener
    http.port=8080

    # Authentication
    authentication.type=static_token
    authentication.token=$(KAFKA_BRIDGE_BEARER_TOKEN)
