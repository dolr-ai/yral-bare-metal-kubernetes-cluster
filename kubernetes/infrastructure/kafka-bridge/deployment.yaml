# Kafka Bridge — stateless HTTP bridge to Kafka
#
# Provides an HTTP REST API for consuming from Kafka topics, allowing external
# clients (e.g., Python/FastAPI services) to consume without a native Kafka client.
#
# Version: 1.0.0 (latest stable, Kafka 4.2.0 client, Java 21)
# Check: https://github.com/strimzi/strimzi-kafka-bridge/releases
#
# Auth: The Bridge has no built-in HTTP authentication (per Strimzi docs).
# External auth should be added via reverse proxy (oauth2-proxy, etc.) if needed.
# Kafka auth: dedicated kafka-bridge KafkaUser with read-only ACLs on snowplow-enriched.
#
# Traffic path:
#   kafka-bridge.yral.com → Cloudflare (orange cloud) → Cilium Gateway (TLS term)
#   → HTTPRoute → kafka-bridge Service → kafka-bridge Deployment
#   → Kafka brokers (internal SASL_PLAINTEXT, port 9092)
#
# Note: v1.0.0 moved /healthy, /ready, /metrics to management port 8081.
# Probes use port 8081; HTTP API remains on port 8080.
#
# Note: The Strimzi Docker entrypoint copies the config file verbatim (no env var
# expansion). An init container uses envsubst to expand $(KAFKA_BRIDGE_PASSWORD)
# before the main container starts.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-bridge
  namespace: kafka
  labels:
    app: kafka-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-bridge
  template:
    metadata:
      labels:
        app: kafka-bridge
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - falkenstein
      initContainers:
        # The Strimzi Docker entrypoint copies the config file verbatim (no env var
        # expansion). This init container expands $(VAR) placeholders using envsubst
        # before the main container starts.
        - name: config-init
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              envsubst < /tmp/template/application.properties \
                > /tmp/custom-config/application.properties
          env:
            - name: KAFKA_BRIDGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-user-passwords
                  key: kafka-bridge-password
          volumeMounts:
            - name: config-template
              mountPath: /tmp/template
              readOnly: true
            - name: config
              mountPath: /tmp/custom-config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: kafka-bridge
          image: quay.io/strimzi/kafka-bridge:1.0.0
          command:
            - /opt/strimzi/bin/docker/kafka_bridge_run.sh
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: management
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthy
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /opt/strimzi/custom-config/application.properties
              subPath: application.properties
      volumes:
        - name: config-template
          configMap:
            name: kafka-bridge-config
        - name: config
          emptyDir: {}
