# PowerDNS Authoritative Server — Deployment (no database, bind backend).
#
# Uses the bind backend — zone files are text ConfigMaps (declarative, GitOps).
# No StatefulSet, no PVC, no database. A simple Deployment with 2 replicas.
#
# Dynamic updates (RFC2136) from ExternalDNS and cert-manager write to a journal
# file on an emptyDir (ephemeral). On pod restart, ExternalDNS and cert-manager
# re-create their records automatically.
#
# Scheduling: worker nodes only (node affinity excludes control-plane).
# Pod anti-affinity spreads replicas across different workers.
#
# Ports:
#   - 5300/UDP + 5300/TCP: DNS (LoadBalancer Service maps 53→5300)
#   - 8081/TCP: HTTP API (ClusterIP — read-only debugging only)
#
# Config:
#   - pdns.conf from ConfigMap (non-sensitive settings)
#   - bind.conf from ConfigMap (zone list)
#   - zone files from ConfigMap (one per domain)
#   - TSIG key from Secret (mounted via --include-dir for RFC2136)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: powerdns
  namespace: external-dns
  labels:
    app: powerdns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: powerdns
  template:
    metadata:
      labels:
        app: powerdns
      annotations:
        # Force restart on TSIG key changes (secrets are mounted but don't trigger rollout)
        reloader.stakater.com/reload: "pdns-tsig-key"
    spec:
      # Worker nodes only — keep DNS off control planes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: powerdns
                topologyKey: kubernetes.io/hostname
      containers:
        - name: powerdns
          image: docker.io/powerdns/pdns-auth-52:latest
          args:
            - --api-key=$(PDNS_API_KEY)
            - --include-dir=/etc/powerdns/tsig
          ports:
            - name: dns-udp
              containerPort: 5300
              protocol: UDP
            - name: dns-tcp
              containerPort: 5300
              protocol: TCP
            - name: api
              containerPort: 8081
              protocol: TCP
          env:
            - name: PDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pdns-api-key
                  key: api-key
          volumeMounts:
            - name: pdns-config
              mountPath: /etc/powerdns/pdns.conf
              subPath: pdns.conf
              readOnly: true
            - name: pdns-bind-conf
              mountPath: /etc/powerdns/bind
              readOnly: true
            - name: pdns-zones
              mountPath: /etc/powerdns/zones
              readOnly: true
            - name: pdns-tsig
              mountPath: /etc/powerdns/tsig
              readOnly: true
            # Journal for RFC2136 dynamic updates (ephemeral, auto-recovered)
            - name: pdns-journal
              mountPath: /var/lib/powerdns
          readinessProbe:
            tcpSocket:
              port: 5300
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5300
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: pdns-config
          configMap:
            name: pdns-config
        - name: pdns-bind-conf
          configMap:
            name: pdns-bind-conf
        - name: pdns-zones
          configMap:
            name: pdns-zone-saikat-dev
        - name: pdns-tsig
          secret:
            secretName: pdns-tsig-key
        - name: pdns-journal
          emptyDir: {}