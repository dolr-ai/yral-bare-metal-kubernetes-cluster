#
# Ansible managed
#
# saikat.dev zone file — generated by ansible/roles/pdns-zone from hosts.yml.
#
# Standard BIND zone file format. Contains:
#   - SOA record (start of authority)
#   - NS records (all custom nameservers)
#   - A records for ns1–ns13 (matching glue records at Namecheap + externalIPs in pdns-service-dns.yaml)
#
# ExternalDNS and cert-manager add dynamic records (A records for services,
# _acme-challenge TXT records for DNS-01) via RFC2136 updates to a journal
# file (ephemeral emptyDir). These dynamic records do not appear in this file —
# they live in the PowerDNS journal. On pod restart, ExternalDNS re-creates
# service records and cert-manager re-creates challenge records as needed.
#
# To regenerate after worker changes:
#   ansible-playbook ansible/playbooks/operations/update-pdns-zones.yml -e pdns_zone_name=saikat.dev
apiVersion: v1
kind: ConfigMap
metadata:
  name: pdns-zone-saikat-dev
  namespace: external-dns
data:
  saikat.dev.zone: |
    $ORIGIN saikat.dev.
    $TTL 300

    @   IN SOA ns1.saikat.dev. hostmaster.saikat.dev. (
            1784869005 ; serial (regenerated on each run)
            10800      ; refresh (3 hours)
            3600       ; retry (1 hour)
            604800     ; expire (1 week)
            300        ; minimum (5 minutes)
        )

    ; NS records — all custom nameservers (matching Namecheap glue records)
    @   IN NS  ns1.saikat.dev.
    @   IN NS  ns2.saikat.dev.
    @   IN NS  ns3.saikat.dev.
    @   IN NS  ns4.saikat.dev.
    @   IN NS  ns5.saikat.dev.
    @   IN NS  ns6.saikat.dev.
    @   IN NS  ns7.saikat.dev.
    @   IN NS  ns8.saikat.dev.
    @   IN NS  ns9.saikat.dev.
    @   IN NS  ns10.saikat.dev.
    @   IN NS  ns11.saikat.dev.

    ; Glue records — nameserver IPs (must match Namecheap glue records + pdns-service-dns externalIPs)
    ns1    IN A  138.201.85.40
    ns2    IN A  88.99.213.237
    ns3    IN A  94.130.128.105
    ns4    IN A  88.99.148.85
    ns5    IN A  138.201.199.41
    ns6    IN A  138.201.125.248
    ns7    IN A  168.119.139.49
    ns8    IN A  138.201.251.32
    ns9    IN A  88.99.147.157
    ns10   IN A  95.217.57.130
    ns11   IN A  136.243.145.173
