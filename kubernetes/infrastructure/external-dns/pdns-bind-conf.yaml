# PowerDNS bind backend configuration.
#
# Lists zones served by PowerDNS. Each zone file is a separate ConfigMap
# containing a standard BIND zone file. The bind.conf is mounted at
# /etc/powerdns/bind/bind.conf inside the PowerDNS pod.
#
# New zones: add a zone ConfigMap + a `zone` entry here + add to kustomization.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pdns-bind-conf
  namespace: external-dns
data:
  bind.conf: |
    # saikat.dev (Phase 1 validation domain)
    zone "saikat.dev" {
      type primary;
      file "/etc/powerdns/zones/saikat.dev.zone";
    };