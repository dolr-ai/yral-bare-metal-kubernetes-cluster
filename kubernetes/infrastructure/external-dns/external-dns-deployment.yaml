# ExternalDNS — syncs DNSEndpoint CRDs to PowerDNS records.
#
# Uses --source=crd only (DNSEndpoint CRDs in kubernetes/infrastructure/external-dns/).
# Service annotations are NOT used — all DNS records are declarative DNSEndpoint CRDs.
# This avoids the EndpointSlice listing timeout on large clusters.
#
# Creates/updates records in PowerDNS via RFC2136 dynamic updates (TSIG-signed).
# Uses TXT registry for ownership tracking (--txt-owner-id=yral-k8s).
#
# Sources:
#   - service: creates records from Service annotations + LoadBalancer/ClusterIP
#   - crd: DNSEndpoint CRD for records without a Service (Phase 2 team delegation)
#
# Provider: rfc2136 (PowerDNS)
#   - --rfc2136-host: PowerDNS DNS Service (ClusterIP or LoadBalancer, port 53)
#   - --rfc2136-tsig-key-name: TSIG key name (must match PowerDNS config)
#   - --rfc2136-tsig-secret: from Secret (must match cert-manager's TSIG key)
#
# Domain filter: saikat.dev (Phase 1). Phase 2: add yral.com.
#
# Policy: sync (create + delete records to match desired state).
# ExternalDNS does NOT support leader election — single replica only.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.22.0
          args:
            - --source=crd
            - --provider=rfc2136
            - --rfc2136-host=powerdns-dns.external-dns.svc.cluster.local
            - --rfc2136-port=53
            - --rfc2136-zone=saikat.dev
            - --rfc2136-tsig-keyname=saikat-dev-key
            - --rfc2136-tsig-secret-alg=hmac-sha512
            - --rfc2136-tsig-secret=$(TSIG_KEY)
            - --domain-filter=saikat.dev
            - --registry=txt
            - --txt-owner-id=yral-k8s
            - --policy=sync
            - --managed-record-types=A
            - --managed-record-types=AAAA
            - --managed-record-types=CNAME
            - --managed-record-types=NS
            - --log-level=info
            - --kube-api-qps=20
            - --kube-api-burst=40
          env:
            - name: TSIG_KEY
              valueFrom:
                secretKeyRef:
                  name: pdns-tsig-key
                  key: tsig-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi