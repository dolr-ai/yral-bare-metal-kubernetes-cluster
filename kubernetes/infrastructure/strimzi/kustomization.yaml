apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  # Strimzi Helm creates RoleBindings in watched namespaces during install,
  # so kafka and kafka-connect namespaces must exist before the HelmRelease runs.
  - ../kafka/namespace.yaml
  - ../kafka-connect/namespace.yaml
