# Strimzi Kafka Operator
#
# Installs the Strimzi operator that manages Kafka, KafkaNodePool, KafkaTopic,
# KafkaUser, KafkaConnect, and KafkaConnector CRDs.
#
# Operator is deployed in the strimzi namespace and watches kafka and
# kafka-connect namespaces only.
#
# Version: check latest at https://github.com/strimzi/strimzi-kafka-operator/releases
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi-kafka-operator
  namespace: strimzi
spec:
  interval: 1h
  chart:
    spec:
      chart: strimzi-kafka-operator
      version: "0.50.1"
      sourceRef:
        kind: HelmRepository
        name: strimzi
        namespace: strimzi
  timeout: 10m
  upgrade:
    remediation:
      retries: 3
  values:
    watchNamespaces:
      - kafka
      - kafka-connect
    # Do not generate a clusterrole for watching all namespaces;
    # operator is scoped to the two namespaces above.
    generateNetworkPolicy: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 512Mi
