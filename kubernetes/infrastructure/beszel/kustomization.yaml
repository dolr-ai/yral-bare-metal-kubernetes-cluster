apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
# ReferenceGrant not needed — traffic goes through oauth2-proxy-beszel in the
# oauth2-proxy namespace, which already has its own ReferenceGrant for kube-system
# HTTPRoutes. The beszel Service is only accessed cluster-internally by
# oauth2-proxy (not by the Gateway HTTPRoute directly).