apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Longhorn backup configuration — depends on infrastructure-longhorn for CRDs.
# Contains S3 backup target credentials, BackupTarget CR, and RecurringJobs
# (daily snapshot + weekly S3 backup).
resources:
  - s3-credentials.sops.yaml
  - backuptarget.yaml
  - recurringjobs.yaml