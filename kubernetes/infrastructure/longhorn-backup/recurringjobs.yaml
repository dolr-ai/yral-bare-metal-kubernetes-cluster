---
# Daily local snapshot — fast point-in-time restore without S3 round-trip.
# Kept for 7 days; runs at 01:00 UTC every day.
# groups: [default] applies to every volume that has no explicit recurring job
# selector set (i.e. all current volumes).
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot
  namespace: longhorn-system
spec:
  cron: "0 1 * * *"
  task: snapshot
  groups:
    - default
  retain: 7
  concurrency: 2
  labels: {}

---
# Weekly S3 backup — full incremental backup to Hetzner Object Storage.
# Kept for 8 weeks (2 months); runs at 02:00 UTC every Sunday.
# groups: [default] applies to every volume that has no explicit recurring job
# selector set (i.e. all current volumes).
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-backup
  namespace: longhorn-system
spec:
  cron: "0 2 * * 0"
  task: backup
  groups:
    - default
  retain: 8
  concurrency: 2
  labels: {}