apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Installs cert-manager CRDs and controllers.
#
# ClusterIssuers live in kubernetes/infrastructure/cert-manager-issuers/ and are
# applied by a separate Flux Kustomization that dependsOn this one, ensuring
# CRDs exist before ClusterIssuer objects are created.
#
# Manual apply (before Flux is bootstrapped):
#   kubectl apply -k kubernetes/infrastructure/cert-manager
#   kubectl wait --for=condition=available -n cert-manager deployment/cert-manager --timeout=120s
#   kubectl wait --for=condition=available -n cert-manager deployment/cert-manager-webhook --timeout=120s
#   kubectl apply -k kubernetes/infrastructure/cert-manager-issuers
resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.19.4/cert-manager.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cert-manager
        namespace: cert-manager
      spec:
        template:
          spec:
            containers:
              - name: cert-manager-controller
                args:
                  - --v=2
                  - --cluster-resource-namespace=$(POD_NAMESPACE)
                  - --leader-election-namespace=kube-system
                  - --acme-http01-solver-image=quay.io/jetstack/cert-manager-acmesolver:v1.19.4
                  - --enable-gateway-api
