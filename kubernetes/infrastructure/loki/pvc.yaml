apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-loki-0
  namespace: loki
spec:
  accessModes:
    - ReadWriteOnce
  # 2 replicas: Loki runs as a single binary with no in-cluster redundancy (RF=1).
  # Switch to the default `longhorn` StorageClass (1 replica) once Loki is migrated
  # to distributed mode with its own write/read HA.
  storageClassName: longhorn
  resources:
    requests:
      storage: 600Gi
