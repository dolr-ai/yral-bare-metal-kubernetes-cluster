# HTTPRoute — Flux webhook receiver
#
# Exposes the webhook-receiver endpoint at:
#   https://flux-webhook.yral.com/hook/<sha256-of-token>
#
# Routes to the dedicated webhook-receiver Service (port 80 → pod port 9292),
# not notification-controller (port 80 → 9090, the notification API).
#
# TLS: covered by existing wildcard *.yral.com cert (cert-manager, letsencrypt-prod).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook-redirect
  namespace: flux-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: http
  hostnames:
    - flux-webhook.yral.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  parentRefs:
    - name: web-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - flux-webhook.yral.com
  rules:
    - backendRefs:
        - name: webhook-receiver
          port: 80
