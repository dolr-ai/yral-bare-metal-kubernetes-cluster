# Flux GitHub Receiver
#
# Exposes a webhook endpoint that GitHub calls on every push to trigger
# immediate GitRepository reconciliation, eliminating poll interval lag.
#
# Webhook URL (generated by notification-controller, revealed after apply):
#   https://flux-webhook.yral.com/hook/<sha256-of-token>
#
# GitHub webhook setup (one-time, after Flux applies this file):
#   1. Get the path:  kubectl get receiver -n flux-system github-receiver -o jsonpath='{.status.webhookPath}'
#   2. Prepend host:  https://flux-webhook.yral.com<path>
#   3. Add webhook in GitHub repo → Settings → Webhooks → Add webhook
#      Content-Type: application/json, Secret: same token value as in secret.sops.yaml
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: github-receiver
  namespace: flux-system
spec:
  type: github
  events:
    - "ping"
    - "push"
  secretRef:
    name: webhook-token
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: flux-system
      namespace: flux-system
