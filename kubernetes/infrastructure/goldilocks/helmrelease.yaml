# Goldilocks — VPA recommendation dashboard
#
# Goldilocks reads VPA .status.recommendation objects across all labelled namespaces
# and presents them as a per-container resize guide in its web UI.
#
# To enable recommendations for a namespace, add the label:
#   goldilocks.fairwinds.com/enabled: "true"
#
# The dashboard is exposed via oauth2-proxy at https://goldilocks.yral.com
# (Google Workspace SSO — same pattern as Grafana, Hubble UI, Longhorn UI).
#
# Requires VPA (infrastructure-vpa) to be installed first — Goldilocks creates
# VPA objects and reads their .status.recommendation fields.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: goldilocks
spec:
  interval: 1h
  chart:
    spec:
      chart: goldilocks
      version: "10.3.0"
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: goldilocks
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

    dashboard:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
