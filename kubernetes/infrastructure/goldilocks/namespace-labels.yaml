# Goldilocks labels for namespaces not owned by our kustomizations.
# Flux applies these with server-side apply — the label is merged into the
# existing namespace without conflicting with the owner (Helm chart / kubeadm).
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    goldilocks.fairwinds.com/enabled: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  labels:
    goldilocks.fairwinds.com/enabled: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  labels:
    goldilocks.fairwinds.com/enabled: "true"
