apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: cloudbeaver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
    spec:
      initContainers:
        - name: copy-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/cloudbeaver/workspace/.data
              mkdir -p /opt/cloudbeaver/workspace/.dbeaver
              cp /tmp/config/.cloudbeaver.runtime.conf /opt/cloudbeaver/workspace/.data/.cloudbeaver.runtime.conf
              cp /tmp/config/data-sources.json /opt/cloudbeaver/workspace/.dbeaver/data-sources.json
          volumeMounts:
            - name: workspace
              mountPath: /opt/cloudbeaver/workspace
            - name: cloudbeaver-config
              mountPath: /tmp/config
              readOnly: true
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:26.0.3
          ports:
            - containerPort: 8978
              name: http
          env:
            - name: BYTEBASE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudbeaver-db-passwords
                  key: BYTEBASE_POSTGRES_PASSWORD
            - name: RUST_COUNTER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudbeaver-db-passwords
                  key: RUST_COUNTER_POSTGRES_PASSWORD
          volumeMounts:
            - name: workspace
              mountPath: /opt/cloudbeaver/workspace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 8978
            initialDelaySeconds: 120
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8978
            initialDelaySeconds: 90
            periodSeconds: 15
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: cloudbeaver-workspace
        - name: cloudbeaver-config
          configMap:
            name: cloudbeaver-config
