apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: cloudbeaver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
    spec:
      initContainers:
        - name: copy-config
          image: busybox:1.36
          env:
            - name: BYTEBASE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudbeaver-db-passwords
                  key: BYTEBASE_POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/cloudbeaver/workspace/.data
              mkdir -p /opt/cloudbeaver/workspace/.dbeaver
              mkdir -p /opt/cloudbeaver/workspace/GlobalConfiguration/.dbeaver
              # Only copy runtime config if it doesn't exist (preserve setup state)
              if [ ! -f /opt/cloudbeaver/workspace/.data/.cloudbeaver.runtime.conf ]; then
                cp /tmp/config/.cloudbeaver.runtime.conf /opt/cloudbeaver/workspace/.data/.cloudbeaver.runtime.conf
              fi
              # Template data-sources.json with actual passwords from env vars
              sed -e "s|\${BYTEBASE_POSTGRES_PASSWORD}|${BYTEBASE_POSTGRES_PASSWORD}|g" \
                  /tmp/config/data-sources.json > /opt/cloudbeaver/workspace/.dbeaver/data-sources.json
              cp /opt/cloudbeaver/workspace/.dbeaver/data-sources.json /opt/cloudbeaver/workspace/GlobalConfiguration/.dbeaver/data-sources.json
          volumeMounts:
            - name: workspace
              mountPath: /opt/cloudbeaver/workspace
            - name: cloudbeaver-config
              mountPath: /tmp/config
              readOnly: true
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:26.1.3
          ports:
            - containerPort: 8978
              name: http
          env:
            - name: BYTEBASE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudbeaver-db-passwords
                  key: BYTEBASE_POSTGRES_PASSWORD
          volumeMounts:
            - name: workspace
              mountPath: /opt/cloudbeaver/workspace
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8978
            initialDelaySeconds: 120
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8978
            initialDelaySeconds: 90
            periodSeconds: 15
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: cloudbeaver-workspace
        - name: cloudbeaver-config
          configMap:
            name: cloudbeaver-config
