apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: cloudbeaver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
    spec:
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:26.0.3
          ports:
            - containerPort: 8978
              name: http
          env:
            - name: BYTEBASE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudbeaver-db-passwords
                  key: BYTEBASE_POSTGRES_PASSWORD
            - name: RUST_COUNTER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudbeaver-db-passwords
                  key: RUST_COUNTER_POSTGRES_PASSWORD
          volumeMounts:
            - name: workspace
              mountPath: /opt/cloudbeaver/workspace
            - name: cloudbeaver-config
              mountPath: /opt/cloudbeaver/workspace/.dbeaver/data-sources.json
              subPath: data-sources.json
              readOnly: true
            - name: cloudbeaver-config
              mountPath: /opt/cloudbeaver/workspace/.data/.cloudbeaver.runtime.conf
              subPath: .cloudbeaver.runtime.conf
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /ping
              port: 8978
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ping
              port: 8978
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: cloudbeaver-workspace
        - name: cloudbeaver-config
          configMap:
            name: cloudbeaver-config
