apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
force: true
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: cloudbeaver-config
    namespace: cloudbeaver
    files:
      - .cloudbeaver.runtime.conf
      - data-sources.json
resources:
  - namespace.yaml
  - secret.sops.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
