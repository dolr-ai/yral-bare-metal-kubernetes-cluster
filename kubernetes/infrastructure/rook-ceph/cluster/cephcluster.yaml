# Rook/Ceph cluster — the cluster's primary storage layer.
#
# Versions: Rook v1.19.3 + Ceph v20.2.1 (Tentacle).
# Default StorageClass: ceph-block (2× replication, host failure domain, ~16.5 TB usable).
# Kafka is the explicit exception (ceph-block-1replica).
#
# Worker disk layout (managed by ansible/roles/storage-setup, always destructive):
#   50G btrfs OS | Ceph partition (GPT label "rook-osd" on nvme0n1p3) + whole-disk OSD on nvme1n1.
#   Never put "ceph" in PARTLABEL. Always run the dd wipe step for bluestore signatures.
#
# The cluster Kustomization uses wait: false — OSD updates are long-running and
# should not block dependent workloads.
#
# Monitoring: ceph status / ceph osd status / ceph df via the rook-ceph toolbox.
---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  # Ceph Tentacle v20.2.1.  Rook v1.19.x is compatible with Ceph v20.x.
  # When upgrading, update this image and follow Ceph's upgrade guide before
  # bumping the Rook chart version (one component at a time per AGENTS.md).
  cephVersion:
    image: quay.io/ceph/ceph:v20.2.1
    allowUnsupported: false

  # Rook stores its own metadata (keyring, config) under this host path.
  # Created by the storage-setup Ansible role before the node joins the cluster.
  dataDirHostPath: /var/lib/rook

  # Enforce pre-upgrade health checks.  Rook will not proceed with a Ceph image
  # upgrade if any PGs are degraded or any OSDs are out of service.
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  waitTimeoutForHealthyOSDInMinutes: 10
  upgradeOSDRequiresHealthyPGs: true

  # Three monitors for quorum.  With 35 worker nodes the risk of losing two
  # monitors simultaneously is very low.  allowMultiplePerNode: false ensures
  # a pod failure on one worker does not take down two mons.
  mon:
    count: 3
    allowMultiplePerNode: false

  # Two managers provide HA for the dashboard and pg_autoscaler module.
  mgr:
    count: 2
    allowMultiplePerNode: false
    modules:
      - name: pg_autoscaler
        enabled: true

  dashboard:
    enabled: true
    # SSL is terminated at the Cilium Gateway; disable TLS inside the pod so
    # the HTTPRoute can proxy plain HTTP to the dashboard Service.
    ssl: false

  # Arbitrary Ceph config key/value pairs applied via `ceph config set`.
  monitoring:
    enabled: true
    metricsDisabled: false

  network:
    # Cilium WireGuard already encrypts all pod-to-pod traffic cluster-wide.
    # Enabling a second layer of encryption inside Ceph would double the per-
    # packet overhead on the already-encrypted OSD replication path.
    connections:
      encryption:
        enabled: false
      compression:
        enabled: false

  crashCollector:
    disable: false

  logCollector:
    enabled: true
    periodicity: daily
    maxLogSize: 500M

  cleanupPolicy:
    # Intentionally left empty — prevents accidental cluster destruction.
    # To wipe the cluster for a clean re-deploy, set confirmation: "yes-really-destroy-data"
    # and run: kubectl delete cephcluster rook-ceph -n rook-ceph
    confirmation: ""
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
    allowUninstallWithVolumes: false

  # ---------------------------------------------------------------------------
  # Placement — all Ceph components run exclusively on worker nodes.
  # Workers are spread across both Helsinki (HEL1) and Falkenstein (FSN1);
  # exclusion is based on the Kubernetes node role label, not on region.
  # Control planes do not have dedicated Ceph OSD disks in their disk layout
  # (storage-setup gives them full-disk btrfs RAID0, not raw OSD partitions).
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                # Exclude nodes labelled as control-plane — they have no raw
                # OSD-ready disks regardless of which datacenter they are in.
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist

    # Spread monitors across different nodes so one node failure cannot take
    # out quorum.
    mon:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: rook-ceph-mon
            topologyKey: kubernetes.io/hostname

    # Prefer spreading managers across different nodes; soft constraint allows
    # both to schedule even if only one worker is available.
    mgr:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: rook-ceph-mgr
              topologyKey: kubernetes.io/hostname

    # Prefer spreading OSD pods across different nodes for better I/O
    # parallelism; soft constraint so all 70 OSDs can schedule freely.
    osd:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: rook-ceph-osd
              topologyKey: kubernetes.io/hostname

  # ---------------------------------------------------------------------------
  # Storage — auto-discover all available raw block devices on worker nodes.
  #
  # After reprovisioning, each NVMe worker exposes two raw block devices:
  #   nvme0n1p3:   ~450 GB GPT partition on the OS drive (created by storage-setup,
  #                labelled "rook-osd" — label must NOT contain "ceph" to avoid
  #                ceph-volume false-positive "Used by ceph-disk" rejection)
  #   nvme1n1:     ~477 GB raw second NVMe drive (wiped clean by storage-setup)
  #
  # Each worker contributes 2 OSDs (~927 GB).  35 workers = ~16.2 TB usable at
  # 2× replication.
  #
  # useAllDevices: true tells Rook to claim any device/partition that has no
  # existing filesystem or partition table.  Rook's availability check skips:
  #   - nvme0n1      (whole disk — has a GPT partition table → not claimable)
  #   - nvme0n1p1    (EFI partition — has vfat filesystem → skip)
  #   - nvme0n1p2    (OS root — has btrfs filesystem, mounted as / → skip)
  # and claims only nvme0n1p3 and nvme1n1.
  #
  # Workers are reprovisioned one at a time (remove-node.yml → add-worker.yml).
  # Rook auto-discovers each new OSD as workers rejoin.  The cluster becomes
  # functional once the first 3 OSD nodes are online and 3 mons achieve quorum.
  storage:
    useAllNodes: true
    useAllDevices: true
    config:
      osdsPerDevice: "1"
      # Encryption is intentionally disabled.
      # encryptedDevice: "true" restricts Rook to whole-disk OSDs only — partitions
      # are unconditionally rejected by ceph-volume when encrypted mode is on.
      # Each worker exposes one ~450 GB GPT partition (nvme0n1p3) and one ~477 GB
      # raw whole disk (nvme1n1); disabling encryption allows both to be used as
      # separate OSDs, doubling raw capacity per worker (~16.2 TB usable vs ~8.4 TB).
      # In-transit encryption is provided by Cilium WireGuard cluster-wide.

  # ---------------------------------------------------------------------------
  # Resource requests — sized for Hetzner AX102 / AX52-class nodes.
  # Adjust limits upward if OSD pods OOMKill under production write load.
  resources:
    mgr:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        memory: "2Gi"
    mon:
      requests:
        cpu: "100m"
        memory: "1Gi"
      limits:
        memory: "2Gi"
    osd:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        memory: "4Gi"
    prepareosd:
      requests:
        cpu: "500m"
        memory: "50Mi"
    mgr-sidecar:
      requests:
        cpu: "100m"
        memory: "40Mi"
      limits:
        memory: "100Mi"
    crashcollector:
      requests:
        cpu: "15m"
        memory: "60Mi"
      limits:
        memory: "60Mi"
    logcollector:
      requests:
        cpu: "100m"
        memory: "100Mi"
      limits:
        memory: "1Gi"
    cleanup:
      requests:
        cpu: "500m"
        memory: "100Mi"
      limits:
        memory: "1Gi"
    exporter:
      requests:
        cpu: "50m"
        memory: "50Mi"
      limits:
        memory: "128Mi"

  # Elevate mon and OSD scheduling priority so the Kubernetes scheduler does not
  # evict them before regular workload pods during node pressure events.
  priorityClassNames:
    mon: system-node-critical
    osd: system-node-critical
    mgr: system-cluster-critical
