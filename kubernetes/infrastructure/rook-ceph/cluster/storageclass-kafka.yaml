# 1-replica CephBlockPool and StorageClass for Kafka.
#
# Kafka uses this instead of the default ceph-block (2-replica) StorageClass
# because Kafka implements its own replication at the application layer:
# 3 brokers, replication.factor=3, min.insync.replicas=2.  Kafka can tolerate
# 2 of 3 node failures — Ceph 2-replica only tolerates 1.  Layering both gives
# 6× physical disk writes per produce request (3 brokers × 2 Ceph replicas)
# with no additional durability benefit.
#
# OSD failure domain is still "host" — each OSD copy lands on a different
# physical node.  requireSafeReplicaSize is set to false because size=1 means
# there is only one copy; requiring a "safe" minimum of 2 would be a
# contradiction and would block provisioning.
#
# WARNING: Do NOT use this StorageClass for any workload that does not
# implement its own replication.  Losing the single OSD that holds the data
# means permanent data loss.  See AGENTS.md "Longhorn replica count and
# StorageClass policy" (and the equivalent Ceph section) for guidance.
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: ceph-blockpool-1replica
  namespace: rook-ceph
spec:
  failureDomain: host
  replicated:
    size: 1
    requireSafeReplicaSize: false
  statusCheck:
    mirror:
      disabled: false
      interval: "60s"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-block-1replica
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: ceph-blockpool-1replica
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
