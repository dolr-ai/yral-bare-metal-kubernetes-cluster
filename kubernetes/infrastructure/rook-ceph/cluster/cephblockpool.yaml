apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: ceph-blockpool
  namespace: rook-ceph
spec:
  # Same-region replica placement: both replicas land in the same CRUSH
  # region (Helsinki or Falkenstein), on different hosts within that region.
  #
  # This replaces the previous `failureDomain: host` (with no sub-domain
  # constraint) which allowed replicas to span across regions (HEL ↔ FSN),
  # causing ~52% of PGs to replicate writes over the ~20ms cross-region link.
  # With same-region placement, write replication latency drops to <1ms
  # (intra-region RTT).
  #
  # Implementation: Rook's `replicasPerFailureDomain` field requires
  # size > replicasPerFailureDomain (designed for stretched clusters with
  # 4+ replicas).  For 2 replicas both in the same region, we use a custom
  # CRUSH rule created via the Ceph toolbox and assigned to the pool
  # imperatively.  The rule is:
  #   take default
  #   choose firstn 1 type region        # pick 1 region
  #   chooseleaf firstn 0 type host      # pick 2 hosts within that region
  #   emit
  #
  # The custom rule was created and assigned via:
  #   # Decompile CRUSH map, add rule, recompile, inject:
  #   ceph osd getcrushmap -o /tmp/crushmap.bin
  #   crushtool -d /tmp/crushmap.bin -o /tmp/crushmap.txt
  #   # (add the same-region rule to the text file)
  #   crushtool -c /tmp/crushmap.txt -o /tmp/crushmap-new.bin
  #   ceph osd setcrushmap -i /tmp/crushmap-new.bin
  #   ceph osd pool set ceph-blockpool crush_rule same-region
  #
  # NOTE: Rook's `failureDomain` is kept as `host` because Rook manages the
  # CRUSH rule based on this field.  The `same-region` rule overrides Rook's
  # default rule for this pool.  If Rook re-creates its rule (e.g., on pool
  # spec change), the pool must be re-assigned to `same-region` via the
  # toolbox.  The `enableCrushUpdates: false` below prevents Rook from
  # overwriting the custom rule.
  #
  # Tradeoff: if an entire region fails, both replicas are lost.  This is
  # acceptable because (a) Velero provides full-cluster DR, (b) etcd backups
  # go to object storage, and (c) the daily latency cost of cross-region
  # replication far outweighs the low probability of total region loss.
  # Region-level resilience is handled at the control-plane layer (etcd
  # members across HEL + FSN), not at the storage layer.
  failureDomain: host

  replicated:
    # 2 replicas matches the current Longhorn defaultReplicaCount of 2.
    # 2 replicas, on different hosts.  The actual same-region constraint
    # is enforced by the custom CRUSH rule assigned to the pool.
    # Tolerates 1-node failure with full data availability.
    # Raw capacity per TB of OSD pool: 2 TB raw → 1 TB usable.
    # With ~33 TB raw across 35 workers: ~16.5 TB usable.
    size: 2
    requireSafeReplicaSize: true

  # Prevent Rook from overwriting the custom same-region CRUSH rule.
  enableCrushUpdates: false

  # Enable the per-pool mirroring status metric for Prometheus.
  statusCheck:
    mirror:
      disabled: false
      interval: "60s"
