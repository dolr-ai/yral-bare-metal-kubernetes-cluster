# StorageClass for Ceph RBD block volumes (RWO).
#
# DEFAULT: ceph-block is the primary StorageClass for all new PVCs.
# All Longhorn PVCs have been migrated to ceph-block; Longhorn is no longer the default.
# (This SC is kept during the Ceph→Longhorn migration coexistence period.)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-block
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: ceph-blockpool

  # imageFormat and imageFeatures are intentionally omitted — Rook CSI defaults
  # are correct for modern Ceph and Ubuntu 24.04 kernels.  Only add these if a
  # specific feature is needed to solve a concrete problem.

  # CSI driver secret references.  These Secrets are created by the Rook operator
  # when the CephCluster is initialised.  Do not modify these names.
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph

allowVolumeExpansion: true
reclaimPolicy: Delete

# WaitForFirstConsumer defers PV provisioning until the pod is scheduled,
# ensuring the RBD image is created in the same topology zone as the pod.
volumeBindingMode: WaitForFirstConsumer
