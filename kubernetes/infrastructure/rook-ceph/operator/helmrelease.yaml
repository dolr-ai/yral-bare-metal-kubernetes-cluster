apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 1h
  chart:
    spec:
      chart: rook-ceph
      version: "v1.19.3"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: rook-ceph
  timeout: 15m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Enable Ceph-CSI RBD (block storage) and CephFS (filesystem) drivers.
    # RBD is required for RWO PVCs backed by CephBlockPool.
    # CephFS is enabled for future RWX support if needed.
    csi:
      enableRbdDriver: true
      enableCephfsDriver: true
      # Use the Ceph userspace RBD driver (krbd=false) for better snapshot
      # support and compatibility with the kubelet version on Ubuntu 24.04.
      rbdPluginUpdateStrategy: RollingUpdate
      cephFSPluginUpdateStrategy: RollingUpdate

    # Emit Prometheus metrics for the Rook operator; scraped by kube-prometheus-stack.
    monitoring:
      enabled: true

    # Log level for the Rook operator.  "INFO" is appropriate for steady-state.
    # Change to "DEBUG" temporarily when diagnosing OSD provisioning failures.
    logLevel: INFO

    # Resource requests for the Rook operator pod itself.
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        memory: "512Mi"
