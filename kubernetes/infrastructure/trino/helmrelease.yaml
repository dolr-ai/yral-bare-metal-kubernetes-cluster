# Trino — distributed SQL query engine for the Snowplow S3 data lake.
#
# Architecture:
#   Coordinator-only (server.workers: 0) — the coordinator executes queries
#   directly. Sufficient for ad-hoc analytics over the events lake. To scale
#   for concurrent queries, raise server.workers and change catalog-pvc.yaml
#   accessModes to ReadWriteMany.
#
# Hive catalog (connector = hive, metastore = file):
#   Table definitions are stored as JSON files in /catalog (catalog-pvc).
#   No Hive Metastore Service or HMS database required.
#   S3 credentials are injected from the trino-s3-credentials Secret.
#   The Trino config engine expands ${ENV:VAR} inside *.properties files.
#
# Querying the data lake after deploy — run once in the Trino UI or CLI:
#   CREATE SCHEMA snowplow.events WITH (location = 's3://yral-events-data-lake/');
#   CREATE TABLE snowplow.events.enriched (
#     app_id VARCHAR, platform VARCHAR, etl_tstamp VARCHAR,
#     collector_tstamp VARCHAR, dvce_created_tstamp VARCHAR,
#     event VARCHAR, event_id VARCHAR, txn_id VARCHAR,
#     name_tracker VARCHAR, v_tracker VARCHAR, v_collector VARCHAR,
#     v_etl VARCHAR, user_id VARCHAR, user_ipaddress VARCHAR,
#     user_fingerprint VARCHAR, domain_userid VARCHAR, domain_sessionidx INTEGER,
#     network_userid VARCHAR, geo_country VARCHAR, geo_region VARCHAR,
#     geo_city VARCHAR, geo_zipcode VARCHAR, geo_latitude DOUBLE,
#     geo_longitude DOUBLE, geo_region_name VARCHAR, ip_isp VARCHAR,
#     ip_organization VARCHAR, ip_domain VARCHAR, ip_netspeed VARCHAR,
#     page_url VARCHAR, page_title VARCHAR, page_referrer VARCHAR,
#     page_urlscheme VARCHAR, page_urlhost VARCHAR, page_urlport INTEGER,
#     page_urlpath VARCHAR, page_urlquery VARCHAR, page_urlfragment VARCHAR,
#     refr_urlscheme VARCHAR, refr_urlhost VARCHAR, refr_urlport INTEGER,
#     refr_urlpath VARCHAR, refr_urlquery VARCHAR, refr_urlfragment VARCHAR,
#     refr_medium VARCHAR, refr_source VARCHAR, refr_term VARCHAR,
#     mkt_medium VARCHAR, mkt_source VARCHAR, mkt_term VARCHAR,
#     mkt_content VARCHAR, mkt_campaign VARCHAR, contexts VARCHAR,
#     se_category VARCHAR, se_action VARCHAR, se_label VARCHAR,
#     se_property VARCHAR, se_value DOUBLE, unstruct_event VARCHAR,
#     tr_orderid VARCHAR, tr_affiliation VARCHAR, tr_total DOUBLE,
#     tr_tax DOUBLE, tr_shipping DOUBLE, tr_city VARCHAR, tr_state VARCHAR,
#     tr_country VARCHAR, ti_orderid VARCHAR, ti_sku VARCHAR, ti_name VARCHAR,
#     ti_category VARCHAR, ti_price DOUBLE, ti_quantity INTEGER,
#     pp_xoffset_min INTEGER, pp_xoffset_max INTEGER, pp_yoffset_min INTEGER,
#     pp_yoffset_max INTEGER, useragent VARCHAR, br_name VARCHAR,
#     br_family VARCHAR, br_version VARCHAR, br_type VARCHAR, br_renderengine VARCHAR,
#     br_lang VARCHAR, br_features_pdf BOOLEAN, br_features_flash BOOLEAN,
#     br_features_java BOOLEAN, br_features_director BOOLEAN,
#     br_features_quicktime BOOLEAN, br_features_realplayer BOOLEAN,
#     br_features_windowsmedia BOOLEAN, br_features_gears BOOLEAN,
#     br_features_silverlight BOOLEAN, br_cookies BOOLEAN,
#     br_colordepth VARCHAR, br_viewwidth INTEGER, br_viewheight INTEGER,
#     os_name VARCHAR, os_family VARCHAR, os_manufacturer VARCHAR,
#     os_timezone VARCHAR, dvce_type VARCHAR, dvce_ismobile BOOLEAN,
#     dvce_screenwidth INTEGER, dvce_screenheight INTEGER, doc_charset VARCHAR,
#     doc_width INTEGER, doc_height INTEGER, tr_currency VARCHAR,
#     tr_total_base DOUBLE, tr_tax_base DOUBLE, tr_shipping_base DOUBLE,
#     ti_currency VARCHAR, ti_price_base DOUBLE, base_currency VARCHAR,
#     geo_timezone VARCHAR, mkt_clickid VARCHAR, mkt_network VARCHAR,
#     etl_tags VARCHAR, dvce_sent_tstamp VARCHAR, refr_domain_userid VARCHAR,
#     refr_dvce_tstamp VARCHAR, derived_contexts VARCHAR,
#     domain_sessionid VARCHAR, derived_tstamp VARCHAR, event_vendor VARCHAR,
#     event_name VARCHAR, event_format VARCHAR, event_version VARCHAR,
#     event_fingerprint VARCHAR, true_tstamp VARCHAR,
#     year VARCHAR, month VARCHAR, day VARCHAR, hour VARCHAR
#   )
#   WITH (
#     external_location = 's3://yral-events-data-lake/events/enriched',
#     format = 'TEXTFILE',
#     textfile_field_separator = U&'\0009',  -- tab character
#     partitioned_by = ARRAY['year', 'month', 'day', 'hour']
#   );
#
# Connect Metabase:
#   Type: Trino, Host: trino.trino.svc.cluster.local, Port: 8080
#   Catalog: snowplow, Schema: events (no auth configured)
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trino
  namespace: trino
spec:
  interval: 1h
  chart:
    spec:
      chart: trino
      version: "1.42.1"
      sourceRef:
        kind: HelmRepository
        name: trino
        namespace: trino
  timeout: 10m
  upgrade:
    remediation:
      retries: 3
  values:
    server:
      # Coordinator-only mode — no separate worker pods.
      # Raises to e.g. 2 when concurrent query load requires horizontal scaling.
      # Also change catalog-pvc.yaml accessModes to ReadWriteMany when adding workers.
      workers: 0

      config:
        memory:
          heapHeadroomPerNode: "1GB"
        query:
          maxMemory: "4GB"
          maxTotalMemory: "6GB"

    coordinator:
      jvm:
        maxHeapSize: "4G"

      # S3 credentials injected as env vars so catalog properties can reference
      # them as ${ENV:AWS_ACCESS_KEY_ID} and ${ENV:AWS_SECRET_ACCESS_KEY}.
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: trino-s3-credentials
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: trino-s3-credentials
              key: aws-secret-access-key

      # Shared catalog PVC — stores file metastore table definitions as JSON.
      additionalVolumes:
        - name: catalog-storage
          persistentVolumeClaim:
            claimName: trino-catalog-storage
      additionalVolumeMounts:
        - name: catalog-storage
          mountPath: /catalog

      # Pinned to falkenstein nodes — same region as the FSN1 S3 bucket.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - falkenstein

      resources:
        requests:
          cpu: 500m
          memory: 5Gi
        limits:
          cpu: 4000m
          memory: 6Gi

    # Snowplow event lake catalog.
    # Uses Hive connector with file-based metastore (no HMS service required).
    # S3 credentials expanded from env vars at startup.
    catalogs:
      snowplow: |
        connector.name=hive
        hive.metastore=file
        hive.metastore.catalog.dir=file:///catalog
        hive.s3.endpoint=https://fsn1.your-objectstorage.com
        hive.s3.path-style-access=true
        hive.s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
        hive.s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
        hive.s3.ssl.enabled=true
        # Read-only — events are written by Kafka Connect, not Trino
        hive.non-managed-table-writes-enabled=false
        hive.allow-drop-table=false
