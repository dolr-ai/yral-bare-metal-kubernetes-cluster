# Snowplow Scala Stream Collector configuration (HOCON format)
# Mounted at /snowplow/config/application.conf inside the collector container.
#
# SASL credentials are NOT embedded here — they are injected at runtime via the
# KAFKA_COLLECTOR_JAAS_CONFIG environment variable, which is referenced with
# ${?KAFKA_COLLECTOR_JAAS_CONFIG} (HOCON optional substitution — Kafka client
# picks it up from the system property + HOCON merge, or via producerConf below).
#
# The collector listens on :9090 (HTTP only — TLS is terminated at the Cilium
# Gateway; traffic between Gateway and collector is encrypted by WireGuard mesh).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: snowplow
data:
  application.conf: |
    collector {
      # License acceptance required in 3.x
      license {
        accept = true
      }

      interface = "0.0.0.0"
      port = 9090

      ssl {
        enable = false
        redirect = false
        port = 9091
      }

      paths {}

      p3p {
        policyRef = "/w3c/p3p.xml"
        CP = "NOI DSP COR NID PSA OUR IND COM NAV STA"
      }

      crossDomain {
        enabled = false
        domains = ["*"]
        secure = false
      }

      cookie {
        enabled = true
        expiration = "365 days"
        name = "sp"
        domains = []
        secure = false
        httpOnly = false
        sameSite = "None"
      }

      cookieBounce {
        enabled = false
      }

      redirectMacro {
        enabled = false
      }

      rootResponse {
        enabled = false
        statusCode = 200
      }

      cors {
        accessControlMaxAge = 60 minutes
      }

      # In 3.7.0, streams.good and streams.bad are objects containing name, brokers,
      # maxBytes, producerConf, and buffer directly (no separate sink/kafka blocks).
      streams {
        good {
          name    = "snowplow-raw"
          brokers = "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
          maxBytes = 1000000

          # sasl.jaas.config is injected from the KAFKA_COLLECTOR_JAAS_CONFIG env var
          # at pod startup — the full JAAS string is stored in the kafka-credentials Secret.
          producerConf {
            acks                  = all
            retries               = 10
            "security.protocol"   = SASL_PLAINTEXT
            "sasl.mechanism"      = SCRAM-SHA-512
            "sasl.jaas.config"    = ${KAFKA_COLLECTOR_JAAS_CONFIG}
          }

          buffer {
            byteLimit   = 3145728
            recordLimit = 500
            timeLimit   = 5000
          }
        }

        bad {
          name    = "snowplow-bad"
          brokers = "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
          maxBytes = 1000000

          producerConf {
            acks                  = all
            retries               = 10
            "security.protocol"   = SASL_PLAINTEXT
            "sasl.mechanism"      = SCRAM-SHA-512
            "sasl.jaas.config"    = ${KAFKA_COLLECTOR_JAAS_CONFIG}
          }

          buffer {
            byteLimit   = 3145728
            recordLimit = 500
            timeLimit   = 5000
          }
        }
      }
    }
