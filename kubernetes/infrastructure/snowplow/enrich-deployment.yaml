# Snowplow Enrich Kafka
#
# Image: snowplow/snowplow-enrich-kafka
# Check latest tags: https://hub.docker.com/r/snowplow/snowplow-enrich-kafka/tags
#
# 2 replicas — stateless consumer/producer. Preferred falkenstein placement
# to colocate with Kafka brokers and reduce cross-DC VXLAN hops.
#
# The enrich config is mounted from the enrich-config ConfigMap.
# SASL credentials are injected as a single env var containing the full JAAS string.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snowplow-enrich
  namespace: snowplow
  annotations:
    configmap.reloader.stakater.com/reload: "enrich-config,enrichments-config"
    secret.reloader.stakater.com/reload: "kafka-credentials,maxmind-credentials"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snowplow-enrich
  template:
    metadata:
      labels:
        app: snowplow-enrich
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - falkenstein
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: snowplow-enrich
                topologyKey: kubernetes.io/hostname
      containers:
        - name: enrich
          # Pin to a specific digest tag in production.
          # Check https://hub.docker.com/r/snowplow/snowplow-enrich-kafka/tags
          image: snowplow/snowplow-enrich-kafka:6.13.1
          args:
            - --config
            - /snowplow/config/application.conf
            - --iglu-config
            - /snowplow/iglu/resolver.json
            # --enrichments is required in 6.8.0; empty dir = no optional enrichments
            - --enrichments
            - /snowplow/enrichments
          env:
            - name: KAFKA_ENRICH_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: enrich-jaas-config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /snowplow/config
              readOnly: true
            - name: iglu
              mountPath: /snowplow/iglu
              readOnly: true
            - name: enrichments
              mountPath: /snowplow/enrichments
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: enrich-config
        - name: iglu
          configMap:
            name: iglu-resolver-config
        - name: enrichments
          configMap:
            name: enrichments-config
