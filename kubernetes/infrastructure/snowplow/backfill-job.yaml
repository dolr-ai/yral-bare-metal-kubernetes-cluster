# One-time Job: backfill geo + UA enrichment fields into snowplow.events_v2.
#
# Immutable data operations pattern:
#   - Copies events → events_v2, enriches events_v2, prints PASS/FAIL validation report
#   - The live events table is NEVER modified
#   - After PASS: follow the "Next steps" printed in job logs to swap the MV
#
# Remove this file and backfill-script-configmap.yaml from kustomization.yaml
# once the swap to events_v2 is complete.
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-enrichments
  namespace: snowplow
spec:
  ttlSecondsAfterFinished: 604800  # keep logs visible for 7 days
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-geoip
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              echo "Waiting for geoip-server..."
              until wget -q -O /dev/null http://geoip-server:8080/GeoLite2-City.mmdb; do
                echo "Not ready, retrying in 10s..."
                sleep 10
              done
              echo "geoip-server ready."
      containers:
        - name: backfill
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              pip install --quiet clickhouse-connect geoip2 ua-parser requests && \
              python /scripts/backfill.py
          env:
            - name: CLICKHOUSE_HOST
              value: chi-analytics-events.clickhouse.svc.cluster.local
            - name: GEOIP_URL
              value: http://geoip-server:8080/GeoLite2-City.mmdb
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: backfill-enrichments-script
