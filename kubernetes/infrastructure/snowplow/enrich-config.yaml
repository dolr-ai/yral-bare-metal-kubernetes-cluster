# Snowplow Enrich Kafka configuration (HOCON format) for 6.8.0
# Mounted at /snowplow/config/application.conf inside the enrich container.
#
# 6.8.0 uses JSON-style HOCON with quoted keys and colon separators.
# Key structural changes from 5.x:
#   - input.topicName (singular) replaces input.topics (array)
#   - output now has 3 streams: good, failed, bad
#   - license.accept = true is required
#   - telemetry.disable = true disables heartbeat events
#
# SASL credentials are injected at runtime via KAFKA_ENRICH_JAAS_CONFIG env var.
# Enrichments are loaded from the --enrichments directory (see enrichments-config.yaml).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: enrich-config
  namespace: snowplow
data:
  application.conf: |
    {
      "license": {
        "accept": true
      }

      "input": {
        "topicName": "snowplow-raw"
        "bootstrapServers": "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
        "consumerConf": {
          "group.id": "snowplow-enrich"
          "auto.offset.reset": "earliest"
          "enable.auto.commit": "false"
          "allow.auto.create.topics": "false"
          "security.protocol": "SASL_PLAINTEXT"
          "sasl.mechanism": "SCRAM-SHA-512"
          "sasl.jaas.config": ${KAFKA_ENRICH_JAAS_CONFIG}
        }
      }

      "output": {
        "good": {
          "topicName": "snowplow-enriched"
          "bootstrapServers": "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
          "producerConf": {
            "client.id": "snowplow-enrich"
            "acks": "all"
            "security.protocol": "SASL_PLAINTEXT"
            "sasl.mechanism": "SCRAM-SHA-512"
            "sasl.jaas.config": ${KAFKA_ENRICH_JAAS_CONFIG}
          }
        }

        # failed: events that could not be validated/enriched (TSV format)
        # Routed to snowplow-bad — we don't distinguish failed vs bad at this stage.
        "failed": {
          "topicName": "snowplow-bad"
          "bootstrapServers": "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
          "producerConf": {
            "client.id": "snowplow-enrich"
            "acks": "all"
            "security.protocol": "SASL_PLAINTEXT"
            "sasl.mechanism": "SCRAM-SHA-512"
            "sasl.jaas.config": ${KAFKA_ENRICH_JAAS_CONFIG}
          }
        }

        # bad: bad rows (JSON format — schema violations, etc.)
        "bad": {
          "topicName": "snowplow-bad"
          "bootstrapServers": "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
          "producerConf": {
            "client.id": "snowplow-enrich"
            "acks": "all"
            "security.protocol": "SASL_PLAINTEXT"
            "sasl.mechanism": "SCRAM-SHA-512"
            "sasl.jaas.config": ${KAFKA_ENRICH_JAAS_CONFIG}
          }
        }
      }

      "monitoring": {
        "metrics": {
          "statsd": {
            "hostname": "localhost"
            "port": 8125
            "period": "1 minute"
            "prefix": "snowplow.enrich"
            "enabled": false
          }
        }
      }

      "telemetry": {
        "disable": true
      }
    }
