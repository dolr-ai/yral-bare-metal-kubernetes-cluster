apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redpanda-console
  namespace: kafka-console
spec:
  interval: 1h
  chart:
    spec:
      chart: console
      version: "3.8.0"
      sourceRef:
        kind: HelmRepository
        name: redpanda
        namespace: kafka-console
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
  values:
    # Top-level config key (not console.config) per chart v3.x schema.
    # See https://docs.redpanda.com/docs/reference/console/config/
    config:
      kafka:
        brokers:
          - kafka-cluster-kafka-bootstrap.kafka.svc:9092
        sasl:
          enabled: true
          mechanism: SCRAM-SHA-512
          username: kafka-console
          # Password injected via KAFKA_SASL_PASSWORD env var from sasl-secret.sops.yaml

    # Kafka SASL password from SOPS-encrypted secret
    extraEnv:
      - name: KAFKA_SASL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kafka-console-sasl
            key: password

    # No ingress — exposed via oauth2-proxy + Cilium Gateway
    ingress:
      enabled: false

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
