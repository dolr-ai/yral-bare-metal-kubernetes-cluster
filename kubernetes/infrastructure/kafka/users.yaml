# Kafka users for the Snowplow event pipeline
#
# Passwords are provisioned from the `kafka-user-passwords` Secret (SOPS-encrypted).
# Strimzi UserOperator registers the SCRAM credentials with Kafka, so passwords are
# set at user creation time rather than generated randomly.
#
# ACL design:
#   snowplow-collector  — producer to snowplow-raw + snowplow-bad
#   snowplow-enrich     — consumer from snowplow-raw, producer to snowplow-enriched + snowplow-bad
#   kafka-connect       — consumer from snowplow-enriched, plus Kafka Connect internal topics
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: snowplow-collector
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: kafka-user-passwords
          key: snowplow-collector-password
  authorization:
    type: simple
    acls:
      # Produce to snowplow-raw
      - resource:
          type: topic
          name: snowplow-raw
          patternType: literal
        operations:
          - Write
          - Describe
      # Produce bad rows
      - resource:
          type: topic
          name: snowplow-bad
          patternType: literal
        operations:
          - Write
          - Describe
      # Required for producer idempotency
      - resource:
          type: transactionalId
          name: snowplow-collector
          patternType: literal
        operations:
          - Write
          - Describe
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: snowplow-enrich
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: kafka-user-passwords
          key: snowplow-enrich-password
  authorization:
    type: simple
    acls:
      # Consume from snowplow-raw
      - resource:
          type: topic
          name: snowplow-raw
          patternType: literal
        operations:
          - Read
          - Describe
      - resource:
          type: group
          name: snowplow-enrich
          patternType: prefix
        operations:
          - Read
      # Produce enriched events
      - resource:
          type: topic
          name: snowplow-enriched
          patternType: literal
        operations:
          - Write
          - Describe
      # Produce bad rows
      - resource:
          type: topic
          name: snowplow-bad
          patternType: literal
        operations:
          - Write
          - Describe
---
# clickhouse-snowplow: consumer user for ClickHouse Kafka engine (reads snowplow-enriched → snowplow.events)
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: clickhouse-snowplow
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: kafka-user-passwords
          key: clickhouse-snowplow-password
  authorization:
    type: simple
    acls:
      # Consume from snowplow-enriched
      - resource:
          type: topic
          name: snowplow-enriched
          patternType: literal
        operations:
          - Read
          - Describe
      - resource:
          type: group
          name: clickhouse-snowplow-consumer
          patternType: literal
        operations:
          - Read
---
# kafka-console: read-only admin user for Redpanda Console UI
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-console
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: kafka-user-passwords
          key: kafka-console-password
  authorization:
    type: simple
    acls:
      # Read + describe all topics (wildcard)
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - Read
          - Describe
          - DescribeConfigs
      # Read all consumer groups (for lag display)
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - Read
          - Describe
      # Describe cluster (broker metadata)
      - resource:
          type: cluster
          name: kafka-cluster
          patternType: literal
        operations:
          - Describe
          - DescribeConfigs
---
# ci-e2e-reader: minimal read-only user for CI E2E test assertions against snowplow-raw
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: ci-e2e-reader
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: kafka-user-passwords
          key: ci-e2e-reader-password
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: snowplow-raw
          patternType: literal
        operations:
          - Read
          - Describe
      - resource:
          type: group
          name: ci-e2e-assert-
          patternType: prefix
        operations:
          - Read
      - resource:
          type: cluster
          name: kafka-cluster
          patternType: literal
        operations:
          - Describe
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-connect
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: kafka-user-passwords
          key: kafka-connect-password
  authorization:
    type: simple
    acls:
      # Consume from snowplow-enriched (S3 Sink source)
      - resource:
          type: topic
          name: snowplow-enriched
          patternType: literal
        operations:
          - Read
          - Describe
      - resource:
          type: group
          name: connect-
          patternType: prefix
        operations:
          - Read
      # Kafka Connect internal topics (connect-offsets, connect-configs, connect-status)
      - resource:
          type: topic
          name: connect-
          patternType: prefix
        operations:
          - Read
          - Write
          - Create
          - Describe
          - DescribeConfigs
          - AlterConfigs
      # Allow Connect workers to describe cluster (needed for metadata fetches)
      - resource:
          type: cluster
          name: kafka-cluster
          patternType: literal
        operations:
          - Describe
          - DescribeConfigs
---
# kafka-bridge: read-only user for the Kafka Bridge HTTP REST API
# Used by the kafka-bridge Deployment to connect to Kafka internally.
# External clients authenticate via bearer token to the Bridge, not directly to Kafka.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-bridge
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: kafka-user-passwords
          key: kafka-bridge-password
  authorization:
    type: simple
    acls:
      # Read enriched events (Bridge exposes via HTTP REST API)
      - resource:
          type: topic
          name: snowplow-enriched
          patternType: literal
        operations:
          - Read
          - Describe
      # Consumer groups created by the Bridge use the "bridge-" prefix
      - resource:
          type: group
          name: bridge-
          patternType: prefix
        operations:
          - Read
      # Broker metadata fetches (required for consumer/producer initialization)
      - resource:
          type: cluster
          name: kafka-cluster
          patternType: literal
        operations:
          - Describe
