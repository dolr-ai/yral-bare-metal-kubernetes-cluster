# Kafka topics for the Snowplow event pipeline
#
# snowplow-raw:       raw collector payloads → Enrich input
#                     48-hour time retention (Enrich should process within hours)
# snowplow-enriched:  validated+enriched events → S3 Sink input
#                     Storage-based retention only: 200 GiB ÷ 12 partitions = ~16.6 GiB per partition
#                     18253611008 = 200 * 1024^3 / 12  (rounded down to nearest byte)
# snowplow-collector-bad:   collector bad rows (malformed HTTP, bot traffic)
#                     7-day time retention for investigation
# snowplow-enrich-bad:      enrichment bad rows (schema violations, field errors) — should be 0
#                     7-day time retention for investigation
# snowplow-enrich-failed:  events that failed enrichment validation — should be 0
#                     7-day time retention for investigation
#
# The old snowplow-bad topic is retired — collector and enrich bad rows are now
# separated so enrichment failures are measurable and alertable independently.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: snowplow-raw
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 12
  replicas: 3
  config:
    # 48-hour time-based retention — raw payloads are transient:
    # Enrich consumers must keep up; 48h is generous headroom for restarts.
    retention.ms: "172800000"
    # Override cluster default (-1) to enable time-based retention on this topic
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: snowplow-enriched
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 12
  replicas: 3
  config:
    # Storage-based retention: 20 GiB per partition × 12 partitions = 240 GiB total cap (~90% of 250 Gi disk).
    # 21474836480 = 20 × 1024^3
    retention.bytes: "21474836480"
    # Explicitly disable time-based retention on this topic (cluster default is already -1)
    retention.ms: "-1"
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: snowplow-collector-bad
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 6
  replicas: 3
  config:
    # 7-day retention for bad-row investigation
    retention.ms: "604800000"
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: snowplow-enrich-bad
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 6
  replicas: 3
  config:
    # 7-day retention for bad-row investigation
    retention.ms: "604800000"
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: snowplow-enrich-failed
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 6
  replicas: 3
  config:
    # 7-day retention for failed-event investigation
    retention.ms: "604800000"
    min.insync.replicas: "2"
