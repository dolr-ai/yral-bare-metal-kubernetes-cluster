apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Installs Gateway API CRDs (experimental channel — superset of standard).
# Experimental channel adds TLSRoute, TCPRoute, and UDPRoute needed for
# non-HTTP Gateway listeners (e.g. Kafka on port 9092 via TLSRoute passthrough).
#
# Version must match or precede the version supported by Cilium.
# Cilium 1.19+ supports Gateway API v1.4.x / v1.5.x.
#
# Manual apply (before Flux is bootstrapped, or to unblock reconciliation):
#   kubectl apply -k kubernetes/infrastructure/gateway-api-crds
resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/experimental-install.yaml
