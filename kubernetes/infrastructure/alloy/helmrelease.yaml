apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: alloy
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: "1.6.2"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: alloy
  timeout: 1h
  upgrade:
    remediation:
      retries: 3
  values:
    # Run as a DaemonSet so every node ships its pod logs to Loki
    controller:
      type: daemonset
      # Roll 4 nodes at a time — cluster has 40 nodes so default maxUnavailable=1 is too slow
      updateStrategy:
        rollingUpdate:
          maxUnavailable: 4
      # Allow scheduling on control-plane nodes to collect their pod logs
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    # Add pods/log to the default ClusterRole so loki.source.kubernetes can
    # call the Kubernetes API log endpoint for each pod
    rbac:
      extraRules:
        - apiGroups: [""]
          resources: ["pods/log"]
          verbs: ["get"]

    alloy:
      resources:
        requests:
          # VPA target: 143m CPU / 524Mi — raised from 50m/128Mi
          cpu: 150m
          memory: 512Mi
        limits:
          # VPA upper: 314m / 1.15Gi — previous 512Mi limit was below VPA target (524Mi)
          cpu: 400m
          memory: 1536Mi

      configMap:
        content: |
          // Discover all Kubernetes pods via the API server
          discovery.kubernetes "pods" {
            role = "pod"
          }

          // Relabel pod metadata into useful Loki stream labels
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            // Only collect logs from running or pending pods
            rule {
              source_labels = ["__meta_kubernetes_pod_phase"]
              regex         = "Pending|Running"
              action        = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            // Prefer app.kubernetes.io/name label for the "app" Loki label
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }

            // Fall back to the plain "app" pod label when app.kubernetes.io/name is
            // absent (e.g. Flux controllers and Velero use plain app=<name>).
            // Joins current "app" and "__meta_kubernetes_pod_label_app" with ";"; the
            // regex only matches when app is still empty (leading ";").
            rule {
              source_labels = ["app", "__meta_kubernetes_pod_label_app"]
              separator     = ";"
              regex         = "^;(.+)$"
              target_label  = "app"
              replacement   = "$1"
            }

            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
            }
          }

          // Use the Kubernetes API log endpoint — avoids filesystem glob issues
          // that occur when a DaemonSet pod tries to read log files for pods
          // running on other nodes via /var/log/pods/*.
          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.write.loki.receiver]
          }

          // Push logs to Loki (internal cluster DNS)
          loki.write "loki" {
            endpoint {
              url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
