apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: alloy
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: "1.6.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: alloy
  timeout: 10m
  upgrade:
    remediation:
      retries: 3
  values:
    # Run as a DaemonSet so every node ships its pod logs to Loki
    controller:
      type: daemonset
      # Allow scheduling on control-plane nodes to collect their pod logs
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    alloy:
      mounts:
        # Mount /var/log from the host to access /var/log/pods/<uid>/<container>/*.log
        varlog: true

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 512Mi

      configMap:
        content: |
          // Discover all Kubernetes pods via the API server
          discovery.kubernetes "pods" {
            role = "pod"
          }

          // Relabel pod metadata: build log file paths and extract useful Loki labels
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            // Only tail logs from running or pending pods
            rule {
              source_labels = ["__meta_kubernetes_pod_phase"]
              regex         = "Pending|Running"
              action        = "keep"
            }

            // /var/log/pods/<uid>/<container>/*.log
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/*.log"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            // Prefer app.kubernetes.io/name label for the "app" Loki label
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }

            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
            }
          }

          // Tail discovered log files and forward to the Loki write component
          loki.source.file "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.write.loki.receiver]
          }

          // Push logs to Loki (internal cluster DNS)
          loki.write "loki" {
            endpoint {
              url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
