# Dedicated Postgres for Bytebase via CloudNativePG.
# Single instance is intentional for current workload.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bytebase-postgres
  namespace: bytebase
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: ceph-block
  bootstrap:
    initdb:
      database: bytebase
      owner: bytebase
      secret:
        name: bytebase-postgres-app
