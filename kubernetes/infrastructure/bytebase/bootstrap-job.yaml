---
# One-shot Terraform job that provisions Bytebase environments, instances, and
# projects declaratively. Re-running is safe — Terraform is idempotent.
#
# To re-run manually (e.g. after adding a new instance to main.tf):
#   kubectl delete job bytebase-bootstrap -n bytebase
#   kubectl apply -f kubernetes/infrastructure/bytebase/bootstrap-job.yaml
#   (or just push a change — Flux will recreate it)
apiVersion: batch/v1
kind: Job
metadata:
  name: bytebase-bootstrap
  namespace: bytebase
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Wait until Bytebase is accepting requests before running Terraform.
        - name: wait-for-bytebase
          image: curlimages/curl:8.7.1
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Bytebase to be ready..."
              until curl -sf http://bytebase-entrypoint.bytebase.svc.cluster.local/healthz; do
                echo "Not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Bytebase is ready."
      containers:
        - name: terraform
          image: hashicorp/terraform:1.10
          workingDir: /workspace
          command:
            - /bin/sh
            - -c
            - |
              cp /terraform-config/main.tf /workspace/main.tf
              terraform init -input=false
              terraform apply -input=false -auto-approve \
                -var="service_account=${BYTEBASE_SERVICE_ACCOUNT}" \
                -var="service_key=${BYTEBASE_SERVICE_KEY}"
          env:
            - name: BYTEBASE_SERVICE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: bytebase-bootstrap-credentials
                  key: service-account-email
            - name: BYTEBASE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: bytebase-bootstrap-credentials
                  key: service-account-key
          volumeMounts:
            - name: terraform-config
              mountPath: /terraform-config
              readOnly: true
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: terraform-config
          configMap:
            name: bytebase-terraform
        - name: workspace
          emptyDir: {}
