# Bytebase — Database schema change management and GitOps for ClickHouse (and others).
#
# Exposed at https://bytebase.yral.com via oauth2-proxy (Google Workspace SSO).
# Bytebase has its own user accounts — users authenticate with Google first (oauth2-proxy),
# then log in to Bytebase separately on first visit.
#
# Postgres: bytebase-postgres-rw.bytebase.svc.cluster.local:5432 (CloudNativePG)
#
# Initial setup:
#   1. Visit https://bytebase.yral.com — Bytebase shows its setup wizard.
#   2. Create an admin account.
#   3. Add ClickHouse instance:
#        Environment: Prod
#        Engine: ClickHouse
#        Host: clickhouse-analytics.clickhouse.svc.cluster.local
#        Port: 9000
#        Username: default
#        Password: (leave empty)
#
# Chart: https://bytebase.github.io/bytebase
# Releases: https://github.com/bytebase/bytebase/releases
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bytebase
  namespace: bytebase
spec:
  interval: 1h
  valuesFrom:
    - kind: Secret
      name: bytebase-postgres-app
      valuesKey: password
      targetPath: bytebase.option.externalPg.pgPassword
  chart:
    spec:
      chart: bytebase
      version: "1.1.5"
      sourceRef:
        kind: HelmRepository
        name: bytebase
        namespace: bytebase
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
  values:
    bytebase:
      option:
        port: 8080
        external-url: "https://bytebase.yral.com"
        externalPg:
          pgHost: "bytebase-postgres-rw.bytebase.svc.cluster.local"
          pgPort: "5432"
          pgUsername: "bytebase"
          pgDatabase: "bytebase"
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      # Co-locate Bytebase with its Postgres in the same region.
      # requiredDuringScheduling ensures they never split across helsinki/falkenstein.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  cnpg.io/cluster: bytebase-postgres
              topologyKey: topology.kubernetes.io/region
