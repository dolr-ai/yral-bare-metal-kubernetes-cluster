---
# Terraform configuration for bootstrapping Bytebase with:
#   - Prod environment
#   - ClickHouse instance pointing at the cluster-internal CHI service
#   - A project wiring the instance as a database
#
# Run by the bytebase-bootstrap Job after Bytebase is healthy.
# Idempotent: safe to re-run (Terraform state is stored in the Job's ephemeral
# volume; re-running the Job re-applies from scratch which is fine since all
# resources use resource_id as a stable identifier and Bytebase ignores no-ops).
apiVersion: v1
kind: ConfigMap
metadata:
  name: bytebase-terraform
  namespace: bytebase
data:
  main.tf: |
    terraform {
      required_providers {
        bytebase = {
          source  = "bytebase/bytebase"
          version = "3.16.3"
        }
      }
    }

    provider "bytebase" {
      service_account = var.service_account
      service_key     = var.service_key
      url             = "http://bytebase-entrypoint.bytebase.svc.cluster.local"
    }

    variable "service_account" {}
    variable "service_key" {}

    resource "bytebase_environment" "prod" {
      resource_id = "prod"
      title       = "Prod"
      order       = 1
    }

    resource "bytebase_instance" "clickhouse" {
      resource_id = "clickhouse-prod"
      title       = "ClickHouse Prod"
      engine      = "CLICKHOUSE"
      environment = "environments/${bytebase_environment.prod.resource_id}"

      data_sources {
        id       = "admin"
        type     = "ADMIN"
        host     = "chi-analytics-events-0-0.clickhouse.svc.cluster.local"
        port     = "9000"
        username = "default"
      }
    }

    resource "bytebase_project" "snowplow" {
      resource_id = "snowplow"
      title       = "Snowplow"
    }
