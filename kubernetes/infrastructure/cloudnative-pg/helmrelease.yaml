# CloudNativePG operator — CRD-native Postgres operator (per-service model).
#
# One postgresql.cnpg.io/v1 Cluster per microservice in its own namespace.
# No shared cluster-wide Postgres. App credentials as *.sops.yaml.
# Use the -rw endpoint. Same-region podAffinity for latency-sensitive app+DB
# pairs (requiredDuringSchedulingIgnoredDuringExecution on cnpg.io/cluster label
# + topology.kubernetes.io/region).
#
# Chart: cloudnative-pg/cloudnative-pg
# Releases: https://github.com/cloudnative-pg/cloudnative-pg/releases
#
# User-selected operator version: v1.29.0 (chart 0.28.0)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: cnpg-system
  timeout: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
