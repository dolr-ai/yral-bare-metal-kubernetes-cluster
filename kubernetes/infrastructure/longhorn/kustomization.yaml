apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Phase 1: Longhorn operator only. SCs and crypto secret are in a separate
# kustomization (storageclasses/) that will be enabled when worker nodes are
# reprovisioned with Longhorn disk layout and workloads begin migrating.
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - secret.sops.yaml
  - backuptarget.yaml
  - recurringjobs.yaml