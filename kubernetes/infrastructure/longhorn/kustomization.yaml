apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Phase 1: Longhorn operator only. SCs, crypto secret, backup target, and
# recurring jobs will be enabled in separate kustomizations after the operator
# is healthy and CRDs are available, and when worker nodes are reprovisioned
# with Longhorn disk layout for workload migration.
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
