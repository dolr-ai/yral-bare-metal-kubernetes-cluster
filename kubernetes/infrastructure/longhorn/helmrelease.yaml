apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: "1.11.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
  timeout: 10m
  upgrade:
    remediation:
      retries: 3
  values:
    defaultSettings:
      # 2 replicas across 35 worker nodes; data survives 1 simultaneous node failure.
      # With weekly S3 backups, S3 is the DR path for catastrophic (2+ node) failures.
      # Using 2 replicas saves ~33% Longhorn storage vs 3 replicas.
      defaultReplicaCount: 2

      # Reserve 5% of each disk for the OS, kubelet, and containerd image cache.
      # Kubelet's default imageGCHighThresholdPercent (85%) automatically evicts
      # unused images before the disk fills — 5% (~48 Gi on 954 Gi disks) is
      # sufficient headroom alongside automatic GC. Default was 30% (~286 Gi).
      storageReservedPercentageForDefaultDisk: 5

      # Prevent cross-zone replica spreading. The default (true) pushes replicas to
      # different topology zones — with HEL1+FSN1 workers that means one replica in
      # Helsinki and one in Falkenstein, requiring every write to cross WAN synchronously.
      # With csiAllowedTopologyKeys enforcing same-region placement and
      # dataLocality: best-effort pinning one replica to the pod's node, this setting
      # prevents secondary replicas from drifting to a different zone within the region.
      replicaZoneSoftAntiAffinity: false

      # Enable region-aware topology scheduling (requires v1.11.1+).
      # The CSI driver includes topology.kubernetes.io/region in the AccessibleTopology
      # of CreateVolumeResponse. With volumeBindingMode: WaitForFirstConsumer, the
      # scheduler pins PV provisioning to the pod's scheduled node's region — so all
      # replicas land in the same region as the pod (Helsinki or Falkenstein).
      # Combined with persistence.defaultDataLocality: best-effort, this gives:
      #   replica 1 → pod's node (local I/O, no network hop)
      #   replica 2 → another node in the same region (no cross-WAN writes)
      csiAllowedTopologyKeys: "topology.kubernetes.io/region"

      # Enable the revision counter globally. This controls the --disableRevCounter
      # flag on every engine process. With counter enabled (i.e. disableRevisionCounter
      # false), a rejoining replica only syncs the delta written while it was down —
      # not the full volume. The counter tracks which blocks changed; without it,
      # Longhorn forces a full rebuild of all data every time a replica's instance-
      # manager restarts (e.g. on every node reboot or upgrade), which on 250 Gi
      # volumes is a 250 Gi network transfer that accomplishes nothing.
      # NOTE: Must use the JSON per-engine-type format (Longhorn v1.11+). The string
      # "false" is a truthy non-empty value in Go templates → the chart would render
      # {"v1":"true"} (counter disabled). Only the explicit JSON form produces the
      # correct ConfigMap entry that the Longhorn Setting controller reads.
      # This is the defaultSettings key — it sets the global Setting CR
      # (disable-revision-counter) which controls engine process flags. The matching
      # persistence.disableRevisionCounter below sets the same value on the StorageClass
      # for new volume creation defaults.
      disableRevisionCounter: '{"v1":"false"}'

      # Allow Longhorn to rebalance replica placement over time. best-effort tries to
      # spread replicas evenly across nodes and zones, and evicts replicas from disks
      # under storage pressure. This is required for Longhorn to remove excess replicas
      # when spec.numberOfReplicas is reduced on an attached volume — without it,
      # cleanupAutoBalancedReplicas returns immediately and extra replicas are never
      # removed. With 35 workers, 13 zones, and replicaZoneSoftAntiAffinity: false,
      # best-effort is largely a no-op for healthy volumes: new replicas are already
      # spread by the scheduler; rebalancing only triggers when imbalance or disk
      # pressure is detected. This setting is also the prerequisite for the
      # replicaAutoBalance: best-effort pass planned during the 1.11.x upgrade.
      replicaAutoBalance: best-effort

      # S3 backup target on Hetzner Object Storage.
      # A /longhorn prefix separates these backups from Velero's in the same bucket.
      # Credential secret keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINTS,
      # VIRTUAL_HOSTED_STYLE (false = path-style addressing required by Hetzner).
      backupTarget: "s3://yral-bare-metal-kubernetes-cluster-control-plane-backup@hel1/longhorn"
      backupTargetCredentialSecret: "longhorn-s3-backup-credentials"

    persistence:
      # Must match defaultSettings.defaultReplicaCount — controls the numberOfReplicas
      # parameter on the default Longhorn StorageClass, which is what Kubernetes uses
      # when provisioning PVCs. If only defaultSettings is set, the StorageClass retains
      # the Helm chart default of 3.
      defaultClassReplicaCount: 2

      # One replica on the pod's node (local I/O, no network hop). The volume follows
      # the pod — Helsinki pods get Helsinki replicas, Falkenstein pods get Falkenstein.
      defaultDataLocality: best-effort

      # Defer PV binding and provisioning until the pod is scheduled. The CSI provisioner
      # then uses the pod's node topology (region, via csiAllowedTopologyKeys) to
      # constrain the PV nodeAffinity to the pod's region. Without WaitForFirstConsumer,
      # the PV is provisioned immediately with no node context, so csiAllowedTopologyKeys
      # has nothing to infer from and region constraint is not applied.
      volumeBindingMode: "WaitForFirstConsumer"

      # Enable the revision counter so Longhorn can determine which blocks changed
      # while a replica was offline (e.g. during a node reboot). With this enabled,
      # a rejoining replica only syncs the delta written while it was down — not the
      # full volume. With disableRevisionCounter: "true" (the Longhorn chart default),
      # Longhorn cannot distinguish dirty from clean blocks, so it forces a full
      # rebuild of the entire volume every time a replica's instance-manager restarts
      # (i.e. on every node reboot). On 250 Gi volumes that is a 250 Gi network
      # transfer that accomplishes nothing — the data was intact on disk.
      # The cost of enabling the counter is one extra fsync per write per replica for
      # the revision.counter file — negligible on NVMe.
      # NOTE: Must use the JSON per-engine-type format (Longhorn v1.11+). Using the
      # plain string "false" is a truthy non-empty string in Go templates → the chart
      # renders {"v1":"true"} instead. Only boolean false or the explicit JSON form
      # '{"v1":"false"}' produces the correct ConfigMap entry.
      disableRevisionCounter: '{"v1":"false"}'
