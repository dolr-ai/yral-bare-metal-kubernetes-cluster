# StorageClass for workloads with built-in app-level replication that makes
# Longhorn-level replication redundant (e.g. Kafka: 3 brokers, replication.factor=3).
# Using this avoids doubling write traffic for data that is already replicated by
# the application itself.
#
# Workloads using this class:
#   - Kafka (3 brokers × replication.factor=3 — app replication is the HA strategy)
#
# All other workloads should use the default `longhorn` StorageClass (2 replicas).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-1replica
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
# allowedTopologies is the second layer of same-region enforcement.
# csiAllowedTopologyKeys causes Longhorn CSI node plugins to *advertise*
# topology.kubernetes.io/region to the external-provisioner, but advertisement
# requires the CSI pods to have restarted since the setting was applied. If a PVC
# is provisioned during that window, accessibilityRequirements ends up null and
# replicas are placed freely across regions.
# allowedTopologies is provisioner-side: it is always evaluated regardless of
# CSI pod registration state. The external-provisioner intersects this with the
# selected node's labels (WaitForFirstConsumer) to generate requisite topology
# constraints, guaranteeing accessibilityRequirements is populated for every PVC.
allowedTopologies:
  - matchLabelExpressions:
      - key: topology.kubernetes.io/region
        values:
          - falkenstein
          - helsinki
parameters:
  numberOfReplicas: "1"
  dataLocality: "best-effort"
  staleReplicaTimeout: "90"
  # Must use JSON format (Longhorn v1.11+). Plain string "false" is truthy in Go
  # templates and would render as {"v1":"true"} — causing salvage failures when
  # the engine (controlled by the global Setting) and replicas disagree.
  disableRevisionCounter: '{"v1":"false"}'
