# Kafka-specific StorageClass — 1 Longhorn replica.
#
# WHY KAFKA IS THE ONLY EXCEPTION TO THE 2-REPLICA DEFAULT:
#   Kafka implements its own replication at the application layer (3 brokers,
#   replication.factor=3). This is STRICTLY STRONGER than Longhorn 2-replica:
#     - Kafka tolerates 2/3 node failures; Longhorn 2-replica tolerates only 1/2.
#     - Layering Longhorn replication on top would produce 6× physical disk writes
#       per produce request (3 brokers × 2 Longhorn replicas) with zero additional
#       durability benefit — Kafka's replication IS the write path, not a redundancy
#       layer on top of it.
#
# THIS IS NOT A PATTERN TO COPY. The default for all other stateful workloads —
# including PostgreSQL, ClickHouse, Redis, and any future databases — is the
# `longhorn` StorageClass (2 replicas). Do NOT apply this StorageClass to anything
# other than Kafka without explicit confirmation that all three criteria below are met:
#   1. The application implements its own replication natively (not just backups)
#   2. App-level replication is strictly stronger than Longhorn 2-replica
#   3. The write amplification from layering both is measurable and unacceptable
#
# Workloads currently using this class:
#   - Kafka (the only one; this list should stay short)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-1replica
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "1"
  dataLocality: "best-effort"
  staleReplicaTimeout: "90"
  # Must use JSON format (Longhorn v1.11+). Plain string "false" is truthy in Go
  # templates and would render as {"v1":"true"} — causing salvage failures when
  # the engine (controlled by the global Setting) and replicas disagree.
  disableRevisionCounter: '{"v1":"false"}'
