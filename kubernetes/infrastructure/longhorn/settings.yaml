# Longhorn settings that cannot be set via HelmRelease values.
# These are applied as Setting CRs directly.
#
# replica-region-soft-anti-affinity: false
#   Hard-blocks cross-region replica placement. csiAllowedTopologyKeys alone is
#   insufficient — confirmed 2026-03-29 when geoip-db landed replicas in both
#   helsinki and falkenstein despite csiAllowedTopologyKeys being set to region.
#   "false" means the anti-affinity is HARD (not soft), i.e. Longhorn will refuse
#   to place a replica in a different region from the other replicas.
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: replica-region-soft-anti-affinity
  namespace: longhorn-system
value: "false"
