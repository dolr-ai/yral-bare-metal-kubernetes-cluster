# StorageClass for workloads with no built-in redundancy (Loki, Prometheus, ClickHouse, Metabase).
#
# These workloads run as single-replica pods, so a node failure without Longhorn replication
# means waiting for S3 backup restore. Until each app gains its own redundancy strategy,
# this StorageClass provides 2 Longhorn replicas to maintain automatic failover.
#
# Workloads using this class (pending their own HA strategy):
#   - Loki (single binary, RF=1)
#   - Prometheus (single pod)
#   - ClickHouse (single shard/replica)
#   - Metabase (single pod, embedded H2 DB)
#
# Once an app gains proper in-cluster redundancy, migrate its PVCs to the default
# `longhorn` StorageClass (1 replica) and remove it from this list.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-2replicas
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "2"
  # Match global Longhorn settings for consistency
  dataLocality: "best-effort"
  staleReplicaTimeout: "90"
  # Must use JSON format (Longhorn v1.11+). Plain string "false" is truthy in Go
  # templates and would render as {"v1":"true"} — causing salvage failures when
  # the engine (controlled by the global Setting) and replicas disagree.
  disableRevisionCounter: '{"v1":"false"}'
