# Single source of truth for Python dependencies across the whole repo — the
# Python equivalent of the root Cargo.toml [workspace.dependencies]. Both venvs
# install from THIS file, and neither hardcodes its own list:
#   root:  pip install -e .        (mise.toml [tasks.bootstrap])
#   fleet: pip install -e ../../   (mise.toml [tasks.fleet-bootstrap], run from
#                                   apps/hetzner-bare-metal-fleet)
# Add a dependency here; never in a venv-creating task. Dependabot's pip
# ecosystem (.github/dependabot.yml, directories: "/") then opens the bump PR.
#
# `ansible-galaxy collection install -r ansible/requirements.yml` stays a
# separate step in the tasks: Galaxy collections are not pip packages.

[build-system]
# Required. Without a build-system declaration, `pip install -e .` falls back to
# setuptools' legacy auto-discovery, which scans top-level directories and fails
# on this repo with:
#   "Multiple top-level packages discovered in a flat-layout:
#    ['apps', 'docker', 'ansible', 'kubernetes']"
# Declaring the backend (together with the empty `packages` list below) makes
# setuptools build a metadata-only distribution instead of hunting for packages.
# Verified: `pip install -e .` at the root and `pip install -e ../../` from the
# fleet directory both succeed against this file.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yral-bare-metal-kubernetes-cluster"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ansible-core>=2.19.13",
    "ansible-lint>=26.8.0",
    "yamllint>=1.38.0",
]

[tool.setuptools]
# Metadata-only distribution: this project ships no importable package, it only
# declares dependencies. The empty list is what stops setuptools from
# auto-discovering apps/, kubernetes/, etc. as packages.
packages = []

