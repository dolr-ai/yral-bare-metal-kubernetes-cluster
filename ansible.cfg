[defaults]
inventory = ansible/inventory/hosts.yml
# group_vars lives alongside the inventory file so Ansible resolves it correctly:
# ansible/inventory/group_vars/all/{vars.yml,vault.yml}
roles_path = ansible/roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
collections_path = ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = False
retry_files_enabled = False
timeout = 30
forks = 10
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400
vault_password_file = ansible/.vault_pass
# Infra SSH key — extracted from Ansible vault by `mise run bootstrap` to ./.yral-infra-ed25519.
# The same key is also installed as ~/.ssh/id_ed25519 (the machine default
# identity) by bootstrap — one key for GitHub and all node access.
private_key_file = ./.yral-infra-ed25519
# Preserve newlines and formatting in task output (ansible-core 2.13+ native option)
stdout_callback = default
result_format = yaml

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
