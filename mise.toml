# Monorepo-wide mise configuration.
# Run from the repository root; this drives the local toolchain for the whole workspace.

[tools]
age = "latest"
cargo-binstall = "latest"
flux2 = "latest"
fnox = "latest"
gh = "latest"
"github:clockworklabs/SpacetimeDB" = "latest"
"aqua:WebAssembly/binaryen" = "latest"
helm = "latest"
kubectl = "latest"
node = "latest"
pitchfork = "latest"
podman = "latest"
protobuf = "latest"
python = "latest"
redis = "latest"
rust = "stable"
sops = "latest"

# System packages — project-specific build dependencies (apt on Debian/Ubuntu).
# Applied with: mise bootstrap packages apply --yes
# OS-filtered — apt entries are ignored on macOS, brew entries on Linux, etc.
# Machine-baseline packages (build-essential, curl, git, etc.) live in ~/.dotfiles/mise.linux.toml.
[bootstrap.packages]
"apt:libssl-dev" = "latest"
"apt:musl-tools" = "latest"
"apt:pkg-config" = "latest"

[env]
_.path = ".venv/bin"
APP_ENV = "development"
LEPTOS_ENV = "development"
# fnox age decryption — private key extracted by mise run bootstrap
# Uses {{config_root}} so the path resolves to the repo root regardless of cwd
FNOX_AGE_KEY_FILE = "{{config_root}}/.yral-infra-ed25519"
# Cargo + cargo-binstall cache dirs — shared across all projects via $HOME.
# Without these, mise's rust/rustup backend sets CARGO_HOME/RUSTUP_HOME to a
# literal `./undefined/` at the cwd (repo root), duplicating caches per project.
CARGO_HOME = "{{env.HOME}}/.cargo"
RUSTUP_HOME = "{{env.HOME}}/.rustup"
CARGO_BINSTALL_DIR = "{{env.HOME}}/.local/share/cargo-binstall"
# Plaintext (non-sensitive) values — declared directly, no .env file needed.
AWS_ACCESS_KEY_ID = "XO5X9A1W8AMHY3DSTKMS"
AWS_ENDPOINT_URL = "https://fsn1.your-objectstorage.com"
AWS_DEFAULT_REGION = "fsn1"
KUBECONFIG = "{{env.HOME}}/.kube/config"

[tasks.bootstrap]
description = "Create .venv, install Python tooling, and extract infra SSH key from vault"
run = '''
python -m venv .venv && ./.venv/bin/pip install --upgrade pip && ./.venv/bin/pip install ansible-core ansible-lint yamllint vastai && ./.venv/bin/ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections

# Initialize git submodules (app source repos)
git submodule update --init --recursive

# Extract infra SSH private key from Ansible vault → ./.yral-infra-ed25519 (repo-local, gitignored)
# Used by fnox (age provider) to decrypt secrets. Idempotent — skips if already present.
if [ -f ansible/.vault_pass ] && [ ! -f .yral-infra-ed25519 ]; then
  export ANSIBLE_VAULT_PASSWORD_FILE=ansible/.vault_pass
  ./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml --vault-password-file ansible/.vault_pass | \
    ./.venv/bin/python -c "import sys, yaml; print(yaml.safe_load(sys.stdin)['vault_github_actions_ssh_private_key'])" \
    > .yral-infra-ed25519
  chmod 600 .yral-infra-ed25519
  echo '  ✓ Extracted infra SSH key to .yral-infra-ed25519'
elif [ -f .yral-infra-ed25519 ]; then
  echo '  ✓ Infra SSH key already at .yral-infra-ed25519'
else
  echo '  ⚠ Vault password file not found at ansible/.vault_pass — skipping infra SSH key extraction'
fi

# Extract kubeconfig from Ansible vault → ~/.kube/config (idempotent — skips if already present)
if [ -f ansible/.vault_pass ] && [ ! -f ~/.kube/config ]; then
  export ANSIBLE_VAULT_PASSWORD_FILE=ansible/.vault_pass
  mkdir -p ~/.kube
  ./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml --vault-password-file ansible/.vault_pass | \
    ./.venv/bin/python -c "import sys, yaml; print(yaml.safe_load(sys.stdin)['vault_kubeconfig'])" \
    > ~/.kube/config
  chmod 600 ~/.kube/config
  echo '  ✓ Extracted kubeconfig to ~/.kube/config'
elif [ -f ~/.kube/config ]; then
  echo '  ✓ Kubeconfig already at ~/.kube/config'
else
  echo '  ⚠ Vault password file not found — skipping kubeconfig extraction'
fi
'''

[tasks.ansible-vault-decrypt]
description = "Decrypt ansible/inventory/group_vars/all/vault.yml for editing"
run = "./.venv/bin/ansible-vault decrypt ansible/inventory/group_vars/all/vault.yml"

[tasks.ansible-vault-encrypt]
description = "Re-encrypt ansible/inventory/group_vars/all/vault.yml after editing"
run = "./.venv/bin/ansible-vault encrypt ansible/inventory/group_vars/all/vault.yml"

[tasks.setup]
description = "Install system packages, repo toolchain, and Python tooling (secrets already in fnox.toml)"
run = "mise bootstrap packages apply --yes && mise install && mise run bootstrap && echo 'Environment is ready'"

# ── SpacetimeDB ─────────────────────────────────────────────────────────────

[tasks.spacetime-dev]
description = "Start SpacetimeDB server (pitchfork) and run dev mode (build, generate bindings, publish, watch for changes)"
run = "pitchfork start spacetimedb && spacetimedb-cli dev"

[tasks.spacetime-stop]
description = "Stop SpacetimeDB server via pitchfork"
run = "pitchfork stop spacetimedb"

# ── yral-auth ────────────────────────────────────────────────────────────────

[tasks.yral-auth-bootstrap]
description = "Install yral-auth build prerequisites (cargo-leptos, musl+wasm targets, npm deps)"
depends = ["bootstrap"]
run = '''
rustup install
cargo binstall cargo-leptos --no-confirm
cd apps/yral-auth && npm install
'''

[tasks.yral-auth-build]
description = "Build yral-auth (release, musl static binary + WASM client)"
dir = "apps/yral-auth"
run = "cargo leptos build --release --lib-features release-lib --bin-features release-bin"
env = { LEPTOS_BIN_TARGET_TRIPLE = "x86_64-unknown-linux-musl" }

[tasks.yral-auth-run]
description = "Run yral-auth locally via pitchfork (release binary, port 8080)"
depends = ["yral-auth-build"]
run = "pitchfork start yral-auth --force"

[tasks.yral-auth-test]
description = "Run yral-auth tests (ssr feature required for bin targets)"
dir = "apps/yral-auth"
run = "cargo test --features ssr --bins --lib"

[tasks.yral-auth-image]
description = "Build the yral-auth container image locally (podman)"
run = "podman build -f apps/yral-auth/Dockerfile.buildkit -t test/yral-auth --platform linux/amd64 ."

[tasks.yral-auth-image-run]
description = "Run the yral-auth container image locally via pitchfork (podman, port 8080)"
depends = ["yral-auth-image"]
run = "pitchfork start yral-auth-container --force"

[tasks.yral-auth-stop]
description = "Stop yral-auth dev server or container via pitchfork"
run = "pitchfork stop yral-auth yral-auth-container"

[tasks.yral-auth-all]
description = "Full yral-auth workflow: build → test → image → image-run → validate → stop"
run = '''
mise run yral-auth-build
mise run yral-auth-run
mise run yral-auth-test
mise run yral-auth-image
mise run yral-auth-image-run
'''

[tasks.yral-auth-validate]
description = "Validate yral-auth on prod (read-only kubectl checks)"
run = '''
echo "=== Pods ==="
kubectl -n yral-auth get pods -l app=yral-auth -o wide
echo ""
echo "=== Health ==="
kubectl -n yral-auth get pods -l app=yral-auth -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.containerStatuses[0].ready}{"\n"}{end}'
echo ""
echo "=== Recent logs (last 20 lines, first pod) ==="
FIRST_POD=$(kubectl -n yral-auth get pods -l app=yral-auth -o jsonpath='{.items[0].metadata.name}')
kubectl -n yral-auth logs "$FIRST_POD" --tail=20
'''

