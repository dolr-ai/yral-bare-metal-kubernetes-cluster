[tasks.yral-web-all]
description = "Full yral-web workflow: build → test → image → image-run → validate → stop"
run = '''
mise run yral-web-build
mise run yral-web-run
mise run yral-web-test
mise run yral-web-image
mise run yral-web-image-run
'''

[tasks.yral-web-validate]
