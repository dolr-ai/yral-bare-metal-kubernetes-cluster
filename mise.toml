# These improve build performance and reliability.
GRADLE_OPTS = "-Dorg.gradle.daemon=true -Dorg.gradle.caching=true"

[tasks.bootstrap]
description = "Create .venv, install Python tooling, and extract infra SSH key from vault"
run = '''
python -m venv .venv && ./.venv/bin/pip install --upgrade pip && ./.venv/bin/pip install ansible-core ansible-lint yamllint vastai && ./.venv/bin/ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections

# Initialize git submodules (app source repos)
git submodule update --init --recursive

# Extract infra SSH private key from Ansible vault → ./.yral-infra-ed25519 (repo-local, gitignored)
# Used by fnox (age provider) to decrypt secrets. Idempotent — skips if already present.
if [ -f ansible/.vault_pass ] && [ ! -f .yral-infra-ed25519 ]; then
  export ANSIBLE_VAULT_PASSWORD_FILE=ansible/.vault_pass
  ./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml --vault-password-file ansible/.vault_pass | \
    ./.venv/bin/python -c "import sys, yaml; print(yaml.safe_load(sys.stdin)['vault_github_actions_ssh_private_key'])" \
    > .yral-infra-ed25519
  chmod 600 .yral-infra-ed25519
  echo '  ✓ Extracted infra SSH key to .yral-infra-ed25519'
elif [ -f .yral-infra-ed25519 ]; then
  echo '  ✓ Infra SSH key already at .yral-infra-ed25519'
else
  echo '  ⚠ Vault password file not found at ansible/.vault_pass — skipping infra SSH key extraction'
fi

# Extract kubeconfig from Ansible vault → ~/.kube/config (idempotent — skips if already present)
if [ -f ansible/.vault_pass ] && [ ! -f ~/.kube/config ]; then
  export ANSIBLE_VAULT_PASSWORD_FILE=ansible/.vault_pass
  mkdir -p ~/.kube
  ./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml --vault-password-file ansible/.vault_pass | \
    ./.venv/bin/python -c "import sys, yaml; print(yaml.safe_load(sys.stdin)['vault_kubeconfig'])" \
    > ~/.kube/config
  chmod 600 ~/.kube/config
  echo '  ✓ Extracted kubeconfig to ~/.kube/config'
elif [ -f ~/.kube/config ]; then
  echo '  ✓ Kubeconfig already at ~/.kube/config'
else
  echo '  ⚠ Vault password file not found — skipping kubeconfig extraction'
fi

rustup install
rustup update
'''

[tasks.ansible-vault-decrypt]
description = "Decrypt ansible/inventory/group_vars/all/vault.yml for editing"
run = "./.venv/bin/ansible-vault decrypt ansible/inventory/group_vars/all/vault.yml"

[tasks.ansible-vault-encrypt]
description = "Re-encrypt ansible/inventory/group_vars/all/vault.yml after editing"
run = "./.venv/bin/ansible-vault encrypt ansible/inventory/group_vars/all/vault.yml"

[tasks.setup]
description = "Install system packages, repo toolchain, and Python tooling (secrets already in fnox.toml)"
run = "mise bootstrap packages apply --yes && mise install && mise run bootstrap && echo 'Environment is ready'"

# ── SpacetimeDB ─────────────────────────────────────────────────────────────
# The yral-database-spacetime module is a SpacetimeDB wasm module (cdylib),
# not a containerized Rust service. The loop is: build (wasm) → generate
# (client bindings) → test → run (local publish) → publish (Maincloud) →
# validate. No -image/-image-run tasks (Maincloud deploy = `spacetime publish`).
#
# Config layering (per SpacetimeDB docs):
#   spacetime.json     → production defaults (server: maincloud, checked in)
#   spacetime.dev.json → dev overrides (server: local, checked in)
# `publish`/`generate`/`dev` read these automatically. `build` does NOT (it
# needs `-p` explicitly). `spacetime dev` implicitly uses `--env dev`, which
# loads spacetime.dev.json on top of spacetime.json.
# The wasm32-unknown-unknown target is installed by mise's rust toolchain.

[tasks.spacetime-build]
description = "Build the yral-database-spacetime wasm module (release)"
run = "spacetimedb-cli build -p apps/yral-database-spacetime"

[tasks.spacetime-generate]
description = "Regenerate Rust client bindings from the module schema (reads spacetime.json)"
run = "spacetimedb-cli generate"

[tasks.spacetime-test]
description = "Run yral-database-spacetime tests"
dir = "apps/yral-database-spacetime"
run = "cargo test"

[tasks.spacetime-run]
description = "Start local SpacetimeDB server (pitchfork) and publish the module locally (--env dev reads spacetime.dev.json → local server)"
depends = ["spacetime-build"]
run = "pitchfork start spacetimedb && spacetimedb-cli publish --env dev --yes"

[tasks.spacetime-dev]
description = "Start SpacetimeDB server (pitchfork) and run dev mode (build, generate bindings, publish, watch for changes)"
run = "pitchfork start spacetimedb && spacetimedb-cli dev"

[tasks.spacetime-stop]
description = "Stop SpacetimeDB server via pitchfork"
run = "pitchfork stop spacetimedb"

# No --yes: maincloud publish is production — we MUST read the migration plan
# and breaking-change warnings interactively before accepting. Never
# auto-accept data-destructive prompts on Maincloud.
[tasks.spacetime-publish]
description = "Publish the yral-database-spacetime module to SpacetimeDB Maincloud (interactive — reads migration plan before accepting)"
depends = ["spacetime-build"]
run = "spacetimedb-cli publish"

[tasks.spacetime-validate]
description = "Validate yral-database-spacetime on Maincloud (read-only checks: tables, row counts, procedure calls)"
run = '''
echo "=== Tables ==="
TABLES_OUT=$(spacetimedb-cli sql --server maincloud $SPACETIMEDB_DB_NAME "SELECT table_name, table_access FROM st_table WHERE table_type = 'user'")
echo "$TABLES_OUT"
echo ""
echo "=== Row counts ==="
# Parse table names from the query output (quoted first column), then count each.
TABLES=$(echo "$TABLES_OUT" | awk -F'|' '/^ "/ {gsub(/[" \t]/, "", $1); print $1}')
for t in $TABLES; do
  echo -n "$t: "
  spacetimedb-cli sql --server maincloud $SPACETIMEDB_DB_NAME "SELECT count(*) AS cnt FROM $t"
done
'''

[tasks.spacetime-all]
description = "Full yral-database-spacetime workflow: build → generate → test → run → publish → validate"
run = '''
mise run spacetime-build
mise run spacetime-generate
mise run spacetime-test
mise run spacetime-run
mise run spacetime-publish
mise run spacetime-validate
'''

# ── yral-backend-canister ───────────────────────────────────────────────────
# ICP canisters (Rust → wasm32-unknown-unknown via dfx). This is a git submodule.
# Prerequisites: dfx + pocket-ic + candid-extractor — NOT available via mise;
# installed inline by the canister-bootstrap task. These tools are ICP-specific
# and not part of the declarative mise toolchain.

[tasks.canister-bootstrap]
description = "Install ICP canister toolchain (dfx, pocket-ic, candid-extractor) — NOT via mise, installed inline"
dir = "apps/yral-backend-canister"
run = '''
# Install candid-extractor (official DFINITY tool for generating .did files from wasm)
if ! command -v candid-extractor &>/dev/null; then
  cargo install candid-extractor
fi

# Install dfx non-interactively
if ! command -v dfx &>/dev/null; then
  export DFXVM_INIT_YES=true
  DFX_VERSION=0.31.0 sh -c "$(curl -fsSL https://internetcomputer.org/install.sh)"
fi

# Install pocket-ic server (idempotent)
POCKET_IC_VERSION="7.0.0"
POCKET_IC_BIN="$PWD/pocket-ic"

if [ ! -f "$POCKET_IC_BIN" ]; then
  TMP="$(mktemp)"
  curl -fsSL "https://github.com/dfinity/pocketic/releases/download/${POCKET_IC_VERSION}/pocket-ic-x86_64-darwin.gz" -o "$TMP"
  gunzip -c "$TMP" > "$POCKET_IC_BIN"
  rm "$TMP"
  chmod +x "$POCKET_IC_BIN"
fi
'''

[tasks.canister-test]
description = "Run canister integration test suite (starts local dfx replica + cargo test)"
dir = "apps/yral-backend-canister"
run = '''
set -euo pipefail

export POCKET_IC_BIN="${POCKET_IC_BIN:-$PWD/pocket-ic}"

echo "POCKET_IC_BIN=$POCKET_IC_BIN"

dfx identity list

dfx start --background
cleanup() {
  dfx stop || true
}
trap cleanup EXIT

for canister in \
  user_post_service \
  user_info_service
  do
  dfx canister create --no-wallet "$canister"
done

for canister in \
  user_post_service \
  user_info_service
  do
  dfx build "$canister"
  gzip -f -1 "./target/wasm32-unknown-unknown/release/${canister}.wasm"
done

cargo test
'''

[tasks.canister-harvest]
description = "Harvest cycles from a single mainnet canister via the task_runner harvest test (materializes ACTIONS_IDENTITY_PEM from fnox, cleans up after). Pass HARVEST_CANISTER_ID=<id> to target a specific canister."
dir = "apps/yral-backend-canister"
run = '''
set -euo pipefail

PEM_FILE="$PWD/actions_identity.pem"

# Materialize the actions identity from fnox (age-encrypted in fnox.toml).
# Clean up on exit so the PEM never lingers on disk.
cleanup() {
  if [ -f "$PEM_FILE" ]; then
    shred -u "$PEM_FILE" 2>/dev/null || rm -f "$PEM_FILE"
  fi
}
trap cleanup EXIT

fnox get ACTIONS_IDENTITY_PEM > "$PEM_FILE"
chmod 600 "$PEM_FILE"

if [ ! -s "$PEM_FILE" ]; then
  echo "Error: ACTIONS_IDENTITY_PEM secret is empty or missing from fnox."
  echo "Set it with: fnox set ACTIONS_IDENTITY_PEM --provider age < <pem-file>"
  exit 1
fi

export DFX_WARNING=-mainnet_plaintext_identity

if [ -n "${HARVEST_CANISTER_ID:-}" ]; then
  echo "==> Harvesting canister: $HARVEST_CANISTER_ID"
else
  echo "==> Harvesting first canister from principal.csv"
  echo "    (set HARVEST_CANISTER_ID=<id> to target a specific canister)"
fi

cargo test -p task_runner -- --ignored harvest_single_canister --nocapture
'''

[tasks.canister-generate-candid]
description = "Rebuild canisters and regenerate Candid .did interface files (optionally pass specific canister names as args)"
dir = "apps/yral-backend-canister"
run = '''
set -euo pipefail

ALL_CANISTERS=(
  user_post_service
  user_info_service
)

if [ $# -gt 0 ]; then
  CANISTERS=("$@")
else
  CANISTERS=("${ALL_CANISTERS[@]}")
fi

for canister in "${CANISTERS[@]}"; do
  echo "==> $canister: building wasm..."
  cargo build -p "$canister" --target wasm32-unknown-unknown --release -q

  wasm="$PWD/target/wasm32-unknown-unknown/release/${canister}.wasm"
  did="$PWD/src/canister/${canister}/can.did"

  echo "==> $canister: extracting candid..."
  candid-extractor "$wasm" > "$did"
  echo "    wrote $did"
done

echo "Done."
'''

# ── yral-auth ────────────────────────────────────────────────────────────────

[tasks.yral-auth-bootstrap]
description = "Install yral-auth build prerequisites (cargo-leptos, musl+wasm targets, npm deps)"
depends = ["bootstrap"]
run = '''
rustup install
cargo binstall cargo-leptos --no-confirm
cd apps/yral-auth && npm install
'''

[tasks.yral-auth-build]
description = "Build yral-auth (release, musl static binary + WASM client)"
dir = "apps/yral-auth"
run = "cargo leptos build --release --lib-features release-lib --bin-features release-bin"
env = { LEPTOS_BIN_TARGET_TRIPLE = "x86_64-unknown-linux-musl" }

[tasks.yral-auth-run]
description = "Run yral-auth locally via pitchfork (release binary, port 8080)"
depends = ["yral-auth-build"]
run = "pitchfork start yral-auth --force"

[tasks.yral-auth-test]
description = "Run yral-auth tests (ssr feature required for bin targets)"
dir = "apps/yral-auth"
run = "cargo test --features ssr --bins --lib"

[tasks.yral-auth-image]
description = "Build the yral-auth container image locally (podman)"
run = "podman build -f apps/yral-auth/Dockerfile.buildkit -t test/yral-auth --platform linux/amd64 ."

[tasks.yral-auth-image-run]
description = "Run the yral-auth container image locally via pitchfork (podman, port 8080)"
depends = ["yral-auth-image"]
run = "pitchfork start yral-auth-container --force"

[tasks.yral-auth-stop]
description = "Stop yral-auth dev server or container via pitchfork"
run = "pitchfork stop yral-auth yral-auth-container"

[tasks.yral-auth-all]
description = "Full yral-auth workflow: build → test → image → image-run → validate → stop"
run = '''
mise run yral-auth-build
mise run yral-auth-run
mise run yral-auth-test
mise run yral-auth-image
mise run yral-auth-image-run
'''

[tasks.yral-auth-validate]
description = "Validate yral-auth on prod (read-only kubectl checks)"
run = '''
echo "=== Pods ==="
kubectl -n yral-auth get pods -l app=yral-auth -o wide
echo ""
echo "=== Health ==="
kubectl -n yral-auth get pods -l app=yral-auth -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.containerStatuses[0].ready}{"\n"}{end}'
echo ""
echo "=== Recent logs (last 20 lines, first pod) ==="
FIRST_POD=$(kubectl -n yral-auth get pods -l app=yral-auth -o jsonpath='{.items[0].metadata.name}')
kubectl -n yral-auth logs "$FIRST_POD" --tail=20
'''

