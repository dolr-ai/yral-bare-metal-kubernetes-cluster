echo "=== Recent logs (last 20 lines, first pod) ==="
FIRST_POD=$(kubectl -n yral-metadata get pods -l app=yral-metadata -o jsonpath='{.items[0].metadata.name}')
kubectl -n yral-metadata logs "$FIRST_POD" --tail=20
'''

