run = "./.venv/bin/ansible-playbook ansible/playbooks/ssh-access.yml"

[tasks.fleet-lint]
description = "Lint the fleet Ansible playbooks and roles with ansible-lint"
dir = "apps/hetzner-bare-metal-fleet"
depends = ["fleet-bootstrap"]
