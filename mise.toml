[tasks.off-chain-agent-build]
description = "Build off-chain-agent (release, musl static binary)"
run = "cargo build --release --target x86_64-unknown-linux-musl -p off-chain-agent"

[tasks.off-chain-agent-run]
description = "Run off-chain-agent locally via pitchfork (release binary, port 50051)"
depends = ["off-chain-agent-build"]
run = "pitchfork start off-chain-agent --force"

[tasks.off-chain-agent-test]
description = "Run off-chain-agent tests"
run = "cargo test -p off-chain-agent"

[tasks.off-chain-agent-image]
description = "Build the off-chain-agent container image locally (podman)"
run = "podman build -f apps/off-chain-agent/Dockerfile.buildkit -t test/off-chain-agent --platform linux/amd64 ."

[tasks.off-chain-agent-image-run]
description = "Run the off-chain-agent container image locally via pitchfork (podman, port 50051)"
depends = ["off-chain-agent-image"]
run = "pitchfork start off-chain-agent-container --force"

[tasks.off-chain-agent-stop]
description = "Stop off-chain-agent dev server or container via pitchfork"
run = "pitchfork stop off-chain-agent off-chain-agent-container"

[tasks.off-chain-agent-all]
description = "Full off-chain-agent workflow: build → run → test → image → image-run"
run = '''
mise run off-chain-agent-build
mise run off-chain-agent-run
mise run off-chain-agent-test
mise run off-chain-agent-image
mise run off-chain-agent-image-run
'''

[tasks.off-chain-agent-validate]
description = "Validate off-chain-agent on prod (read-only kubectl checks)"
run = '''
echo "=== Pods ==="
kubectl -n off-chain-agent get pods -l app=off-chain-agent -o wide
echo ""
echo "=== Health ==="
kubectl -n off-chain-agent get pods -l app=off-chain-agent -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.containerStatuses[0].ready}{"\n"}{end}'
echo ""
echo "=== Recent logs (last 20 lines, first pod) ==="
FIRST_POD=$(kubectl -n off-chain-agent get pods -l app=off-chain-agent -o jsonpath='{.items[0].metadata.name}')
kubectl -n off-chain-agent logs "$FIRST_POD" --tail=20
'''

# ── yral-mobile ──────────────────────────────────────────────────────────────
# Kotlin Multiplatform (Android + iOS). Tasks use `dir` to run from the submodule.
# Prerequisites (not managed by mise — system-level):
#   - Android SDK (set ANDROID_HOME or sdk.dir in local.properties)
#   - Xcode + Command Line Tools (macOS only, for iOS targets)
#   - Android emulator (API 35, Google APIs, 12 GB disk)
#   - iOS simulator (iPhone, any recent iOS)
# First-time setup:  mise install && mise run yral-mobile-setup

[tasks.yral-mobile-setup]
description = "Install Ruby gems (fastlane) and run CocoaPods install for iOS"
dir = "apps/yral-mobile"
run = '''
bundle install
cd iosApp && pod install
'''

[tasks.yral-mobile-checks]
description = "CI-equivalent full check suite (lint + unit tests + iOS xcodebuild + Android/iOS e2e)"
dir = "apps/yral-mobile"
run = '''
./gradlew

./gradlew ktlintFormat
./gradlew ktlintCheck
./gradlew detekt --continue

./gradlew allChecks
./gradlew :iosSharedUmbrella:podPublishDebugXCFramework

# Auth allTests: iOS simulator test linking fails due to a pre-existing
# Kotlin/Native CocoaPods transitive dependency issue (FirebasePerformance
# framework not linked into the test binary). Android unit tests pass.
./gradlew :shared:features:auth:allTests || echo '⚠ auth allTests failed (pre-existing iOS linking issue)'
./gradlew test

'''

[tasks.yral-mobile-clean]
description = "Clean all Gradle build outputs"
dir = "apps/yral-mobile"
run = "./gradlew clean"

# ─── my-website (SvelteKit static site → nginx) ───────────────────────────────

[tasks.my-website-build]
description = "Build my-website (SvelteKit static site)"
dir = "apps/my-website"
run = "npm ci && npm run build"

[tasks.my-website-image]
description = "Build the my-website container image locally (podman)"
run = "podman build -f apps/my-website/Dockerfile.buildkit -t test/my-website --platform linux/amd64 ."

[tasks.my-website-image-run]
description = "Run the my-website container image locally via pitchfork (podman, port 8080)"
depends = ["my-website-image"]
run = "pitchfork start my-website-container --force"

[tasks.my-website-stop]
description = "Stop my-website container via pitchfork"
run = "pitchfork stop my-website-container"

[tasks.my-website-validate]
description = "Validate my-website on prod (read-only kubectl checks)"
run = '''
echo "=== Pods ==="
kubectl -n my-website get pods -l app=my-website -o wide
echo ""
echo "=== Health ==="
kubectl -n my-website get pods -l app=my-website -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.containerStatuses[0].ready}{"\n"}{end}'
echo ""
echo "=== Recent logs (last 20 lines, first pod) ==="
FIRST_POD=$(kubectl -n my-website get pods -l app=my-website -o jsonpath='{.items[0].metadata.name}')
kubectl -n my-website logs "$FIRST_POD" --tail=20
'''
