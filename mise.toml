# Monorepo-wide mise configuration.
# Run from the repository root; this drives the local toolchain for the whole workspace.

[tools]
age = "latest"
"aqua:WebAssembly/binaryen" = "latest"
cargo-binstall = "latest"
"cargo:cargo-expand" = "latest"
"cargo:topcoat-cli" = "latest"
"cargo:trunk" = "latest"
cocoapods = { version = "latest", os = ["macos"] }
flux2 = "2.9.4"
fnox = "latest"
gh = "latest"
helm = "latest"
"github:clockworklabs/SpacetimeDB" = "latest"
# Mobile tooling — macOS only (Android + iOS development). These tools
# require macOS frameworks and are not installable on Linux. They are
# conditionally installed only on macOS machines.
# Pinned to JDK 21 LTS (not "latest"): Gradle 8.14.4's bundled Kotlin compiler
# (Kotlin 2.0.21) cannot parse JDK 26's version string ("26.0.2") and throws
# IllegalArgumentException during script compilation. Bump only after upgrading
# the Gradle wrapper to a version whose embedded Kotlin supports the new JDK.
java = { version = "21", os = ["macos"] }
kubectl = "latest"
maestro = { version = "latest", os = ["macos"] }
node = "latest"
pitchfork = "latest"
podman = "latest"
protobuf = "latest"
python = "latest"
ruby = { version = "latest", os = ["macos"] }
# Rust toolchain — pinned to a dated nightly via mise.lock (more reproducible
# than rust-toolchain.toml's floating "nightly"). mise's rust backend sets
# RUSTUP_TOOLCHAIN, which would override rust-toolchain.toml anyway, so we
# declare targets/components here as tool options. `mise install` adds any
# missing targets/components on every run. Do NOT add a rust-toolchain.toml —
# it would be dead weight (RUSTUP_TOOLCHAIN env var takes precedence).
rust = { version = "nightly", targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-musl"], components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"] }
sops = "latest"
sqlite = "latest"
swiftlint = { version = "latest", os = ["macos"] }

# System packages — project-specific build dependencies (apt on Debian/Ubuntu).
# Applied with: mise bootstrap packages apply --yes
# OS-filtered — apt entries are ignored on macOS, brew entries on Linux, etc.
# Machine-baseline packages (build-essential, curl, git, etc.) live in ~/.dotfiles/mise.linux.toml.
[bootstrap.packages]
"apt:bind9-dnsutils" = "latest"
"apt:libssl-dev" = "latest"
"apt:musl-tools" = "latest"
"apt:pkg-config" = "latest"

[env]
_.path = ".venv/bin"
APP_ENV = "development"
LEPTOS_ENV = "development"
# fnox age decryption — private key extracted by mise run bootstrap
# Uses {{config_root}} so the path resolves to the repo root regardless of cwd
FNOX_AGE_KEY_FILE = "{{config_root}}/.yral-infra-ed25519"
# Cargo + cargo-binstall cache dirs — shared across all projects via $HOME.
# Without these, mise's rust/rustup backend sets CARGO_HOME/RUSTUP_HOME to a
# literal `./undefined/` at the cwd (repo root), duplicating caches per project.
CARGO_HOME = "{{env.HOME}}/.cargo"
RUSTUP_HOME = "{{env.HOME}}/.rustup"
CARGO_BINSTALL_DIR = "{{env.HOME}}/.local/share/cargo-binstall"
# Plaintext (non-sensitive) values — declared directly, no .env file needed.
AWS_ACCESS_KEY_ID = "XO5X9A1W8AMHY3DSTKMS"
AWS_ENDPOINT_URL = "https://fsn1.your-objectstorage.com"
AWS_DEFAULT_REGION = "fsn1"
KUBECONFIG = "{{env.HOME}}/.kube/config"
# SpacetimeDB Maincloud (SaaS) — DB identity/name for the yral-database-spacetime
# module. The Maincloud base URL is fixed; the DB name matches `spacetime.json`.
# Plaintext only (no secrets here); the admin token (if needed for write
# reducers from a cluster service) lives in fnox. See AGENTS.md
# "External Service Config & Secrets".
SPACETIMEDB_MAINCLOUD_URL = "https://maincloud.spacetimedb.com"
SPACETIMEDB_DB_NAME = "yral-database-spacetime-4lbo7"

# ── yral-auth ─────────────────────────────────────────────────────────────
# SpacetimeDB config (KV store + identity token for REST calls).
# The admin token is the yral-auth JWT — SpacetimeDB derives an admin Identity
# from the iss + sub claims. Stored in fnox.toml as SPACETIMEDB_ADMIN_TOKEN.
# SPACETIMEDB_URL is the name yral-auth's SpacetimeKV expects (same value as
# SPACETIMEDB_MAINCLOUD_URL).
SPACETIMEDB_URL = "https://maincloud.spacetimedb.com"
# Plaintext (non-sensitive) values — public OAuth identifiers and public keys.
GOOGLE_CLIENT_ID = "804814798298-taifmq3k6olk9bjr1cqb9gfnp1mssqqb.apps.googleusercontent.com"
APPLE_CLIENT_ID = "com.yral.yral-auth"
APPLE_TEAM_ID = "2UL556KNXC"
APPLE_KEY_ID = "9DWVYWDYD8"
# Public keys (used for verification by other services — not secrets)
JWT_PUB_EC_PEM = '''
-----BEGIN PUBLIC KEY-----
MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEoqN3/0RNfrnrnYGxKBgy/qHnmITr
+6ucjxStx7tjA30QJZlWzo0atxmY8y9dUR+eKQI0SnbQds4xLEU8+JGm8Q==
-----END PUBLIC KEY-----'''
CLIENT_JWT_PUB_ED_PEM = '''
-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEAKpZNfPOONR9AXiaGmHv8AHemm4SNK0uh+mf523ho5KU=
-----END PUBLIC KEY-----'''

# ── off-chain-agent ──────────────────────────────────────────────────────
RUST_LOG = "info"
OFF_CHAIN_AGENT_URL = "http://localhost:50051/"

# ── yral-web ───────────────────────────────────────────────────────────
# LEPTOS_SITE_ADDR is set per-daemon in pitchfork.toml (prod: 8080, dev: 8081)
LEPTOS_HASH_FILES = "true"
# Plaintext (non-sensitive) values — public OAuth identifiers
# These are the production redirect URLs; dev daemons override them in pitchfork.toml
GOOGLE_REDIRECT_URL = "http://127.0.0.1:8080/auth/google_redirect"
YRAL_AUTH_REDIRECT_URL = "http://127.0.0.1:8080/auth/yral_redirect"
# Yral-auth client ID (same as yral-auth's GOOGLE_CLIENT_ID)
YRAL_AUTH_CLIENT_ID = "804814798298-taifmq3k6olk9bjr1cqb9gfnp1mssqqb.apps.googleusercontent.com"

# ── yral-metadata ─────────────────────────────────────────────────────────
# Bind address for the Axum server
BIND_ADDRESS = "0.0.0.0:7000"

# ── yral-mobile ───────────────────────────────────────────────────────────
# Kafka bootstrap server for e2e test assertions (checks module).
KAFKA_BOOTSTRAP = "kafka.yral.com:9092"
# Gradle — use the project wrapper (./gradlew) for all builds.
# These improve build performance and reliability.
GRADLE_OPTS = "-Dorg.gradle.daemon=true -Dorg.gradle.caching=true"

[tasks.bootstrap]
description = "Create .venv, install Python tooling, and extract infra SSH key from vault"
run = '''
python -m venv .venv && ./.venv/bin/pip install --upgrade pip && ./.venv/bin/pip install ansible-core ansible-lint yamllint && ./.venv/bin/ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections

# Initialize git submodules (app source repos)
git submodule update --init --recursive

# Extract infra SSH private key from Ansible vault → ./.yral-infra-ed25519 (repo-local, gitignored)
# Used by fnox (age provider) to decrypt secrets. Idempotent — skips if already present.
if [ -f ansible/.vault_pass ] && [ ! -f .yral-infra-ed25519 ]; then
  export ANSIBLE_VAULT_PASSWORD_FILE=ansible/.vault_pass
  ./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml --vault-password-file ansible/.vault_pass | \
    ./.venv/bin/python -c "import sys, yaml; print(yaml.safe_load(sys.stdin)['vault_github_actions_ssh_private_key'])" \
    > .yral-infra-ed25519
  chmod 600 .yral-infra-ed25519
  echo '  ✓ Extracted infra SSH key to .yral-infra-ed25519'
elif [ -f .yral-infra-ed25519 ]; then
  echo '  ✓ Infra SSH key already at .yral-infra-ed25519'
else
  echo '  ⚠ Vault password file not found at ansible/.vault_pass — skipping infra SSH key extraction'
fi

# Extract kubeconfig from Ansible vault → ~/.kube/config (idempotent — skips if already present)
if [ -f ansible/.vault_pass ] && [ ! -f ~/.kube/config ]; then
  export ANSIBLE_VAULT_PASSWORD_FILE=ansible/.vault_pass
  mkdir -p ~/.kube
  ./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml --vault-password-file ansible/.vault_pass | \
    ./.venv/bin/python -c "import sys, yaml; print(yaml.safe_load(sys.stdin)['vault_kubeconfig'])" \
    > ~/.kube/config
  chmod 600 ~/.kube/config
  echo '  ✓ Extracted kubeconfig to ~/.kube/config'
elif [ -f ~/.kube/config ]; then
  echo '  ✓ Kubeconfig already at ~/.kube/config'
else
  echo '  ⚠ Vault password file not found — skipping kubeconfig extraction'
fi

rustup install
rustup update
'''

[tasks.ansible-vault-decrypt]
description = "Decrypt ansible/inventory/group_vars/all/vault.yml for editing"
run = "./.venv/bin/ansible-vault decrypt ansible/inventory/group_vars/all/vault.yml"

[tasks.ansible-vault-encrypt]
description = "Re-encrypt ansible/inventory/group_vars/all/vault.yml after editing"
run = "./.venv/bin/ansible-vault encrypt ansible/inventory/group_vars/all/vault.yml"

[tasks.ansible-vault-view]
description = "View a value from Ansible vault (usage: mise run ansible-vault-view -- <yaml key>)"
run = '''
./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml | \
  ./.venv/bin/python -c "import sys, yaml; print(yaml.safe_load(sys.stdin)[sys.argv[1]])" "$@"
'''

[tasks.ansible-playbook]
description = "Run an Ansible playbook (usage: mise run ansible-playbook -- ansible/playbooks/operations/<playbook>.yml [-e target_host=...])"
run = "./.venv/bin/ansible-playbook"

[tasks.ansible-lint]
description = "Lint Ansible playbooks and roles (runs ansible-lint on ansible/playbooks/operations/)"
run = "./.venv/bin/ansible-lint ansible/playbooks/operations/"

[tasks.sops-decrypt]
description = "Decrypt a SOPS file (usage: mise run sops-decrypt -- kubernetes/path/to/file.sops.yaml)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
KEYFILE=$(mktemp)
ansible-vault view ansible/inventory/group_vars/all/vault.yml | grep 'AGE-SECRET-KEY' | tr -d '[:space:]' > "$KEYFILE"
SOPS_AGE_KEY_FILE="$KEYFILE" sops --decrypt "$@"
rm -f "$KEYFILE"
'''

[tasks.sops-encrypt]
description = "Encrypt a plain YAML file as SOPS in-place (usage: mise run sops-encrypt -- kubernetes/path/to/file.sops.yaml)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
KEYFILE=$(mktemp)
ansible-vault view ansible/inventory/group_vars/all/vault.yml | grep 'AGE-SECRET-KEY' | tr -d '[:space:]' > "$KEYFILE"
SOPS_AGE_KEY_FILE="$KEYFILE" sops --encrypt --in-place "$@"
rm -f "$KEYFILE"
'''

[tasks.sops-edit]
description = "Edit a SOPS file in-place (usage: mise run sops-edit -- kubernetes/path/to/file.sops.yaml)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
KEYFILE=$(mktemp)
ansible-vault view ansible/inventory/group_vars/all/vault.yml | grep 'AGE-SECRET-KEY' | tr -d '[:space:]' > "$KEYFILE"
SOPS_AGE_KEY_FILE="$KEYFILE" sops "$@"
rm -f "$KEYFILE"
'''

[tasks.setup]
description = "Install system packages, repo toolchain, and Python tooling (secrets already in fnox.toml)"
run = "mise bootstrap packages apply --yes && mise install && mise run bootstrap && echo 'Environment is ready'"

# ── SpacetimeDB ─────────────────────────────────────────────────────────────
# The yral-database-spacetime module is a SpacetimeDB wasm module (cdylib),
# not a containerized Rust service. The loop is: build (wasm) → generate
# (client bindings) → test → run (local publish) → publish (Maincloud) →
# validate. No -image/-image-run tasks (Maincloud deploy = `spacetime publish`).
#
# Config layering (per SpacetimeDB docs):
#   spacetime.json     → production defaults (server: maincloud, checked in)
#   spacetime.dev.json → dev overrides (server: local, checked in)
# `publish`/`generate`/`dev` read these automatically. `build` does NOT (it
# needs `-p` explicitly). `spacetime dev` implicitly uses `--env dev`, which
# loads spacetime.dev.json on top of spacetime.json.
# The wasm32-unknown-unknown target is installed by mise's rust toolchain.

[tasks.spacetime-build]
description = "Build the yral-database-spacetime wasm module (release)"
run = "spacetimedb-cli build -p apps/yral-database-spacetime"

[tasks.spacetime-generate]
description = "Regenerate Rust client bindings from the live Maincloud database schema (reads spacetime.json). Must be run after spacetime-publish to reflect schema changes."
run = "spacetimedb-cli generate"

[tasks.spacetime-test]
description = "Run yral-database-spacetime tests"
dir = "apps/yral-database-spacetime"
run = "cargo test"

[tasks.spacetime-run]
description = "Start local SpacetimeDB server (pitchfork) and publish the module locally (--env dev reads spacetime.dev.json → local server)"
depends = ["spacetime-build"]
run = "pitchfork start spacetimedb && spacetimedb-cli publish --env dev --yes"

[tasks.spacetime-dev]
description = "Start SpacetimeDB server (pitchfork) and run dev mode (build, generate bindings, publish, watch for changes)"
run = "pitchfork start spacetimedb && spacetimedb-cli dev"

[tasks.spacetime-stop]
description = "Stop SpacetimeDB server via pitchfork"
run = "pitchfork stop spacetimedb"

# No --yes: maincloud publish is production — we MUST read the migration plan
# and breaking-change warnings interactively before accepting. Never
# auto-accept data-destructive prompts on Maincloud.
[tasks.spacetime-publish]
description = "Publish to SpacetimeDB Maincloud (interactive — reads migration plan), then regenerate client bindings. Order: build → publish → generate."
depends = ["spacetime-build"]
run = "spacetimedb-cli publish && mise run spacetime-generate"

[tasks.spacetime-validate]
description = "Validate yral-database-spacetime on Maincloud (read-only checks: tables, row counts, procedure calls)"
run = '''
echo "=== Tables ==="
TABLES_OUT=$(spacetimedb-cli sql --server maincloud $SPACETIMEDB_DB_NAME "SELECT table_name, table_access FROM st_table WHERE table_type = 'user'")
echo "$TABLES_OUT"
echo ""
echo "=== Row counts ==="
# Parse table names from the query output (quoted first column), then count each.
TABLES=$(echo "$TABLES_OUT" | awk -F'|' '/^ "/ {gsub(/[" \t]/, "", $1); print $1}')
for t in $TABLES; do
  echo -n "$t: "
  spacetimedb-cli sql --server maincloud $SPACETIMEDB_DB_NAME "SELECT count(*) AS cnt FROM $t"
done
'''

[tasks.spacetime-all]
description = "Full yral-database-spacetime workflow: build → generate → test → run → publish → validate"
run = '''
mise run spacetime-build
mise run spacetime-generate
mise run spacetime-test
mise run spacetime-run
mise run spacetime-publish
mise run spacetime-validate
'''

# ── yral-auth ────────────────────────────────────────────────────────────────

[tasks.yral-auth-build]
description = "Build yral-auth (release, musl static binary + WASM client)"
dir = "apps/yral-auth"
run = "cargo leptos build --release --lib-features release-lib --bin-features release-bin"
env = { LEPTOS_BIN_TARGET_TRIPLE = "x86_64-unknown-linux-musl" }

[tasks.yral-auth-run]
description = "Run yral-auth locally via pitchfork (release binary, port 8080)"
depends = ["yral-auth-build"]
run = "pitchfork start yral-auth --force"

[tasks.yral-auth-test]
description = "Run yral-auth tests (starts local SpacetimeDB dev server if needed, injects JWT_EC_PEM via fnox)"
dir = "apps/yral-auth"
env = { SPACETIMEDB_URL = "http://127.0.0.1:3000" }
run = '''
pitchfork start spacetimedb-dev --force
fnox exec -- cargo test --features ssr --bins --lib -- --test-threads=1
'''

[tasks.yral-auth-image]
description = "Build the yral-auth container image locally (podman)"
run = "podman build -f apps/yral-auth/Dockerfile.buildkit -t test/yral-auth --platform linux/amd64 ."

[tasks.yral-auth-image-run]
description = "Run the yral-auth container image locally via pitchfork (podman, port 8080)"
depends = ["yral-auth-image"]
run = "pitchfork start yral-auth-container --force"

[tasks.yral-auth-stop]
description = "Stop yral-auth dev server or container via pitchfork"
run = "pitchfork stop yral-auth yral-auth-container"

[tasks.yral-auth-all]
description = "Full yral-auth workflow: build → test → image → image-run → validate → stop"
run = '''
mise run yral-auth-build
mise run yral-auth-run
mise run yral-auth-test
mise run yral-auth-image
mise run yral-auth-image-run
'''

[tasks.yral-auth-validate]
description = "Validate yral-auth on prod (read-only kubectl checks)"
run = '''
echo "=== Pods ==="
kubectl -n yral-auth get pods -l app=yral-auth -o wide
echo ""
echo "=== Health ==="
kubectl -n yral-auth get pods -l app=yral-auth -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.containerStatuses[0].ready}{"\n"}{end}'
echo ""
echo "=== Recent logs (last 20 lines, first pod) ==="
FIRST_POD=$(kubectl -n yral-auth get pods -l app=yral-auth -o jsonpath='{.items[0].metadata.name}')
kubectl -n yral-auth logs "$FIRST_POD" --tail=20
'''

