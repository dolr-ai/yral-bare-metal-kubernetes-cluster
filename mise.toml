echo "=== Pods ==="
kubectl -n yral-metadata get pods -l app=yral-metadata -o wide
echo ""
echo "=== Health ==="
kubectl -n yral-metadata get pods -l app=yral-metadata -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.containerStatuses[0].ready}{"\n"}{end}'
