./.venv/bin/ansible-vault view ansible/inventory/group_vars/all/vault.yml | \
  ./.venv/bin/python -c "import sys, yaml; print(yaml.safe_load(sys.stdin)[sys.argv[1]])" "$@"
'''

# ── yral-rishi-agent (agent.rishi.yral.com backend) ─────────────────────────
# The repo's CI pins ruff==0.15.14 (as of 2026-09-08); we bump to latest in
# mise (0.16.6) and have asked Rishi to bump his CI to match — parity comes
# from HIS bump, not from us pinning his old version. Until he does, his CI
# is the authority for PRs: if our newer ruff flags extra findings, those are
# his to fix (or his CI bump fixes parity); we do NOT sweep his repo with our
# newer lint (scope discipline — we only fix what we need, not the code he
# maintains). Same commands as his CI either way.

[tasks.yral-rishi-agent-lint]
description = "Run yral-rishi-agent's CI lint commands (ruff check + format --check at our latest ruff; his CI pin governs PRs)"
dir = "apps/yral-rishi-agent"
run = '''
ruff check app/ infra/
ruff format --check app/ infra/
'''

[tasks.yral-rishi-agent-lint-fix]
description = "Apply ruff's formatting/import fixes to yral-rishi-agent (run before committing; verify with yral-rishi-agent-lint)"
dir = "apps/yral-rishi-agent"
run = '''
ruff check --fix app/ infra/
ruff format app/ infra/
'''

# Test env mirrors the repo's CI test job: python -m venv + pip install of
# requirements.txt + requirements-test.txt + pytest — the SAME mechanism the
# root bootstrap uses for Ansible (NO uv anywhere in this repo; a stray
# uv.lock that uv commands once created at the root was removed — uv is
# not part of this repo's toolchain).
