# ── yral-ios ────────────────────────────────────────────────────────────────
# Native Swift/SwiftUI iOS app (single SPM package + thin Xcode shell).
# Apple-canonical tooling only: xcodebuild + xcrun altool. No CocoaPods, no
# fastlane, no Ruby gems.
# Prerequisites (not managed by mise — system-level):
#   - Xcode 26 (iOS 18 deployment target; simulator + device)
# First-time setup:  mise install && mise run yral-ios-setup
# Signing secrets (dist cert p12, provisioning profile, cert password, ASC
# p8) live in fnox.toml [secrets] — same source for local and CI (CI runs
# `mise run bootstrap` to extract the age key, then everything flows from
# fnox exactly like local).

[tasks.yral-ios-setup]
description = "Resolve SPM dependencies for the YralApp package"
dir = "apps/yral-ios/packages/YralApp"
run = "swift package resolve"

# The Firebase config plist is GITIGNORED (it contains the project's Google
# Cloud API key — flagged by secret scanning when committed). The yral-ios-build
# and yral-ios-upload-testflight tasks self-inject it inline from the fnox
# secret (YRAL_IOS_FIREBASE_PLIST_BASE64): their guard re-execs under
# `fnox exec` when secrets are absent, so plain `mise run <task>` works.
# Rotate the API key: rotate in GCP console → update the fnox secret
# (exact command documented on the secret's fnox.toml entry).
[tasks.yral-ios-sync-rishi-openapi]
description = "Fetch the LIVE OpenAPI spec from agent.rishi.yral.com (byte-verbatim) into the SPM target — the generator plugin consumes it at build time. Offline → keeps the committed snapshot (the spec is a build INPUT, never hand-edited; spec defects are fixed by PR to yral-rishi-agent)."
dir = "apps/yral-ios/packages/YralApp"
run = '''
curl -fsSL --max-time 30 https://agent.rishi.yral.com/openapi.json \
  -o Sources/YralApp/openapi.json \
  || echo 'WARN: live spec unreachable — building against the committed snapshot (offline mode)'
'''

[tasks.yral-ios-build]
description = "Build the iosApp target for the iOS Simulator (Debug, unsigned). Self-injects the Firebase plist from fnox (no fnox exec prefix needed)."
dir = "apps/yral-ios"
depends = ["yral-ios-sync-rishi-openapi"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Self-inject: re-exec under fnox exec when secrets are absent (plain
# `mise run yral-ios-build` just works; fnox is the secrets source — mise
# [env] is committed plaintext, so secrets never live there).
if [ -z "${YRAL_IOS_FIREBASE_PLIST_BASE64:-}" ]; then
  exec fnox exec -- mise run yral-ios-build
fi

# GoogleService-Info.plist is gitignored and materialized from the fnox
# secret. ATOMIC write: temp file → plutil lint → mv — a failed inject can
# never leave a corrupt (0-byte) plist behind for xcodebuild/Xcode to choke
# on ("unable to read input file as a property list").
PLIST_TMP=$(mktemp)
trap 'rm -f "$PLIST_TMP"' EXIT
printf '%s' "$YRAL_IOS_FIREBASE_PLIST_BASE64" | base64 -d > "$PLIST_TMP"
plutil -lint "$PLIST_TMP"
mv "$PLIST_TMP" iosApp/GoogleService-Info.plist

xcodebuild build \
  -project iosApp.xcodeproj \
  -scheme iosApp \
  -destination 'generic/platform=iOS Simulator' \
  -configuration Debug \
  CODE_SIGNING_ALLOWED=NO \
  -skipPackagePluginValidation
'''

[tasks.yral-ios-test]
description = "Run the YralApp SPM package unit tests (Swift Testing)"
dir = "apps/yral-ios/packages/YralApp"
depends = ["yral-ios-sync-rishi-openapi"]
run = "swift test"

[tasks.yral-ios-lint]
description = "Lint the YralApp SPM package with swift-format (Apple's first-party formatter and linter, shipped in the Xcode toolchain)."
dir = "apps/yral-ios"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# `swift format` (note the space) is the toolchain-provided entry point — Swift 6
# ships swift-format inside Xcode 16+, so there is nothing to install via mise.
# No .swift-format config: we use the toolchain defaults verbatim. That is what
# makes this consistent with format-on-save, which goes through SourceKit-LSP
# and therefore applies the SAME defaults (plus the editor's indentation).
#
# The codebase is 2-space indented to match swift-format's default. VS Code's
# `editor.detectIndentation` (default true) matches whatever a file already
# uses, so saves stay self-consistent in both editors.
#
# --strict makes warnings fail the gate. Only the two hand-written trees are
# passed: the generated OpenAPI sources live under .build/plugins/outputs/, so
# they are never traversed (their warnings are fixed upstream — see the Zero
# Warnings rule, not suppressed here).
swift format lint --strict --recursive \
  packages/YralApp/Sources packages/YralApp/Tests
'''

[tasks.yral-ios-checks]
description = "CI-equivalent check suite: lint + package tests + simulator build (same task local and CI run)"
depends = ["yral-ios-lint", "yral-ios-test", "yral-ios-build"]
run = "echo 'yral-ios checks: all green'"

[tasks.yral-ios-clean]
description = "Clean SPM and Xcode build outputs (incl. the fnox-injected Firebase plist)"
dir = "apps/yral-ios"
run = '''
swift package --package-path packages/YralApp clean
rm -rf packages/YralApp/.build build
rm -rf iosApp.xcodeproj/xcuserdata
rm -f iosApp/GoogleService-Info.plist
'''

# Upload task is wrapped with `fnox exec --` so the four signing secrets in
# fnox.toml are injected into the script's environment (same mechanism as
# yral-auth-test; see fnox.toml [secrets] for the key names). mise [env]
# provides the non-secret identifiers (ASC key/issuer, Apple team id).
[tasks.yral-ios-upload-testflight]
description = "Archive (Release, App Store signing) and upload to TestFlight via altool. Self-injects secrets from fnox (no fnox exec prefix needed)."
dir = "apps/yral-ios"
depends = ["yral-ios-checks"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Self-inject: re-exec under fnox exec when secrets are absent. Inside the
# re-exec: YRAL_IOS_DIST_CERT_P12_BASE64, YRAL_IOS_DIST_PROFILE_BASE64,
# YRAL_IOS_CERT_PASSWORD, APP_STORE_CONNECT_API_KEY_BASE64,
# YRAL_IOS_FIREBASE_PLIST_BASE64 (fnox.toml), YRAL_ASC_KEY_ID,
# YRAL_ASC_ISSUER_ID, YRAL_APPLE_TEAM_ID (mise [env]).
if [ -z "${YRAL_IOS_FIREBASE_PLIST_BASE64:-}" ]; then
  exec fnox exec -- mise run yral-ios-upload-testflight
fi

# The Firebase plist is a required bundle resource — materialize it
# ATOMICALLY (temp → plutil lint → mv): a failed inject must never leave
# a corrupt 0-byte plist for xcodebuild/Xcode to choke on.
PLIST_TMP=$(mktemp)
printf '%s' "$YRAL_IOS_FIREBASE_PLIST_BASE64" | base64 -d > "$PLIST_TMP"
plutil -lint "$PLIST_TMP"
mv "$PLIST_TMP" iosApp/GoogleService-Info.plist

WORKDIR="build/signing"
mkdir -p "$WORKDIR" ~/Library/MobileDevice/Provisioning\ Profiles

echo "${YRAL_IOS_DIST_CERT_P12_BASE64}" | base64 --decode > "$WORKDIR/Yral-Dist.p12"
echo "${YRAL_IOS_DIST_PROFILE_BASE64}" | base64 --decode > "$WORKDIR/Yral-Distribution.mobileprovision"
cp "$WORKDIR/Yral-Distribution.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

# Build keychain: isolated, auto-unlocked for this session, no partition-list
# prompts (CI-standard form). The p12 stored in fnox is already in the
# legacy PKCS12 format macOS `security import` requires — see the secret's
# entry in fnox.toml for how to recreate it correctly.
# Delete FIRST: the keychain persists across runs, and importing the p12
# into the STALE one fails with SecKeychainItemImport: "User canceled the
# operation" (partition-list denial) — the task must be idempotent.
security delete-keychain ~/Library/Keychains/yralios-build.keychain-db 2>/dev/null || true
security create-keychain -p "" yralios-build.keychain || true
security import "$WORKDIR/Yral-Dist.p12" -k ~/Library/Keychains/yralios-build.keychain -P "$YRAL_IOS_CERT_PASSWORD" -A
# Append the build keychain to the search list WITHOUT dropping the system
# ones — `-s` rewrites the whole list, so name the standard keychains
# explicitly (login + System). Dropping login breaks cert-chain trust
# (errSecInternalComponent: "unable to build chain to self-signed root").
security list-keychains -s ~/Library/Keychains/yralios-build.keychain ~/Library/Keychains/login.keychain-db /Library/Keychains/System.keychain
security set-keychain-settings -lut 21600s ~/Library/Keychains/yralios-build.keychain
security unlock-keychain -p "" ~/Library/Keychains/yralios-build.keychain
security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" yralios-build.keychain

rm -rf build/YralApp.xcarchive build/ipa
# No CODE_SIGN_* / PROVISIONING_PROFILE_* CLI overrides here: CLI overrides
# propagate to EVERY target in the graph and make SPM package targets fail
# with "does not support provisioning profiles". Manual signing lives on the
# iosApp target's Release configuration in project.pbxproj (see that file).
xcodebuild archive \
  -project iosApp.xcodeproj \
  -scheme iosApp \
  -destination 'generic/platform=iOS' \
  -archivePath build/YralApp.xcarchive \
  -configuration Release \
  -skipPackagePluginValidation \
  -quiet

cat > build/ExportOptions.plist <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>app-store</string>
  <key>teamID</key>
  <string>$YRAL_APPLE_TEAM_ID</string>
  <key>signingCertificate</key>
  <string>Apple Distribution</string>
  <key>provisioningProfiles</key>
  <dict>
    <key>com.yral.iosApp</key>
    <string>Yral-Distribution</string>
  </dict>
</dict>
</plist>
EOF

xcodebuild -exportArchive \
  -archivePath build/YralApp.xcarchive \
  -exportOptionsPlist build/ExportOptions.plist \
  -exportPath build/ipa

# altool resolves the ASC API key by file convention:
# ./private_keys/AuthKey_<KEY_ID>.p8 (also ~/.private_keys etc.)
mkdir -p private_keys
echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "private_keys/AuthKey_${YRAL_ASC_KEY_ID}.p8"

IPA_PATH=$(ls -t build/ipa/*.ipa | head -n 1)
echo "Uploading $IPA_PATH via altool"
xcrun altool --upload-app \
  --type ios \
  --file "$IPA_PATH" \
  --apiKey "$YRAL_ASC_KEY_ID" \
  --apiIssuer "$YRAL_ASC_ISSUER_ID"

# Upload dSYMs to Crashlytics from the archive (upload-symbols ships inside the
# SPM checkout of the firebase-ios-sdk, resolved during the archive).
UPLOAD_SYMBOLS_SCRIPT=$(ls -t "$HOME"/Library/Developer/Xcode/DerivedData/*/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols 2>/dev/null | head -n 1)
if [[ -n "$UPLOAD_SYMBOLS_SCRIPT" && -f "$UPLOAD_SYMBOLS_SCRIPT" && -d build/YralApp.xcarchive/dSYMs ]]; then
  "$UPLOAD_SYMBOLS_SCRIPT" -gsp iosApp/GoogleService-Info.plist -p ios build/YralApp.xcarchive/dSYMs
else
  echo '  ⚠ Crashlytics upload-symbols script or dSYMs not found — skipping dSYM upload' >&2
fi
'''
# The task self-injects (guard re-execs via fnox exec) — plain
# `mise run yral-ios-upload-testflight` works from any shell.

