[settings]
# Required by the `[daemons]` section below (and `mise daemons`).
experimental = true

[tools]
age = "latest"
# binaryen (wasm-opt) PINNED to 131 — do NOT let `mise upgrade --bump` float
# this ("latest" resolves to 132, which is broken; see below). SpacetimeDB
# bundles no wasm-opt, so `spacetime build` optimises with whatever `wasm-opt`
# is on PATH — i.e. this version. 132's output breaks the SpacetimeDB 2.10
# wasm parser: `spacetime build` still SUCCEEDS (it only optimises), but the
# publish pre-publish check rejects the module with "failed to parse
# WebAssembly module: invalid leading byte (0x7e) for external kind", while
# the un-optimized wasm parses fine (isolated via --bin-path). Re-verified
# failing against 2.10.0 — `mise run spacetime-run` reproduces it locally via
# the local server's pre-publish check, so no Maincloud access is needed.
# Bump only together with a verified `spacetime build` + publish cycle.
"aqua:WebAssembly/binaryen" = "131"
# aws-cli — the S3 client for Hetzner Object Storage. Chosen because the
# credentials in [env] are ALREADY in AWS's standard variable names
# (AWS_ACCESS_KEY_ID / AWS_ENDPOINT_URL / AWS_DEFAULT_REGION, with
# AWS_SECRET_ACCESS_KEY in fnox), so aws-cli authenticates against Hetzner
# with no extra config: `aws s3 ls` just works. Hetzner's Object Storage is
# S3-compatible, so any S3 client would do — this one needs no new variables
# and no config file.
#
# NOTE the endpoint in [env] is a SINGLE location (fsn1). Buckets live in the
# location they were created in, and this account has buckets in more than one
# (fsn1 / hel1 ...), so a listing against AWS_ENDPOINT_URL shows only that
# location's buckets. To reach another location use `--endpoint-url
# https://<loc>.your-objectstorage.com` with the same credentials. The etcd
# backup role does exactly this with hel1 (see ansible/inventory/hosts.yml),
# which is why its endpoint differs from AWS_ENDPOINT_URL.
# Read-only by default — do not mutate buckets from a shell (repo rule: the
# declarative source is Ansible/git; see AGENTS.md "Immutable GitOps"). The one
# carve-out is `mise run s3-abort-multipart-uploads`, which clears orphaned
# multipart uploads on a decommissioned bucket: those are not declared state
# (invisible to every listing, owned by no operator, present in no git source)
# and they leak billable storage and block the bucket's deletion.
aws-cli = "latest"
cargo-binstall = "latest"
"cargo:trunk" = "latest"
cocoapods = { version = "latest", os = ["macos"] }
flux2 = "2.9.5"
fnox = "latest"
gh = "latest"
helm = "latest"
# SpacetimeDB CLI. The release tarball names its binary `spacetimedb-cli`,
# but the canonical, documented invocation is `spacetime` (see
# https://spacetimedb.com/docs/cli-reference and the official installer) —
# `rename_exe` exposes the pinned version under the canonical name so PATH
# resolution never falls through to a stale installer-managed binary.
# `spacetimedb-standalone` stays untouched: `spacetime start` execs it.
"github:clockworklabs/SpacetimeDB" = { version = "latest", rename_exe = { "spacetimedb-cli" = "spacetime" } }
kubectl = "latest"
maestro = { version = "latest", os = ["macos"] }
node = "latest"
pitchfork = "latest"
podman = "latest"
python = "latest"
# rclone — third S3 client, for the operations neither of the others covers:
# `purge` (remove a prefix AND the bucket in one step), `backend
# list-multipart-uploads` / `backend cleanup` (orphaned upload parts, which are
# invisible to `ls` but still billed), and `backend cleanup-hidden` (old object
# versions on a versioned bucket). aws-cli covers bucket-level admin and s5cmd
# covers bulk object ops; rclone's value here is the backend-command surface
# plus its native `Hetzner` provider profile.
#
# For Hetzner use `--s3-provider Hetzner` — rclone's docs list Hetzner as a
# first-class provider (regions hel1/fsn1/nbg1), so no `Other` fallback is
# needed. Credentials come from the same AWS_* variables in [env] + fnox, and
# `--s3-endpoint` replaces `--endpoint-url`.
#
# Two knobs worth knowing when a bucket misbehaves (both are documented rclone
# flags, and both change the server-side code path — useful when one listing or
# delete implementation is at fault rather than the data):
#   --s3-list-version 1        use ListObjects v1 instead of v2 (rclone defaults
#                              to auto-detecting; v1 is a different code path)
#   --s3-list-url-encode       toggle URL-encoded listings, which is more
#                              reliable for awkward object keys
rclone = "latest"
ruff = "latest"
# rush — cross-platform parallel job runner (Go, single native binary). Added
# because parallelising shell work on macOS has no good built-in: BSD `xargs`
# has NO -d flag (so tab-separated input can't be split safely) and GNU
# `parallel` isn't in the mise registry at all. rush supports -d for an
# explicit field delimiter and -j for worker count, which is what makes it
# safe for TSV input instead of relying on whitespace splitting.
#
# Usage pattern for N-field TSV records ({1}/{2} are the fields per record):
#   rush -j 64 -d '\t' 'cmd {1} {2}' < records.tsv
# (see the mise.toml note on the three S3 clients above for why these
# bulk-S3 maintenance jobs exist at all)
rush = "latest"
# Rust — latest STABLE via mise.lock resolution (committed lock pins the
# exact resolved version per `mise lock`, so builds stay reproducible while
# `mise run setup` on a fresh checkout pulls the newest stable).
#
# Stable is correct repo-wide: no #![feature] gates anywhere (SpacetimeDB's
# `unstable` is a crate feature, stable-fine), and nightly-2026-09-08's wasm
# codegen drifted into breaking `spacetime generate`.
#
# CAVEAT — mise manages rust by installing its own toolchain and exporting
# `RUSTUP_TOOLCHAIN=stable`, which TAKES PRECEDENCE over any
# rust-toolchain.toml. That silently bypasses apps/yral-web/rust-toolchain.toml
# (channel = "nightly"):
#   local build with mise active → stable
#   container build (no mise)    → nightly
# so the prod image compiles with a different compiler than local builds.
# nightly is genuinely needed there for `cargo leptos watch --hot-reload`
# (see that file for the verified reasoning — the leptos `nightly`
# cargo-features are inert on stable and are NOT the reason).
# TODO(unify-yral-web-toolchain): make local and container agree — either
# pin the container to stable and drop --hot-reload, or have the yral-web
# tasks set RUSTUP_TOOLCHAIN=nightly explicitly.
rust = { version = "stable", targets = [
  "wasm32-unknown-unknown",
  "x86_64-unknown-linux-musl",
], components = [
  "rustfmt",
  "clippy",
  "rust-src",
  "rust-analyzer",
] }
# s5cmd — bulk object operations against Hetzner Object Storage. Kept ALONGSIDE
# aws-cli because they cover different halves of the API and neither does both:
#   aws-cli → bucket-level admin (ls, versioning, policies) and one-off reads.
#   s5cmd   → many-object operations (delete/copy/sync over 10^4–10^6 keys).
# `aws s3 rm --recursive` issues ONE DELETE per object, so emptying a bucket
# with ~190K objects is ~190K sequential round trips. s5cmd batches through the
# S3 DeleteObjects API (1000 keys per request) and runs a large worker pool, so
# the same bucket empties in a fraction of the time. Use it for bucket cleanup
# and any bulk transfer; use aws-cli for anything bucket-scoped.
#
# Same credentials as aws-cli — it reads the standard AWS_* variables from
# [env] + fnox, and takes the location endpoint via --endpoint-url exactly like
# aws-cli (see the aws-cli note above for why the location matters).
s5cmd = "latest"
sops = "latest"
sqlite = "latest"
# NOTE: `swift` is intentionally NOT declared here. On macOS Xcode ships a
# complete, SDK-matched toolchain (`xcrun --find swift`), and a mise-installed
# swift.org toolchain SHADOWS it with an older release — Xcode 27's SDK passes
# `-target-arch-variant`, which swift 6.3.3's driver does not understand, so
# manifest compilation died with signal 11 across every SwiftPM command. We no
# longer build Swift on Linux, so there is nothing for mise to provide.
# If a Linux Swift toolchain is ever needed again, declare it OS-scoped:
#   swift = { version = "...", os = ["linux"] }

# System packages — project-specific build dependencies (apt on Debian/Ubuntu).
# Applied with: mise bootstrap packages apply --yes
# OS-filtered — apt entries are ignored on macOS, brew entries on Linux, etc.
# Machine-baseline packages (build-essential, curl, git, etc.) live in ~/.dotfiles/mise.linux.toml.
[bootstrap.packages]
"apt:bind9-dnsutils" = "latest"
"apt:libssl-dev" = "latest"
"apt:musl-tools" = "latest"
"apt:pkg-config" = "latest"

[env]
_.path = ".venv/bin"
APP_ENV = "development"
LEPTOS_ENV = "development"
# fnox age decryption — private key extracted by mise run bootstrap
# Uses {{config_root}} so the path resolves to the repo root regardless of cwd
FNOX_AGE_KEY_FILE = "{{config_root}}/.yral-infra-ed25519"
# Cargo + cargo-binstall cache dirs — shared across all projects via $HOME.
# Without these, mise's rust/rustup backend sets CARGO_HOME/RUSTUP_HOME to a
# literal `./undefined/` at the cwd (repo root), duplicating caches per project.
CARGO_HOME = "{{env.HOME}}/.cargo"
RUSTUP_HOME = "{{env.HOME}}/.rustup"
CARGO_BINSTALL_DIR = "{{env.HOME}}/.local/share/cargo-binstall"
# Plaintext (non-sensitive) values — declared directly, no .env file needed.
AWS_ACCESS_KEY_ID = "XO5X9A1W8AMHY3DSTKMS"
AWS_ENDPOINT_URL = "https://fsn1.your-objectstorage.com"
AWS_DEFAULT_REGION = "fsn1"
KUBECONFIG = "{{env.HOME}}/.kube/config"
# SpacetimeDB Maincloud (SaaS) — DB identity/name for the yral-database-spacetime
# module. The Maincloud base URL is fixed; the DB name matches `spacetime.json`.
# Plaintext only (no secrets here); the admin token (if needed for write
# reducers from a cluster service) lives in fnox. See AGENTS.md
# "External Service Config & Secrets".
SPACETIMEDB_MAINCLOUD_URL = "https://maincloud.spacetimedb.com"
SPACETIMEDB_DB_NAME = "yral-database-spacetime-4lbo7"

# ── yral-auth ─────────────────────────────────────────────────────────────
# SpacetimeDB config (KV store + identity token for REST calls).
# The admin token is the yral-auth JWT — SpacetimeDB derives an admin Identity
# from the iss + sub claims. Stored in fnox.toml as SPACETIMEDB_ADMIN_TOKEN.
# SPACETIMEDB_URL is the name yral-auth's SpacetimeKV expects (same value as
# SPACETIMEDB_MAINCLOUD_URL).
SPACETIMEDB_URL = "https://maincloud.spacetimedb.com"
# Plaintext (non-sensitive) values — public OAuth identifiers and public keys.
GOOGLE_CLIENT_ID = "804814798298-taifmq3k6olk9bjr1cqb9gfnp1mssqqb.apps.googleusercontent.com"
APPLE_CLIENT_ID = "com.yral.yral-auth"
APPLE_TEAM_ID = "2UL556KNXC"
APPLE_KEY_ID = "9DWVYWDYD8"
# Public keys (used for verification by other services — not secrets)
JWT_PUB_EC_PEM = '''
-----BEGIN PUBLIC KEY-----
MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEoqN3/0RNfrnrnYGxKBgy/qHnmITr
+6ucjxStx7tjA30QJZlWzo0atxmY8y9dUR+eKQI0SnbQds4xLEU8+JGm8Q==
-----END PUBLIC KEY-----'''
CLIENT_JWT_PUB_ED_PEM = '''
-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEAKpZNfPOONR9AXiaGmHv8AHemm4SNK0uh+mf523ho5KU=
-----END PUBLIC KEY-----'''

# ── off-chain-agent ──────────────────────────────────────────────────────
RUST_LOG = "info"
OFF_CHAIN_AGENT_URL = "http://localhost:50051/"

# ── yral-web ───────────────────────────────────────────────────────────
# LEPTOS_SITE_ADDR is set per-daemon in pitchfork.toml (prod: 8080, dev: 8081)
LEPTOS_HASH_FILES = "true"
# Plaintext (non-sensitive) values — public OAuth identifiers
# These are the production redirect URLs; dev daemons override them in pitchfork.toml
GOOGLE_REDIRECT_URL = "http://127.0.0.1:8080/auth/google_redirect"
YRAL_AUTH_REDIRECT_URL = "http://127.0.0.1:8080/auth/yral_redirect"
# Yral-auth client ID (same as yral-auth's GOOGLE_CLIENT_ID)
YRAL_AUTH_CLIENT_ID = "804814798298-taifmq3k6olk9bjr1cqb9gfnp1mssqqb.apps.googleusercontent.com"

# ── yral-metadata ─────────────────────────────────────────────────────────
# Bind address for the Axum server
BIND_ADDRESS = "0.0.0.0:7000"

# ── yral-ios (App Store Connect identifiers — not secret) ─────────────────
# yral-ios TestFlight/App Store upload path: xcodebuild archive →
# xcodebuild -exportArchive → xcrun altool. Secrets for this chain live in
# fnox.toml [secrets]; only these non-secret identifiers live here.
# Key GT9767YMH6: created 2026-09-01 (old key J52D7789G2 revoked
YRAL_ASC_KEY_ID = "GT9767YMH6"
YRAL_ASC_ISSUER_ID = "6ddd2cf0-9212-47e6-9f69-69cb16412c45"
# Apple Developer team (same as the legacy app's manual signing).
YRAL_APPLE_TEAM_ID = "2UL556KNXC"
# Bundle id is fixed: com.yral.iosApp (TestFlight and App Store are channels
