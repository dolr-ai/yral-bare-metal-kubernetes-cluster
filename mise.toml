# SKIP gracefully without them — CI runs them with a real Postgres.
[tasks.yral-rishi-agent-test-bootstrap]
description = "Create the yral-rishi-agent test venv (.venv, gitignored) with CI's dependency set"
dir = "apps/yral-rishi-agent"
run = '''
python -m venv .venv
./.venv/bin/pip install --upgrade pip
./.venv/bin/pip install -r requirements.txt -r requirements-test.txt pytest
'''

[tasks.yral-rishi-agent-test]
description = "Run yral-rishi-agent's test suite (venv from yral-rishi-agent-test-bootstrap; integration tests skip without Docker)"
dir = "apps/yral-rishi-agent"
