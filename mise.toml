# Monorepo-wide mise configuration.
# Run from the repository root; this drives the local toolchain for the whole workspace.

[tools]
node = "latest"
python = "latest"
podman = "latest"
kubectl = "latest"
helm = "latest"
flux2 = "latest"
sops = "latest"
age = "latest"
rust = "stable"
cargo-binstall = "latest"
gh = "latest"

[env]
_.file = '.env'
_.path = '.venv/bin'
APP_ENV = 'development'
LEPTOS_ENV = 'development'

[tasks.bootstrap]
description = "Create a repo-local .venv and install Python automation tooling"
run = "python -m venv .venv && ./.venv/bin/pip install --upgrade pip && ./.venv/bin/pip install ansible-core ansible-lint yamllint vastai && ./.venv/bin/ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections"

[tasks.yral-auth-bootstrap]
description = "Install yral-auth build prerequisites"
depends = ["bootstrap"]
run = "cargo binstall cargo-leptos --no-confirm"
