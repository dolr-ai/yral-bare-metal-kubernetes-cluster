# ── yral-ios ────────────────────────────────────────────────────────────────
# Native Swift/SwiftUI iOS app (single SPM package + thin Xcode shell).
# Apple-canonical tooling only: xcodebuild + xcrun altool. No CocoaPods, no
# fastlane, no Ruby gems. The legacy KMP app (apps/yral-mobile) is frozen —
# it keeps building via its own CI in the submodule repo.
# Prerequisites (not managed by mise — system-level):
#   - Xcode 26 (iOS 18 deployment target; simulator + device)
# First-time setup:  mise install && mise run yral-ios-setup
# Signing secrets (dist cert p12, provisioning profile, cert password, ASC
# p8) live in fnox.toml [secrets] — same source for local and CI (CI runs
# `mise run bootstrap` to extract the age key, then everything flows from
# fnox exactly like local).

[tasks.yral-ios-setup]
description = "Resolve SPM dependencies for the YralApp package"
dir = "apps/yral-ios/packages/YralApp"
run = "swift package resolve"

# The Firebase config plist is GITIGNORED (it contains the project's Google
# Cloud API key — flagged by secret scanning when committed). The yral-ios-build
# and yral-ios-upload-testflight tasks inject it inline from the fnox secret
# (YRAL_IOS_FIREBASE_PLIST_BASE64) when run under `fnox exec --`.
# Rotate the API key: rotate in GCP console → update the fnox secret
# (exact command documented on the secret's fnox.toml entry).
[tasks.yral-ios-build]
description = "Build the iosApp target for the iOS Simulator (Debug, unsigned). Requires the Firebase plist (fnox exec -- mise run yral-ios-build)"
dir = "apps/yral-ios"
run = '''
# GoogleService-Info.plist is gitignored and injected from fnox — it must
# exist for the build (it's a bundle resource). Under `fnox exec --` the
# secret materializes it; otherwise fall back to any plist left from a
# previous inject, else fail with instructions.
if [ -n "${YRAL_IOS_FIREBASE_PLIST_BASE64:-}" ]; then
  printf '%s' "$YRAL_IOS_FIREBASE_PLIST_BASE64" | base64 -d > iosApp/GoogleService-Info.plist
elif [ ! -f iosApp/GoogleService-Info.plist ]; then
  echo 'ERROR: iosApp/GoogleService-Info.plist missing — run via: fnox exec -- mise run yral-ios-build' >&2
  exit 1
fi

xcodebuild build \
  -project iosApp.xcodeproj \
  -scheme iosApp \
  -destination 'generic/platform=iOS Simulator' \
  -configuration Debug \
  CODE_SIGNING_ALLOWED=NO \
  -quiet
'''

[tasks.yral-ios-test]
description = "Run the YralApp SPM package unit tests (Swift Testing)"
dir = "apps/yral-ios/packages/YralApp"
run = "swift test"

[tasks.yral-ios-lint]
description = "Lint apps/yral-ios with SwiftLint (strict)"
dir = "apps/yral-ios"
run = "swiftlint lint --strict"

[tasks.yral-ios-checks]
description = "CI-equivalent check suite: lint + package tests + simulator build (same task local and CI run)"
depends = ["yral-ios-lint", "yral-ios-test", "yral-ios-build"]
run = "echo 'yral-ios checks: all green'"

[tasks.yral-ios-clean]
description = "Clean SPM and Xcode build outputs (incl. the fnox-injected Firebase plist)"
dir = "apps/yral-ios"
run = '''
swift package --package-path packages/YralApp clean
rm -rf packages/YralApp/.build build
rm -rf iosApp.xcodeproj/xcuserdata
rm -f iosApp/GoogleService-Info.plist
'''

# Upload task is wrapped with `fnox exec --` so the four signing secrets in
# fnox.toml are injected into the script's environment (same mechanism as
# yral-auth-test; see fnox.toml [secrets] for the key names). mise [env]
# provides the non-secret identifiers (ASC key/issuer, Apple team id).
[tasks.yral-ios-upload-testflight]
description = "Archive (Release, App Store signing) and upload to TestFlight via altool (secrets via fnox)"
dir = "apps/yral-ios"
depends = ["yral-ios-checks"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Inside fnox exec: YRAL_IOS_DIST_CERT_P12_BASE64, YRAL_IOS_DIST_PROFILE_BASE64,
# YRAL_IOS_CERT_PASSWORD, APP_STORE_CONNECT_API_KEY_BASE64 (fnox.toml),
# YRAL_IOS_FIREBASE_PLIST_BASE64 (fnox.toml — gitignored GoogleService-Info.plist),
# YRAL_ASC_KEY_ID, YRAL_ASC_ISSUER_ID, YRAL_APPLE_TEAM_ID (mise [env]).

# The Firebase plist is a required bundle resource — materialize it from
# fnox before archiving.
printf '%s' "$YRAL_IOS_FIREBASE_PLIST_BASE64" | base64 -d > iosApp/GoogleService-Info.plist
plutil -lint iosApp/GoogleService-Info.plist

WORKDIR="build/signing"
mkdir -p "$WORKDIR" ~/Library/MobileDevice/Provisioning\ Profiles

echo "${YRAL_IOS_DIST_CERT_P12_BASE64}" | base64 --decode > "$WORKDIR/Yral-Dist.p12"
echo "${YRAL_IOS_DIST_PROFILE_BASE64}" | base64 --decode > "$WORKDIR/Yral-Distribution.mobileprovision"
cp "$WORKDIR/Yral-Distribution.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

# Build keychain: isolated, auto-unlocked for this session, no partition-list
# prompts (CI-standard form). The p12 stored in fnox is already in the
# legacy PKCS12 format macOS `security import` requires — see the secret's
# entry in fnox.toml for how to recreate it correctly.
security create-keychain -p "" yralios-build.keychain || true
security import "$WORKDIR/Yral-Dist.p12" -k ~/Library/Keychains/yralios-build.keychain -P "$YRAL_IOS_CERT_PASSWORD" -A
# Append the build keychain to the search list WITHOUT dropping the system
# ones — `-s` rewrites the whole list, so name the standard keychains
# explicitly (login + System). Dropping login breaks cert-chain trust
# (errSecInternalComponent: "unable to build chain to self-signed root").
security list-keychains -s ~/Library/Keychains/yralios-build.keychain ~/Library/Keychains/login.keychain-db /Library/Keychains/System.keychain
security set-keychain-settings -lut 21600s ~/Library/Keychains/yralios-build.keychain
security unlock-keychain -p "" ~/Library/Keychains/yralios-build.keychain
security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" yralios-build.keychain

rm -rf build/YralApp.xcarchive build/ipa
# No CODE_SIGN_* / PROVISIONING_PROFILE_* CLI overrides here: CLI overrides
# propagate to EVERY target in the graph and make SPM package targets fail
# with "does not support provisioning profiles". Manual signing lives on the
# iosApp target's Release configuration in project.pbxproj (see that file).
xcodebuild archive \
  -project iosApp.xcodeproj \
  -scheme iosApp \
  -destination 'generic/platform=iOS' \
  -archivePath build/YralApp.xcarchive \
  -configuration Release \
  -quiet

cat > build/ExportOptions.plist <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>app-store</string>
  <key>teamID</key>
  <string>$YRAL_APPLE_TEAM_ID</string>
  <key>signingCertificate</key>
  <string>Apple Distribution</string>
  <key>provisioningProfiles</key>
  <dict>
    <key>com.yral.iosApp</key>
    <string>Yral-Distribution</string>
  </dict>
</dict>
</plist>
EOF

xcodebuild -exportArchive \
  -archivePath build/YralApp.xcarchive \
  -exportOptionsPlist build/ExportOptions.plist \
  -exportPath build/ipa

# altool resolves the ASC API key by file convention:
# ./private_keys/AuthKey_<KEY_ID>.p8 (also ~/.private_keys etc.)
mkdir -p private_keys
echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "private_keys/AuthKey_${YRAL_ASC_KEY_ID}.p8"

IPA_PATH=$(ls -t build/ipa/*.ipa | head -n 1)
echo "Uploading $IPA_PATH via altool"
xcrun altool --upload-app \
  --type ios \
  --file "$IPA_PATH" \
  --apiKey "$YRAL_ASC_KEY_ID" \
  --apiIssuer "$YRAL_ASC_ISSUER_ID"

# Upload dSYMs to Crashlytics from the archive (upload-symbols ships inside the
# SPM checkout of the firebase-ios-sdk, resolved during the archive).
UPLOAD_SYMBOLS_SCRIPT=$(ls -t "$HOME"/Library/Developer/Xcode/DerivedData/*/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols 2>/dev/null | head -n 1)
if [[ -n "$UPLOAD_SYMBOLS_SCRIPT" && -f "$UPLOAD_SYMBOLS_SCRIPT" && -d build/YralApp.xcarchive/dSYMs ]]; then
  "$UPLOAD_SYMBOLS_SCRIPT" -gsp iosApp/GoogleService-Info.plist -p ios build/YralApp.xcarchive/dSYMs
else
  echo '  ⚠ Crashlytics upload-symbols script or dSYMs not found — skipping dSYM upload' >&2
fi
'''
# NOTE: to inject fnox secrets, run via: fnox exec -- mise run yral-ios-upload-testflight
# (fnox exec wraps any command; mise runs the script with its [env] applied).

