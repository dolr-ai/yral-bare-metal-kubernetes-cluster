# ── yral-mobile ───────────────────────────────────────────────────────────
# Kafka bridge URL + bearer token for e2e test assertions (checks module).
# The e2e tests use the Kafka Bridge HTTP REST API (not native Kafka) to
# consume Snowplow events from the snowplow-raw topic. The bearer token
# authenticates against the nginx proxy in front of the Kafka Bridge.
# Token is injected via fnox (KAFKA_BRIDGE_TOKEN secret).
KAFKA_BRIDGE_URL = "https://kafka-bridge.yral.com"
# Gradle — use the project wrapper (./gradlew) for all builds.
# These improve build performance and reliability.
