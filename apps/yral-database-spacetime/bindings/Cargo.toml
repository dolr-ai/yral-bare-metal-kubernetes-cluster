[package]
name = "yral-database-spacetime-bindings"
version = "0.1.0"
edition = "2024"

# Generated SpacetimeDB SDK client bindings for the yral-database-spacetime module.
# This crate is consumed by backend Rust services (off-chain-agent, yral-web)
# that need to call SpacetimeDB reducers and procedures via the SDK.
#
# The `src/` directory is entirely generated by `mise run spacetime-generate`
# (runs `spacetimedb-cli generate`, which reads `spacetime.json` for the output
# directory and language). Never hand-edit files in `src/` — regenerate instead.
[lib]
name = "yral_database_spacetime_bindings"

[dependencies]
spacetimedb-sdk = { workspace = true }