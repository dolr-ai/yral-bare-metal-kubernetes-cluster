[package]
name = "yral_database_spacetime"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# `crate-type = ["cdylib"]` is required — `spacetimedb-cli build` needs a
# standalone wasm artifact, not the default `rlib`. Without it, `wasm-opt`
# fails to find the right artifact for optimization.
# `rlib` is also exported so that other workspace crates (off-chain-agent,
# yral-legacy) can depend on the generated SDK bindings at `src/bindings/`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log = { workspace = true }
# `features = ["unstable"]` enables `#[spacetimedb::procedure]` and
# `#[spacetimedb::http::handler]` (unstable-gated in spacetimedb 2.6.1).
# Required by the `posts` feature (procedures + HTTP handler).
spacetimedb = { workspace = true, features = ["unstable"] }

[dev-dependencies]
anyhow = { workspace = true }
candid = { workspace = true }
canisters-client = { workspace = true, features = ["user-post-service"] }
ic-agent = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde_json = { workspace = true }
spacetimedb-sdk = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
