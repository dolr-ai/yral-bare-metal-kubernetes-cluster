[package]
name = "yral_database_spacetime"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
log = { workspace = true }
# `unstable` enables `#[spacetimedb::procedure]` (the read path for the mobile
# app via REST `POST /v1/database/{db}/call/:name`). Procedures are
# unstable-gated in spacetimedb 2.6.1; the ungate PR #5164 postdates the 2.6
# line. The Maincloud 2.6.1 host already routes `CallProcedure` correctly.
spacetimedb = { workspace = true, features = ["unstable"] }
