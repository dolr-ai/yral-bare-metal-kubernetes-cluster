[workspace]
members = ["client", "server", "types"]
resolver = "2"

[workspace.dependencies]
candid = "0.10.32"
chrono = "0.4"
ic-agent = { version = "0.49.0", default-features = false, features = ["pem"]}
log = "0.4.21"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "http2",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.115"
thiserror = "1.0.58"
yral-identity = { path = "../yral-common/identity", default-features = false }
