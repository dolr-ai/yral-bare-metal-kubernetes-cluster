[package]
name = "yral-metadata-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9", features = ["json", "macros"] }
base64 = "0.22"
bb8 = "0.9.1"
bb8-redis = "0.26.0"
candid.workspace = true
chrono.workspace = true
config = { version = "0.14.0", features = ["toml"] }
elsa = "1.11.2"
email_address = "0.2.9"
env_logger = "0.11.3"
futures = "0.3.30"
ic-agent.workspace = true
jsonwebtoken = { version = "9.3.0", features = ["use_pem"] }
log.workspace = true
once_cell = "1.19.0"
redis = {
  version = "1.0.2",
  features = [
    "acl",
    "ahash",
    "aio",
    "cluster",
    "cluster-async",
    "connection-manager",
    "sentinel",
    "tokio-rustls-comp",
  ]
}
regex = "1.11.1"
reqwest = {
  workspace = true,
  default-features = false,
  features = [
    "http2",
    "json",
    "rustls-tls",
  ]
}
rustls = { version = "0.23.26" }
serde.workspace = true
serde_json.workspace = true
serde_with = "3.7.0"
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1.36.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
types = { package = "yral-metadata-types", path = "../types" }
utoipa = { version = "5.3.1" }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "reqwest"] }
yral-canisters-client = {
  path = "../../yral-common/canisters-client",
  features = [
    "user-info-service",
    "user-post-service",
  ]
}
yral-identity = {
  workspace = true,
  default-features = false,
  features = [
    "verify",
  ]
}
yral-types = { path = "../../yral-common/types" }

[dev-dependencies]
k256 = "0.13"
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
dragonfly-integration-tests = []
