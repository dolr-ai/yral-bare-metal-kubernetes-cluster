# Per-app mise config for yral-metadata.
# Inherits tools from the root monorepo mise.toml — only app-specific env goes here.
# Secrets are in fnox.toml (age-encrypted, committed to git).
# Shared Dragonfly secrets are in the root fnox.toml (hierarchical config).

[env]
APP_ENV = 'development'
RUST_LOG = 'info'
# Bind address for the Axum server
BIND_ADDRESS = '0.0.0.0:7000'