#:schema https://fnox.jdx.dev/schema.json

# yral-auth secrets — age-encrypted ciphertext, safe to commit.
# Inherits the age provider from the root fnox.toml (hierarchical config).
#
# Setup:
#   1. mise run bootstrap (from repo root) — extracts infra SSH key
#   2. fnox set <KEY> --provider age  — encrypt each secret into this file
#   3. Verify: fnox get COOKIE_KEY

[secrets]
COOKIE_KEY= { provider = "age", value = "", description = "Cookie signing/encryption key", if_missing = "error" }
GOOGLE_CLIENT_SECRET= { provider = "age", value = "", description = "Google OAuth client secret", if_missing = "error" }
APPLE_AUTH_KEY_PEM= { provider = "age", value = "", description = "Apple OAuth private key PEM", if_missing = "error" }
JWT_EC_PEM= { provider = "age", value = "", description = "JWT ES256 private key PEM for signing auth tokens", if_missing = "error" }
CLIENT_JWT_ED_PEM= { provider = "age", value = "", description = "JWT Ed25519 private key PEM for signing client secrets", if_missing = "error" }
WHATSAPP_API_KEY= { provider = "age", value = "", description = "WhatsApp API key (optional — phone auth)", if_missing = "warn" }
