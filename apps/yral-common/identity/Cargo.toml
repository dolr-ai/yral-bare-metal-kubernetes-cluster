[package]
name = "yral-identity"
version = "0.1.0"
edition = "2024"

[dependencies]
ic-agent = { workspace = true, default-features = false, optional = true }
candid.workspace = true
web-time.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
getrandom = { version = "0.2.15", optional = true }

# Signature verification (vendored — replaces ic-validator-ingress-message from dfinity/ic.git)
k256 = { version = "0.13.3", default-features = false, features = ["ecdsa", "pkcs8"], optional = true }

[dev-dependencies]
k256 = { version = "0.13.3", features = ["ecdsa"] }
rand = "0.8.5"

[features]
default = ["ic-agent", "verify"]
ic-agent = ["dep:ic-agent"]
verify = ["dep:k256", "ic-agent"]
wasm-bindgen = ["ic-agent/wasm-bindgen", "getrandom/js"]