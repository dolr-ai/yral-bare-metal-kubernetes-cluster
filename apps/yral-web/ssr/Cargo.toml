[package]
name = "yral-web"
version = "0.1.0"
edition = "2021"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "yral-web"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# [Optional] The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS. The CSS is optimized by Lightning CSS before being written to <site-root>/<site-pkg>/app.css
# style-file = "style/main.scss"

# The tailwind input file.
tailwind-input-file = "style/input.css"

# The tailwind config file.
tailwind-config-file = "tailwind.config.js"

# Enables additional file hashes on outputted css, js, and wasm files
#
# Optional: Defaults to false. Can also be set with the LEPTOS_HASH_FILES=false env var
hash-files = true

# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "public"

# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

# The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# Set by cargo-leptos watch when building with that tool. Controls whether autoreload JS will be included in the head
watch = false

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The profile to use for the bin target when compiling for release
#
# Optional. Defaults to "release".
bin-profile-release = "prod-release"

# The profile to use for the bin target when compiling for debug
#
# Optional. Defaults to "debug".
# bin-profile-dev = "bin-debug"

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"

# Uncomment in local to disable erasing components
disable-erase-components = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "yral-web"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["macros"], optional = true }
axum-extra = {
  workspace = true,
  features = [
    "cookie",
    "cookie-private",
    "cookie-signed",
    "typed-header",
  ],
  optional = true
}
bb8 = { workspace = true, optional = true }
bb8-redis = { workspace = true, optional = true }
candid.workspace = true
canisters-client = { workspace = true, features = ["full"] }
codee = { workspace = true, features = ["json_serde"] }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
dotenv = { workspace = true, optional = true }
enum_dispatch = { workspace = true, optional = true }
futures = { workspace = true }
gloo = { workspace = true, features = ["futures", "net"] }
gob-cloudflare = { workspace = true, optional = true }
hex = { workspace = true }
http = { workspace = true }
ic-agent = { workspace = true, features = ["pem"] }
icondata = { workspace = true }
icondata_core = { workspace = true }
indexmap.workspace = true
js-sys = { workspace = true }
jsonwebtoken = { workspace = true, optional = true }
k256 = { workspace = true, features = ["jwk", "std"] }
leptos = { workspace = true, features = ["nightly"] }
leptos_axum = { workspace = true, optional = true }
leptos_icons = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true, features = ["nightly"] }
leptos-use = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
openidconnect = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
redis = {
  workspace = true,
  features = [
    "acl",
    "ahash",
    "aio",
    "cluster",
    "cluster-async",
    "connection-manager",
    "sentinel",
    "tokio-rustls-comp",
  ],
  optional = true
}
regex = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["http2", "json", "multipart"] }
send_wrapper = { workspace = true, features = ["futures"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
simple_logger = { workspace = true }
speedate = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = {
  workspace = true,
  features = ["rt-multi-thread", "signal", "time"],
  optional = true
}
tower = { workspace = true, features = ["full"], optional = true }
tower-http = { workspace = true, features = ["cors", "fs"], optional = true }
tracing = { workspace = true, optional = true }
tracing-futures = { workspace = true, optional = true }
tracing-log = { workspace = true, optional = true }
tracing-subscriber = {
  workspace = true,
  features = ["env-filter", "std"],
  optional = true
}
types = { workspace = true }
urlencoding = { workspace = true }
uts2ts = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = {
  workspace = true,
  features = [
    "Clipboard",
    "Document",
    "Navigator",
    "ShareData",
    "ValidityState",
    "Window",
    "Worker",
    "XmlHttpRequest",
    "XmlHttpRequestUpload",
  ],
  optional = true
}
web-time.workspace = true
yral-canisters-common = { workspace = true }
yral-metadata-client = { workspace = true, optional = true }
yral-metadata-types = { workspace = true, optional = true }

# local deps
auth = { path = "./src/auth" }
component = { path = "./src/component" }
consts = { path = "./src/consts" }
page = { path = "./src/page" }
state = { path = "./src/state" }
utils = { path = "./src/utils" }

[dev-dependencies]

