[package]
name = "auth"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["macros"], optional = true }
axum-extra = {
  workspace = true,
  features = [
    "cookie",
    "cookie-private",
    "cookie-signed",
    "typed-header",
  ],
  optional = true
}
base64 = { workspace = true, optional = true }
bb8 = { workspace = true, optional = true }
bb8-redis = { workspace = true, optional = true }
consts = { path = "../consts" }
enum_dispatch = { workspace = true, optional = true }
futures = { workspace = true }
global-constants = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
http = { workspace = true }
jsonwebtoken = { workspace = true, optional = true }
leptos = { workspace = true, features = ["nightly"] }
leptos_axum = { workspace = true, optional = true }
openidconnect = { workspace = true, optional = true }
rand_chacha = { workspace = true }
redis = {
  workspace = true,
  features = [
    "acl",
    "ahash",
    "aio",
    "cluster",
    "cluster-async",
    "connection-manager",
    "sentinel",
    "tokio-rustls-comp",
  ],
  optional = true
}
regex = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls"], optional = true }
rustls = { workspace = true, features = ["ring"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "time"], optional = true }
tracing = { workspace = true, optional = true }
types = { workspace = true }
web-time.workspace = true

[features]
oauth-ssr = ["consts/oauth-ssr", "dep:jsonwebtoken", "dep:openidconnect"]
ssr = [
  "axum-extra",
  "bb8",
  "bb8-redis",
  "consts/ssr",
  "dep:axum",
  "dep:base64",
  "dep:enum_dispatch",
  "dep:global-constants",
  "dep:hex",
  "dep:leptos_axum",
  "dep:redis",
  "dep:regex",
  "dep:reqwest",
  "dep:rustls",
  "dep:tokio",
  "dep:tracing",
  "leptos/ssr",
]
