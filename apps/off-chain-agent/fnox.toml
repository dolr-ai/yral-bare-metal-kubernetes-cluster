#:schema https://fnox.jdx.dev/schema.json

# off-chain-agent secrets — age-encrypted ciphertext, safe to commit.
# Inherits the age provider and shared Dragonfly secrets from the root fnox.toml (hierarchical config).
#
# Setup:
#   1. mise run bootstrap (from repo root) — extracts infra SSH key
#   2. fnox set <KEY> --provider age  — encrypt each secret into this file
#   3. Verify: fnox get BACKEND_ADMIN_IDENTITY
#
# Note: Some secrets are only needed in production. For local dev, set the ones you need and leave the rest.
# Google Chat, etc.). For local dev, set the ones you need and leave the rest.

[secrets]
# IC backend admin identity (ED25519 PEM)
BACKEND_ADMIN_IDENTITY= { provider = "age", value = "", description = "IC backend admin identity (ED25519 PEM private key)", default = "", if_missing = "warn" }

# Leaderboard Redis URL (separate from Dragonfly — this is the leaderboard Redis)
LEADERBOARD_REDIS_URL= { provider = "age", value = "", description = "Leaderboard Redis connection URL", default = "", if_missing = "warn" }

# Service canister migration Redis URL
SERVICE_CANISTER_MIGRATION_REDIS_URL= { provider = "age", value = "", description = "Service canister migration Redis connection URL", default = "", if_missing = "warn" }


GOOGLE_SA_KEY= { provider = "age", value = "", description = "Google service account JSON (writes to google_service_account.json)", default = "", if_missing = "warn" }

# API keys
YRAL_OFF_CHAIN_USER_MIGRATION_API_KEY= { provider = "age", value = "", description = "User migration API key", default = "", if_missing = "warn" }
YRAL_METADATA_NOTIFICATION_API_KEY= { provider = "age", value = "", description = "Notification API key (optional)", default = "", if_missing = "warn" }
NAITIK_MULTI_SERVICE_API_JWT_TOKEN= { provider = "age", value = "", description = "Naitik multi-service JWT (optional)", default = "", if_missing = "warn" }
YRAL_HON_WORKER_JWT= { default = "", description = "HON worker JWT (optional)", if_missing = "warn" }

# Cloudflare credentials
CF_IMAGES_API_TOKEN= { default = "", description = "Cloudflare Images API token", if_missing = "warn" }
CF_R2_ACCESS_KEY_TEMP= { default = "", description = "Cloudflare R2 temp access key", if_missing = "warn" }
CF_WORKER_ACCESS_OFF_CHAIN_AGENT_KEY= { default = "", description = "CF Worker access key for off-chain-agent", if_missing = "warn" }
CLOUDFLARE_STREAM_READ_AND_LIST_ACCESS_TOKEN= { default = "", description = "Cloudflare Stream read/list token", if_missing = "warn" }

# Analytics
ANALYTICS_SERVER_TOKEN= { default = "", description = "Analytics server token", if_missing = "warn" }
BTC_REWARDS_GCHAT_WEBHOOK_URL= { default = "", description = "BTC rewards GChat webhook URL", if_missing = "warn" }


YRAL_METADATA_TOKEN= { provider = "age", value = "" }
KVROCKS_HOSTS= { provider = "age", value = "" }
KVROCKS_PASSWORD= { provider = "age", value = "" }
KVROCKS_CA_CERT= { provider = "age", value = "" }
KVROCKS_CLIENT_CERT= { provider = "age", value = "" }
KVROCKS_CLIENT_KEY= { provider = "age", value = "" }
