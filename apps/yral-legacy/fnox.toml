#:schema https://fnox.jdx.dev/schema.json

# yral-legacy secrets — age-encrypted ciphertext, safe to commit.
# Inherits the age provider and shared Dragonfly secrets from the root fnox.toml (hierarchical config).
#
# Setup:
#   1. mise run bootstrap (from repo root) — extracts infra SSH key
#   2. fnox set <KEY> --provider age  — encrypt each secret into this file
#   3. Verify: fnox get COOKIE_KEY

[secrets]
# Cookie signing/encryption key (hex, 128 chars without 0x prefix)
# Generate with: openssl rand -hex 64
# Same value as yral-auth COOKIE_KEY for SSO cookie sharing
COOKIE_KEY= { provider = "age", value = "", description = "Cookie signing/encryption key (hex, 128 chars). Generate: openssl rand -hex 64. Use same as yral-auth for SSO.", default = "", if_missing = "warn" }

# Worker JWT token for off-chain-agent communication
HON_WORKER_JWT= { provider = "age", value = "", description = "Worker JWT token for off-chain-agent gRPC auth", default = "", if_missing = "warn" }

# IC backend admin identity (secp256k1 EC PEM)
BACKEND_ADMIN_IDENTITY= { provider = "age", value = "", description = "IC backend admin identity (secp256k1 EC PEM private key)", if_missing = "error" }

# Cloudflare credentials (feature: cloudflare)
CF_TOKEN= { provider = "age", value = "", description = "Cloudflare API token (feature: cloudflare)", if_missing = "warn" }
CF_ACCOUNT_ID= { provider = "age", value = "", description = "Cloudflare account ID (feature: cloudflare)", default = "", if_missing = "warn" }

# Hetzner S3 credentials for profile storage
HETZNER_S3_ACCESS_KEY= { provider = "age", value = "", description = "Hetzner S3 access key for profile storage", default = "", if_missing = "warn" }
HETZNER_S3_SECRET_KEY= { provider = "age", value = "", description = "Hetzner S3 secret key for profile storage", default = "", if_missing = "warn" }

# OAuth secrets (feature: oauth-ssr)
YRAL_AUTH_CLIENT_SECRET= { provider = "age", value = "", description = "Yral-auth OAuth client secret (feature: oauth-ssr)", if_missing = "warn" }
YRAL_AUTH_MIGRATION_ES256_PEM= { default = "", description = "ES256 PEM for OAuth migration (can be empty string)", if_missing = "warn" }
