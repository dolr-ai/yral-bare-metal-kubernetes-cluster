[package]
name = "component"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { workspace = true, features = ["macros"], optional = true }
chrono = "0.4"
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
hon-worker-common = { workspace = true, features = ["client"] }
global-constants = { workspace = true }
leptos = { workspace = true, features = ["nightly"] }
leptos_axum = { workspace = true, optional = true }
leptos_meta = { workspace = true, optional = true }
leptos_router = { workspace = true, features = ["nightly"], optional = true }
log = { workspace = true }
simple_logger = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "time"], optional = true }
tower = { workspace = true, features = ["full"], optional = true }
tower-http = { workspace = true, features = ["cors", "fs"], optional = true }
wasm-bindgen = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
candid.workspace = true
ic-agent = { workspace = true, features = ["pem"] }
futures = { workspace = true }
leptos-use = { workspace = true }
codee = { workspace = true, features = ["json_serde"] }
reqwest = { workspace = true, features = ["http2", "json", "multipart"] }
serde_bytes.workspace = true
hex = { workspace = true }
leptos_icons = { workspace = true }
icondata = { workspace = true }
gloo = { workspace = true, features = ["futures", "net"] }
once_cell = { workspace = true }
web-time.workspace = true
k256 = { workspace = true, features = ["jwk", "std"] }
icondata_core = { workspace = true }
serde_json = { workspace = true }
crc32fast = { workspace = true }
uts2ts = { workspace = true }
rand_chacha = { workspace = true, optional = true }
web-sys = {
  workspace = true,
  features = [
    "Clipboard",
    "Document",
    "Navigator",
    "ShareData",
    "ValidityState",
    "Window",
    "Worker",
    "XmlHttpRequest",
    "XmlHttpRequestUpload",
  ],
  optional = true
}
circular-buffer = { workspace = true }
enum_dispatch = { workspace = true, optional = true }
axum-extra = {
  workspace = true,
  features = [
    "cookie",
    "cookie-private",
    "cookie-signed",
    "typed-header",
  ],
  optional = true
}
openidconnect = { workspace = true, optional = true }
dotenv = { workspace = true, optional = true }
redis = {
  workspace = true,
  features = [
    "acl",
    "ahash",
    "aio",
    "cluster",
    "cluster-async",
    "connection-manager",
    "sentinel",
    "tokio-rustls-comp",
  ],
  optional = true
}
bb8 = { workspace = true, optional = true }
bb8-redis = { workspace = true, optional = true }
gob-cloudflare = { workspace = true, optional = true }
gloo-utils = { workspace = true, features = ["serde"] }
hmac = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true }
sns-validation = { workspace = true }
js-sys = { workspace = true }
priority-queue = { workspace = true }
rust_decimal = { workspace = true }
speedate = { workspace = true, optional = true }
urlencoding = { workspace = true }
types = { workspace = true }
canisters-client = { workspace = true, features = ["full"] }
yral-canisters-common = { workspace = true }
ic-certification = { workspace = true }
ciborium = { workspace = true }
yral-metadata-client = { workspace = true }
uuid = { workspace = true, features = ["v4", "js"] }
regex = { workspace = true, optional = true }
anyhow = { workspace = true }
send_wrapper = { workspace = true, features = ["futures"] }
jsonwebtoken = { workspace = true, optional = true }

# local deps
consts = { path = "../consts" }
auth = { path = "../auth" }
state = { path = "../state" }
utils = { path = "../utils" }

[features]
hydrate = [
    "leptos/hydrate",
    "leptos_meta",
    "leptos_router",
    "ic-agent/wasm-bindgen",
    "dep:web-sys",
    "dep:rand_chacha",
    "speedate",
    "send_wrapper/futures",
    "consts/hydrate",
    "utils/hydrate",
    "state/hydrate",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:tracing",
    "leptos-use/ssr",
    "leptos-use/axum",
    "reqwest/rustls",
    "dep:redis",
    "yral-canisters-common/rustls-tls",
    "dep:enum_dispatch",
    "axum-extra",
    "dep:rand_chacha",
    "dep:dotenv",
    "bb8",
    "bb8-redis",
    "hmac",
    "speedate",
    "dep:regex",
    "consts/ssr",
    "utils/ssr",
    "state/ssr",
    "auth/ssr",
    "dep:jsonwebtoken",
]
# Fetch mock referral history instead of history via canister
mock-referral-history = [
    "dep:rand_chacha",
    "k256/arithmetic",
    "consts/mock-referral-history",
    "utils/mock-referral-history",
    "state/mock-referral-history",
]


mock-history = [
    "mock-referral-history",
    "mock-wallet-history",
    "consts/mock-history",
    "utils/mock-history",
    "state/mock-history",
]
oauth-ssr = [
    "dep:openidconnect",
    "consts/oauth-ssr",
    "utils/oauth-ssr",
    "state/oauth-ssr",
    "auth/oauth-ssr",
]
oauth-hydrate = [
    "consts/oauth-hydrate",
    "utils/oauth-hydrate",
    "state/oauth-hydrate",
]
redis-kv = ["consts/redis-kv", "utils/redis-kv", "state/redis-kv"]
cloudflare = [
    "dep:gob-cloudflare",
    "consts/cloudflare",
    "utils/cloudflare",
    "state/cloudflare",
]
backend-admin = [
    "consts/backend-admin",
    "utils/backend-admin",
    "state/backend-admin",
]
mock-wallet-history = [
    "dep:rand_chacha",
    "consts/mock-wallet-history",
    "utils/mock-wallet-history",
    "state/mock-wallet-history",
]
release-bin = [
    "ssr",
    "cloudflare",
    "gob-cloudflare/rustls-tls",
    "redis-kv",
    "backend-admin",
    "oauth-ssr",
    "consts/release-bin",
    "utils/release-bin",
    "state/release-bin",
]
release-lib = [
    "hydrate",
    "cloudflare",
    "redis-kv",
    "backend-admin",
    "dep:openidconnect",
    "oauth-hydrate",
    "consts/release-lib",
    "utils/release-lib",
    "state/release-lib",
]
