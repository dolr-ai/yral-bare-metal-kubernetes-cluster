[package]
name = "state"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["macros"], optional = true }
axum-extra = {
  workspace = true,
  features = [
    "cookie",
    "cookie-private",
    "cookie-signed",
    "typed-header",
  ],
  optional = true
}
base64 = { workspace = true, optional = true }
bb8 = { workspace = true, optional = true }
bb8-redis = { workspace = true, optional = true }
candid.workspace = true
canisters-client = { workspace = true, features = ["full"] }
ciborium = { workspace = true }
codee = { workspace = true, features = ["json_serde"] }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
crc32fast = { workspace = true }
dotenv = { workspace = true, optional = true }
enum_dispatch = { workspace = true, optional = true }
futures = { workspace = true }
getrandom = { version = "0.3", default-features = false, features = ["wasm_js"], optional = true }
global-constants = { workspace = true }
gloo = { workspace = true, features = ["futures", "net"] }
gloo-utils = { workspace = true, features = ["serde"] }
gob-cloudflare = { workspace = true, optional = true }
hex = { workspace = true }
hmac = { workspace = true, optional = true }
http = { workspace = true }
ic-agent = { workspace = true, features = ["pem"] }
ic-certification = { workspace = true }
icondata = { workspace = true }
icondata_core = { workspace = true }
js-sys = { workspace = true }
jsonwebtoken = { workspace = true, optional = true }
k256 = { workspace = true, features = ["jwk", "std"] }
leptos = { workspace = true, features = ["nightly"] }
leptos_axum = { workspace = true, optional = true }
leptos_icons = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true, features = ["nightly"] }
leptos-use = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
openidconnect = { workspace = true, optional = true }
openssl-sys = { workspace = true, features = ["vendored"], optional = true }
priority-queue = { workspace = true }
rand = { workspace = true, default-features = false, features = ["small_rng"] }
rand_chacha = { workspace = true, optional = true }
redis = {
  workspace = true,
  features = [
    "acl",
    "ahash",
    "aio",
    "cluster",
    "cluster-async",
    "connection-manager",
    "sentinel",
    "tokio-rustls-comp",
  ],
  optional = true
}
regex = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["http2", "json", "multipart"] }
rust_decimal = { workspace = true }
send_wrapper = { workspace = true, features = ["futures"] }
serde = { workspace = true, features = ["derive"] }
serde_bytes.workspace = true
serde_json = { workspace = true }
simple_logger = { workspace = true }
spacetimedb-sdk = { workspace = true, optional = true }
speedate = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "time"], optional = true }
tower = { workspace = true, features = ["full"], optional = true }
tower-http = { workspace = true, features = ["cors", "fs"], optional = true }
tracing = { workspace = true, optional = true }
types = { workspace = true }
urlencoding = { workspace = true }
uts2ts = { workspace = true }
uuid = { workspace = true, features = ["js", "v4"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = {
  workspace = true,
  features = [
    "Clipboard",
    "Document",
    "HtmlDocument",
    "Navigator",
    "ShareData",
    "ValidityState",
    "Window",
    "Worker",
    "XmlHttpRequest",
    "XmlHttpRequestUpload",
  ],
  optional = true
}
web-time.workspace = true
yral-canisters-common = { workspace = true }
yral-database-spacetime-bindings = { workspace = true, optional = true }
yral-metadata-client = { workspace = true }
yral-metadata-types = { workspace = true }

auth = { path = "../auth" }
# workspace deps
consts = { path = "../consts" }
utils = { path = "../utils" }

[build-dependencies]
anyhow = { workspace = true }

[features]
backend-admin = []
cloudflare = ["dep:gob-cloudflare"]
spacetimedb-browser = ["spacetimedb-sdk/browser"]
hydrate = [
  "consts/hydrate",
  "dep:base64",
  "dep:getrandom",
  "dep:rand_chacha",
  "dep:spacetimedb-sdk",
  "dep:web-sys",
  "dep:yral-database-spacetime-bindings",
  "ic-agent/wasm-bindgen",
  "leptos/hydrate",
  "send_wrapper/futures",
  "spacetimedb-browser",
  "speedate",
  "utils/hydrate",
  "yral-metadata-client/rustls-tls",
]
oauth-hydrate = []
oauth-ssr = ["dep:openidconnect"]
redis-kv = []
release-bin = [
  "backend-admin",
  "cloudflare",
  "gob-cloudflare/rustls-tls",
  "oauth-ssr",
  "redis-kv",
  "ssr",
]
release-lib = [
  "backend-admin",
  "cloudflare",
  "dep:openidconnect",
  "hydrate",
  "oauth-hydrate",
  "redis-kv",
]
ssr = ["auth/ssr", "axum-extra", "bb8", "bb8-redis", "consts/ssr", "dep:axum", "dep:dotenv", "dep:enum_dispatch", "dep:leptos_axum", "dep:openssl-sys", "dep:rand_chacha", "dep:redis", "dep:regex", "dep:spacetimedb-sdk", "dep:tokio", "dep:tower", "dep:tower-http", "dep:tracing", "dep:yral-database-spacetime-bindings", "hmac", "leptos_meta/ssr", "leptos_router/ssr", "leptos-use/axum", "leptos-use/ssr", "leptos/ssr", "reqwest/rustls", "speedate", "utils/ssr", "yral-canisters-common/rustls-tls", "yral-metadata-client/rustls-tls"]
