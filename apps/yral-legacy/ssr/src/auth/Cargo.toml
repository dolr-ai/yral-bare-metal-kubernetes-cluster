[package]
name = "auth"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid.workspace = true
ic-agent = { workspace = true, features = ["pem"] }
k256 = { workspace = true, features = ["jwk", "std"] }
leptos = { workspace = true, features = ["nightly"] }
rand_chacha = { workspace = true }
serde = { workspace = true, features = ["derive"] }
web-time.workspace = true
yral-canisters-common = { workspace = true }
# consts
types = { workspace = true }
bb8 = { workspace = true, optional = true }
redis = {
  workspace = true,
  features = [
    "acl",
    "ahash",
    "aio",
    "cluster",
    "cluster-async",
    "connection-manager",
    "sentinel",
    "tokio-rustls-comp",
  ],
  optional = true
}
bb8-redis = { workspace = true, optional = true }
futures = { workspace = true }
enum_dispatch = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "time"], optional = true }
thiserror.workspace = true
serde_json = { workspace = true }
axum = { workspace = true, features = ["macros"], optional = true }
axum-extra = {
  workspace = true,
  features = [
    "cookie",
    "cookie-private",
    "cookie-signed",
    "typed-header",
  ],
  optional = true
}
http = { workspace = true }
leptos_axum = { workspace = true, optional = true }
openidconnect = { workspace = true, optional = true }
consts = { path = "../consts" }
jsonwebtoken = { workspace = true, optional = true }
canisters-client = { workspace = true, features = ["full"], optional = true }
global-constants = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
anyhow = { workspace = true }

[features]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "leptos/ssr",
    "dep:redis",
    "yral-canisters-common/rustls-tls",
    "dep:enum_dispatch",
    "axum-extra",
    "bb8",
    "bb8-redis",
    "consts/ssr",
    "dep:rustls",
    "dep:tracing",
    "dep:regex",
    "dep:global-constants",
    "dep:hex"
]
oauth-ssr = ["dep:openidconnect", "dep:jsonwebtoken", "dep:canisters-client", "consts/oauth-ssr"]
