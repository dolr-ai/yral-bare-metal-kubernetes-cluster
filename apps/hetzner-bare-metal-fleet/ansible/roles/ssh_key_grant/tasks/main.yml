---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - team_member_name is defined
      - team_members is defined
      - team_members[team_member_name] is defined
    fail_msg: "team_member_name must be provided and exist in team_members dictionary"

- name: Get team member SSH key
  ansible.builtin.set_fact:
    ssh_key_grant_member_email: "{{ team_members[team_member_name].email }}"
    ssh_key_grant_member_ssh_key: "{{ team_members[team_member_name].ssh_key }}"

- name: Display access grant information
  ansible.builtin.debug:
    msg: "Granting SSH access to {{ ssh_key_grant_member_email }} on {{ inventory_hostname }}"

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Check if authorized_keys file exists
  ansible.builtin.stat:
    path: "{{ ssh_key_grant_authorized_keys_file }}"
  register: ssh_key_grant_authorized_keys_stat

- name: Create authorized_keys file if it doesn't exist
  ansible.builtin.file:
    path: "{{ ssh_key_grant_authorized_keys_file }}"
    state: touch
    mode: "0600"
    owner: root
    group: root
  when: not ssh_key_grant_authorized_keys_stat.stat.exists

- name: Check if key already exists in authorized_keys
  ansible.builtin.shell: |
    grep -F "{{ ssh_key_grant_member_email }}" {{ ssh_key_grant_authorized_keys_file }} || true
  register: ssh_key_grant_key_check
  changed_when: false

- name: Add SSH key to authorized_keys
  ansible.builtin.lineinfile:
    path: "{{ ssh_key_grant_authorized_keys_file }}"
    line: "{{ ssh_key_grant_member_ssh_key }}"
    state: present
    create: true
    mode: "0600"
  when: ssh_key_grant_key_check.stdout == ""

- name: Confirm key was added
  ansible.builtin.debug:
    msg: >-
      SSH key for {{ ssh_key_grant_member_email }}
      {{ 'already existed' if ssh_key_grant_key_check.stdout != '' else 'has been added' }}
      to {{ inventory_hostname }}

- name: Display access revocation notice
  ansible.builtin.debug:
    msg: "NOTE: This access is temporary. It will be revoked during the next weekly-update run (ssh_security role)."
