---
- name: Check if system is Debian/Ubuntu
  ansible.builtin.fail:
    msg: "This role is designed for Debian/Ubuntu systems only"
  when: ansible_os_family != "Debian"

- name: Check if Docker is installed
  ansible.builtin.command: docker --version
  register: beszel_agent_docker_check
  failed_when: false
  changed_when: false

- name: Fail if Docker is not installed
  ansible.builtin.fail:
    msg: "Docker is not installed. Please run the docker role first."
  when: beszel_agent_docker_check.rc != 0

- name: Display Docker version
  ansible.builtin.debug:
    msg: "Docker version: {{ beszel_agent_docker_check.stdout }}"

- name: Check if docker-compose.yml exists
  ansible.builtin.stat:
    path: "{{ beszel_agent_docker_compose_path }}"
  register: beszel_agent_compose_file

- name: Create docker-compose.yml if it doesn't exist
  ansible.builtin.copy:
    dest: "{{ beszel_agent_docker_compose_path }}"
    content: |
      version: "3.8"
      services:
    mode: "0644"
  when: not beszel_agent_compose_file.stat.exists

- name: Display compose file status
  ansible.builtin.debug:
    msg: "docker-compose.yml {{ 'already exists' if beszel_agent_compose_file.stat.exists else 'was created' }}"

- name: Check if beszel_agent_token is defined
  ansible.builtin.fail:
    msg: |
      beszel_agent_token is not defined for host {{ inventory_hostname }}.
      Set vault_beszel_agent_token in group_vars/all/vault.yml for the universal token,
      or in host_vars/{{ inventory_hostname }}/vault.yml for a per-host token.
  when: beszel_agent_token is not defined or beszel_agent_token == ""

- name: Create backup of docker-compose.yml
  ansible.builtin.copy:
    src: "{{ beszel_agent_docker_compose_path }}"
    dest: "{{ beszel_agent_docker_compose_path }}.backup-{{ ansible_date_time.epoch }}"
    remote_src: true
    mode: preserve

- name: Remove existing Ansible-managed beszel-agent block
  ansible.builtin.blockinfile:
    path: "{{ beszel_agent_docker_compose_path }}"
    marker: "  # {mark} ANSIBLE MANAGED BLOCK - BESZEL AGENT"
    state: absent
  register: beszel_agent_block_removed

- name: Copy beszel cleanup script to remote
  ansible.builtin.copy:
    src: cleanup_beszel.py
    dest: /tmp/cleanup_beszel.py
    mode: "0755"
  changed_when: false

- name: Remove any remaining non-managed beszel-agent entries
  ansible.builtin.command: python3 /tmp/cleanup_beszel.py
  changed_when: false

- name: Clean up temporary script
  ansible.builtin.file:
    path: /tmp/cleanup_beszel.py
    state: absent
  changed_when: false

- name: Ensure docker-compose.yml has beszel-agent service
  ansible.builtin.blockinfile:
    path: "{{ beszel_agent_docker_compose_path }}"
    marker: "  # {mark} ANSIBLE MANAGED BLOCK - BESZEL AGENT"
    insertafter: "^services:"
    state: present
    block: |2
        # ┌─────────────────────────────────────────────────────────────────┐
        # │  MANAGED BY ANSIBLE — DO NOT EDIT OR REMOVE THIS SECTION       │
        # │                                                                 │
        # │  This block is required for Beszel system monitoring to work.  │
        # │  It is automatically maintained by the beszel_agent Ansible     │
        # │  role. Any manual changes will be overwritten on the next run.  │
        # │                                                                 │
        # │  To update configuration, edit the Ansible role variables:     │
        # │    ansible/inventory/group_vars/all/vars.yml                   │
        # └─────────────────────────────────────────────────────────────────┘
        beszel-agent:
          image: henrygd/beszel-agent
          container_name: beszel-agent
          restart: unless-stopped
          network_mode: host
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./beszel_agent_data:/var/lib/beszel-agent
            - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
          environment:
            LISTEN: {{ beszel_listen_port }}
            KEY: "{{ beszel_ssh_key }}"
            TOKEN: {{ beszel_agent_token }}
            HUB_URL: {{ beszel_hub_url }}
          security_opt:
            - apparmor:unconfined
  register: beszel_agent_compose_updated
  # Handler chain (pull image → start → health-wait → status display) runs
  # only when the managed block actually changed.
  notify: beszel agent compose updated

- name: Display update status
  ansible.builtin.debug:
    msg: "Beszel agent service was {{ 'updated' if beszel_agent_compose_updated.changed else 'already configured' }}"

- name: Validate docker-compose.yml syntax
  ansible.builtin.command: docker compose -f {{ beszel_agent_docker_compose_path }} config --quiet
  args:
    chdir: /root
  register: beszel_agent_compose_validation
  failed_when: beszel_agent_compose_validation.rc != 0
  changed_when: false

- name: Display validation result
  ansible.builtin.debug:
    msg: "docker-compose.yml syntax is valid"

- name: Display container status
  ansible.builtin.debug:
    msg: "Beszel agent container {{ 'started/updated' if beszel_agent_compose_updated.changed else 'no changes needed' }}"
