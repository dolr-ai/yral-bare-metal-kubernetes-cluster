---
- name: Wait for system to be ready
  ansible.builtin.wait_for_connection:
    timeout: 60
    delay: "{{ system_update_retry_delay }}"
  retries: "{{ system_update_retry_count }}"
  register: system_update_connection_result
  until: system_update_connection_result is succeeded

- name: Gather facts
  ansible.builtin.setup:

- name: Check if system is Debian/Ubuntu
  ansible.builtin.fail:
    msg: "This role is designed for Debian/Ubuntu systems only"
  when: ansible_os_family != "Debian"

- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  register: system_update_apt_cache_result
  retries: 3
  delay: 10
  until: system_update_apt_cache_result is succeeded

- name: Check for available package upgrades
  ansible.builtin.shell: set -o pipefail; apt list --upgradable 2>/dev/null | grep -c upgradable || true
  register: system_update_upgradable_packages
  changed_when: false

- name: Display number of upgradable packages
  ansible.builtin.debug:
    msg: "{{ system_update_upgradable_packages.stdout }} packages are available for upgrade"

- name: Perform full system upgrade
  ansible.builtin.apt:
    upgrade: full
    autoremove: true
    autoclean: true
  register: system_update_upgrade_result
  when: system_update_upgradable_packages.stdout | int > 0

- name: Remove unnecessary packages
  ansible.builtin.apt:
    autoremove: true
    purge: true

- name: Clean apt cache
  ansible.builtin.apt:
    autoclean: true

- name: Display upgrade summary
  ansible.builtin.debug:
    msg: |
      Upgrade Summary:
      - Packages upgraded: >-
          {{ system_update_upgrade_result.stdout_lines | length
             if system_update_upgrade_result is defined
             and system_update_upgrade_result.stdout_lines is defined
             else 0 }}
  when: system_update_upgrade_result is defined

- name: Check if system reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: system_update_reboot_required_file

- name: Display reboot requirement status
  ansible.builtin.debug:
    msg: "System reboot is {{ 'REQUIRED' if system_update_reboot_required_file.stat.exists else 'NOT required' }}"

- name: Reboot system if required
  ansible.builtin.reboot:
    msg: "Rebooting system after package upgrades (kernel or critical system libraries updated)"
    reboot_timeout: 300
    connect_timeout: 20
    test_command: uptime
  when:
    - system_update_reboot_required_file.stat.exists
    - system_update_enable_reboot | default(false) | bool
