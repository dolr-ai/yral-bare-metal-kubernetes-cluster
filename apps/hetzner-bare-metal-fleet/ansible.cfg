[defaults]
inventory = ansible/inventory/hosts.yml
host_key_checking = False
timeout = 60
gathering = smart
fact_caching = memory
fact_caching_timeout = 3600
retry_files_enabled = True
retry_files_save_path = ansible/retry
stdout_callback = default
stderr_callback = default
bin_ansible_callbacks = True
deprecation_warnings = False
collections_paths = ansible/collections
roles_path = ansible/roles
log_path = ansible/ansible.log
# Vault password file — shared with the parent yral-bare-metal-kubernetes-cluster repo.
# Both use the same Ansible vault password. Path is relative to this ansible.cfg
# (in the fleet directory, 2 levels below the repo root).
vault_password_file = ../../ansible/.vault_pass

# Infra SSH private key — extracted from the parent repo's Ansible vault by
# `mise run bootstrap` at the repo root, to ./.yral-infra-ed25519 (gitignored).
private_key_file = ../../.yral-infra-ed25519

[inventory]
enable_plugins = yaml, ini, auto

[privilege_escalation]
become = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o AddKeysToAgent=yes -o ForwardAgent=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=20
pipelining = True
control_path = %(directory)s/%%h-%%r
retries = 5
