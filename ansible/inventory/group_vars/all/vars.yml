---
# Ansible Variables - Configuration and Vault Indirection
# This file contains plaintext configuration values and indirection for vault secrets.
# Vault variables (prefixed with vault_) are loaded in pre_tasks before roles execute.

# Hetzner Robot API credentials
hetzner_robot_api_user: "#ws+hEJX77Pr"
hetzner_robot_api_password: "{{ vault_hetzner_robot_api_password }}"  # Indirection to vault

# Hetzner S3 credentials
hetzner_s3_access_key: "XO5X9A1W8AMHY3DSTKMS"
hetzner_s3_secret_key: "{{ vault_hetzner_s3_secret_key }}"  # Indirection to vault

# Kubernetes cluster admin kubeconfig (stored in vault, used by scripts/setup-local-env.sh)
kubeconfig: "{{ vault_kubeconfig }}"  # Indirection to vault

# GitHub PAT for Flux bootstrap (stored in vault, exported as GITHUB_TOKEN by scripts/setup-local-env.sh)
github_flux_token: "{{ vault_github_flux_token }}"  # Indirection to vault

# Age private key for Flux SOPS decryption
# scripts/setup-local-env.sh creates k8s Secret 'sops-age' in flux-system namespace.
# Flux uses this key to decrypt *.sops.yaml files from git (e.g. cloudflare-api-token).
# To generate: age-keygen -o /tmp/age.key  (then store contents as vault_age_private_key)
age_private_key: "{{ vault_age_private_key }}"  # Indirection to vault

# Infrastructure SSH keypair — used for all node access (Hetzner, Vast.ai)
# AND for git operations against GitHub (single key for everything).
# Private key is secret (vault); public key is plaintext (safe to commit).
# scripts/setup-local-env.sh extracts the private key to ~/.ssh/id_ed25519
# (the default SSH identity), so ssh, git, and ansible all pick it up automatically.
# To get the public key: ssh-keygen -y -f ~/.ssh/id_ed25519
github_actions_ssh_private_key: "{{ vault_github_actions_ssh_private_key }}"  # Indirection to vault
github_actions_ssh_pub_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM/H7Jp2RgC1xtg1nyzpmhzOTmUz3n+PQPsk83BzUskg github-actions@yral.com"  # Plaintext — derived from private key via: ssh-keygen -y -f ~/.ssh/id_ed25519

# Cloudflare DNS management for kubernetes-api round-robin A records
# Used by node-remove and control-plane-join roles to update DNS on CP add/remove
cloudflare_api_token: "{{ vault_cloudflare_api_token }}"  # Indirection to vault
cloudflare_zone_id: "f0e13310b0b3c66709f0debd5e3bbb10"
cloudflare_zone_name: "yral.com"
kubernetes_api_hostname: "kubernetes-api.yral.com"
cloudflare_app_wildcard_hostname: "*.yral.com"  # Proxied wildcard served by cilium-envoy on all nodes

# Vast.ai API key for GPU instance provisioning
vastai_api_key: "{{ vault_vastai_api_key }}"  # Indirection to vault
