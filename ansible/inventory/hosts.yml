---
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    # Kubernetes cluster configuration
    control_plane_endpoint: "kubernetes-api.yral.com"
    pod_network_cidr: "10.244.0.0/16"

    # Hetzner Robot API credentials
    # (loaded from ansible/group_vars/all/vault.yml)
    hetzner_robot_api_user: "#ws+hEJX77Pr"
    # hetzner_robot_api_password: defined in vault.yml

    # Hetzner Object Storage for backups
    # (loaded from ansible/group_vars/all/vault.yml)
    hetzner_s3_access_key: "XO5X9A1W8AMHY3DSTKMS"
    # hetzner_s3_secret_key: defined in vault.yml
    hetzner_s3_bucket: "yral-bare-metal-kubernetes-cluster-control-plane-backup"
    hetzner_s3_endpoint: "https://hel1.your-objectstorage.com"
    hetzner_s3_region: "hel1"

  children:
    k8s_cluster:
      children:
        control_plane:
          hosts:
            # 5 control planes, 1 per Helsinki building (HEL1-DC2/3/4/6/7).
