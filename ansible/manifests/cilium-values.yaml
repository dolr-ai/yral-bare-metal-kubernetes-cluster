# Cilium Helm Values — Day-1 BOOTSTRAP ONLY
#
# This file is used exclusively by the Ansible `cilium` role during cluster
# initialisation (init-control-plane.yml). It installs Cilium CNI so that
# pods (including Flux itself) can schedule.
#
# Day-2 source of truth: kubernetes/infrastructure/cilium/helmrelease.yaml
# After Flux is bootstrapped it reconciles the HelmRelease and owns all
# subsequent Cilium config/version changes. Do NOT edit this file for Day-2
# changes — edit helmrelease.yaml instead.
#
# Version pin is in ansible/roles/cilium/defaults/main.yml

# Cluster configuration
cluster:
  name: yral-k8s-cluster
  id: 1

# kube-proxy replacement - STRICT mode
kubeProxyReplacement: true
k8sServiceHost: kubernetes-api.yral.com
k8sServicePort: 6443

# IPAM configuration
ipam:
  mode: kubernetes

# Encryption - WireGuard for pod-to-pod traffic
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true

# Hubble observability
hubble:
  enabled: true
  relay:
    enabled: true
    replicas: 2
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 512Mi
  ui:
    enabled: true
    replicas: 1
    resources:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    ingress:
      enabled: false # Will create LoadBalancer Service instead
  metrics:
    enabled:
      - dns:query
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction

# Ingress Controller
# Disabled — Gateway API (below) is the sole ingress mechanism.
# IngressController occupied NodePort 80/443; disabling it frees those ports
# for Gateway API hostNetwork mode.
ingressController:
  enabled: false

# Gateway API — hostNetwork mode for bare-metal port binding
# Cilium creates DaemonSet pods with hostNetwork=true that bind directly to
# ports 80/443 on every node. No LoadBalancer IP or LB-IPAM needed.
# Cloudflare proxy connects to origin port 443 → hits these pods on every CP node.
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true

# Service Mesh (Envoy proxy)
envoy:
  enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Operator configuration
operator:
  replicas: 2
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

# IPv4 configuration
ipv4:
  enabled: true

# IPv6 disabled for now
ipv6:
  enabled: false

# BGP Control Plane (disabled - using ARP mode)
bgpControlPlane:
  enabled: false

# LoadBalancer mode: SNAT — responses are source-NAT'd to the node's own IP.
# DSR is incompatible with Hetzner bare metal — DSR sends responses directly from
# the service IP, but since those IPs aren't bound to any local interface the
# kernel routes them back out to the gateway, causing Hetzner to flag packet reflection.
loadBalancer:
  algorithm: maglev
  mode: snat

# Enable socket-level load balancing
socketLB:
  enabled: true

# Host firewall
hostFirewall:
  enabled: false

# Enable bandwidth manager for better traffic control
bandwidthManager:
  enabled: true
  bbr: true

# Enable local redirect policy for better performance
localRedirectPolicy: true

# bpf.hostRouting requires native routing mode — disabled with VXLAN
bpf:
  masquerade: true
  preallocateMaps: true

# Enable Cilium endpoint routes for better performance
endpointRoutes:
  enabled: true

# autoDirectNodeRoutes only works with native routing — not applicable with VXLAN
autoDirectNodeRoutes: false

# Enable MTU detection
enableIPv4Masquerade: true
enableIPv6Masquerade: false

# Resource configuration for Cilium agent
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Security context
seccompPath: ""

# Prometheus metrics
prometheus:
  enabled: true
  serviceMonitor:
    enabled: false # Will enable after deploying Prometheus

# Enable health checking
healthChecking: true

# VXLAN tunnel mode: encapsulates pod traffic, fully compatible with Hetzner's L3
# routing. Native/direct routing caused packet reflection (VIP responses routed
# back to gateway because VIPs are not bound to any local interface).
# Note: 'tunnel' key was removed in Cilium 1.15; use routingMode + tunnelProtocol instead.
tunnelProtocol: vxlan
routingMode: tunnel

# Enable host services
hostServices:
  enabled: true
  protocols: tcp,udp

# Node port acceleration
# SNAT mode for consistency with loadBalancer.mode — DSR causes same reflection issue
nodePort:
  enabled: true
  mode: snat

# External IPs support
externalIPs:
  enabled: true

# Enable L7 proxy
l7Proxy: true

# DNS proxy for visibility
dnsProxy:
  enableTransparentMode: true

# Enable policy enforcement
policyEnforcementMode: default

# Enable CNI chaining (disabled - Cilium is sole CNI)
cni:
  chainingMode: none
  exclusive: true

# Tolerations for control plane nodes (allow Cilium to run everywhere)
tolerations:
  - operator: Exists

# Debug mode - disabled for production
debug:
  enabled: false

# Rollout configuration
rollOutCiliumPods: true
