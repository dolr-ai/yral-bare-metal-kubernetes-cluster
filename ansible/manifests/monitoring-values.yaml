# kube-prometheus-stack Helm Values (bootstrap-only)
# These values are used by ansible/roles/monitoring/ for initial cluster bootstrap.
# The Flux HelmRelease at kubernetes/infrastructure/monitoring/helmrelease.yaml
# is the source of truth for production. If you change retention/storage there,
# sync the values here so bootstrap matches production.
#
# Prometheus
prometheus:
  enabled: true
  prometheusSpec:
    # Single replica (matches Flux HelmRelease). ceph-block provides durability.
    replicas: 1
    # 15-day retention, matches Flux HelmRelease.
    retention: 15d
    # Hard size cap: ~90% of 100Gi PVC. Matches Flux HelmRelease.
    retentionSize: "90GB"

    # Resources (match Flux HelmRelease)
    resources:
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 8Gi

    # Storage (match Flux HelmRelease — ceph-block, 100Gi)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi

    # Topology spread - prefer same datacenter, schedule freely
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus

    # Pod anti-affinity - spread across nodes
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - prometheus
              topologyKey: kubernetes.io/hostname

# Grafana
grafana:
  enabled: true
  replicas: 1

  # Admin credentials
  adminPassword: "CHANGE_ME_SECURE_PASSWORD"

  # Resources
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

  # Persistence
  persistence:
    enabled: true
    size: 10Gi

  # Affinity rules: prefer same datacenter as Prometheus, avoid control plane nodes
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
            topologyKey: topology.kubernetes.io/zone

  # Expose via ClusterIP — external access through Cilium Ingress (grafana.yral.com)
  service:
    type: ClusterIP
    port: 80

  # Grafana configuration
  grafana.ini:
    server:
      root_url: "http://grafana.yral.com"
    analytics:
      check_for_updates: true
    security:
      admin_user: admin

  # Datasources
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-operated:9090
          access: proxy
          isDefault: true

  # Dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      node-exporter:
        gnetId: 1860
        revision: 27
        datasource: Prometheus
      cilium-metrics:
        gnetId: 16611
        revision: 1
        datasource: Prometheus
      hubble-metrics:
        gnetId: 16612
        revision: 1
        datasource: Prometheus

# AlertManager
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 2

    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Topology spread
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: alertmanager

    # Avoid control plane nodes - let it schedule on workers
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist

# Node exporter - runs on all nodes including control planes
nodeExporter:
  enabled: true

# kube-state-metrics
kubeStateMetrics:
  enabled: true

# Enable default rules
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    prometheus: true
    prometheusOperator: true

# ServiceMonitor for Cilium (enable after Cilium is installed)
additionalServiceMonitors:
  - name: cilium-agent
    selector:
      matchLabels:
        k8s-app: cilium
    namespaceSelector:
      matchNames:
        - kube-system
    endpoints:
      - port: prometheus
        interval: 30s
  - name: hubble
    selector:
      matchLabels:
        k8s-app: hubble
    namespaceSelector:
      matchNames:
        - kube-system
    endpoints:
      - port: prometheus
        interval: 30s
