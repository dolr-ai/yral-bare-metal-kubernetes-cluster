---
- name: Display target host information
  ansible.builtin.debug:
    msg:
      - "Installing Helm on: {{ ansible_facts['hostname'] }}"
      - "IP: {{ ansible_host }}"
      - "Node type: {{ node_type }}"

- name: Check if Helm is already installed
  ansible.builtin.command: which helm
  register: helm_check
  changed_when: false
  failed_when: false

- name: Display Helm installation status
  ansible.builtin.debug:
    msg: "Helm is already installed at {{ helm_check.stdout }}"
  when: helm_check.rc == 0

- name: Download Helm installation script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
    dest: /tmp/get_helm.sh
    mode: "0700"
  when: helm_check.rc != 0

- name: Install Helm v{{ helm_version }} using official script
  ansible.builtin.command: /tmp/get_helm.sh
  environment:
    DESIRED_VERSION: "v{{ helm_version }}"
  when: helm_check.rc != 0
  register: helm_install

- name: Remove Helm installation script
  ansible.builtin.file:
    path: /tmp/get_helm.sh
    state: absent
  when: helm_check.rc != 0

- name: Verify Helm installation
  ansible.builtin.command: helm version
  register: helm_version
  changed_when: false

- name: Display Helm version
  ansible.builtin.debug:
    msg: "{{ helm_version.stdout_lines }}"

- name: Add common Helm repositories
  ansible.builtin.command: "{{ item }}"
  loop:
    - helm repo add cilium https://helm.cilium.io/
    - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
    - helm repo add stable https://charts.helm.sh/stable
  register: helm_repos
  changed_when: "'has been added' in helm_repos.stdout"
  failed_when: false

- name: Update Helm repositories
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Display installation summary
  ansible.builtin.debug:
    msg:
      - "✅ Helm installation completed successfully"
      - "✅ Helm repositories added: cilium, prometheus-community, stable"
      - "✅ Repositories updated"
      - ""
      - "Next steps:"
      - "1. Deploy kube-vip static pods on all control planes"
      - "2. Initialize Kubernetes cluster with kubeadm"
      - "3. Deploy Cilium CNI using Helm"
