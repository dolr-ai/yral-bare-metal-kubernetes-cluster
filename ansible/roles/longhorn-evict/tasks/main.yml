---
# longhorn-evict — gracefully drain all Longhorn replicas from a node
#
# Sets evictionRequested=true on every disk of the target Longhorn node, then
# waits until scheduledReplica is empty for all disks before returning.
# Longhorn migrates each replica to another node during this wait.
#
# Called from:
#   remove-node.yml  (hosts: localhost, target_host=<node>)
#
# Not used in upgrade-worker.yml because the upgrade cycle (delete → reboot → rejoin)
# is brief (~5-10 min) and Longhorn recognises disk UUIDs on rejoin, cancelling any
# in-progress rebuild. Proactively setting evictionRequested before an upgrade would
# leave it permanently enabled if no reboot ended up being required.
#
# kubectl commands run on localhost (the Ansible controller / devcontainer).
# The vscode user's ~/.kube/config is used directly — no become needed.

- name: Check that target_host is defined
  ansible.builtin.fail:
    msg: "target_host must be specified: -e target_host=worker-X"
  when: target_host is not defined or target_host == ""
  run_once: true

- name: Check Longhorn node object exists
  ansible.builtin.command: >
    kubectl get node.longhorn.io {{ target_host }} -n longhorn-system -o name
  register: longhorn_node_check
  changed_when: false
  failed_when: false
  run_once: true

- name: Skip eviction if node not registered in Longhorn
  ansible.builtin.debug:
    msg: "Node {{ target_host }} not found in Longhorn, skipping replica eviction."
  when: longhorn_node_check.rc != 0
  run_once: true

- name: Get Longhorn disk keys for target node
  ansible.builtin.shell: |
    kubectl get node.longhorn.io {{ target_host }} -n longhorn-system \
      -o json | python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    for key in d['spec']['disks']:
        print(key)
    "
  register: longhorn_disk_keys
  changed_when: false
  when: longhorn_node_check.rc == 0
  run_once: true

- name: Check current replica count before eviction
  ansible.builtin.shell: |
    kubectl get node.longhorn.io {{ target_host }} -n longhorn-system \
      -o json | python3 -c "
    import sys, json, subprocess, shlex
    d = json.load(sys.stdin)
    total = 0
    for disk in d.get('status', {}).get('diskStatus', {}).values():
        for replica_name in disk.get('scheduledReplica', {}):
            # Only count replicas whose CR actually exists.
            # On a dead node, scheduledReplica can contain phantom entries
            # (the replica CR was already deleted but the node status was never
            # reconciled because the node is unreachable). Counting phantoms
            # would cause the eviction wait to loop forever.
            result = subprocess.run(
                shlex.split(
                    f'kubectl get replica.longhorn.io {replica_name} -n longhorn-system'
                ),
                capture_output=True
            )
            if result.returncode == 0:
                total += 1
            else:
                print(f'PHANTOM replica {replica_name} (CR not found, skipping)', file=sys.stderr)
    print(total)
    "
  register: replica_count_before
  changed_when: false
  when: longhorn_node_check.rc == 0
  run_once: true

- name: Display replica count before eviction
  ansible.builtin.debug:
    msg: "Replicas on {{ target_host }} before eviction: {{ replica_count_before.stdout }}"
  when: longhorn_node_check.rc == 0
  run_once: true

- name: Enable eviction on each disk
  ansible.builtin.shell: >
    kubectl patch node.longhorn.io {{ target_host }} -n longhorn-system
    --type=json
    -p='[{"op":"replace","path":"/spec/disks/{{ item }}/allowScheduling","value":false},{"op":"replace","path":"/spec/disks/{{ item }}/evictionRequested","value":true}]'
  loop: "{{ longhorn_disk_keys.stdout_lines | default([]) }}"
  when:
    - longhorn_node_check.rc == 0
    - longhorn_disk_keys.stdout_lines | default([]) | length > 0
    - replica_count_before.stdout | int > 0
  run_once: true
  changed_when: true

- name: Wait for all replicas to evacuate (up to 30 min)
  ansible.builtin.shell: |
    kubectl get node.longhorn.io {{ target_host }} -n longhorn-system \
      -o json | python3 -c "
    import sys, json, subprocess, shlex
    d = json.load(sys.stdin)
    total = 0
    for disk in d.get('status', {}).get('diskStatus', {}).values():
        for replica_name in disk.get('scheduledReplica', {}):
            result = subprocess.run(
                shlex.split(
                    f'kubectl get replica.longhorn.io {replica_name} -n longhorn-system'
                ),
                capture_output=True
            )
            if result.returncode == 0:
                total += 1
    print(total)
    "
  register: replica_count
  until: replica_count.stdout | int == 0
  retries: 60
  delay: 30
  changed_when: false
  failed_when: false
  when:
    - longhorn_node_check.rc == 0
    - replica_count_before.stdout | int > 0
  run_once: true

- name: Set eviction timeout fact
  ansible.builtin.set_fact:
    eviction_timed_out: "{{ replica_count is defined and replica_count.stdout | default('0') | int > 0 }}"
  when:
    - longhorn_node_check.rc == 0
    - replica_count_before.stdout | int > 0
  run_once: true

- name: Check data safety after eviction timeout
  ansible.builtin.shell: |
    kubectl get replicas.longhorn.io -n longhorn-system -o json |
    python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    # Count remaining replicas per volume (excluding the target node)
    volumes = {}
    for r in d.get('items', []):
        vol = r['metadata']['labels'].get('longhornvolume', '')
        node = r['spec']['nodeID']
        if vol and node != '{{ target_host }}':
            volumes[vol] = volumes.get(vol, 0) + 1
    unsafe = [vol for vol, count in volumes.items() if count < 2]
    if unsafe:
        print('UNSAFE:' + ','.join(unsafe))
    else:
        print('SAFE')
    "
  register: data_safety_check
  changed_when: false
  when:
    - longhorn_node_check.rc == 0
    - eviction_timed_out | default(false) | bool
  run_once: true

- name: Fail if data safety cannot be guaranteed after eviction timeout
  ansible.builtin.fail:
    msg: >-
      Longhorn replica eviction timed out for {{ target_host }} and data safety
      cannot be guaranteed. Volumes with fewer than 2 remaining replicas:
      {{ data_safety_check.stdout }}.
      Do NOT proceed — fix Longhorn storage issues first (add disks, enable
      scheduling on other nodes, etc.) and re-run the playbook.
  when:
    - longhorn_node_check.rc == 0
    - eviction_timed_out | default(false) | bool
    - "'UNSAFE' in data_safety_check.stdout"
  run_once: true

- name: Warn about forced eviction (data safe)
  ansible.builtin.debug:
    msg: >-
      Longhorn replica eviction timed out for {{ target_host }} but data is safe
      (all volumes have ≥2 replicas on other nodes).
      Proceeding with forced eviction — the replica on {{ target_host }} will
      be lost, but data integrity is maintained.
  when:
    - longhorn_node_check.rc == 0
    - eviction_timed_out | default(false) | bool
    - "'SAFE' in data_safety_check.stdout"
  run_once: true

- name: Eviction complete
  ansible.builtin.debug:
    msg: >-
      Longhorn eviction complete for {{ target_host }} —
      all {{ replica_count_before.stdout }} replicas migrated off the node.
  when:
    - longhorn_node_check.rc == 0
    - replica_count_before.stdout | int > 0
    - not (eviction_timed_out | default(false) | bool)
  run_once: true
