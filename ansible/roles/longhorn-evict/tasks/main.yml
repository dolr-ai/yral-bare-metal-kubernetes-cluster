---
# longhorn-evict — gracefully drain all Longhorn replicas from a node
#
# Sets evictionRequested=true on every disk of the target Longhorn node, then
# waits until scheduledReplica is empty for all disks before returning.
# Longhorn migrates each replica to another node during this wait.
#
# Called from:
#   remove-node.yml  (hosts: localhost, target_host=<node>)
#
# Not used in upgrade-worker.yml because the upgrade cycle (delete → reboot → rejoin)
# is brief (~5-10 min) and Longhorn recognises disk UUIDs on rejoin, cancelling any
# in-progress rebuild. Proactively setting evictionRequested before an upgrade would
# leave it permanently enabled if no reboot ended up being required.
#
# Target node resolution:
#   - remove-node.yml runs on localhost; target_host holds the node name.

- name: Check that target_host is defined
  ansible.builtin.fail:
    msg: "target_host must be specified: -e target_host=worker-X"
  when: target_host is not defined or target_host == ""
  run_once: true

- name: Check Longhorn node object exists
  ansible.builtin.command: >
    kubectl get node.longhorn.io {{ target_host }} -n longhorn-system -o name
  delegate_to: localhost
  register: longhorn_node_check
  changed_when: false
  failed_when: false
  run_once: true

- name: Skip eviction if node not registered in Longhorn
  ansible.builtin.debug:
    msg: "Node {{ target_host }} not found in Longhorn, skipping replica eviction."
  when: longhorn_node_check.rc != 0
  run_once: true

- name: Get Longhorn disk keys for target node
  ansible.builtin.shell: |
    kubectl get node.longhorn.io {{ target_host }} -n longhorn-system \
      -o json | python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    for key in d['spec']['disks']:
        print(key)
    "
  delegate_to: localhost
  register: longhorn_disk_keys
  changed_when: false
  when: longhorn_node_check.rc == 0
  run_once: true

- name: Check current replica count before eviction
  ansible.builtin.shell: |
    kubectl get node.longhorn.io {{ target_host }} -n longhorn-system \
      -o json | python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    total = sum(
        len(disk.get('scheduledReplica', {}))
        for disk in d.get('status', {}).get('diskStatus', {}).values()
    )
    print(total)
    "
  delegate_to: localhost
  register: replica_count_before
  changed_when: false
  when: longhorn_node_check.rc == 0
  run_once: true

- name: Display replica count before eviction
  ansible.builtin.debug:
    msg: "Replicas on {{ target_host }} before eviction: {{ replica_count_before.stdout }}"
  when: longhorn_node_check.rc == 0
  run_once: true

- name: Enable eviction on each disk
  ansible.builtin.command: >
    kubectl patch node.longhorn.io {{ target_host }} -n longhorn-system
    --type=json
    -p=[{"op":"replace","path":"/spec/disks/{{ item }}/evictionRequested","value":true}]
  delegate_to: localhost
  loop: "{{ longhorn_disk_keys.stdout_lines | default([]) }}"
  when:
    - longhorn_node_check.rc == 0
    - longhorn_disk_keys.stdout_lines | default([]) | length > 0
    - replica_count_before.stdout | int > 0
  run_once: true
  changed_when: true

- name: Wait for all replicas to evacuate (up to 30 min)
  ansible.builtin.shell: |
    kubectl get node.longhorn.io {{ target_host }} -n longhorn-system \
      -o json | python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    total = sum(
        len(disk.get('scheduledReplica', {}))
        for disk in d.get('status', {}).get('diskStatus', {}).values()
    )
    print(total)
    "
  delegate_to: localhost
  register: replica_count
  until: replica_count.stdout | int == 0
  retries: 360
  delay: 5
  changed_when: false
  when:
    - longhorn_node_check.rc == 0
    - replica_count_before.stdout | int > 0
  run_once: true

- name: Eviction complete
  ansible.builtin.debug:
    msg: >-
      Longhorn eviction complete for {{ target_host }} —
      all {{ replica_count_before.stdout }} replicas migrated off the node.
  when:
    - longhorn_node_check.rc == 0
    - replica_count_before.stdout | int > 0
  run_once: true
