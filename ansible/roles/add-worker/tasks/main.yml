---
- name: Display worker addition plan
  ansible.builtin.debug:
    msg: |
      ============================================================
      Adding Worker Node to Kubernetes Cluster
      ============================================================
      Target: {{ target_host }}

      Steps:
      1. Join worker to cluster
      2. Apply node labels (topology, disk type, etc.)
      3. Verify node is Ready
      ============================================================
  delegate_to: localhost
  run_once: true

- name: Join worker node to cluster
  ansible.builtin.include_role:
    name: worker-join

- name: Apply node labels
  ansible.builtin.include_role:
    name: node-labels

- name: Verify worker node status
  ansible.builtin.command: kubectl get node {{ inventory_hostname }} -o wide
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: node_status
  changed_when: false

- name: Display node status
  ansible.builtin.debug:
    msg: "{{ node_status.stdout_lines }}"

- name: Success message
  ansible.builtin.debug:
    msg: |
      ============================================================
      ✅ Worker Node Added Successfully!
      ============================================================
      Node: {{ target_host }}

      Verify with:
        kubectl get nodes
        kubectl get pods -A -o wide --field-selector spec.nodeName={{ target_host }}
      ============================================================
