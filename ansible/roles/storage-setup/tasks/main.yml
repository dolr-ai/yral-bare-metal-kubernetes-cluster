---
# Storage Setup - Prepares node-local disk resources according to the node's role.
#
# WORKER NODES — Ceph OSD preparation:
#   Workers are Rook/Ceph OSD nodes.  installimage installs a 50 GB btrfs root on
#   one of the two NVMe drives (whichever the rescue kernel enumerates as nvme0n1).
#   The rescue kernel and the production Ubuntu kernel may enumerate PCIe NVMe slots
#   in different orders, so the OS may land on nvme0n1 OR nvme1n1 after reboot.
#   This role detects the OS drive at runtime (via findmnt + lsblk) and:
#     • Adds a GPT partition labelled "ceph-osd" to the OS drive (free space after
#       the 50 GB root) — Rook uses this as OSD-A (~450 GB).
#     • Wipes the secondary NVMe drive clean — Rook uses this as OSD-B (~500 GB).
#   Total per worker: ~950 GB Ceph block storage.
#
# CONTROL PLANES — btrfs expansion + Longhorn data path:
#   Control planes are not Ceph OSD nodes and keep the full-disk btrfs layout.
#   nvme1n1 is joined into the btrfs RAID0 pool for maximum ephemeral/OS capacity.
#   The Longhorn data directory is created with nodatacow to prevent double-CoW
#   while Longhorn is still the CSI provider during the migration window.
#   Remove the Longhorn section once the Longhorn → Rook/Ceph migration is complete.

# ---------------------------------------------------------------------------
# WORKER PATH — Ceph OSD disk preparation

- name: "[worker] Prepare Ceph OSD disks"
  when: "'worker_nodes' in group_names"
  block:
    - name: "[worker] Install gdisk (provides sgdisk) for GPT partition management"
      ansible.builtin.apt:
        name: gdisk
        state: present
        update_cache: false

    - name: "[worker] Detect OS NVMe drive (the drive that contains /)"
      # findmnt returns the root partition device (e.g. /dev/nvme1n1p1); lsblk
      # strips the partition suffix to give the parent disk (e.g. nvme1n1).
      # The rescue kernel and the production Ubuntu kernel may enumerate NVMe PCIe
      # slots in different orders, so the OS drive is not always nvme0n1.
      ansible.builtin.shell: |
        set -o pipefail
        root_part=$(findmnt -n -o SOURCE /)
        lsblk -no pkname "$root_part"
      args:
        executable: /bin/bash
      register: worker_os_nvme_result
      changed_when: false

    - name: "[worker] Set OS NVMe drive fact"
      ansible.builtin.set_fact:
        worker_os_nvme: "{{ worker_os_nvme_result.stdout | trim }}"

    - name: "[worker] Detect secondary (raw) NVMe drive"
      # The raw drive is whichever NVMe device is NOT the OS drive.
      ansible.builtin.shell: |
        lsblk -d --noheadings -o NAME | grep '^nvme' | grep -v '^{{ worker_os_nvme }}$'
      register: worker_raw_nvme_result
      changed_when: false

    - name: "[worker] Set secondary NVMe drive fact"
      ansible.builtin.set_fact:
        worker_raw_nvme: "{{ worker_raw_nvme_result.stdout | trim }}"

    - name: "[worker] Display detected drive assignments"
      ansible.builtin.debug:
        msg: "OS drive: /dev/{{ worker_os_nvme }} | Raw OSD drive: /dev/{{ worker_raw_nvme }}"

    - name: "[worker] Check whether Rook OSD partition already exists on OS drive"
      # installimage always creates exactly 2 partitions (OS root + BIOS boot).
      # A third partition means the Rook OSD partition was already created.
      # This check avoids re-creating the partition on idempotent re-runs.
      ansible.builtin.shell: |
        PART_COUNT=$(lsblk -rno TYPE /dev/{{ worker_os_nvme }} | grep -c '^part$' 2>/dev/null || echo 0)
        [ "$PART_COUNT" -gt 2 ]
      register: ceph_part_check
      changed_when: false
      failed_when: false

    - name: "[worker] Create Rook OSD GPT partition on remaining OS drive free space"
      # install-ubuntu.sh uses FORCE_GPT 2 in the installimage autosetup config,
      # so the OS drive arrives as a GPT disk with the OS root partition (50 GiB)
      # and a BIOS boot partition (~1 MiB, auto-created by installimage for GRUB).
      # --new=0:0:0 creates the next available partition number, starting at the
      # first free sector and ending at the last usable sector — consuming all
      # space left after the 50 GiB OS root.
      #
      # CRITICAL: Do NOT use a partition name containing "ceph" (e.g. "ceph-osd").
      # ceph-volume inventory checks:  'ceph' in partlabel  to detect ceph-disk
      # partitions and marks them as "Used by ceph-disk", causing Rook to skip them
      # permanently. Use "rook-osd" — the Rook deviceFilter ("nvme") matches by
      # device name, not partition label.
      ansible.builtin.command: sgdisk --new=0:0:0 --change-name=0:rook-osd /dev/{{ worker_os_nvme }}
      when: ceph_part_check.rc != 0
      register: sgdisk_result

    - name: "[worker] Notify kernel of new partition table on OS drive"
      ansible.builtin.command: partprobe /dev/{{ worker_os_nvme }}
      when: sgdisk_result is changed

    - name: "[worker] Wipe stale signatures from the Rook OSD partition"
      # wipefs clears standard filesystem magic bytes but NOT bluestore labels.
      # Ceph 20.x (Tentacle) writes bluestore bdev labels at CAPACITY-BASED positions
      # within each device — specifically at 1 GiB, 10 GiB, and 100 GiB from the
      # device start (as a "bluestore block device\n" magic string + OSD UUID).
      # We zero all three capacity positions on the OSD partition AND the standard
      # start/end boundaries.
      #
      # Runs unconditionally: storage-setup executes during add-worker.yml
      # before the node joins, so no active Rook OSD is mounted on this
      # partition at this point.
      ansible.builtin.shell: |
        set -o pipefail
        PART=$(lsblk -rno NAME,PARTLABEL /dev/{{ worker_os_nvme }} | awk '$2=="rook-osd" {print "/dev/" $1}')
        [ -n "$PART" ] || { echo "rook-osd partition not found"; exit 1; }
        wipefs -af "$PART"
        # Zero start: clears primary bluestore label at offset 0 of partition
        dd if=/dev/zero of="$PART" bs=4M count=10 conv=fsync
        # Zero capacity-based label positions (1 GiB, 10 GiB, 100 GiB from partition start)
        # These are aligned to 4096-byte blocks so integer divide is exact
        dd if=/dev/zero of="$PART" bs=4096 count=2 seek=$(( 1073741824  / 4096 )) conv=fsync
        dd if=/dev/zero of="$PART" bs=4096 count=2 seek=$(( 10737418240 / 4096 )) conv=fsync
        dd if=/dev/zero of="$PART" bs=4096 count=2 seek=$(( 107374182400 / 4096 )) conv=fsync
        # Zero end: clears bluestore label at (partition_size - 4096)
        SECTORS=$(blockdev --getsz "$PART")
        dd if=/dev/zero of="$PART" bs=512 count=81920 seek=$(( SECTORS - 81920 )) conv=fsync
      args:
        executable: /bin/bash
      changed_when: true

    - name: "[worker] Zero capacity-based bluestore label positions on OS drive"
      # A previous Rook prepare job that used the whole OS disk as a raw bluestore
      # OSD writes labels at 1 GiB, 10 GiB, and 100 GiB from the DISK start.
      # The 1 GiB and 10 GiB positions fall inside the 50 GB OS root partition
      # (nvme1n1p1) and are overwritten by each fresh OS install — no action needed.
      # The 100 GiB position falls ~50 GiB inside nvme1n1p3 (partition starts at ~50 GB)
      # and is never touched by the OS or by the partition-level wipe above.
      # Must be zeroed via the whole-disk device path.
      # Also zero the disk tail (size-4096, in the GPT backup section) which the
      # OS install does not cover.
      ansible.builtin.shell: |
        SECTORS=$(blockdev --getsz /dev/{{ worker_os_nvme }})
        # Zero 100 GiB position on the whole disk (stale whole-disk OSD label inside p3)
        dd if=/dev/zero of=/dev/{{ worker_os_nvme }} bs=4096 count=2 seek=$(( 107374182400 / 4096 )) conv=fsync
        # Zero last 40 MB — clears bluestore label at disk tail (GPT backup area)
        dd if=/dev/zero of=/dev/{{ worker_os_nvme }} bs=512 count=81920 seek=$(( SECTORS - 81920 )) conv=fsync
      args:
        executable: /bin/bash
      changed_when: true

    - name: "[worker] Re-read partition table after signature wipe"
      ansible.builtin.command: partprobe /dev/{{ worker_os_nvme }}
      when: sgdisk_result is changed

    - name: "[worker] Verify Rook OSD partition was created on OS drive"
      ansible.builtin.shell: |
        PART_COUNT=$(lsblk -rno TYPE /dev/{{ worker_os_nvme }} | grep -c '^part$' 2>/dev/null || echo 0)
        [ "$PART_COUNT" -gt 2 ]
      register: ceph_part_verify
      changed_when: false
      failed_when: ceph_part_verify.rc != 0

    - name: "[worker] Display OS drive partition layout"
      ansible.builtin.shell: lsblk /dev/{{ worker_os_nvme }}
      changed_when: false
      register: os_nvme_layout

    - name: "[worker] Show OS drive partition layout"
      ansible.builtin.debug:
        msg: "{{ os_nvme_layout.stdout_lines }}"

    - name: "[worker] Wipe all filesystem signatures and zero raw drive bluestore positions"
      # wipefs clears known filesystem magic bytes.  dd then zeros the capacity-based
      # bluestore bdev label positions that ceph_volume scans on every raw device:
      #   • Offset 0 (40 MB): clears primary label + any GPT/filesystem header.
      #   • 1 GiB, 10 GiB, 100 GiB from disk start: exact capacity-based positions
      #     where Ceph 20.x bluestore writes (and reads) label copies.
      #   • device_size-4096 (last 40 MB): clears any label or backup GPT at disk tail.
      # Uses bs=4096 with pre-computed integer seeks to guarantee writes land on exact
      # GB boundaries (no rounding error from 512-byte sector arithmetic).
      # Always runs unconditionally: storage-setup runs before the node joins,
      # so no active Rook OSD exists on this drive.
      ansible.builtin.shell: |
        wipefs -af /dev/{{ worker_raw_nvme }}
        # Zero first 40 MB — clears primary bluestore label at offset 0
        dd if=/dev/zero of=/dev/{{ worker_raw_nvme }} bs=4M count=10 conv=fsync
        # Zero capacity-based label positions (exact integer seeks at bs=4096)
        dd if=/dev/zero of=/dev/{{ worker_raw_nvme }} bs=4096 count=2 seek=$(( 1073741824   / 4096 )) conv=fsync
        dd if=/dev/zero of=/dev/{{ worker_raw_nvme }} bs=4096 count=2 seek=$(( 10737418240  / 4096 )) conv=fsync
        dd if=/dev/zero of=/dev/{{ worker_raw_nvme }} bs=4096 count=2 seek=$(( 107374182400 / 4096 )) conv=fsync
        # Zero last 40 MB — clears any label at disk tail / GPT backup area
        SECTORS=$(blockdev --getsz /dev/{{ worker_raw_nvme }})
        dd if=/dev/zero of=/dev/{{ worker_raw_nvme }} bs=512 count=81920 seek=$(( SECTORS - 81920 )) conv=fsync
      args:
        executable: /bin/bash
      changed_when: true

    - name: "[worker] Remove stale Rook OSD data directories"
      # ceph-volume raw list reads /var/lib/rook/rook-ceph/<clusterid>_<uuid>/
      # to identify which block device each OSD UUID belongs to.  If these dirs
      # survive a node reprovision, ceph-volume will re-report the old UUID→device
      # mappings (including any wrongly-assigned OSD on the whole OS disk) even
      # after the disks are fully zeroed — because it is reading the host-path
      # metadata, not the disk bytes.  Delete the cluster-specific OSD dirs and
      # recreate the parent so Rook starts from a clean slate.
      # /var/lib/rook/rook-ceph/<clusterid>_<osd-uuid>/ only — do NOT delete
      # the entire /var/lib/rook tree as Rook may share other state there.
      ansible.builtin.shell: |
        if [ -d /var/lib/rook/rook-ceph ]; then
          # Remove only the UUID-named OSD dirs (format: <clusterid>_<uuid>)
          find /var/lib/rook/rook-ceph -maxdepth 1 -type d \
            -regextype posix-extended \
            -regex '.*/[0-9a-f-]+_[0-9a-f-]+$' \
            -exec rm -rf {} +
        fi
      args:
        executable: /bin/bash
      changed_when: true

    - name: "[worker] Create Rook data directory"
      # Rook stores its own metadata (e.g. keyring, config) in dataDirHostPath.
      # Must exist before the Rook OSD prepare job runs on this node.
      ansible.builtin.file:
        path: /var/lib/rook
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "[worker] Display Ceph OSD disk summary"
      ansible.builtin.debug:
        msg: >
          Worker {{ inventory_hostname }} Ceph OSD disks prepared:
          {{ worker_os_nvme }} — OS root (50 GB) + ceph-osd GPT partition (~450 GB);
          {{ worker_raw_nvme }} — raw, ready for Rook OSD discovery (~500 GB).
          Total Ceph capacity on this node: ~950 GB.

# ---------------------------------------------------------------------------
# CONTROL PLANE PATH — btrfs expansion + Longhorn data path

- name: "[control-plane] Prepare Longhorn data directory and expand btrfs"
  when: "'worker_nodes' not in group_names"
  block:
    # NOTE: Remove the next three tasks once Longhorn is fully removed.
    - name: "[control-plane] Create Longhorn data directory"
      ansible.builtin.file:
        path: /var/lib/longhorn
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "[control-plane] Disable btrfs Copy-on-Write for Longhorn data directory"
      # nodatacow can only be set on an empty directory on btrfs; the attribute is
      # inherited by all files created inside it.
      # Expected lsattr output: ---------------C-- /var/lib/longhorn
      ansible.builtin.command: chattr +C /var/lib/longhorn
      register: chattr_result
      changed_when: chattr_result.rc == 0
      failed_when: chattr_result.rc != 0

    - name: "[control-plane] Verify nodatacow is set on Longhorn data directory"
      ansible.builtin.command: lsattr -d /var/lib/longhorn
      register: lsattr_result
      changed_when: false

    - name: "[control-plane] Assert nodatacow flag is present"
      ansible.builtin.assert:
        that: "'C' in lsattr_result.stdout"
        fail_msg: "nodatacow (chattr +C) was not set on /var/lib/longhorn — Longhorn volumes will suffer double-CoW performance degradation on btrfs"
        success_msg: "nodatacow confirmed on /var/lib/longhorn: {{ lsattr_result.stdout }}"

    # Expand btrfs to the second drive so the full ~1 TB of NVMe capacity is
    # available for ephemeral storage, kubelet image cache, and containerd.
    - name: "[control-plane] Get list of all disk devices"
      ansible.builtin.shell: lsblk -d -o NAME,TYPE | grep disk | awk '{print $1}'
      register: disk_list
      changed_when: false

    - name: "[control-plane] Display available disks"
      ansible.builtin.debug:
        msg: "Available disks: {{ disk_list.stdout_lines }}"

    - name: "[control-plane] Check if server has multiple drives"
      ansible.builtin.set_fact:
        has_multiple_drives: "{{ disk_list.stdout_lines | length > 1 }}"

    - name: "[control-plane] Skip btrfs expansion — only one drive detected"
      ansible.builtin.debug:
        msg: "Only one drive detected. Skipping btrfs expansion."
      when: not has_multiple_drives

    - name: "[control-plane] Expand btrfs to second drive"
      when: has_multiple_drives
      block:
        - name: "[control-plane] Check if root filesystem is btrfs"
          ansible.builtin.shell: df -T / | tail -1 | awk '{print $2}'
          register: root_fs_type
          changed_when: false

        - name: "[control-plane] Display root filesystem type"
          ansible.builtin.debug:
            msg: "Root filesystem type: {{ root_fs_type.stdout }}"

        - name: "[control-plane] Skip — root is not btrfs"
          ansible.builtin.debug:
            msg: "Root filesystem is {{ root_fs_type.stdout }}, not btrfs. Skipping btrfs expansion."
          when: root_fs_type.stdout != "btrfs"

        - name: "[control-plane] Get current btrfs devices"
          ansible.builtin.shell: btrfs filesystem show / | grep -oP '/dev/\S+' | sed 's|/dev/||' | sort
          register: btrfs_devices
          changed_when: false
          when: root_fs_type.stdout == "btrfs"

        - name: "[control-plane] Display current btrfs devices"
          ansible.builtin.debug:
            msg: "Current btrfs devices: {{ btrfs_devices.stdout_lines }}"
          when: root_fs_type.stdout == "btrfs"

        - name: "[control-plane] Add second drive to btrfs RAID0 pool"
          when: root_fs_type.stdout == "btrfs" and btrfs_devices.stdout_lines | length < 2
          block:
            - name: "[control-plane] Get root base device name"
              ansible.builtin.shell: |
                set -o pipefail && root_dev=$(df / | tail -1 | awk '{print $1}')
                if [[ $root_dev =~ nvme ]]; then
                  echo "$root_dev" | sed 's/p[0-9]*$//'
                else
                  echo "$root_dev" | sed 's/[0-9]*$//'
                fi
              args:
                executable: /bin/bash
              register: root_device_raw
              changed_when: false

            - name: "[control-plane] Extract base device name"
              ansible.builtin.set_fact:
                root_base_device: "{{ root_device_raw.stdout | basename }}"

            - name: "[control-plane] Display root base device"
              ansible.builtin.debug:
                msg: "Root filesystem is on base device: {{ root_base_device }}"

            - name: "[control-plane] Find available unused drive"
              ansible.builtin.shell: |
                set -o pipefail && all_disks=({{ disk_list.stdout_lines | join(' ') }})
                root_base="{{ root_base_device }}"
                for disk in "${all_disks[@]}"; do
                  if [[ "$disk" != "$root_base" ]]; then
                    echo "$disk"
                    exit 0
                  fi
                done
              args:
                executable: /bin/bash
              register: available_drive_result
              changed_when: false
              failed_when: false

            - name: "[control-plane] Set second drive fact"
              ansible.builtin.set_fact:
                second_drive: "{{ available_drive_result.stdout | trim }}"
              when: available_drive_result.stdout != ""

            - name: "[control-plane] Display available drive"
              ansible.builtin.debug:
                msg: "Available unused drive: {{ second_drive }}"
              when: second_drive is defined and second_drive != ""

            - name: "[control-plane] No unused drive found — skip expansion"
              ansible.builtin.debug:
                msg: "No unused drive found. All drives are already in use."
              when: second_drive is not defined or second_drive == ""

            - name: "[control-plane] Check if second drive device exists"
              ansible.builtin.stat:
                path: "/dev/{{ second_drive }}"
              register: second_drive_stat
              when: second_drive is defined and second_drive != ""

            - name: "[control-plane] Wipe filesystem signatures from second drive"
              ansible.builtin.command: wipefs -a /dev/{{ second_drive }}
              when: second_drive is defined and second_drive != "" and second_drive_stat.stat.exists
              register: wipe_result

            - name: "[control-plane] Create GPT partition table on second drive"
              ansible.builtin.command: parted /dev/{{ second_drive }} mklabel gpt
              when: second_drive is defined and second_drive != "" and second_drive_stat.stat.exists and wipe_result.changed

            - name: "[control-plane] Add second drive to btrfs filesystem"
              ansible.builtin.command: btrfs device add -f /dev/{{ second_drive }} /
              when: second_drive is defined and second_drive != "" and second_drive_stat.stat.exists and wipe_result.changed
              register: btrfs_add

            - name: "[control-plane] Record whether btrfs device was added"
              ansible.builtin.set_fact:
                btrfs_device_added: "{{ btrfs_add is changed }}"

            - name: "[control-plane] Balance btrfs to RAID0 data / DUP metadata"
              when: btrfs_device_added
              block:
                - name: "[control-plane] Show btrfs filesystem before balance"
                  ansible.builtin.command: btrfs filesystem show
                  changed_when: false
                  register: btrfs_before

                - name: "[control-plane] Display pre-balance state"
                  ansible.builtin.debug:
                    msg: "{{ btrfs_before.stdout_lines }}"

                - name: "[control-plane] Convert btrfs data to RAID0 and start balance"
                  # -dconvert=raid0 : stripe data across both NVMe drives for full
                  #                   combined capacity and maximum sequential I/O.
                  # -mconvert=dup   : mirror metadata on both drives so a single bad
                  #                   metadata chunk does not corrupt the filesystem.
                  # Longhorn/Rook provides cross-node redundancy; RAID0 here is safe.
                  ansible.builtin.command: btrfs balance start -dconvert=raid0 -mconvert=dup /
                  async: 3600
                  poll: 30

                - name: "[control-plane] Show btrfs filesystem after balance"
                  ansible.builtin.command: btrfs filesystem show
                  changed_when: false
                  register: btrfs_after

                - name: "[control-plane] Display post-balance state"
                  ansible.builtin.debug:
                    msg: "{{ btrfs_after.stdout_lines }}"

                - name: "[control-plane] Display disk usage after expansion"
                  ansible.builtin.command: df -h /
                  changed_when: false
                  register: df_output

                - name: "[control-plane] Show disk usage"
                  ansible.builtin.debug:
                    msg: "{{ df_output.stdout_lines }}"

                - name: "[control-plane] Display btrfs filesystem usage"
                  ansible.builtin.command: btrfs filesystem usage /
                  changed_when: false
                  register: btrfs_usage

                - name: "[control-plane] Show btrfs usage"
                  ansible.builtin.debug:
                    msg: "{{ btrfs_usage.stdout_lines }}"

                - name: "[control-plane] Success — btrfs expanded to RAID0"
                  ansible.builtin.debug:
                    msg: "Successfully expanded btrfs filesystem to /dev/{{ second_drive }} with RAID0 data striping"
