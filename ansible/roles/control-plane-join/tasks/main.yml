---
- name: Join control plane node
  block:
    - name: Upload control plane certificates on first control plane
      ansible.builtin.shell: |
        kubeadm init phase upload-certs --upload-certs 2>/dev/null | grep -E '^[a-f0-9]{64}$'
      delegate_to: "{{ (groups['control_plane'] | reject('equalto', inventory_hostname) | list)[0] }}"
      register: certificate_key

    - name: Generate control plane join command
      ansible.builtin.shell: |
        kubeadm token create --print-join-command --certificate-key {{ certificate_key.stdout }}
      delegate_to: "{{ (groups['control_plane'] | reject('equalto', inventory_hostname) | list)[0] }}"
      register: join_command

    - name: Check kubeadm-config ClusterConfiguration kubernetesVersion
      ansible.builtin.shell: |
        kubectl get configmap kubeadm-config -n kube-system -o jsonpath='{.data.ClusterConfiguration}' 2>/dev/null | grep -oP 'kubernetesVersion:\s*\K.*' | tr -d ' '
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ (groups['control_plane'] | reject('equalto', inventory_hostname) | list)[0] }}"
      register: cluster_kubernetes_version
      changed_when: false

    - name: Display cluster kubeadm-config version
      ansible.builtin.debug:
        msg: "Cluster kubeadm-config version: {{ cluster_kubernetes_version.stdout }}, installed kubeadm version: v{{ kubernetes_version }}"

    - name: Upgrade cluster config to match installed kubeadm version
      ansible.builtin.command: >
        kubeadm upgrade apply v{{ kubernetes_version }} --yes
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ (groups['control_plane'] | reject('equalto', inventory_hostname) | list)[0] }}"
      register: kubeadm_upgrade
      when: cluster_kubernetes_version.stdout != "v" ~ kubernetes_version

    - name: Display kubeadm upgrade result
      ansible.builtin.debug:
        msg: "{{ kubeadm_upgrade.stdout_lines }}"
      when: cluster_kubernetes_version.stdout != "v" ~ kubernetes_version

    - name: Build final join command
      ansible.builtin.set_fact:
        join_command_final: >-
          {{ join_command.stdout }}
          {{ '' if '--control-plane' in join_command.stdout else '--control-plane' }}
          {{ '' if '--apiserver-advertise-address' in join_command.stdout else '--apiserver-advertise-address=' + ansible_facts['default_ipv4']['address'] }}

    - name: Join as control plane
      ansible.builtin.command: "{{ join_command_final }}"
      register: join_result

    - name: Display join result
      ansible.builtin.debug:
        msg: "{{ join_result.stdout_lines }}"

    - name: Create .kube directory
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0755"

    - name: Copy admin.conf to .kube/config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"

- name: Add CP A record to Cloudflare DNS after successful join
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      type: "A"
      name: "{{ kubernetes_api_hostname }}"
      content: "{{ hostvars[inventory_hostname]['ansible_host'] }}"
      ttl: 1
      proxied: false
    status_code: 200
  delegate_to: localhost
  register: control_plane_join_cf_result
  changed_when: control_plane_join_cf_result.status == 200

- name: Display Cloudflare DNS registration result
  ansible.builtin.debug:
    msg: >-
      Added A record: {{ kubernetes_api_hostname }} → {{ hostvars[inventory_hostname]['ansible_host'] }}
      (record id: {{ control_plane_join_cf_result.json.result.id }})

- name: Add CP app wildcard A record to Cloudflare DNS after successful join
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      type: "A"
      name: "{{ cloudflare_app_wildcard_hostname }}"
      content: "{{ hostvars[inventory_hostname]['ansible_host'] }}"
      ttl: 1
      proxied: true
    status_code: 200
  delegate_to: localhost
  register: control_plane_join_cf_wildcard_result
  changed_when: control_plane_join_cf_wildcard_result.status == 200

- name: Display Cloudflare app wildcard DNS registration result
  ansible.builtin.debug:
    msg: >-
      Added A record: {{ cloudflare_app_wildcard_hostname }} → {{ hostvars[inventory_hostname]['ansible_host'] }}
      (record id: {{ control_plane_join_cf_wildcard_result.json.result.id }})

- name: Remove NoSchedule taint for stacked mode
  ansible.builtin.command: >
    kubectl taint node {{ inventory_hostname }}
    node-role.kubernetes.io/control-plane:NoSchedule-
  delegate_to: "{{ (groups['control_plane'] | reject('equalto', inventory_hostname) | list)[0] }}"
  register: taint_removal_result
  changed_when: "'untainted' in taint_removal_result.stdout"
  failed_when: "'not found' in taint_removal_result.stderr and 'untainted' not in taint_removal_result.stdout"
  when: stacked_mode | bool

- name: Display taint removal result (stacked mode)
  ansible.builtin.debug:
    msg: >-
      Stacked mode: removed NoSchedule taint from {{ inventory_hostname }}.
      Workloads can now schedule on this control plane node.
  when: stacked_mode | bool
