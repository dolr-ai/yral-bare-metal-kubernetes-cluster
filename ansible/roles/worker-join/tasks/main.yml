---
- name: Check if node is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf_stat

- name: Skip if already joined
  ansible.builtin.debug:
    msg: "Node {{ ansible_facts['hostname'] }} is already part of the cluster"
  when: kubelet_conf_stat.stat.exists

- name: Join worker node to cluster
  when: not kubelet_conf_stat.stat.exists
  block:
    - name: Use cached join command from first control plane if available
      ansible.builtin.set_fact:
        join_command: "{{ hostvars[groups['control_plane'][0]]['worker_join_command'] }}"
      when: hostvars[groups['control_plane'][0]]['worker_join_command'] is defined

    - name: Generate join command from first control plane
      ansible.builtin.command: kubeadm token create --print-join-command
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: join_command_dynamic
      changed_when: true   # token create always mints a new bootstrap token
      when: join_command is not defined

    - name: Set join command from generated output
      ansible.builtin.set_fact:
        join_command: "{{ join_command_dynamic.stdout }}"
      when: join_command is not defined

    - name: Join cluster
      ansible.builtin.command: "{{ join_command }}"
      register: join_result
      changed_when: true   # kubeadm join always rewrites kubelet state

    - name: Display join result
      ansible.builtin.debug:
        msg: "{{ join_result.stdout_lines }}"

- name: Add worker app wildcard A record to Cloudflare DNS after successful join
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      type: "A"
      name: "{{ cloudflare_app_wildcard_hostname }}"
      content: "{{ hostvars[inventory_hostname]['ansible_host'] }}"
      ttl: 1
      proxied: true
    status_code: [200, 400]
  delegate_to: localhost
  register: worker_join_cf_result
  changed_when: worker_join_cf_result.status == 200
  failed_when: >
    worker_join_cf_result.status != 200 and
    (worker_join_cf_result.status != 400 or
     'identical record already exists' not in (worker_join_cf_result.json.errors | map(attribute='message') | join(' ')))

- name: Display Cloudflare DNS registration result
  ansible.builtin.debug:
    msg: >-
      Added A record: {{ cloudflare_app_wildcard_hostname }} → {{ hostvars[inventory_hostname]['ansible_host'] }}
      {% if worker_join_cf_result.status == 200 %}(record id: {{ worker_join_cf_result.json.result.id }}){% else %}(already exists){% endif %}

- name: Delete stale Rook OSD prepare job for this node (cleanup from Ceph→Longhorn migration)
  ansible.builtin.command: >
    kubectl delete job rook-ceph-osd-prepare-{{ inventory_hostname }}
    -n rook-ceph --ignore-not-found
  delegate_to: localhost
  changed_when: true
  failed_when: false
