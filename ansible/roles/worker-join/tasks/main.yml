---
- name: Check if node is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf_stat

- name: Skip if already joined
  ansible.builtin.debug:
    msg: "Node {{ ansible_hostname }} is already part of the cluster"
  when: kubelet_conf_stat.stat.exists

- name: Join worker node to cluster
  when: not kubelet_conf_stat.stat.exists
  block:
    - name: Use cached join command from first control plane if available
      ansible.builtin.set_fact:
        join_command: "{{ hostvars[groups['control_plane'][0]]['worker_join_command'] }}"
      when: hostvars[groups['control_plane'][0]]['worker_join_command'] is defined

    - name: Generate join command from first control plane
      ansible.builtin.shell: kubeadm token create --print-join-command
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: join_command_dynamic
      when: join_command is not defined

    - name: Set join command from generated output
      ansible.builtin.set_fact:
        join_command: "{{ join_command_dynamic.stdout }}"
      when: join_command is not defined

    - name: Join cluster
      ansible.builtin.command: "{{ join_command }}"
      register: join_result

    - name: Display join result
      ansible.builtin.debug:
        msg: "{{ join_result.stdout_lines }}"
