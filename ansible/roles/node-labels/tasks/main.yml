---
- name: Wait for node to be registered
  ansible.builtin.shell: kubectl get node {{ ansible_hostname }} --no-headers 2>/dev/null | wc -l
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: node_check
  until: node_check.stdout | int > 0
  retries: 30
  delay: 10
  delegate_to: "{{ groups['control_plane'][0] }}"
  changed_when: false

- name: Apply topology labels to node
  ansible.builtin.command: >
    kubectl label node {{ ansible_hostname }}
    topology.kubernetes.io/zone={{ datacenter }}
    topology.kubernetes.io/region={{ region }}
    topology.kubernetes.io/country={{ country }}
    --overwrite
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: label_result
  changed_when: "'labeled' in label_result.stdout"

- name: Verify control plane taint
  ansible.builtin.command: kubectl get node {{ ansible_hostname }} -o jsonpath='{.spec.taints}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: taint_check
  changed_when: false
  when: node_type == "control-plane"

- name: Display taint status for control plane
  ansible.builtin.debug:
    msg:
      - "Control plane node {{ ansible_hostname }} taints:"
      - "{{ taint_check.stdout }}"
  when: node_type == "control-plane"

- name: Verify node labels
  ansible.builtin.command: kubectl get node {{ ansible_hostname }} --show-labels
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: labels_output
  changed_when: false
- name: Display node labels
  ansible.builtin.debug:
    msg: "{{ labels_output.stdout_lines }}"

- name: Get nodes by topology
  ansible.builtin.command: kubectl get nodes -L topology.kubernetes.io/zone,topology.kubernetes.io/region
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: topology_output
  changed_when: false
  run_once: true

- name: Display topology summary
  ansible.builtin.debug:
    msg:
      - "✅ Topology labels applied to all nodes"
      - ""
      - "{{ topology_output.stdout_lines }}"
      - ""
      - "Cluster distribution:"
      - "  - Control planes: 3 nodes in HEL1-DC2 (Helsinki)"
      - "  - Workers: 9 nodes in FSN1 (Falkenstein), 1 node in HEL1-DC2 (Helsinki)"
  run_once: true
