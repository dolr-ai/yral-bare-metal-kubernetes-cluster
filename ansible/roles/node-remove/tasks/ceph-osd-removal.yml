---
# Ceph OSD removal — safely remove the target node's OSDs from the Ceph cluster.
#
# Called from node-remove/tasks/main.yml BEFORE draining the node, while the
# node is still running and its OSDs are `up` so Ceph can rebalance data off
# them cleanly.
#
# Only runs for worker nodes (control planes don't have OSDs). Fails if the
# node has OSDs in the CRUSH map but they can't be found (parsing error).
# Skips silently only if Ceph is not installed or the node is not in the
# CRUSH map at all (already removed or never was a Ceph node).

- name: Find rook-ceph-tools pod name
  ansible.builtin.shell: |
    kubectl get pods -n rook-ceph -l app=rook-ceph-tools -o jsonpath='{.items[0].metadata.name}'
  register: ceph_tools_pod
  changed_when: false
  failed_when: false
  run_once: true

- name: Skip Ceph OSD removal if no toolbox pod found
  ansible.builtin.debug:
    msg: "rook-ceph-tools pod not found — Ceph may not be installed. Skipping OSD removal."
  when: ceph_tools_pod.stdout | trim == ""
  run_once: true

- name: Remove Ceph OSDs
  when: ceph_tools_pod.stdout | trim != ""
  block:
    - name: Check if node exists in CRUSH map
      ansible.builtin.shell: |
        kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph osd tree 2>/dev/null | \
        grep -E "[[:space:]]host {{ node_remove_k8s_name }}([[:space:]]|$)"
      register: ceph_node_in_crush
      changed_when: false
      failed_when: false
      run_once: true

    - name: Skip if node not in CRUSH map (already removed or never was a Ceph node)
      ansible.builtin.debug:
        msg: "Node {{ node_remove_k8s_name }} not found in Ceph CRUSH map — skipping OSD removal."
      when: ceph_node_in_crush.rc != 0
      run_once: true

    - name: Remove OSDs from Ceph cluster
      when: ceph_node_in_crush.rc == 0
      block:
        - name: Get OSD IDs for target node from CRUSH tree
          # Use python3 for reliable parsing of ceph osd tree output.
          # CRUSH tree format:
          #   ID   WEIGHT  TYPE NAME      STATUS  REWEIGHT  PRI-AFF
          #   -13  0.88    host worker-2
          #    4   ssd     0.46  osd.4    up      1.00000   1.00000
          # host is at fields[2], hostname at fields[3].
          # osd.N is at fields[3] on OSD lines.
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph osd tree 2>/dev/null | \
            python3 -c "
            import sys
            target = '{{ node_remove_k8s_name }}'
            in_host = False
            osd_ids = []
            for line in sys.stdin:
                fields = line.split()
                if not fields:
                    continue
                # Detect host line: 'ID WEIGHT host <hostname>'
                if len(fields) >= 4 and fields[2] == 'host':
                    in_host = (fields[3] == target)
                    continue
                # Detect OSD line: 'ID CLASS WEIGHT osd.N STATUS ...'
                if in_host and len(fields) >= 4 and fields[3].startswith('osd.'):
                    osd_ids.append(fields[3].replace('osd.', ''))
            print(' '.join(osd_ids) if osd_ids else '')
            "
          register: ceph_osd_ids_raw
          changed_when: false
          run_once: true

        - name: Set OSD IDs fact
          ansible.builtin.set_fact:
            ceph_osd_ids: "{{ ceph_osd_ids_raw.stdout.split() }}"
          run_once: true

        - name: Fail if node is in CRUSH map but no OSDs were found
          ansible.builtin.fail:
            msg: >-
              Node {{ node_remove_k8s_name }} is in the Ceph CRUSH map but no OSDs
              were found. This is likely a parsing error. Refusing to continue —
              investigate before draining the node. OSD IDs found: {{ ceph_osd_ids }}
          when: ceph_osd_ids | length == 0
          run_once: true

        - name: Display OSD removal plan
          ansible.builtin.debug:
            msg: |
              Ceph OSD removal: {{ node_remove_k8s_name }}
              OSDs to remove: {{ ceph_osd_ids | join(', ') }}
              Total: {{ ceph_osd_ids | length }} OSD(s)
          run_once: true
        - name: Set noout to prevent premature rebalance
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph osd set noout
          changed_when: true
          run_once: true

        - name: Mark each OSD out (triggers rebalance to other OSDs)
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph osd out {{ item }}
          loop: "{{ ceph_osd_ids }}"
          changed_when: true
          run_once: true

        - name: Unset noout to allow rebalance
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph osd unset noout
          changed_when: true
          run_once: true

        - name: Wait for all PGs to reach active+clean
          # ceph pg stat output format:
          #   161 pgs: 1 stale+active+clean, 160 active+clean; 825 GiB data, ...; 170 B/s rd, ...
          # Only the first semicolon-separated section contains PG states.
          # The rest is capacity/throughput info that never contains 'active+clean'.
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph pg stat 2>/dev/null | \
            python3 -c "
            import sys
            data = sys.stdin.read().strip()
            # Only check the first section (PG states) — ignore capacity/throughput
            pg_section = data.split(';')[0]
            if 'active+clean' in pg_section:
                # Check if all PG states are active+clean (allow stale+active+clean too)
                # A PG is healthy if it's active+clean, even with stale prefix
                states = [s.strip() for s in pg_section.split(':')[1].split(',') if s.strip()]
                non_clean = [s for s in states if 'active+clean' not in s]
                if not non_clean:
                    print('clean')
                else:
                    print('degraded: ' + ', '.join(non_clean))
            else:
                print('not_clean')
            "
          register: ceph_pg_status
          until: ceph_pg_status.stdout == "clean"
          retries: 120
          delay: 10
          changed_when: false
          run_once: true

        - name: PGs are active+clean
          ansible.builtin.debug:
            msg: "✅ All PGs active+clean — safe to purge OSDs"
          run_once: true

        - name: Mark each OSD down (required before purge — purge refuses if up)
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph osd down {{ item }}
          loop: "{{ ceph_osd_ids }}"
          changed_when: true
          run_once: true

        - name: Purge each OSD (destroys daemon + removes from CRUSH)
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- \
            ceph osd purge {{ item }} --yes-i-really-mean-it
          loop: "{{ ceph_osd_ids }}"
          changed_when: true
          run_once: true

        - name: Remove host bucket from CRUSH map
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- \
            ceph osd crush remove {{ node_remove_k8s_name }}
          register: crush_remove_result
          changed_when: true
          run_once: true

        - name: Verify Ceph health (fail on ERR, warn on WARN)
          # HEALTH_WARN is expected after OSD removal (degraded PGs during rebalance).
          # Only fail on HEALTH_ERR which indicates data loss or mon failure.
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph health 2>/dev/null
          register: ceph_health
          changed_when: false
          failed_when: "'ERR' in ceph_health.stdout"
          run_once: true

        - name: Display Ceph health
          ansible.builtin.debug:
            msg: "Ceph health after OSD removal: {{ ceph_health.stdout }}"
          run_once: true

        - name: OSD removal complete
          ansible.builtin.debug:
            msg: |
              ✅ Ceph OSDs removed for {{ node_remove_k8s_name }}: {{ ceph_osd_ids | join(', ') }}
              Ceph health: {{ ceph_health.stdout }}
          run_once: true