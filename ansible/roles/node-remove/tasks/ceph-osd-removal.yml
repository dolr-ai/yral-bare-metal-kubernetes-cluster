---
# Ceph OSD removal — safely remove the target node's OSDs from the Ceph cluster.
#
# Direct purge approach: mark OSDs out, wait for PGs to rebalance, verify
# safe-to-destroy, scale down deployments, purge OSDs, and remove host from
# CRUSH map. This is done directly via the Ceph toolbox rather than relying
# on Rook's removeOSDsIfOutAndSafeToRemove mechanism, which deadlocks when
# the operator's OSD update loop blocks (too many OSDs "not ok-to-stop").
#
# Called from node-remove/tasks/main.yml BEFORE draining the node, while the
# node is still running and its OSDs are `up` so Ceph can rebalance data off
# them cleanly.

- name: Find rook-ceph-tools pod name
  ansible.builtin.shell: |
    kubectl get pods -n rook-ceph -l app=rook-ceph-tools -o jsonpath='{.items[0].metadata.name}'
  register: ceph_tools_pod
  changed_when: false
  failed_when: false
  run_once: true

- name: Skip Ceph OSD removal if no toolbox pod found
  ansible.builtin.debug:
    msg: "rook-ceph-tools pod not found — Ceph may not be installed. Skipping OSD removal."
  when: ceph_tools_pod.stdout | trim == ""
  run_once: true

- name: Remove Ceph OSDs
  when: ceph_tools_pod.stdout | trim != ""
  block:
    - name: Check if node exists in CRUSH map
      ansible.builtin.shell: |
        kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph osd tree 2>/dev/null | \
        grep -E "[[:space:]]host {{ node_remove_k8s_name }}([[:space:]]|$)"
      register: ceph_node_in_crush
      changed_when: false
      failed_when: false
      run_once: true

    - name: Skip if node not in CRUSH map (already removed or never was a Ceph node)
      ansible.builtin.debug:
        msg: "Node {{ node_remove_k8s_name }} not found in Ceph CRUSH map — skipping OSD removal."
      when: ceph_node_in_crush.rc != 0
      run_once: true

    - name: Remove OSDs from Ceph cluster
      when: ceph_node_in_crush.rc == 0
      block:
        - name: Get OSD IDs for target node from CRUSH tree
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph osd tree 2>/dev/null | \
            python3 -c "
            import sys
            target = '{{ node_remove_k8s_name }}'
            in_host = False
            osd_id_set = set()
            for line in sys.stdin:
                fields = line.split()
                if not fields:
                    continue
                if len(fields) >= 4 and fields[2] == 'host':
                    in_host = (fields[3] == target)
                    continue
                if in_host and len(fields) >= 4 and fields[3].startswith('osd.'):
                    osd_id_set.add(fields[3].replace('osd.', ''))
            print(' '.join(sorted(osd_id_set, key=int)) if osd_id_set else '')
            "
          register: ceph_osd_ids_raw
          changed_when: false
          run_once: true

        - name: Set OSD IDs fact
          ansible.builtin.set_fact:
            ceph_osd_ids: "{{ ceph_osd_ids_raw.stdout.split() }}"
          run_once: true

        - name: Fail if node is in CRUSH map but no OSDs were found
          ansible.builtin.fail:
            msg: >-
              Node {{ node_remove_k8s_name }} is in the Ceph CRUSH map but no OSDs
              were found. This is likely a parsing error. Refusing to continue —
              investigate before draining the node. OSD IDs found: {{ ceph_osd_ids }}
          when: ceph_osd_ids | length == 0
          run_once: true

        - name: Display OSD removal plan
          ansible.builtin.debug:
            msg: |
              Ceph OSD removal: {{ node_remove_k8s_name }}
              OSDs to remove: {{ ceph_osd_ids | join(', ') }}
              Total: {{ ceph_osd_ids | length }} OSD(s)
              Method: Direct purge (scale down → purge → CRUSH rm)
          run_once: true

        # Step 1: Mark OSDs out — triggers Ceph to rebalance data to remaining OSDs.
        - name: Mark each OSD out (triggers rebalance to other OSDs)
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph osd out {{ item }}
          loop: "{{ ceph_osd_ids }}"
          changed_when: true
          run_once: true

        # Step 2: Wait for all PGs to reach active+clean (data fully rebalanced).
        - name: Wait for all PGs to reach active+clean
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph pg stat 2>/dev/null | \
            python3 -c "
            import sys
            data = sys.stdin.read().strip()
            pg_section = data.split(';')[0]
            if 'active+clean' in pg_section:
                states = [s.strip() for s in pg_section.split(':')[1].split(',') if s.strip()]
                non_clean = [s for s in states if 'active+clean' not in s]
                if not non_clean:
                    print('clean')
                else:
                    print('degraded: ' + ', '.join(non_clean))
            else:
                print('not_clean')
            "
          register: ceph_pg_status
          until: ceph_pg_status.stdout == "clean"
          retries: 120
          delay: 10
          changed_when: false
          run_once: true

        - name: PGs are active+clean
          ansible.builtin.debug:
            msg: "✅ All PGs active+clean — data rebalanced, OSDs safe to remove"
          run_once: true

        # Step 3: Verify OSDs are safe-to-destroy (Ceph confirms all data is replicated elsewhere).
        - name: Verify OSDs are safe-to-destroy
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- \
            ceph osd safe-to-destroy {{ ceph_osd_ids | join(' ') }} 2>&1
          register: ceph_safe_to_destroy
          changed_when: false
          failed_when: "'safe to destroy' not in ceph_safe_to_destroy.stdout.lower()"
          run_once: true

        - name: OSDs confirmed safe to destroy
          ansible.builtin.debug:
            msg: "✅ OSDs {{ ceph_osd_ids | join(', ') }} are safe to destroy — Rook operator will remove them"
          run_once: true

        # Step 4: Directly purge OSDs and remove from CRUSH.
        #
        # The Rook operator's removeOSDsIfOutAndSafeToRemove mechanism requires the
        # OSD health monitor goroutine to be running, but it only starts after the
        # OSD update loop completes — which blocks when too many OSDs are down
        # ("not ok-to-stop"). This deadlock means the operator never removes the
        # OSDs. The direct approach (scale down deployment, purge, remove from
        # CRUSH) is reliable and doesn't depend on the operator.
        #
        # Ref: https://rook.io/docs/rook/latest/Storage-Configuration/Advanced/ceph-osd-mgmt/
        - name: Scale down OSD deployments to force OSDs down
          ansible.builtin.shell: |
            kubectl -n rook-ceph scale deploy rook-ceph-osd-{{ item }} --replicas=0
          loop: "{{ ceph_osd_ids }}"
          changed_when: true
          run_once: true

        - name: Delete OSD deployments
          ansible.builtin.shell: |
            kubectl -n rook-ceph delete deploy rook-ceph-osd-{{ item }} --ignore-not-found
          loop: "{{ ceph_osd_ids }}"
          changed_when: true
          run_once: true

        - name: Purge OSDs from Ceph
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- \
            ceph osd purge {{ item }} --force --yes-i-really-mean-it
          loop: "{{ ceph_osd_ids }}"
          changed_when: true
          run_once: true

        - name: Remove host from CRUSH map
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- \
            ceph osd crush rm {{ node_remove_k8s_name }}
          changed_when: true
          run_once: true

        # Step 5: Wait for PGs to rebalance after CRUSH removal.
        - name: Wait for PGs to rebalance after CRUSH removal
          ansible.builtin.shell: |
            kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph pg stat 2>/dev/null | \
            python3 -c "
            import sys
            data = sys.stdin.read().strip()
            pg_section = data.split(';')[0]
            if 'active+clean' in pg_section:
                states = [s.strip() for s in pg_section.split(':')[1].split(',') if s.strip()]
                non_clean = [s for s in states if 'active+clean' not in s]
                if not non_clean:
                    print('clean')
                else:
                    print('degraded: ' + ', '.join(non_clean))
            else:
                print('not_clean')
            "
          register: ceph_pg_status_after_crush
          until: ceph_pg_status_after_crush.stdout == "clean"
          retries: 120
          delay: 10
          changed_when: false
          run_once: true

        - name: OSD removal complete
          ansible.builtin.debug:
            msg: |
              ✅ Ceph OSDs removed for {{ node_remove_k8s_name }}: {{ ceph_osd_ids | join(', ') }}
              Deployments scaled down and deleted, OSDs purged, host removed from CRUSH.
          run_once: true
