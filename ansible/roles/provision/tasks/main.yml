---
- name: Set server IP from inventory
  ansible.builtin.set_fact:
    provision_server_ip: "{{ ansible_host }}"
  run_once: true

- name: Display server information
  ansible.builtin.debug:
    msg: |
      ============================================================
      Provisioning Server: {{ inventory_hostname }}
      IP Address: {{ provision_server_ip }}
      ============================================================
  run_once: true

# Idempotency guard: if Ubuntu 24.04 is already running and responding,
# skip all provisioning steps (rescue mode, install, reboot).
- name: Check if Ubuntu 24.04 already running on server
  ansible.builtin.shell: |
    ssh -i /home/vscode/.ssh/hetzner-ansible-key \
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
      root@{{ provision_server_ip }} \
      'grep -q "Ubuntu 24" /etc/os-release 2>/dev/null && echo UBUNTU_RUNNING || echo NOT_UBUNTU'
  register: provision_os_check
  failed_when: false
  changed_when: false
  delegate_to: localhost
  run_once: true

- name: Display provision skip message
  ansible.builtin.debug:
    msg: "✅ Ubuntu 24.04 already running on {{ provision_server_ip }} — skipping provision (idempotent)."
  when: "'UBUNTU_RUNNING' in (provision_os_check.stdout | default(''))"
  run_once: true

- name: Set provision skip flag
  ansible.builtin.set_fact:
    provision_skip: "{{ 'UBUNTU_RUNNING' in (provision_os_check.stdout | default('')) }}"
  run_once: true

- name: Provision server (install Ubuntu from Hetzner rescue)
  when: not provision_skip
  run_once: true
  block:
    - name: Fetch SSH keys from Hetzner API
      ansible.builtin.uri:
        url: "https://robot-ws.your-server.de/key"
        method: GET
        user: "{{ hetzner_robot_api_user }}"
        password: "{{ hetzner_robot_api_password }}"
        force_basic_auth: true
        return_content: true
      register: hetzner_keys_response
      delegate_to: localhost

    - name: Build SSH key fingerprint mapping
      ansible.builtin.set_fact:
        provision_key_fingerprints: "{{ provision_key_fingerprints | default([]) + [item.key.fingerprint] }}"
      loop: "{{ hetzner_keys_response.json }}"
      when:
        - item.key.name | lower in provision_hetzner_ssh_keys or
          (item.key.name | lower).split() | intersect(provision_hetzner_ssh_keys) | length > 0
      loop_control:
        label: "{{ item.key.name }}"

    - name: Fail if SSH keys not found
      ansible.builtin.fail:
        msg: "Required SSH keys not found in Hetzner account. Please add: {{ provision_hetzner_ssh_keys }}"
      when: provision_key_fingerprints is not defined or provision_key_fingerprints | length == 0

    - name: Display SSH keys to be used
      ansible.builtin.debug:
        msg: "Using {{ provision_key_fingerprints | length }} SSH keys for rescue mode"

    - name: Build authorized_key query string
      ansible.builtin.set_fact:
        provision_authorized_keys_query: "{{ provision_key_fingerprints | map('regex_replace', '^(.*)$', 'authorized_key[]=\\1') | join('&') }}"

    - name: Activate rescue mode
      ansible.builtin.uri:
        url: "https://robot-ws.your-server.de/boot/{{ provision_server_ip }}/rescue?{{ provision_authorized_keys_query }}"
        method: POST
        user: "{{ hetzner_robot_api_user }}"
        password: "{{ hetzner_robot_api_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          os: linux
          arch: 64
        return_content: true
      register: rescue_response
      delegate_to: localhost

    - name: Display rescue mode activation
      ansible.builtin.debug:
        msg: "✅ Rescue mode activated for {{ provision_server_ip }}"

    - name: Trigger hardware reset
      ansible.builtin.uri:
        url: "https://robot-ws.your-server.de/reset/{{ provision_server_ip }}"
        method: POST
        user: "{{ hetzner_robot_api_user }}"
        password: "{{ hetzner_robot_api_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          type: hw
        status_code: [200, 201]
      register: reset_response
      delegate_to: localhost

    - name: Wait for server to boot into rescue mode
      ansible.builtin.wait_for:
        host: "{{ provision_server_ip }}"
        port: 22
        delay: 30
        timeout: 300
        state: started
      delegate_to: localhost

    - name: Verify rescue system is booted
      ansible.builtin.shell: |
        ssh -i /home/vscode/.ssh/hetzner-ansible-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
          root@{{ provision_server_ip }} \
          "test -f /root/.oldroot/nfs/install/installimage && echo 'rescue_ready'"
      register: rescue_check
      retries: 12
      delay: 5
      until: rescue_check.stdout == 'rescue_ready'
      changed_when: false
      delegate_to: localhost

    - name: Detect drive type
      ansible.builtin.shell: |
        ssh -i /home/vscode/.ssh/hetzner-ansible-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          root@{{ provision_server_ip }} \
          "lsblk -d -o NAME 2>/dev/null"
      register: provision_drive_list
      changed_when: false
      delegate_to: localhost

    - name: Determine drive to use
      ansible.builtin.set_fact:
        provision_drive_to_use: "{{ 'nvme0n1' if 'nvme0n1' in provision_drive_list.stdout else 'sda' }}"

    - name: Display drive information
      ansible.builtin.debug:
        msg: "Detected drive type: {{ provision_drive_to_use }}"

    - name: Run Ubuntu installation script
      ansible.builtin.shell: |
        ssh -i /home/vscode/.ssh/hetzner-ansible-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          root@{{ provision_server_ip }} \
          "curl -fsSL https://raw.githubusercontent.com/{{ provision_github_repository }}/main/scripts/install-ubuntu.sh | \
          MACHINE_HOSTNAME='{{ inventory_hostname }}' \
          DRIVE_TO_USE='{{ provision_drive_to_use }}' bash"
      register: install_output
      failed_when: false
      changed_when: true
      delegate_to: localhost

    - name: Check installation success
      ansible.builtin.fail:
        msg: "Installation failed - INSTALLATION COMPLETE marker not found"
      when: "'INSTALLATION COMPLETE' not in install_output.stdout"

    - name: Reboot server into Ubuntu
      ansible.builtin.shell: |
        ssh -i /home/vscode/.ssh/hetzner-ansible-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          root@{{ provision_server_ip }} "reboot" || true
      changed_when: true
      delegate_to: localhost

    - name: Wait for server to reboot
      ansible.builtin.wait_for:
        host: "{{ provision_server_ip }}"
        port: 22
        delay: 60
        timeout: 600
        state: started
      delegate_to: localhost

    - name: Verify Ubuntu is running
      ansible.builtin.shell: |
        ssh -i /home/vscode/.ssh/hetzner-ansible-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
          root@{{ provision_server_ip }} \
          "cat /etc/os-release | grep Ubuntu"
      register: ubuntu_check
      retries: 24
      delay: 5
      until: ubuntu_check.rc == 0
      delegate_to: localhost
      changed_when: false
