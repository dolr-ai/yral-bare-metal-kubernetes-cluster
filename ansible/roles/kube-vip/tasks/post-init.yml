---
# post-init.yml: Apply kube-vip RBAC and ConfigMap AFTER kubeadm init.
# Requires a running cluster (kubectl access via /etc/kubernetes/admin.conf).

- name: Wait for kube-vip to start and bind VIP (port 6443 reachable via VIP)
  ansible.builtin.wait_for:
    host: "{{ control_plane_vip }}"
    port: 6443
    timeout: 120
    delay: 5
    msg: "Timed out waiting for kube-vip to bind VIP {{ control_plane_vip }}:6443"

- name: Create kube-vip RBAC manifest
  ansible.builtin.copy:
    content: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: kube-vip
        namespace: kube-system
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: kube-vip-role
      rules:
        - apiGroups: [""]
          resources: ["services", "services/status", "nodes", "endpoints"]
          verbs: ["list", "get", "watch", "update"]
        - apiGroups: ["coordination.k8s.io"]
          resources: ["leases"]
          verbs: ["list", "get", "watch", "update", "create"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: kube-vip-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: kube-vip-role
      subjects:
      - kind: ServiceAccount
        name: kube-vip
        namespace: kube-system
    dest: /tmp/kube-vip-rbac.yaml
    mode: "0644"

- name: Create kube-vip cloud provider ConfigMap template
  ansible.builtin.copy:
    content: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kubevip
        namespace: kube-system
      data:
        range-global: {{ loadbalancer_ip_range }}
        cidr-global: "32"
    dest: /tmp/kube-vip-configmap.yaml
    mode: "0644"
  when: loadbalancer_ip_range is defined

- name: Apply kube-vip RBAC
  ansible.builtin.command: kubectl apply -f /tmp/kube-vip-rbac.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kube_vip_rbac_result
  changed_when: "'configured' in kube_vip_rbac_result.stdout or 'created' in kube_vip_rbac_result.stdout"

- name: Apply kube-vip ConfigMap
  ansible.builtin.command: kubectl apply -f /tmp/kube-vip-configmap.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kube_vip_configmap_result
  changed_when: "'configured' in kube_vip_configmap_result.stdout or 'created' in kube_vip_configmap_result.stdout"
  when: loadbalancer_ip_range is defined

# Now that RBAC is in place, regenerate the manifest with leader election
# enabled and admin.conf (standard, limited-privilege kubeconfig).
# This is the production configuration used long-term.
- name: Detect primary network interface for production manifest
  ansible.builtin.shell: ip route | grep default | awk '{print $5}' | head -n1
  register: kube_vip_prod_interface
  changed_when: false
  when: kube_vip_interface is not defined

- name: Set kube-vip production interface
  ansible.builtin.set_fact:
    kube_vip_interface_production: "{{ kube_vip_interface | default(kube_vip_prod_interface.stdout | default(kube_vip_interface_effective | default(''))) }}"

- name: Pull kube-vip container image
  ansible.builtin.command: ctr image pull ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
  register: kube_vip_pull_result
  changed_when: "'Downloaded' in kube_vip_pull_result.stderr or 'Downloaded' in kube_vip_pull_result.stdout"

- name: Generate kube-vip production manifest (leader election + admin.conf)
  ansible.builtin.shell: |
    ctr run --rm --net-host ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }} vip \
      /kube-vip manifest pod \
      --interface {{ kube_vip_interface_production }} \
      --address {{ control_plane_vip }} \
      --controlplane \
      --services \
      --arp \
      --leaderElection \
      --enableLoadBalancer
  register: kube_vip_manifest_prod
  changed_when: false

- name: Write production kube-vip manifest (replaces bootstrap manifest)
  ansible.builtin.copy:
    content: "{{ kube_vip_manifest_prod.stdout }}"
    dest: /etc/kubernetes/manifests/kube-vip.yaml
    mode: "0600"
    owner: root
    group: root

- name: Wait for kube-vip pod to restart with production manifest
  ansible.builtin.shell: |
    crictl ps --name kube-vip --state running -q 2>/dev/null | head -1
  register: kube_vip_container_status
  until: kube_vip_container_status.stdout | length > 0
  retries: 30
  delay: 10
  changed_when: false
  # Static pods don't have standard labels, so we check via crictl instead of kubectl

- name: Verify VIP still reachable after production manifest swap
  ansible.builtin.wait_for:
    host: "{{ control_plane_vip }}"
    port: 6443
    timeout: 120
    delay: 5
    msg: "VIP {{ control_plane_vip }}:6443 not reachable after manifest swap"

- name: Display kube-vip post-init summary
  ansible.builtin.debug:
    msg:
      - "✅ kube-vip RBAC applied"
      - "{{ '✅ kube-vip ConfigMap applied (LoadBalancer IP pool: ' + loadbalancer_ip_range + ')' if loadbalancer_ip_range is defined else '⚠️  ConfigMap skipped (loadbalancer_ip_range not configured)' }}"
      - "✅ Production manifest deployed (admin.conf + leader election)"
      - "✅ kube-vip container is running"
      - "✅ VIP {{ control_plane_vip }} verified reachable"
      - "  - Mode: ARP with leader election"
