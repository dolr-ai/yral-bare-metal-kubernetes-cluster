---
# main.yml: kube-vip deployment for ADDITIONAL control planes.
# The cluster is already running and the VIP is already bound by the first CP;
# no bootstrap (pre-init) is needed — just write the production manifest directly.
#
# For first-control-plane bootstrap (init-control-plane.yml), the split task
# files are called directly via tasks_from:
#   - tasks_from: pre-init   # before kubeadm init (bootstrap manifest, no leaderElection)
#   - tasks_from: post-init  # after kubeadm init  (RBAC + production manifest)

- name: Apply kube-vip RBAC, ConfigMap, and production manifest
  ansible.builtin.include_tasks: post-init.yml
