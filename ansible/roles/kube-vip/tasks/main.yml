---
- name: Display kube-vip deployment information
  ansible.builtin.debug:
    msg:
      - "Deploying kube-vip on: {{ ansible_hostname }}"
      - "Control plane VIP: {{ control_plane_vip }}"
      - "LoadBalancer IP range: {{ loadbalancer_ip_range | default('Not configured') }}"
      - "Control plane endpoint: {{ control_plane_endpoint }}"

- name: Create Kubernetes manifests directory
  ansible.builtin.file:
    path: /etc/kubernetes/manifests
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Pull kube-vip container image
  ansible.builtin.command: ctr image pull ghcr.io/kube-vip/kube-vip:v0.8.5
  register: pull_result
  changed_when: "'Downloaded' in pull_result.stderr or 'Downloaded' in pull_result.stdout"

- name: Detect primary network interface
  ansible.builtin.shell: ip route | grep default | awk '{print $5}' | head -n1
  register: primary_interface
  changed_when: false

- name: Display detected interface
  ansible.builtin.debug:
    msg: "Detected primary interface: {{ primary_interface.stdout }}"

- name: Generate kube-vip static pod manifest
  ansible.builtin.shell: |
    ctr run --rm --net-host ghcr.io/kube-vip/kube-vip:v0.8.5 vip \
      /kube-vip manifest pod \
      --interface {{ primary_interface.stdout }} \
      --address {{ control_plane_vip }} \
      --controlplane \
      --services \
      --arp \
      --leaderElection \
      --enableLoadBalancer
  register: kube_vip_manifest
  changed_when: false

- name: Write kube-vip manifest to file
  ansible.builtin.copy:
    content: "{{ kube_vip_manifest.stdout }}"
    dest: /etc/kubernetes/manifests/kube-vip.yaml
    mode: "0600"
    owner: root
    group: root

- name: Create kube-vip RBAC manifest
  ansible.builtin.copy:
    content: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: kube-vip
        namespace: kube-system
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: kube-vip-role
      rules:
        - apiGroups: [""]
          resources: ["services", "services/status", "nodes", "endpoints"]
          verbs: ["list", "get", "watch", "update"]
        - apiGroups: ["coordination.k8s.io"]
          resources: ["leases"]
          verbs: ["list", "get", "watch", "update", "create"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: kube-vip-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: kube-vip-role
      subjects:
      - kind: ServiceAccount
        name: kube-vip
        namespace: kube-system
    dest: /tmp/kube-vip-rbac.yaml
    mode: "0644"

- name: Create kube-vip cloud provider ConfigMap template
  ansible.builtin.copy:
    content: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kubevip
        namespace: kube-system
      data:
        range-global: {{ loadbalancer_ip_range }}
        cidr-global: "32"
    dest: /tmp/kube-vip-configmap.yaml
    mode: "0644"
  when: loadbalancer_ip_range is defined

- name: Display kube-vip deployment summary
  ansible.builtin.debug:
    msg:
      - "✅ kube-vip manifest created at /etc/kubernetes/manifests/kube-vip.yaml"
      - "✅ RBAC manifest created at /tmp/kube-vip-rbac.yaml (apply after cluster init)"
      - "{{ '✅ ConfigMap created at /tmp/kube-vip-configmap.yaml (apply after cluster init)' if loadbalancer_ip_range is defined else '⚠️  ConfigMap skipped (loadbalancer_ip_range not configured)' }}"
      - ""
      - "Configuration:"
      - "  - Mode: ARP"
      - "  - Control plane VIP: {{ control_plane_vip }}"
      - "{{ '  - LoadBalancer IP pool: ' + loadbalancer_ip_range if loadbalancer_ip_range is defined else '  - LoadBalancer IP pool: Not configured' }}"
      - "  - Leader election: Enabled"
      - "  - Services LoadBalancer: {{ 'Enabled' if loadbalancer_ip_range is defined else 'Disabled (no IP pool)' }}"
      - ""
      - "⚠️  kube-vip will start automatically when kubelet starts"
      - "{{ '⚠️  Apply RBAC and ConfigMap after kubeadm init completes' if loadbalancer_ip_range is defined else '⚠️  Apply RBAC after kubeadm init completes' }}"
