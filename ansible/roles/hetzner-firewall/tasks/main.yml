---
# Configure the Hetzner Robot Firewall for this node.
#
# All Robot API calls are delegated to localhost (the Ansible control node).
# The firewall is applied to the node identified by ansible_host.
#
# Policy: permissive — "Allow all" incoming, Hetzner Services whitelist enabled.
#
# Rationale: Cloudflare CIDR-based access restrictions for HTTP/HTTPS are enforced
# at the Kubernetes layer via CiliumNetworkPolicy (in kubernetes/), not at the
# Hetzner firewall layer. This avoids the 50-rule limit on Hetzner's stateless
# per-server firewall and keeps security policy in GitOps / Flux rather than
# requiring full node reprovisioning to update Cloudflare CIDR ranges.
#
# Hetzner Services (whitelist_hos): enabled — allows Hetzner's own management
# infrastructure (KVM console, rescue system, monitoring) to reach the node.

- name: Reset firewall to permissive default
  community.hrobot.firewall:
    hetzner_user: "{{ hetzner_robot_api_user }}"
    hetzner_password: "{{ hetzner_robot_api_password }}"
    server_ip: "{{ ansible_host }}"
    state: present
    allowlist_hos: true
    rules:
      input:
        - action: accept
          name: "Allow all"
  delegate_to: localhost
