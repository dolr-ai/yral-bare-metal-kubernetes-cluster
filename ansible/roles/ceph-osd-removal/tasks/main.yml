# ceph-osd-removal — safely remove a node's Ceph OSDs before reprovisioning.
#
# Runs against localhost (the Ansible controller) and uses kubectl to exec into
# the rook-ceph-tools pod for Ceph CLI commands. The target node is specified
# via -e target_host=worker-X.
#
# Steps:
#   1. Find the OSD IDs for the target node from `ceph osd tree`
#   2. Set `noout` to prevent rebalance during preparation
#   3. Mark each OSD `out` → Ceph begins rebalancing PGs to remaining OSDs
#   4. Unset `noout` → allow rebalance to proceed
#   5. Wait for all PGs to reach `active+clean` (poll with short intervals)
#   6. Purge each OSD (destroys the OSD daemon and removes from CRUSH)
#   7. Remove the host bucket from CRUSH
#   8. Verify ceph health is OK
#
# This role is called BEFORE node-drain/node-remove/provision in the migration
# playbook. The node must still be running and its OSDs must be `up` so Ceph
# can rebalance data off them cleanly.
#
# Serial: one node at a time (complete + verify before next), per AGENTS.md.

- name: Check that target_host is defined
  ansible.builtin.fail:
    msg: "target_host must be specified: -e target_host=worker-X"
  when: target_host is not defined or target_host == ""
  run_once: true

- name: Find rook-ceph-tools pod name
  ansible.builtin.shell: |
    kubectl get pods -n rook-ceph -l app=rook-ceph-tools -o jsonpath='{.items[0].metadata.name}'
  register: ceph_tools_pod
  changed_when: false
  run_once: true

- name: Fail if toolbox pod not found
  ansible.builtin.fail:
    msg: "rook-ceph-tools pod not found in rook-ceph namespace"
  when: ceph_tools_pod.stdout | trim == ""
  run_once: true

- name: Get OSD IDs for target node from CRUSH tree
  ansible.builtin.shell: |
    kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph osd tree 2>/dev/null | \
    awk -v host="{{ target_host }}" '
      /host '"'"'/ { in_host=0 }
      $0 ~ "host " host "$" { in_host=1; next }
      in_host && /osd\./ { gsub("osd\\.","",$1); print $1 }
    '
  register: ceph_osd_ids_raw
  changed_when: false
  run_once: true

- name: Set OSD IDs fact
  ansible.builtin.set_fact:
    ceph_osd_ids: "{{ ceph_osd_ids_raw.stdout_lines }}"
  run_once: true

- name: Skip if no OSDs found for this node
  ansible.builtin.debug:
    msg: "No Ceph OSDs found for {{ target_host }} — node may already be removed from Ceph."
  when: ceph_osd_ids | length == 0
  run_once: true

- name: Display OSD removal plan
  ansible.builtin.debug:
    msg: |
      ============================================================
      Ceph OSD Removal: {{ target_host }}
      ============================================================
      OSDs to remove: {{ ceph_osd_ids | join(', ') }}
      Total: {{ ceph_osd_ids | length }} OSD(s)

      Steps:
      1. Set noout (prevent rebalance during prep)
      2. Mark OSDs out → Ceph rebalances data to remaining OSDs
      3. Unset noout → allow rebalance
      4. Wait for PGs active+clean
      5. Purge OSDs + remove host from CRUSH
      6. Verify ceph health
      ============================================================
  when: ceph_osd_ids | length > 0
  run_once: true

- name: Remove OSDs from Ceph
  when: ceph_osd_ids | length > 0
  block:
    - name: Set noout to prevent premature rebalance
      ansible.builtin.shell: |
        kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph osd set noout
      changed_when: true
      run_once: true

    - name: Mark each OSD out (triggers rebalance to other OSDs)
      ansible.builtin.shell: |
        kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph osd out {{ item }}
      loop: "{{ ceph_osd_ids }}"
      changed_when: true
      run_once: true

    - name: Unset noout to allow rebalance
      ansible.builtin.shell: |
        kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph osd unset noout
      changed_when: true
      run_once: true

    - name: Wait for all PGs to reach active+clean
      ansible.builtin.shell: |
        kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph pg stat 2>/dev/null | \
        python3 -c "
        import sys
        data = sys.stdin.read().strip()
        # Output format: 'X pgps active+clean; ...' or 'N pgps: ... active+clean; ...'
        # We check if all PGs are active+clean (no degraded, recovering, etc.)
        if 'active+clean' in data:
            # Extract the total and clean counts
            parts = data.split(';')[0].strip()
            total = int(parts.split()[0])
            # Check if there are any non-clean states
            non_clean = [s for s in data.split(';') if s.strip() and 'active+clean' not in s]
            if not non_clean:
                print('clean')
            else:
                print('degraded: ' + '; '.join(non_clean))
        else:
            print('not_clean')
        "
      register: ceph_pg_status
      until: ceph_pg_status.stdout == "clean"
      retries: 120
      delay: 10
      changed_when: false
      run_once: true

    - name: PGs are active+clean
      ansible.builtin.debug:
        msg: "✅ All PGs active+clean — safe to purge OSDs"
      run_once: true

    - name: Purge each OSD (destroys daemon + removes from CRUSH)
      ansible.builtin.shell: |
        kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- \
        ceph osd purge {{ item }} --yes-i-really-mean-it
      loop: "{{ ceph_osd_ids }}"
      changed_when: true
      run_once: true

    - name: Remove host bucket from CRUSH map
      ansible.builtin.shell: |
        kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- \
        ceph osd crush remove {{ target_host }}
      register: crush_remove_result
      changed_when: true
      failed_when: false
      run_once: true

    - name: Display CRUSH removal result
      ansible.builtin.debug:
        msg: "CRUSH host removal: {{ crush_remove_result.stdout | default('no output') }}{{ crush_remove_result.stderr | default('') }}"
      run_once: true

    - name: Verify Ceph health
      ansible.builtin.shell: |
        kubectl -n rook-ceph exec {{ ceph_tools_pod.stdout }} -- ceph health 2>/dev/null
      register: ceph_health
      changed_when: false
      run_once: true

    - name: Display Ceph health
      ansible.builtin.debug:
        msg: "Ceph health: {{ ceph_health.stdout }}"
      run_once: true

    - name: Fail if Ceph health is not OK
      ansible.builtin.fail:
        msg: "Ceph health is '{{ ceph_health.stdout }}' — expected HEALTH_OK. Investigate before proceeding."
      when: ceph_health.stdout != "HEALTH_OK"
      run_once: true

    - name: OSD removal complete
      ansible.builtin.debug:
        msg: |
          ============================================================
          ✅ Ceph OSD Removal Complete: {{ target_host }}
          ============================================================
          Removed OSDs: {{ ceph_osd_ids | join(', ') }}
          Ceph health: {{ ceph_health.stdout }}
          PGs: active+clean

          Node is now safe to drain and reprovision.
          ============================================================
      run_once: true