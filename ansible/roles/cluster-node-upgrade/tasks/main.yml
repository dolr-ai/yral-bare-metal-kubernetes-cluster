---
# Orchestrate cluster-wide or single-node upgrades

- name: Display upgrade plan
  ansible.builtin.debug:
    msg: |
      {% if target_host is defined and target_host != "" %}
      ============================================================
      Single Node Upgrade
      ============================================================
      Target: {{ target_host }}

      This will upgrade the specified node only.
      ============================================================
      {% else %}
      ============================================================
      Cluster-Wide System Upgrade
      ============================================================
      
      This playbook will upgrade all nodes in sequence:

      Phase 1: Upgrade Control Plane Nodes
      {% for node in groups.get('control_plane', []) %}
      - {{ node }}
      {% endfor %}

      Phase 2: Upgrade Worker Nodes
      {% for node in groups.get('worker_nodes', []) %}
      - {{ node }}
      {% endfor %}

      For each node:
        1. Run system package upgrades
        2. Check if reboot is required
        3. If reboot: drain → remove → reboot → rejoin
        4. If no reboot: skip reboot steps
        5. Wait for Ready status
        6. Run health verification

      Downtime: MINIMAL
      - Drained pods reschedule to healthy nodes
      - One node down at a time
      - Control planes upgraded first (maintains API stability)

      ============================================================
      {% endif %}

# ========== Single Node Mode ==========

- name: Upgrade single node
  when: target_host is defined and target_host != ""
  block:
    - name: Verify target host exists
      ansible.builtin.assert:
        that:
          - target_host in groups['all']
        fail_msg: "Target host {{ target_host }} not found in inventory"

    - name: Run single node upgrade
      ansible.builtin.include_role:
        name: node-upgrade
      vars:
        node_target: "{{ target_host }}"

# ========== Cluster Mode ==========

- name: Upgrade control plane nodes
  when: target_host is not defined or target_host == ""
  block:
    - name: Upgrade each control plane sequentially
      ansible.builtin.include_role:
        name: node-upgrade
      vars:
        node_target: "{{ item }}"
      loop: "{{ groups.get('control_plane', []) }}"

    - name: Verify cluster health after control plane upgrades
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cluster_state
      changed_when: false
      delegate_to: "{{ groups['control_plane'][0] }}"

    - name: Display cluster state
      ansible.builtin.debug:
        msg: "{{ cluster_state.stdout_lines }}"

    - name: Wait before upgrading workers
      ansible.builtin.pause:
        prompt: "All control planes upgraded. Press Enter to upgrade workers (or Ctrl-C to stop)"
      when: groups.get('worker_nodes', []) | length > 0

- name: Upgrade worker nodes
  when: target_host is not defined or target_host == ""
  block:
    - name: Upgrade each worker sequentially
      ansible.builtin.include_role:
        name: node-upgrade
      vars:
        node_target: "{{ item }}"
      loop: "{{ groups.get('worker_nodes', []) }}"

    - name: Verify cluster health after worker upgrades
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cluster_state
      changed_when: false
      delegate_to: "{{ groups['control_plane'][0] }}"

    - name: Display cluster state
      ansible.builtin.debug:
        msg: "{{ cluster_state.stdout_lines }}"

# ========== Final Verification ==========

- name: Final cluster verification
  when: target_host is not defined or target_host == ""
  block:
    - name: Run final health check
      ansible.builtin.command: >
        kubectl get nodes -o jsonpath='{range .items[*]}{"\n"}{.metadata.name}{"\t"}{.status.conditions[?(@.type=="Ready")].status}{end}'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: final_status
      changed_when: false
      delegate_to: "{{ groups['control_plane'][0] }}"

    - name: Display final cluster status
      ansible.builtin.debug:
        msg: |
          ============================================================
          ✅ UPGRADE COMPLETED
          ============================================================

          Final Node Status:
          {{ final_status.stdout }}

          All nodes have been upgraded and are Ready.

          Post-Upgrade Verification:
          - kubectl get nodes -o wide
          - kubectl get pods -A
          - kubectl top nodes
          - kubectl top pods -A

          ============================================================
