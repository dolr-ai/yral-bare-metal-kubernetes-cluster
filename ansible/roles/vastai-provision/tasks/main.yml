---
# Register the shared infrastructure SSH key with the Vast.ai account.
# Idempotent: non-zero rc means the key is already registered; that is not an error.
- name: Register SSH public key with Vast.ai account
  ansible.builtin.command:
    cmd: vastai create ssh-key "{{ github_actions_ssh_pub_key }}"
  register: vastai_key_register
  changed_when: vastai_key_register.rc == 0
  failed_when: false
  no_log: true

- name: Report SSH key registration result
  ansible.builtin.debug:
    msg: "{{ 'SSH key registered with Vast.ai account' if vastai_key_register.rc == 0 else 'SSH key already registered (skipped)' }}"

# gpu_totalram is combined VRAM across all GPUs in the offer (in GB).
# Sorting by dph_total ascending gives cheapest first across all rental types
# (interruptible, on-demand, reserved) — no type filter applied deliberately.
- name: Search for cheapest offers with {{ vastai_vram_min_gb }}GB+ combined VRAM
  ansible.builtin.command:
    cmd: >
      vastai search offers
      "gpu_totalram >= {{ vastai_vram_min_gb }}"
      -o "dph_total asc"
      --raw
  register: vastai_search_raw
  changed_when: false

- name: Parse search results
  ansible.builtin.set_fact:
    vastai_offers: "{{ vastai_search_raw.stdout | from_json }}"

- name: Fail if fewer than {{ vastai_num_replicas }} offers found
  ansible.builtin.fail:
    msg: >
      Only {{ vastai_offers | length }} offer(s) match >= {{ vastai_vram_min_gb }}GB VRAM
      but {{ vastai_num_replicas }} replicas were requested.
      Lower vastai_vram_min_gb or reduce vastai_num_replicas.
  when: vastai_offers | length < vastai_num_replicas

- name: Display selected offers before provisioning
  ansible.builtin.debug:
    msg: >
      Replica {{ loop.index }}/{{ vastai_num_replicas }}:
      offer={{ item.id }}
      gpu={{ item.gpu_name }} x{{ item.num_gpus }}
      vram={{ item.gpu_totalram }}GB
      price=${{ item.dph_total }}/hr
  loop: "{{ vastai_offers[:vastai_num_replicas] }}"
  loop_control:
    label: "offer {{ item.id }}"

# Each iteration creates one instance on a distinct physical offer,
# placing replicas on different machines for resilience.
- name: Create instance for each selected offer
  ansible.builtin.command:
    cmd: >
      vastai create instance {{ item.id }}
      --image {{ vastai_image }}
      --disk {{ vastai_disk_gb }}
      {{ '--ssh' if vastai_ssh else '' }}
      {{ '--direct' if vastai_direct else '' }}
      --raw
  loop: "{{ vastai_offers[:vastai_num_replicas] }}"
  loop_control:
    label: "offer {{ item.id }} ({{ item.gpu_name }} x{{ item.num_gpus }}, ${{ item.dph_total }}/hr)"
  register: vastai_create_results
  changed_when: true

- name: Parse created instance details
  ansible.builtin.set_fact:
    vastai_created_instances: "{{ vastai_create_results.results | map(attribute='stdout') | map('from_json') | list }}"

# Belt-and-suspenders: explicitly attach the SSH key to each instance via the
# Vast.ai REST API. The --ssh flag above injects all account-registered keys,
# but the explicit attach ensures the key is present even on instances that
# started before the account-level registration completed.
- name: Attach SSH public key to each created instance
  ansible.builtin.uri:
    url: "https://console.vast.ai/api/v0/instances/{{ item.new_contract }}/ssh/?api_key={{ vastai_api_key }}"
    method: POST
    body_format: json
    body:
      ssh_key: "{{ github_actions_ssh_pub_key }}"
    status_code: [200, 201, 204]
  loop: "{{ vastai_created_instances }}"
  loop_control:
    label: "instance {{ item.new_contract }}"
  no_log: true

- name: Show created instance IDs
  ansible.builtin.debug:
    msg: "Instance {{ item.new_contract }} created with SSH key attached"
  loop: "{{ vastai_created_instances }}"
  loop_control:
    label: "instance {{ item.new_contract }}"
