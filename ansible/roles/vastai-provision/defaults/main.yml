---
# vastai-provision — provisions GPU instances on Vast.ai (not Kubernetes).
# Always >= 2 replicas on distinct offers so the service survives one preemption.
# Shared infra SSH key attached. Override vars at invocation (never new playbook).
#
# Minimum combined VRAM across all GPUs in the instance, in GB.
# e.g. 40 matches a 2x20GB machine or a 1x40GB machine.
vastai_vram_min_gb: 40

# Number of instances to provision. Keep >= 2 so service survives one preemption.
vastai_num_replicas: 2

# Vast.ai official Ollama image. Verify the exact tag at:
# https://hub.docker.com/r/vastai/ollama/tags
vastai_image: "vastai/ollama"

# Disk per instance in GB. Ollama models are large; 100 GB is a safe minimum.
# Increase if you plan to serve 70B+ models (which can exceed 40 GB on disk).
vastai_disk_gb: 100

# Enable SSH access to the instance for debugging.
vastai_ssh: true

# Connect directly to the instance instead of routing through Vast.ai's proxy.
# Reduces latency; requires the instance's port to be reachable from your machine.
vastai_direct: true
