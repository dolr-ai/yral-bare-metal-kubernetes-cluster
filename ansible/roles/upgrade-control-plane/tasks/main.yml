---
# upgrade-control-plane role
#
# Safely upgrades one control plane node at a time:
#   1. Pre-flight: verify etcd quorum (majority of CPs healthy before touching this one)
#   2. Upgrade system packages
#   3. If reboot required:
#      a. Cordon + drain (evict workloads)
#      b. kubeadm reset --force  → cleanly removes this node from etcd membership
#      c. Reboot
#      d. Wait for SSH + kubelet
#      e. kubeadm join --control-plane  → rejoins with cert distribution
#      f. Uncordon and verify Ready
#   4. Post-flight: verify etcd membership and node Ready
#
# Safety: kubectl commands are always delegated to a healthy CP that is NOT
# the current node, so the delegate remains available even while this node
# is down.
#
# serial: 1 in the playbook ensures only one control plane is touched at a
# time, keeping etcd quorum intact throughout a rolling upgrade.

# ========== SETUP ==========

- name: Identify a healthy kubectl delegate (not this node)
  ansible.builtin.set_fact:
    # Use the first control plane that is NOT the current node.
    # This remains healthy while we take this node through upgrade.
    kubectl_delegate: >-
      {{
        groups['control_plane']
        | difference([inventory_hostname])
        | first
        | default(inventory_hostname)
      }}

- name: Display upgrade plan
  ansible.builtin.debug:
    msg: |
      ============================================================
      Upgrading Control Plane: {{ inventory_hostname }}
      kubectl delegate: {{ kubectl_delegate }}
      ============================================================

# ========== PRE-FLIGHT ==========

- name: Get all control plane node names (as known to Kubernetes)
  ansible.builtin.command: >
    kubectl get nodes
    -l node-role.kubernetes.io/control-plane
    -o jsonpath='{.items[*].metadata.name}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cp_node_names
  changed_when: false
  delegate_to: "{{ kubectl_delegate }}"

- name: Get Ready control plane count
  ansible.builtin.command: >
    kubectl get nodes
    -l node-role.kubernetes.io/control-plane
    -o jsonpath='{.items[?(@.status.conditions[?(@.type=="Ready")].status=="True")].metadata.name}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ready_cp_nodes
  changed_when: false
  delegate_to: "{{ kubectl_delegate }}"

- name: Assert etcd quorum is safe before proceeding
  # Safe to proceed when either:
  #   a. There is only 1 control plane (single-node cluster - user accepts risk)
  #   b. Majority of control planes are Ready (quorum maintained after removing 1)
  ansible.builtin.assert:
    that:
      - >-
        (groups['control_plane'] | length) == 1
        or
        (ready_cp_nodes.stdout.split() | length) > (groups['control_plane'] | length // 2)
    fail_msg: >-
      Refusing to upgrade {{ inventory_hostname }}: etcd quorum at risk.
      Ready control planes: {{ ready_cp_nodes.stdout.split() | join(', ') }}.
      Total control planes: {{ groups['control_plane'] | length }}.
      Need majority ({{ (groups['control_plane'] | length // 2) + 1 }}) to be Ready.
    success_msg: "Quorum check passed. Ready CPs: {{ ready_cp_nodes.stdout.split() | join(', ') }}"
  delegate_to: "{{ kubectl_delegate }}"

# ========== UPGRADE PHASE ==========

- name: Upgrade system packages
  ansible.builtin.shell: |
    set -euo pipefail
    apt-get update -qq
    DEBIAN_FRONTEND=noninteractive apt-get upgrade -y
  changed_when: true

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_stat

- name: Display reboot status
  ansible.builtin.debug:
    msg: "Reboot {{ 'REQUIRED - will drain, reset, reboot, and rejoin' if reboot_required_stat.stat.exists else 'NOT required - skipping reboot cycle' }}"

# ========== DRAIN → RESET → REBOOT → REJOIN (only if reboot required) ==========

- name: Drain, reboot, and rejoin control plane
  when: reboot_required_stat.stat.exists
  block:

    # ----- Drain -----

    - name: Cordon node (mark unschedulable)
      ansible.builtin.command: kubectl cordon {{ inventory_hostname }}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ kubectl_delegate }}"
      changed_when: true

    - name: Drain node (evict all evictable pods)
      ansible.builtin.command: >
        kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets
        --delete-emptydir-data
        --force
        --grace-period=300
        --timeout=600s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ kubectl_delegate }}"
      changed_when: true

    # ----- kubeadm reset (cleanly removes this node from etcd) -----

    - name: Reset kubeadm (removes node from etcd membership cleanly)
      ansible.builtin.command: kubeadm reset --force
      changed_when: true

    - name: Verify etcd member count decreased on delegate
      ansible.builtin.shell: |
        ETCDCTL_API=3 etcdctl \
          --endpoints=https://127.0.0.1:2379 \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key \
          member list
      register: etcd_after_reset
      changed_when: false
      failed_when: false
      delegate_to: "{{ kubectl_delegate }}"

    - name: Display etcd membership after reset
      ansible.builtin.debug:
        msg: "{{ etcd_after_reset.stdout_lines }}"

    # ----- Reboot -----

    - name: Initiate reboot
      ansible.builtin.shell: sleep 3 && /usr/sbin/shutdown -r now
      async: 1
      poll: 0
      changed_when: true

    - name: Wait for node to go offline
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname].ansible_host }}"
        port: 22
        state: stopped
        timeout: 120
        sleep: 5
      delegate_to: localhost

    - name: Wait for node to come back online
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname].ansible_host }}"
        port: 22
        state: started
        timeout: 300
        sleep: 10
      delegate_to: localhost

    - name: Confirm SSH is responsive
      ansible.builtin.command: >
        ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no
        root@{{ hostvars[inventory_hostname].ansible_host }} "echo ok"
      register: ssh_ready
      until: ssh_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      delegate_to: localhost

    # ----- Rejoin as control plane -----

    - name: Upload certificates and capture cert key
      ansible.builtin.shell: |
        set -euo pipefail
        kubeadm init phase upload-certs --upload-certs 2>/dev/null | tail -1
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cert_key
      changed_when: false
      delegate_to: "{{ kubectl_delegate }}"

    - name: Generate control plane join command
      ansible.builtin.shell: |
        set -euo pipefail
        TOKEN=$(kubeadm token create)
        HASH=$(openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt \
          | openssl rsa -pubin -outform der 2>/dev/null \
          | openssl dgst -sha256 -hex | sed 's/^.* //')
        echo "kubeadm join {{ control_plane_endpoint }}:6443 \
          --token ${TOKEN} \
          --discovery-token-ca-cert-hash sha256:${HASH} \
          --control-plane \
          --certificate-key {{ cert_key.stdout }} \
          --apiserver-advertise-address={{ hostvars[inventory_hostname].ansible_host }}"
      register: cp_join_cmd
      changed_when: false
      delegate_to: "{{ kubectl_delegate }}"

    - name: Rejoin cluster as control plane
      ansible.builtin.command: "{{ cp_join_cmd.stdout }}"
      changed_when: true

    - name: Wait for kubelet to be active
      ansible.builtin.command: systemctl is-active kubelet
      register: kubelet_status
      until: kubelet_status.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Wait for node object to appear in cluster
      ansible.builtin.command: kubectl get node {{ inventory_hostname }}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ kubectl_delegate }}"
      register: node_exists
      until: node_exists.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Uncordon node (restore schedulability)
      ansible.builtin.command: kubectl uncordon {{ inventory_hostname }}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ kubectl_delegate }}"
      changed_when: true

# ========== VERIFICATION ==========

- name: Wait for node to be Ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=600s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ kubectl_delegate }}"
  changed_when: false

- name: Assert node is Ready
  ansible.builtin.command: >
    kubectl get node {{ inventory_hostname }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: node_ready_status
  failed_when: node_ready_status.stdout != "True"
  changed_when: false
  delegate_to: "{{ kubectl_delegate }}"

- name: Verify kubelet and containerd are healthy
  ansible.builtin.shell: |
    systemctl is-active kubelet
    systemctl is-active containerd
  register: service_status
  changed_when: false

- name: Verify etcd membership is restored
  ansible.builtin.shell: |
    ETCDCTL_API=3 etcdctl \
      --endpoints=https://127.0.0.1:2379 \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt \
      --cert=/etc/kubernetes/pki/etcd/server.crt \
      --key=/etc/kubernetes/pki/etcd/server.key \
      member list
  register: etcd_members_final
  changed_when: false
  delegate_to: "{{ kubectl_delegate }}"

- name: Display etcd membership after upgrade
  ansible.builtin.debug:
    msg: "{{ etcd_members_final.stdout_lines }}"

- name: Display upgrade completion
  ansible.builtin.debug:
    msg: |
      ============================================================
      ✅ Control Plane Upgrade Complete: {{ inventory_hostname }}
      ============================================================
      Rebooted:  {{ 'yes' if reboot_required_stat.stat.exists else 'no' }}
      Status:    Ready ✓
      etcd:      member rejoined ✓
      Services:  {{ service_status.stdout_lines | join(', ') }}

      kubectl get nodes
      kubectl get pods -n kube-system --field-selector spec.nodeName={{ inventory_hostname }}
      ============================================================
