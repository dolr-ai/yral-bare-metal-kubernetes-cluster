---
# Kubernetes Stack Deployment (Kubernetes-Only)
# Deploys Kubernetes control plane and platform services
# Assumes base system setup (containerd, kubeadm) is already complete
# Usage: ansible-playbook kubernetes-only.yml

- name: Display Kubernetes deployment information
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display deployment plan
      ansible.builtin.debug:
        msg: |
          ============================================================
          YRAL Bare Metal Kubernetes - Kubernetes Stack Only
          ============================================================
          This playbook deploys the Kubernetes control plane and
          platform services. It assumes base system setup is complete.
          
          Prerequisites: base-system-setup.yml already executed
          
          Components:
            - Helm 3 (control planes)
            - kube-vip (HA virtual IP with ARP failover)
            - Kubernetes cluster (kubeadm init + worker joins)
            - Cilium CNI with WireGuard encryption
            - Prometheus/Grafana monitoring
            - Automated etcd backups to S3
            - Velero disaster recovery
          ============================================================

- name: Install Helm
  import_playbook: helm-install.yml

- name: Deploy kube-vip
  import_playbook: kube-vip-deploy.yml

- name: Initialize Cluster
  import_playbook: cluster-setup.yml

- name: Deploy Cilium CNI
  import_playbook: cilium-deploy.yml

- name: Deploy Monitoring
  import_playbook: monitoring-deploy.yml

- name: Setup etcd Backups
  import_playbook: etcd-backup.yml

- name: Install Velero
  import_playbook: velero-install.yml
