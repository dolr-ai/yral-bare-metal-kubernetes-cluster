---
# Full Kubernetes Cluster Deployment
# This orchestrates the complete deployment from base system to production cluster
# Usage: ansible-playbook full-deployment.yml

- name: Display deployment information
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display deployment plan
      ansible.builtin.debug:
        msg: |
          ============================================================
          YRAL Bare Metal Kubernetes - Full Deployment
          ============================================================
          This playbook orchestrates the complete deployment process:
          
          Phase 1: Base System Setup (all nodes)
            - System updates and configuration (base-system role)
            - SSH security hardening (ssh-hardening role)
            - Container runtime containerd (containerd role)
            - Kubernetes binaries v1.35 (kubernetes role)
          
          Phase 2: Kubernetes Infrastructure
            - Helm package manager (control planes)
            - kube-vip for HA control plane
            - Cluster initialization (kubeadm init + joins)
            - Cilium CNI with WireGuard encryption
          
          Phase 3: Platform Services
            - Monitoring stack (Prometheus, Grafana)
            - Automated etcd backups to S3
            - Velero disaster recovery
          ============================================================

- name: Phase 1 - Base System Setup
  import_playbook: base-system-setup.yml

- name: Phase 2 - Kubernetes Infrastructure  
  import_playbook: helm-install.yml

- name: Phase 2 - Deploy kube-vip
  import_playbook: kube-vip-deploy.yml

- name: Phase 2 - Initialize Cluster
  import_playbook: cluster-setup.yml

- name: Phase 2 - Deploy Cilium CNI
  import_playbook: cilium-deploy.yml

- name: Phase 3 - Deploy Monitoring
  import_playbook: monitoring-deploy.yml

- name: Phase 3 - Setup etcd Backups
  import_playbook: etcd-backup.yml

- name: Phase 3 - Install Velero
  import_playbook: velero-install.yml
