---
# Base System Setup for Kubernetes Nodes
# This playbook prepares bare metal servers for Kubernetes
# Usage: ansible-playbook base-system-setup.yml [--limit hostname]

- name: Base System Setup for Kubernetes Nodes
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Display base setup information
      ansible.builtin.debug:
        msg: |
          ============================================================
          YRAL Bare Metal Kubernetes - Base System Setup
          ============================================================
          Target: {{ ansible_hostname }}
          IP: {{ ansible_host }}
          
          Components:
          1. System updates and base packages (base-system role)
          2. SSH security hardening (ssh-hardening role)
          3. Container runtime (containerd role)
          4. Kubernetes binaries v1.35 (kubernetes role)
          ============================================================

  roles:
    - role: base-system
    - role: ssh-hardening
    - role: containerd
    - role: kubernetes
