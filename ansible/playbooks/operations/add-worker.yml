---
# Add Worker Node to Kubernetes Cluster
# Usage: ansible-playbook operations/add-worker.yml -e target_host=worker-X

- name: Add worker node (provision, configure, join)
  hosts: "{{ target_host }}"
  gather_facts: true
  become: true
  serial: 1

  roles:
    - name: Step 1: Provision server
      role: provision
    
    - name: Step 2: Configure base system
      role: base-system
    
    - name: Step 3: Configure storage
      role: storage-setup
    
    - name: Step 4: Harden SSH access
      role: ssh-hardening
    
    - name: Step 5: Install container runtime
      role: containerd
    
    - name: Step 6: Install Kubernetes components
      role: kubernetes
    
    - name: Step 7: Join worker to cluster
      role: worker-join
    
    - name: Step 8: Apply node labels
      role: node-labels
