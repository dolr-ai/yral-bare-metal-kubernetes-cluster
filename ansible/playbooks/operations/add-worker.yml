---
# Add Worker Node to Kubernetes Cluster
# Usage: ansible-playbook operations/add-worker.yml -e target_host=worker-X

- name: Add worker node (provision, configure, join)
  hosts: "{{ target_host }}"
  gather_facts: false
  become: true
  serial: 1

  roles:
    - role: provision
    - role: base-system
    - role: resolv-cleanup
    - role: sysctl-tuning
    - role: storage-longhorn
    - role: ssh-hardening
    - role: containerd
    - role: kubernetes
    - role: worker-join
    - role: node-labels
    - role: cloudflare-dns
