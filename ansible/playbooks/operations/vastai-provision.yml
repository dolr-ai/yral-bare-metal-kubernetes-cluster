---
# Provision Vast.ai GPU instances.
# Usage:
# ansible-playbook ansible/playbooks/operations/vastai-provision.yml \
#   -e vastai_image=vastai/ollama \
#   -e vastai_vram_min_gb=60 \
#   -e vastai_num_replicas=1 \
#   -e vastai_disk_gb=100 \
#   -e vastai_ssh=true \
#   -e vastai_direct=true

- name: Provision Vast.ai GPU instances
  hosts: localhost
  gather_facts: false

  roles:
    - role: vastai-provision
