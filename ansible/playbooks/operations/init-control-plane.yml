---
# Initialize First Control Plane Node
# Usage: ansible-playbook operations/init-control-plane.yml

- name: Initialize first control plane node (provision from scratch)
  hosts: control-plane-1
  gather_facts: true
  become: true
  serial: 1

  roles:
    - role: provision
    - role: storage-setup
    - role: ssh-hardening
    - role: base-system
    - role: containerd
    - role: kubernetes
    - role: kube-vip
      tasks_from: pre-init
    - role: cluster-init
    - role: kube-vip
      tasks_from: post-init
