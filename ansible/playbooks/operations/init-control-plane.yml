---
# Initialize First Control Plane Node
# Usage: ansible-playbook operations/init-control-plane.yml
#
# Role order: provision → storage-setup → ssh-hardening → base-system →
#             sysctl-tuning → containerd → kubernetes → cluster-init → node-labels →
#             helm → gateway-api-crds → cilium

- name: Initialize first control plane node (provision from scratch)
  hosts: control-plane-1
  gather_facts: false
  become: true
  serial: 1

  roles:
    - role: provision
    - role: storage-setup
    - role: ssh-hardening
    - role: base-system
    - role: sysctl-tuning
    - role: containerd
    - role: kubernetes
    - role: cluster-init
    - role: node-labels
    - role: helm
    - role: gateway-api-crds
    - role: cilium
