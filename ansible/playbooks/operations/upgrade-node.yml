---
# Upgrade Nodes - Single node or cluster-wide with confirmation pause between phases.
#
# This playbook has three plays by design: control planes, pause, workers.
# When target_host is set, all three plays target that one host - the pause
# play runs against localhost and skips if target_host is defined, and the
# worker play will simply match zero hosts if target_host is a control plane
# (and vice versa), so it is safe in both single-node and cluster-wide mode.
#
# Usage:
#   Upgrade all nodes (control planes then workers):
#     ansible-playbook operations/upgrade-node.yml
#   Upgrade single node:
#     ansible-playbook operations/upgrade-node.yml -e target_host=worker-1

- name: Upgrade control plane nodes
  hosts: "{{ target_host | default('control_plane') }}"
  gather_facts: true
  become: true
  serial: 1

  roles:
    - role: node-upgrade

- name: Pause before upgrading worker nodes
  hosts: localhost
  gather_facts: false

  roles:
    - role: upgrade-pause

- name: Upgrade worker nodes
  hosts: "{{ target_host | default('worker_nodes') }}"
  gather_facts: true
  become: true
  serial: 1

  roles:
    - role: node-upgrade
