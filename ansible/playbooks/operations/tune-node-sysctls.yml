---
# Apply kernel sysctl tuning to all existing cluster nodes (one-time Day-2 operation).
#
# Writes /etc/sysctl.d/99-kubernetes-tuning.conf (persistent across reboots)
# and applies the settings immediately without requiring a reboot.
#
# This playbook is idempotent and safe to re-run. After all nodes are tuned,
# future nodes receive the same settings via the sysctl-tuning role in their
# provisioning playbook (init-control-plane, add-control-plane, add-worker).
#
# Usage: ansible-playbook operations/tune-node-sysctls.yml

- name: Apply sysctl tuning to all cluster nodes
  hosts: k8s_cluster
  gather_facts: false
  become: true
  serial: 1

  roles:
    - role: sysctl-tuning
