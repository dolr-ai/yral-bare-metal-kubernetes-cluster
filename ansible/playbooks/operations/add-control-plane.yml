---
# Add Control Plane Node to Kubernetes Cluster
# This playbook provisions a new control plane node and joins it to the existing HA cluster
# Usage: ansible-playbook operations/add-control-plane.yml -e target_host=control-plane-X

- name: Validate input
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check that target_host is defined
      ansible.builtin.fail:
        msg: "target_host must be specified: -e target_host=control-plane-X"
      when: target_host is not defined or target_host == ""

    - name: Verify target host exists in inventory
      ansible.builtin.assert:
        that:
          - target_host in groups['control_plane']
        fail_msg: "Host {{ target_host }} not found in control_plane group. Add it to inventory first."
        success_msg: "Host {{ target_host }} found in inventory"

    - name: Verify cluster has existing control planes
      ansible.builtin.assert:
        that:
          - groups['control_plane'] | length >= 1
        fail_msg: "No existing control planes found. Use cluster-setup.yml for initial bootstrap."
        success_msg: "Found {{ groups['control_plane'] | length }} control plane(s) in inventory"

- name: Display control plane addition plan
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Show operation details
      ansible.builtin.debug:
        msg: |
          ============================================================
          Adding Control Plane Node to HA Kubernetes Cluster
          ============================================================
          Target: {{ target_host }}
          Existing Control Planes: {{ groups['control_plane'] | difference([target_host]) | join(', ') }}
          
          Steps:
          1. Provision server with Ubuntu 24.04
          2. Setup base system (updates, SSH, containerd, kubeadm)
          3. Upload control plane certificates
          4. Join as control plane (with etcd)
          5. Deploy kube-vip for VIP failover
          6. Verify etcd cluster health
          7. Apply node labels
          
          ⚠️  IMPORTANT:
          - This will add another etcd member
          - Ensure VIP {{ vip_address }} is configured correctly
          - Verify DNS resolves to VIP before proceeding
          ============================================================

    - name: Pause for confirmation
      ansible.builtin.pause:
        prompt: "Press ENTER to continue or Ctrl+C to abort"

- name: Provision and setup base system
  import_playbook: ../provision-server.yml
  vars:
    target_host: "{{ target_host }}"

- name: Upload control plane certificates
  hosts: "{{ target_host }}"
  become: true
  gather_facts: true
  serial: 1

  tasks:
    - name: Check if already a control plane
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Skip if already control plane
      ansible.builtin.debug:
        msg: "Node {{ inventory_hostname }} is already a control plane"
      when: admin_conf.stat.exists

    - name: Create certificate directory
      ansible.builtin.file:
        path: /tmp/kubernetes-certs
        state: directory
        mode: '0755'
      when: not admin_conf.stat.exists

    - name: Upload control plane certificates from first control plane
      ansible.builtin.shell: |
        kubeadm init phase upload-certs --upload-certs 2>&1 | tail -1
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: certificate_key
      when: not admin_conf.stat.exists

    - name: Display certificate key
      ansible.builtin.debug:
        msg: "Certificate key: {{ certificate_key.stdout }}"
      when: not admin_conf.stat.exists

    - name: Generate control plane join command
      ansible.builtin.shell: |
        kubeadm token create --print-join-command --certificate-key {{ certificate_key.stdout }}
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: join_command
      when: not admin_conf.stat.exists

    - name: Display join command
      ansible.builtin.debug:
        msg: "{{ join_command.stdout }}"
      when: not admin_conf.stat.exists

    - name: Join as control plane
      ansible.builtin.shell: |
        {{ join_command.stdout }} --control-plane --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      when: not admin_conf.stat.exists
      register: join_result

    - name: Display join result
      ansible.builtin.debug:
        msg: "{{ join_result.stdout_lines }}"
      when: not admin_conf.stat.exists

    - name: Setup kubectl for root user
      ansible.builtin.file:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        state: link
        force: true
      when: not admin_conf.stat.exists

- name: Deploy kube-vip on new control plane
  hosts: "{{ target_host }}"
  become: true
  gather_facts: true

  tasks:
    - name: Check if kube-vip already exists
      ansible.builtin.stat:
        path: /etc/kubernetes/manifests/kube-vip.yaml
      register: kube_vip_manifest

    - name: Generate kube-vip manifest
      ansible.builtin.shell: |
        KVVERSION=$(curl -sL https://api.github.com/repos/kube-vip/kube-vip/releases | jq -r '.[0].name')
        ctr image pull ghcr.io/kube-vip/kube-vip:$KVVERSION
        ctr run --rm --net-host ghcr.io/kube-vip/kube-vip:$KVVERSION vip /kube-vip manifest pod \
          --interface {{ ansible_default_ipv4.interface }} \
          --address {{ vip_address }} \
          --controlplane \
          --arp \
          --leaderElection > /etc/kubernetes/manifests/kube-vip.yaml
      args:
        creates: /etc/kubernetes/manifests/kube-vip.yaml
      when: not kube_vip_manifest.stat.exists

    - name: Wait for kube-vip to start
      ansible.builtin.wait_for:
        timeout: 30
      when: not kube_vip_manifest.stat.exists

- name: Verify control plane health
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait for new control plane to be Ready
      ansible.builtin.shell: |
        kubectl get node {{ target_host }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: node_status
      until: node_status.stdout == "True"
      retries: 30
      delay: 10
      changed_when: false

    - name: Get all control plane nodes
      ansible.builtin.command: kubectl get nodes -l node-role.kubernetes.io/control-plane
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: control_planes
      changed_when: false

    - name: Display control planes
      ansible.builtin.debug:
        msg: "{{ control_planes.stdout_lines }}"

    - name: Verify etcd cluster health
      ansible.builtin.shell: |
        ETCDCTL_API=3 etcdctl endpoint health \
          --endpoints=https://127.0.0.1:2379 \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key \
          --cluster
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: etcd_health
      changed_when: false

    - name: Display etcd health
      ansible.builtin.debug:
        msg: "{{ etcd_health.stdout_lines }}"

    - name: List etcd members
      ansible.builtin.shell: |
        ETCDCTL_API=3 etcdctl member list \
          --endpoints=https://127.0.0.1:2379 \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: etcd_members
      changed_when: false

    - name: Display etcd members
      ansible.builtin.debug:
        msg: "{{ etcd_members.stdout_lines }}"

    - name: Verify kube-vip on new node
      ansible.builtin.command: kubectl get pod -n kube-system -l component=kube-vip --field-selector spec.nodeName={{ target_host }}
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: kube_vip_pod
      changed_when: false

    - name: Display kube-vip status
      ansible.builtin.debug:
        msg: "{{ kube_vip_pod.stdout_lines }}"

- name: Apply node labels
  hosts: "{{ target_host }}"
  become: true
  gather_facts: true

  tasks:
    - name: Apply topology zone label
      ansible.builtin.command: >
        kubectl label node {{ inventory_hostname }}
        topology.kubernetes.io/zone={{ datacenter }}
        --overwrite
      delegate_to: "{{ groups['control_plane'][0] }}"
      when: datacenter is defined

    - name: Apply topology region label
      ansible.builtin.command: >
        kubectl label node {{ inventory_hostname }}
        topology.kubernetes.io/region={{ region }}
        --overwrite
      delegate_to: "{{ groups['control_plane'][0] }}"
      when: region is defined

    - name: Apply topology country label
      ansible.builtin.command: >
        kubectl label node {{ inventory_hostname }}
        topology.kubernetes.io/country={{ country }}
        --overwrite
      delegate_to: "{{ groups['control_plane'][0] }}"
      when: country is defined

- name: Final verification
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Test API server on new control plane
      ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes
      delegate_to: "{{ target_host }}"
      register: api_test
      changed_when: false

    - name: Display API server test
      ansible.builtin.debug:
        msg: "{{ api_test.stdout_lines }}"

    - name: Success message
      ansible.builtin.debug:
        msg: |
          ============================================================
          ✅ Control Plane Node Added Successfully!
          ============================================================
          Node: {{ target_host }}
          Total Control Planes: {{ groups['control_plane'] | length }}
          etcd Quorum: {{ (groups['control_plane'] | length / 2) | int + 1 }} nodes required
          
          Cluster Status:
          - ✅ Node joined as control plane
          - ✅ etcd member added to cluster
          - ✅ kube-vip deployed for VIP failover
          - ✅ API server responding
          
          Verify with:
            kubectl get nodes -o wide
            kubectl get pods -n kube-system -l tier=control-plane
            kubectl get endpoints kubernetes
          
          Test failover:
            curl -k https://{{ vip_address }}:6443/healthz
          ============================================================
