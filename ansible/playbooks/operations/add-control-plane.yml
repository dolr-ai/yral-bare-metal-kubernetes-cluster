---
# Add Control Plane Node to Kubernetes Cluster
# Usage: ansible-playbook operations/add-control-plane.yml -e target_host=control-plane-X

- name: Add control plane node (provision, configure, join)
  hosts: "{{ target_host }}"
  gather_facts: false

  serial: 1

  roles:
    - role: provision
    - role: storage-setup
    - role: ssh-hardening
    - role: base-system
    - role: resolv-cleanup
    - role: sysctl-tuning
    - role: containerd
    - role: kubernetes
    - role: control-plane-join
    - role: node-labels
    - role: cloudflare-dns
