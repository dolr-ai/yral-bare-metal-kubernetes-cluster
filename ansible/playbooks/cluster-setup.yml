---
- name: Initialize Kubernetes cluster
  hosts: control_plane
  become: true
  gather_facts: true
  serial: 1

  roles:
    - role: ../roles/cluster-init

- name: Join worker nodes to cluster
  hosts: worker_nodes
  become: true
  gather_facts: true
  serial: 3

  roles:
    - role: ../roles/worker-join

- name: Label nodes with topology
  hosts: k8s_cluster
  become: true
  gather_facts: true

  roles:
    - role: ../roles/node-labels

- name: Verify cluster status
  hosts: control_plane[0]
  become: true
  gather_facts: false

  tasks:
    - name: Get all nodes
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: nodes_output
      changed_when: false

    - name: Display cluster nodes
      ansible.builtin.debug:
        msg: "{{ nodes_output.stdout_lines }}"

    - name: Get control plane pods
      ansible.builtin.command: kubectl get pods -n kube-system
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: pods_output
      changed_when: false

    - name: Display control plane pods
      ansible.builtin.debug:
        msg: "{{ pods_output.stdout_lines }}"
