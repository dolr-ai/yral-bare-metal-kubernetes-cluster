---
# Apply Hetzner Robot Firewall rules to a single node.
#
# Usage:
#   ansible-playbook ansible/playbooks/apply-firewall.yml -e target_host=control-plane-4
#
# Runs ONLY the hetzner-firewall role — no provisioning, no reboots.
# Use this to iterate on firewall rule changes without re-provisioning.

- name: Apply Hetzner Robot Firewall to node
  hosts: "{{ target_host }}"
  gather_facts: false
  become: false

  roles:
    - role: hetzner-firewall
