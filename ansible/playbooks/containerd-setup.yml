---
# containerd Setup for Kubernetes
# This playbook follows the official Kubernetes documentation:
# https://kubernetes.io/docs/setup/production-environment/container-runtimes/#containerd
#
# Strategy:
# 1. Install the latest containerd version from Docker's repository
# 2. Pin the installed version to prevent automatic updates
# 3. Configure systemd cgroup driver (supports both containerd 1.x and 2.x)
# 4. Enable CRI support and configure kernel modules
#
- name: Install and Configure containerd for Kubernetes
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true

  tasks:
    - name: Display target host information
      ansible.builtin.debug:
        msg:
          - "Installing containerd on: {{ ansible_hostname }}"
          - "IP: {{ ansible_host }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Install prerequisites for containerd
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Get Ubuntu codename
      ansible.builtin.shell: . /etc/os-release && echo "$VERSION_CODENAME"
      register: ubuntu_codename
      changed_when: false

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ubuntu_codename.stdout }} stable"
        state: present
        filename: docker

    - name: Update apt cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install latest containerd.io package
      ansible.builtin.apt:
        name: containerd.io
        state: latest
      register: containerd_install

    - name: Get installed containerd version
      ansible.builtin.shell: dpkg -l containerd.io | grep '^ii' | awk '{print $3}'
      register: containerd_version
      changed_when: false

    - name: Pin containerd to installed version
      ansible.builtin.dpkg_selections:
        name: containerd.io
        selection: hold

    - name: Display containerd installation status
      ansible.builtin.debug:
        msg:
          - "✅ containerd.io package installed successfully"
          - "Installed version: {{ containerd_version.stdout }}"
          - "Package pinned and held from auto-updates"

    - name: Configure kernel modules for Kubernetes
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Load overlay kernel module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter kernel module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Verify kernel modules are loaded
      ansible.builtin.shell: lsmod | grep -E "overlay|br_netfilter"
      register: kernel_modules
      changed_when: false

    - name: Display loaded kernel modules
      ansible.builtin.debug:
        msg: "{{ kernel_modules.stdout_lines }}"

    - name: Configure sysctl parameters for Kubernetes networking
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        owner: root
        group: root
        mode: "0644"

    - name: Apply sysctl parameters
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Verify sysctl parameters
      ansible.builtin.shell: |
        echo "net.ipv4.ip_forward = $(sysctl -n net.ipv4.ip_forward)"
        echo "net.bridge.bridge-nf-call-iptables = $(sysctl -n net.bridge.bridge-nf-call-iptables)"
        echo "net.bridge.bridge-nf-call-ip6tables = $(sysctl -n net.bridge.bridge-nf-call-ip6tables)"
      register: sysctl_status
      changed_when: false

    - name: Display sysctl parameters
      ansible.builtin.debug:
        msg: "{{ sysctl_status.stdout_lines }}"

    - name: Create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Check if containerd config exists
      ansible.builtin.stat:
        path: /etc/containerd/config.toml
      register: containerd_config

    - name: Generate default containerd configuration
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      when: not containerd_config.stat.exists

    - name: Read containerd config
      ansible.builtin.slurp:
        path: /etc/containerd/config.toml
      register: containerd_config_content

    - name: Detect containerd major version
      ansible.builtin.shell: containerd --version | awk '{print $3}' | cut -d'.' -f1 | sed 's/v//'
      register: containerd_major_version
      changed_when: false

    - name: Check if SystemdCgroup is already enabled
      ansible.builtin.set_fact:
        systemd_cgroup_enabled: "{{ containerd_config_content.content | b64decode | regex_search('SystemdCgroup = true') is not none }}"

    - name: Remove CRI plugin from disabled_plugins list
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^disabled_plugins = \["cri"\]'
        state: absent

    - name: Set SystemdCgroup = true for containerd 1.x
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        insertafter: '^\s*\[plugins\."io\.containerd\.grpc\.v1\.cri"\.containerd\.runtimes\.runc\.options\]'
        line: "            SystemdCgroup = true"
        state: present
      when:
        - not systemd_cgroup_enabled
        - containerd_major_version.stdout == "1"

    - name: Set SystemdCgroup = true for containerd 2.x
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        insertafter: '^\s*\[plugins\.[''"]io\.containerd\.cri\.v1\.runtime[''"]\.containerd\.runtimes\.runc\.options\]'
        line: "            SystemdCgroup = true"
        state: present
      when:
        - not systemd_cgroup_enabled
        - containerd_major_version.stdout == "2"

    - name: Verify SystemdCgroup configuration
      ansible.builtin.shell: grep -A 2 "runc.options" /etc/containerd/config.toml | grep SystemdCgroup || echo "NOT FOUND"
      register: systemd_cgroup_check
      changed_when: false

    - name: Display SystemdCgroup status
      ansible.builtin.debug:
        msg:
          - "Containerd version: {{ containerd_major_version.stdout }}.x"
          - "SystemdCgroup setting: {{ systemd_cgroup_check.stdout }}"

    - name: Restart containerd service
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Wait for containerd to be ready
      ansible.builtin.wait_for:
        path: /run/containerd/containerd.sock
        timeout: 30

    - name: Verify containerd service status
      ansible.builtin.systemd:
        name: containerd
        state: started
      register: containerd_status

    - name: Check containerd socket
      ansible.builtin.stat:
        path: /run/containerd/containerd.sock
      register: containerd_socket

    - name: Display containerd setup completion
      ansible.builtin.debug:
        msg:
          - "✅ containerd setup completed successfully"
          - "Service status: {{ containerd_status.status.ActiveState }}"
          - "Socket exists: {{ containerd_socket.stat.exists }}"
          - "Socket path: /run/containerd/containerd.sock"
