---
- name: Install and Configure containerd for Kubernetes
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Display target host information
      debug:
        msg:
          - "Installing containerd on: {{ ansible_hostname }}"
          - "IP: {{ ansible_host }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Install prerequisites for containerd
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Get Ubuntu codename
      shell: . /etc/os-release && echo "$VERSION_CODENAME"
      register: ubuntu_codename
      changed_when: false

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ubuntu_codename.stdout }} stable"
        state: present
        filename: docker

    - name: Update apt cache after adding Docker repository
      apt:
        update_cache: yes

    - name: Install containerd.io package (pinned to 1.7.x series)
      apt:
        name: containerd.io=1.7.*
        state: present
      register: containerd_install

    - name: Hold containerd package version
      dpkg_selections:
        name: containerd.io
        selection: hold

    - name: Display containerd installation status
      debug:
        msg:
          - "✅ containerd.io package installed successfully"
          - "Version: {{ containerd_install.stdout | default('1.7.x series') }}"
          - "Package held from auto-updates"

    - name: Configure kernel modules for Kubernetes
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Load overlay kernel module
      modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter kernel module
      modprobe:
        name: br_netfilter
        state: present

    - name: Verify kernel modules are loaded
      shell: lsmod | grep -E "overlay|br_netfilter"
      register: kernel_modules
      changed_when: false

    - name: Display loaded kernel modules
      debug:
        msg: "{{ kernel_modules.stdout_lines }}"

    - name: Configure sysctl parameters for Kubernetes networking
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        owner: root
        group: root
        mode: "0644"

    - name: Apply sysctl parameters
      command: sysctl --system
      changed_when: false

    - name: Verify sysctl parameters
      shell: |
        echo "net.ipv4.ip_forward = $(sysctl -n net.ipv4.ip_forward)"
        echo "net.bridge.bridge-nf-call-iptables = $(sysctl -n net.bridge.bridge-nf-call-iptables)"
        echo "net.bridge.bridge-nf-call-ip6tables = $(sysctl -n net.bridge.bridge-nf-call-ip6tables)"
      register: sysctl_status
      changed_when: false

    - name: Display sysctl parameters
      debug:
        msg: "{{ sysctl_status.stdout_lines }}"

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Check if containerd config exists
      stat:
        path: /etc/containerd/config.toml
      register: containerd_config

    - name: Generate default containerd configuration
      shell: containerd config default > /etc/containerd/config.toml
      when: not containerd_config.stat.exists

    - name: Read containerd config
      slurp:
        path: /etc/containerd/config.toml
      register: containerd_config_content

    - name: Check if SystemdCgroup is already enabled
      set_fact:
        systemd_cgroup_enabled: "{{ containerd_config_content.content | b64decode | regex_search('SystemdCgroup = true') is not none }}"

    - name: Configure systemd cgroup driver for containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: '(\[plugins\."io\.containerd\.grpc\.v1\.cri"\.containerd\.runtimes\.runc\.options\]\s+)(\w+)'
        after: '\[plugins\."io\.containerd\.grpc\.v1\.cri"\.containerd\.runtimes\.runc\.options\]'
        before: '\[plugins\."io\.containerd'
      when: not systemd_cgroup_enabled

    - name: Set SystemdCgroup = true in containerd config
      lineinfile:
        path: /etc/containerd/config.toml
        insertafter: '^\s*\[plugins\."io\.containerd\.grpc\.v1\.cri"\.containerd\.runtimes\.runc\.options\]'
        line: "            SystemdCgroup = true"
        state: present
      when: not systemd_cgroup_enabled

    - name: Verify SystemdCgroup configuration
      shell: grep -A 2 "runc.options" /etc/containerd/config.toml | grep SystemdCgroup || echo "NOT FOUND"
      register: systemd_cgroup_check
      changed_when: false

    - name: Display SystemdCgroup status
      debug:
        msg: "{{ systemd_cgroup_check.stdout }}"

    - name: Restart containerd service
      systemd:
        name: containerd
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: Wait for containerd to be ready
      wait_for:
        path: /run/containerd/containerd.sock
        timeout: 30

    - name: Verify containerd service status
      systemd:
        name: containerd
        state: started
      register: containerd_status

    - name: Check containerd socket
      stat:
        path: /run/containerd/containerd.sock
      register: containerd_socket

    - name: Display containerd setup completion
      debug:
        msg:
          - "✅ containerd setup completed successfully"
          - "Service status: {{ containerd_status.status.ActiveState }}"
          - "Socket exists: {{ containerd_socket.stat.exists }}"
          - "Socket path: /run/containerd/containerd.sock"
