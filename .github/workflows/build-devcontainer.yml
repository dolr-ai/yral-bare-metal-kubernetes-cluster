name: Build DevContainer Image

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and Cache DevContainer Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create stub SSH and gh config directories for devcontainer
        run: |
          # Create stub files/directories for devcontainer mounts
          # These are only needed for local development with WSL, not CI
          mkdir -p ~/.ssh ~/.config/gh
          touch ~/.ssh/agent.sock
          echo "Stub directories created for devcontainer mounts"

      - name: Pre-build dev container image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/dolr-ai/yral-k8s-devcontainer
          cacheFrom: ghcr.io/dolr-ai/yral-k8s-devcontainer
          push: always
