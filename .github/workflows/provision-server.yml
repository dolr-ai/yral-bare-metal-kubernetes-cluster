name: Provision Server with Ubuntu

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: "Target hostname (from inventory)"
        required: true
        type: string

env:
  ANSIBLE_HOST_KEY_CHECKING: False
  ANSIBLE_FORCE_COLOR: True

jobs:
  provision:
    name: Provision Server
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create stub SSH and gh config directories for devcontainer
        run: |
          # Create stub files/directories for devcontainer mounts
          # These are only needed for local development with WSL, not CI
          mkdir -p ~/.ssh ~/.config/gh
          touch ~/.ssh/agent.sock
          echo "Stub directories created for devcontainer mounts"

      - name: Provision server in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/dolr-ai/yral-k8s-devcontainer
          cacheFrom: ghcr.io/dolr-ai/yral-k8s-devcontainer
          push: never
          runCmd: |
            set -e
            
            # Enable colored output for Ansible
            export ANSIBLE_FORCE_COLOR=true
            
            # Set up vault password
            echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.vault_pass
            chmod 600 ansible/.vault_pass
            
            # Validate vault password file
            [ -s ansible/.vault_pass ] || { echo "ERROR: Vault password file is empty - GitHub secret may not be set"; exit 1; }
            echo "✓ Vault password file created ($(wc -c < ansible/.vault_pass) bytes)"
            
            # Test vault password with quick decryption
            ansible-vault view --vault-password-file=ansible/.vault_pass ansible/group_vars/all/vault.yml >/dev/null 2>&1 && echo "✓ Vault password validated successfully" || { echo "ERROR: Vault password test failed - incorrect password"; exit 1; }
            
            # Extract SSH key from vault (github-actions@yral.com)
            mkdir -p ~/.ssh
            ansible-vault view ansible/group_vars/all/vault.yml | awk '/vault_github_actions_ssh_private_key:/,/-----END OPENSSH PRIVATE KEY-----/' | tail -n +2 | sed 's/^  //' > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            
            # Cleanup function to remove temporary credentials
            cleanup() {
              rm -f ~/.ssh/id_rsa
              rm -f ansible/.vault_pass
            }
            trap cleanup EXIT
            
            # Run bare metal provisioning
            cd ansible
            ansible-playbook -i inventory/hosts.yml playbooks/provision-server.yml \
              -e "provision_target_host=${{ github.event.inputs.target_host }}" \
              -e "github_repository=${{ github.repository }}" \
              -v

      - name: Create job summary
        if: always()
        run: |
          cat << 'SUMMARY' >> $GITHUB_STEP_SUMMARY
          ## Server Provisioning

          **Target Host:** ${{ github.event.inputs.target_host }}
          **Status:** ${{ job.status }}
          **Triggered by:** @${{ github.actor }}

          ### Provisioning Steps

          1. ✅ Activated rescue mode with SSH keys
          2. ✅ Rebooted into rescue system
          3. ✅ Detected drive type and installed Ubuntu 24.04
          4. ✅ Rebooted into Ubuntu
          5. ✅ Ran system updates and configuration
          6. ✅ Expanded btrfs to second drive (if available)
          7. ✅ Hardened SSH security
          8. ✅ Installed containerd v1.7.x
          9. ✅ Installed Kubernetes v1.35.0

          ### Next Steps

          The server is now ready for Kubernetes cluster initialization.

          **Run full deployment:**
          \`\`\`bash
          # Via workflow
          gh workflow run deploy-cluster.yml -f playbook=full-deployment

          # Or locally
          cd ansible
          ansible-playbook -i inventory/hosts.yml playbooks/full-deployment.yml -v
          \`\`\`

          **Verify installation:**
          \`\`\`bash
          # SSH into the server
          ssh root@<server-ip>

          # Check services
          systemctl status containerd
          kubeadm version
          kubectl version --client
          \`\`\`
          SUMMARY
