name: Provision Server with Ubuntu

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: "Target hostname (from inventory)"
        required: true
        type: string

env:
  ANSIBLE_HOST_KEY_CHECKING: False
  ANSIBLE_FORCE_COLOR: True

jobs:
  provision:
    name: Provision Server
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: |
          pip install ansible

      - name: Setup Ansible Vault password
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.vault_pass
          chmod 600 ansible/.vault_pass

      - name: Configure SSH key from vault
        run: |
          mkdir -p ~/.ssh
          cd ansible

          # Extract SSH key from vault
          ansible localhost -m debug -a "var=github_actions_ssh_private_key" \
            -e "@group_vars/all/vault.yml" \
            -e "@group_vars/all/vars.yml" \
            --vault-password-file .vault_pass \
            | grep -A 100 "github_actions_ssh_private_key" \
            | tail -n +3 | grep -v "^}" | sed 's/^[[:space:]]*//' | sed 's/"$//' | sed 's/^"//' > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

      - name: Run server provisioning playbook
        run: |
          cd ansible
          ansible-playbook -i inventory/hosts.yml playbooks/provision-server.yml \
            -e "provision_target_host=${{ github.event.inputs.target_host }}" \
            -e "github_repository=${{ github.repository }}" \
            -v

      - name: Create job summary
        if: always()
        run: |
          cat << 'SUMMARY' >> $GITHUB_STEP_SUMMARY
          ## Server Provisioning

          **Target Host:** ${{ github.event.inputs.target_host }}
          **Status:** ${{ job.status }}
          **Triggered by:** @${{ github.actor }}

          ### Provisioning Steps

          1. ✅ Activated rescue mode with SSH keys
          2. ✅ Rebooted into rescue system
          3. ✅ Detected drive type and installed Ubuntu 24.04
          4. ✅ Rebooted into Ubuntu
          5. ✅ Ran system updates and configuration
          6. ✅ Expanded btrfs to second drive (if available)
          7. ✅ Hardened SSH security
          8. ✅ Installed containerd v1.7.x
          9. ✅ Installed Kubernetes v1.35.0

          ### Next Steps

          The server is now ready for Kubernetes cluster initialization.

          **Run full deployment:**
          \`\`\`bash
          # Via workflow
          gh workflow run deploy-cluster.yml -f playbook=full-deployment

          # Or locally
          cd ansible
          ansible-playbook -i inventory/hosts.yml playbooks/full-deployment.yml -v
          \`\`\`

          **Verify installation:**
          \`\`\`bash
          # SSH into the server
          ssh root@<server-ip>

          # Check services
          systemctl status containerd
          kubeadm version
          kubectl version --client
          \`\`\`
          SUMMARY
