name: Validate Ansible Playbooks

on:
  pull_request:
    paths:
      - "playbooks/**"
      - "roles/**"
      - "inventory/**"
      - "manifests/**"
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/validate-ansible.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate Syntax and Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create stub SSH and gh config directories for devcontainer
        run: |
          # Create stub files/directories for devcontainer mounts
          # These are only needed for local development with WSL, not CI
          mkdir -p ~/.ssh ~/.config/gh
          touch ~/.ssh/agent.sock
          echo "Stub directories created for devcontainer mounts"

      - name: Validate Ansible in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/dolr-ai/yral-k8s-devcontainer
          cacheFrom: ghcr.io/dolr-ai/yral-k8s-devcontainer
          push: never
          runCmd: |
            set -e
            
            # Install required Ansible collections
            echo "Installing Ansible collections..."
            ansible-galaxy collection install -r ansible/requirements.yml
            
            # Create vault password file for Ansible
            echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.vault_pass
            chmod 600 ansible/.vault_pass
            
            # Validate YAML syntax
            echo "Validating YAML files..."
            yamllint -c .yamllint ansible/ || true
            
            # Validate Ansible playbooks
            echo "Checking Ansible playbook syntax..."
            for playbook in ansible/playbooks/*.yml; do
              echo "Checking $playbook..."
              ansible-playbook --syntax-check "$playbook"
            done
            
            # Run ansible-lint
            echo "Running ansible-lint..."
            ansible-lint ansible/playbooks/ ansible/roles/ || true
            
            # Validate inventory
            echo "Validating inventory structure..."
            ansible-inventory --list > /dev/null
            
            # Check for required secrets
            echo "Checking inventory for required placeholders..."
            if grep -q "PLACEHOLDER_UPDATE_ME" ansible/inventory/hosts.yml; then
              echo "⚠️  Warning: Found PLACEHOLDER_UPDATE_ME in inventory"
              echo "Please update the following in ansible/inventory/hosts.yml:"
              echo "  - hetzner_s3_access_key"
              echo "  - hetzner_s3_bucket"
              echo ""
              echo "Also ensure these GitHub Secrets are set:"
              echo "  - HETZNER_ROBOT_PASSWORD"
              echo "  - HETZNER_S3_SECRET_KEY"
              echo "  - HETZNER_BARE_METAL_GITHUB_ACTIONS_SSH_PRIVATE_KEY"
            else
              echo "✅ No placeholders found in inventory"
            fi

      - name: Create validation summary
        if: always()
        run: |
          cat << 'SUMMARY' >> $GITHUB_STEP_SUMMARY
          ## Ansible Validation Results

          **Status**: ${{ job.status }}

          ### Files Validated

          - ✅ Playbooks: `ansible/playbooks/*.yml`
          - ✅ Roles: `ansible/roles/*/tasks/main.yml`
          - ✅ Inventory: `ansible/inventory/hosts.yml`
          - ✅ Manifests: `ansible/manifests/*.yaml`

          ### Validation Steps

          1. **YAML Syntax**: Checked with yamllint
          2. **Ansible Syntax**: Checked with ansible-playbook --syntax-check
          3. **Best Practices**: Checked with ansible-lint
          4. **Inventory Structure**: Validated with ansible-inventory

          ### Before Deployment

          Ensure these are configured:

          **Inventory placeholders** (in `ansible/inventory/hosts.yml`):
          - `hetzner_s3_access_key`: Your Hetzner Object Storage access key
          - `hetzner_s3_bucket`: Your S3 bucket name

          **GitHub Secrets**:
          - `HETZNER_ROBOT_PASSWORD`: Hetzner Robot API password
          - `HETZNER_S3_SECRET_KEY`: S3 secret key
          - `HETZNER_BARE_METAL_GITHUB_ACTIONS_SSH_PRIVATE_KEY`: SSH private key

          **DNS Configuration**:
          - `kubernetes-api.yral.com` → `77.42.49.55` (DNS-only, not proxied)
          SUMMARY
