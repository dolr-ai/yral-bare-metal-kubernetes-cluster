name: Weekly System Update

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      target:
        description: "Limit to a single node (e.g. worker-3 or control-plane-2). Leave blank to run all nodes."
        required: false
        default: ""

jobs:
  update:
    name: System Update
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h — accommodates a full cluster serial upgrade

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # devcontainer.json bind-mounts ~/.ssh/agent.sock from the host so
      # developers can forward their SSH agent into the container. In CI
      # there is no SSH agent socket, so create a placeholder file to
      # prevent Docker from failing on the missing bind-mount source.
      - name: Create SSH agent socket placeholder
        run: mkdir -p ~/.ssh && touch ~/.ssh/agent.sock

      # devcontainer.json bind-mounts ~/.config/gh so the gh CLI config is
      # available inside the container. GitHub-hosted runners don't pre-create
      # this directory, so Docker refuses to start with a "bind source path
      # does not exist" error. Create an empty directory as a placeholder.
      - name: Create gh config placeholder
        run: mkdir -p ~/.config/gh

      # Runs the upgrade entirely inside the dev container so the environment
      # is identical to local development. postCreate.sh (which installs pip
      # packages and Ansible collections) runs automatically during container
      # build before runCmd executes.
      - name: Run system update inside dev container
        uses: devcontainers/ci@v0.3
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          TARGET_HOST: ${{ github.event.inputs.target || '' }}
        with:
          push: never
          # Forward the two CI-specific env vars into the container.
          env: |
            ANSIBLE_VAULT_PASSWORD
            TARGET_HOST
          # set -euo pipefail: any non-zero exit (including a single failed
          # node upgrade) immediately aborts the entire run.
          runCmd: |
            set -euo pipefail

            # ── Secret bootstrap ───────────────────────────────────────────────
            # Write the vault password so postCreate.sh can decrypt the vault.
            # postCreate.sh ran during container build but skipped all secret
            # extraction steps because the vault pass didn't exist yet — re-run
            # it now so SSH key, kubeconfig, and age key are all materialised.
            printf '%s' "$ANSIBLE_VAULT_PASSWORD" > ansible/.vault_pass
            .devcontainer/postCreate.sh

            # ── Control planes first — etcd quorum must remain stable ──────────
            # serial: 1 is enforced in the playbook; set -e stops on first failure.
            # On reboot: the role drains, deletes, reboots, rejoins, and uncordons
            # automatically. Cloudflare DNS A records are managed by the
            # node-remove / control-plane-join roles.
            # Skipped when a specific worker target is provided.
            if [[ -n "${TARGET_HOST:-}" && "$TARGET_HOST" == worker-* ]]; then
              echo "Skipping control plane upgrade — target is a worker node."
            else
              EXTRA_ARGS=()
              [[ -n "${TARGET_HOST:-}" ]] && EXTRA_ARGS=(-e "target_host=${TARGET_HOST}")
              ansible-playbook ansible/playbooks/operations/upgrade-control-plane.yml \
                -v "${EXTRA_ARGS[@]}"
            fi

            # ── Workers after all control planes are healthy ───────────────────
            # serial: 1 ensures Longhorn replica rebuilds complete before the
            # next worker is drained.
            # Skipped when a specific control-plane target is provided.
            if [[ -n "${TARGET_HOST:-}" && "$TARGET_HOST" == control-plane-* ]]; then
              echo "Skipping worker upgrade — target is a control plane node."
            else
              EXTRA_ARGS=()
              [[ -n "${TARGET_HOST:-}" ]] && EXTRA_ARGS=(-e "target_host=${TARGET_HOST}")
              ansible-playbook ansible/playbooks/operations/upgrade-worker.yml \
                -v "${EXTRA_ARGS[@]}"
            fi

            # ── Clean up vault password ────────────────────────────────────────
            # The container is ephemeral so this is belt-and-suspenders hygiene.
            shred -u ansible/.vault_pass
