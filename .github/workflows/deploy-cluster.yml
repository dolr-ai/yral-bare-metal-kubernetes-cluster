name: Deploy Kubernetes Cluster

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: "Playbook to run"
        required: true
        type: choice
        options:
          - "base-system-setup"
          - "kubernetes-only"
          - "full-deployment"
          - "helm-install"
          - "kube-vip-deploy"
          - "cluster-setup"
          - "cilium-deploy"
          - "monitoring-deploy"
          - "etcd-backup"
          - "velero-install"

env:
  ANSIBLE_HOST_KEY_CHECKING: False
  ANSIBLE_FORCE_COLOR: True

jobs:
  deploy:
    name: Run Ansible Playbook
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: |
          pip install ansible

      - name: Setup Ansible Vault password
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.vault_pass
          chmod 600 ansible/.vault_pass

      - name: Configure SSH key from vault
        run: |
          mkdir -p ~/.ssh
          cd ansible

          # Extract SSH key from vault
          ansible localhost -m debug -a "var=github_actions_ssh_private_key" \
            -e "@group_vars/all/vault.yml" \
            -e "@group_vars/all/vars.yml" \
            --vault-password-file .vault_pass \
            | grep -A 100 "github_actions_ssh_private_key" \
            | tail -n +3 | grep -v "^}" | sed 's/^[[:space:]]*//' | sed 's/"$//' | sed 's/^"//' > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          # Add known hosts for control planes
          ssh-keyscan -H 95.216.228.60 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H 95.216.6.238 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H 95.216.24.51 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test connectivity to control planes
        run: |
          cd ansible
          ansible control_plane -i inventory/hosts.yml -m ping

      - name: Run selected playbook
        run: |
          cd ansible
          case "${{ github.event.inputs.playbook }}" in
            "base-system-setup")
              ansible-playbook -i inventory/hosts.yml playbooks/base-system-setup.yml -v
              ;;
            "kubernetes-only")
              ansible-playbook -i inventory/hosts.yml playbooks/kubernetes-only.yml -v
              ;;
            "full-deployment")
              ansible-playbook -i inventory/hosts.yml playbooks/full-deployment.yml -v
              ;;
            *)
              ansible-playbook -i inventory/hosts.yml playbooks/${{ github.event.inputs.playbook }}.yml -v
              ;;
          esac

      - name: Create deployment summary
        if: always()
        run: |
          cat << 'SUMMARY' >> $GITHUB_STEP_SUMMARY
          ## Kubernetes Cluster Deployment

          **Playbook**: ${{ github.event.inputs.playbook }}
          **Status**: ${{ job.status }}
          **Triggered by**: @${{ github.actor }}

          ### Deployment Options

          - **full-deployment**: Complete deployment (base setup + all Kubernetes components)
          - **base-system-setup**: System preparation (updates, SSH, containerd, kubeadm)
          - **kubernetes-only**: Kubernetes stack only (helm → velero)
          - Individual playbooks: Run specific components

          ### Cluster Information

          - **Control Plane VIP**: 77.42.49.55
          - **API Endpoint**: https://kubernetes-api.yral.com:6443
          - **Hubble UI**: http://95.217.49.194
          - **Grafana**: http://95.217.49.195

          ### Next Steps

          **Verify cluster status:**
          \`\`\`bash
          ssh root@95.216.228.60 'kubectl get nodes -o wide'
          \`\`\`

          **Check Cilium:**
          \`\`\`bash
          ssh root@95.216.228.60 'kubectl -n kube-system exec ds/cilium -- cilium-dbg status'
          \`\`\`

          **Access Grafana:**
          \`\`\`bash
          ssh root@95.216.228.60 'cat /root/grafana-access.txt'
          \`\`\`

          ### Troubleshooting

          \`\`\`bash
          kubectl get pods -n kube-system     # Core components
          kubectl get pods -n monitoring      # Prometheus, Grafana
          kubectl get pods -n velero          # Backup system
          \`\`\`
          SUMMARY
