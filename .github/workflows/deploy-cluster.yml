name: Deploy Kubernetes Cluster

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: "Playbook to run"
        required: true
        type: choice
        options:
          - "base-system-setup"
          - "kubernetes-only"
          - "full-deployment"
          - "helm-install"
          - "kube-vip-deploy"
          - "cluster-setup"
          - "cilium-deploy"
          - "monitoring-deploy"
          - "etcd-backup"
          - "velero-install"

env:
  ANSIBLE_HOST_KEY_CHECKING: False
  ANSIBLE_FORCE_COLOR: True

jobs:
  deploy:
    name: Run Ansible Playbook
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create stub SSH and gh config directories for devcontainer
        run: |
          # Create stub files/directories for devcontainer mounts
          # These are only needed for local development with WSL, not CI
          mkdir -p ~/.ssh ~/.config/gh
          touch ~/.ssh/agent.sock
          echo "Stub directories created for devcontainer mounts"

      - name: Run Ansible playbook in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/dolr-ai/yral-k8s-devcontainer
          cacheFrom: ghcr.io/dolr-ai/yral-k8s-devcontainer
          push: never
          runCmd: |
            set -e
            
            # Enable colored output for Ansible
            export ANSIBLE_FORCE_COLOR=true
            
            # Set up vault password
            echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.vault_pass
            chmod 600 ansible/.vault_pass
            
            # Validate vault password file
            [ -s ansible/.vault_pass ] || { echo "ERROR: Vault password file is empty - GitHub secret may not be set"; exit 1; }
            echo "✓ Vault password file created ($(wc -c < ansible/.vault_pass) bytes)"
            
            # Test vault password with quick decryption
            ansible-vault view ansible/group_vars/all/vault.yml >/dev/null 2>&1 && echo "✓ Vault password validated successfully" || { echo "ERROR: Vault password test failed - incorrect password"; exit 1; }
            
            # Extract SSH key from vault (github-actions@yral.com)
            mkdir -p ~/.ssh
            ansible-vault view ansible/group_vars/all/vault.yml | awk '/vault_github_actions_ssh_private_key:/,/-----END OPENSSH PRIVATE KEY-----/' | tail -n +2 | sed 's/^  //' > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            
            # Cleanup function to remove temporary credentials
            cleanup() {
              rm -f ~/.ssh/id_rsa
              rm -f ansible/.vault_pass
            }
            trap cleanup EXIT
            
            # Test connectivity to control planes
            ansible control_plane -m ping
            
            # Run selected playbook
            case "${{ github.event.inputs.playbook }}" in
              "base-system-setup")
                ansible-playbook ansible/playbooks/base-system-setup.yml -v
                ;;
              "kubernetes-only")
                ansible-playbook ansible/playbooks/kubernetes-only.yml -v
                ;;
              "full-deployment")
                ansible-playbook ansible/playbooks/full-deployment.yml -v
                ;;
              *)
                ansible-playbook ansible/playbooks/${{ github.event.inputs.playbook }}.yml -v
                ;;
            esac

      - name: Create deployment summary
        if: always()
        run: |
          cat << 'SUMMARY' >> $GITHUB_STEP_SUMMARY
          ## Kubernetes Cluster Deployment

          **Playbook**: ${{ github.event.inputs.playbook }}
          **Status**: ${{ job.status }}
          **Triggered by**: @${{ github.actor }}

          ### Deployment Options

          - **full-deployment**: Complete deployment (base setup + all Kubernetes components)
          - **base-system-setup**: System preparation (updates, SSH, containerd, kubeadm)
          - **kubernetes-only**: Kubernetes stack only (helm → velero)
          - Individual playbooks: Run specific components

          ### Cluster Information

          - **Control Plane VIP**: 77.42.49.55
          - **API Endpoint**: https://kubernetes-api.yral.com:6443
          - **Hubble UI**: http://95.217.49.194
          - **Grafana**: http://95.217.49.195

          ### Next Steps

          **Verify cluster status:**
          \`\`\`bash
          ssh root@95.216.228.60 'kubectl get nodes -o wide'
          \`\`\`

          **Check Cilium:**
          \`\`\`bash
          ssh root@95.216.228.60 'kubectl -n kube-system exec ds/cilium -- cilium-dbg status'
          \`\`\`

          **Access Grafana:**
          \`\`\`bash
          ssh root@95.216.228.60 'cat /root/grafana-access.txt'
          \`\`\`

          ### Troubleshooting

          \`\`\`bash
          kubectl get pods -n kube-system     # Core components
          kubectl get pods -n monitoring      # Prometheus, Grafana
          kubectl get pods -n velero          # Backup system
          \`\`\`
          SUMMARY
