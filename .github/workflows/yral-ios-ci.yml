name: Yral iOS CI

# Single workflow for the native iOS app (apps/yral-ios). Local and CI run
# the SAME mise checks task — CI needs only: a working mise + the Ansible vault
# password (the root repo's only GitHub secret). `mise run bootstrap`
# extracts the age key from the vault; fnox decrypts the Firebase plist from
# fnox.toml. No repo-scoped iOS secrets, no fastlane, no CocoaPods.
#
#   pull_request          → mise run yral-ios-checks (lint + tests + sim build)
#   push/merge to main    → same checks (deploys run locally — see the
#                           commented-out deploy job below)
#
# Dependabot/Renovate PRs are SKIPPED: GitHub never delivers repo secrets
# (ANSIBLE_VAULT_PASSWORD) to workflows triggered by those bots, so the
# vault → age key → fnox chain can never work there. The bumped action version
# gets validated by the push-to-main run after the bot PR merges, which does
# have secrets.
on:
  pull_request:
    paths:
      - "apps/yral-ios/**"
      - ".github/workflows/yral-ios-ci.yml"
      - "fnox.toml"
      - "mise.toml"
  push:
    branches:
      - main
    paths:
      - "apps/yral-ios/**"
      - ".github/workflows/yral-ios-ci.yml"
      - "fnox.toml"
      - "mise.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs cancel freely; main runs serialize (one checks run at a time).
  group: yral-ios-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: macos-latest
    # Dependabot/Renovate PR workflows receive NO repo secrets (GitHub policy —
    # same as fork PRs), so the vault-dependent checks can never run there.
    # Skip instead of failing (PR #249 failed exactly this way).
    # user.type == 'Bot' covers dependabot[bot], renovate[bot], AND
    # GitHub-App style logins (e.g. `app/renovate`) that lack the [bot] suffix.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # mise-action installs the toolchain declared in mise.toml. Xcode itself
      # is pinned below (preinstalled on the runner image).
      - name: Set up mise + project tools
        uses: jdx/mise-action@v2

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Same bootstrap as local: fnox exec (used by the checks step for the
      # gitignored GoogleService-Info.plist) requires the age key to decrypt
      # fnox secrets. Without this, fnox exec fails resolving the first
      # secret with identity_read_failed.
      - name: Bootstrap (vault → age key → fnox)
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          echo "$ANSIBLE_VAULT_PASSWORD" > ansible/.vault_pass
          chmod 600 ansible/.vault_pass
          [ -s ansible/.vault_pass ] || { echo "ERROR: vault password empty"; exit 1; }
          mise run bootstrap

      - name: Run checks (lint + package tests + simulator build)
        # fnox exec injects YRAL_IOS_FIREBASE_PLIST_BASE64 — the gitignored
        # GoogleService-Info.plist is a required bundle resource for the
        # xcodebuild step.
        run: fnox exec -- mise run yral-ios-checks

  # TestFlight deploy DISABLED (2026-09-01): macOS runners on the free
  # public pool queue for 1h+ and the deploy job can be starved entirely —
  # it also raced ahead of the latest commit on at least one occasion.
  # Deploys run LOCALLY: `fnox exec -- mise run yral-ios-upload-testflight`
  # (identical mise task — local and CI run the same checks either way).
  # To re-enable: uncomment this job (and the bootstrap step it needs).
  # upload-testflight:
  #   needs: checks
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   runs-on: macos-latest
  #   steps:
