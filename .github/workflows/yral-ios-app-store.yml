name: Yral iOS → App Store

# App Store distribution on published release tags containing "iOS"
# (legacy repo convention, e.g. "v4.0.0-iOS"). Same mise/fnox pattern as
# yral-ios-ci.yml: the runner only has mise + the Ansible vault password;
# everything else bootstraps from the repo (bootstrap → age key → fnox).
# Upload path is Apple-canonical: xcodebuild archive → -exportArchive →
# xcrun altool (inside mise run yral-ios-upload-testflight).
on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: yral-ios-app-store-deploy
  cancel-in-progress: false

jobs:
  build-release:
    if: contains(github.event.release.tag_name, 'iOS')
    runs-on: macos-latest

    steps:
      - name: Extract version from release tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION=$(echo "$TAG" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Could not extract valid semver from tag '$TAG', got: '$VERSION'" >&2
            exit 1
          fi
          echo "Extracted version: $VERSION from tag: $TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Plain checkout with the default GITHUB_TOKEN: `permissions: contents:
      # write` (top of this file) + persist-credentials (checkout default)
      # is GitHub's documented way to push the version bump back to main.
      - name: Check out main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update iOS version files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # MARKETING_VERSION is Apple's fixed Xcode build-setting name for
          # the user-facing version (CFBundleShortVersionString) — "marketing"
          # as opposed to the build number (CURRENT_PROJECT_VERSION). It is
          # set on both Debug and Release configurations of the shell target.
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = ${VERSION};/g" apps/yral-ios/iosApp.xcodeproj/project.pbxproj
          echo "Updated MARKETING_VERSION entries:"
          grep -n "MARKETING_VERSION" apps/yral-ios/iosApp.xcodeproj/project.pbxproj

      - name: Set up mise + project tools
        uses: jdx/mise-action@v2

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bootstrap (vault → age key → fnox)
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          echo "$ANSIBLE_VAULT_PASSWORD" > ansible/.vault_pass
          chmod 600 ansible/.vault_pass
          [ -s ansible/.vault_pass ] || { echo "ERROR: vault password empty"; exit 1; }
          mise run bootstrap

      # Same task local and CI run for the TestFlight upload; the App Store
      # release reuses the archive+export+altool steps it contains.
      - name: Archive + upload to App Store Connect
        run: fnox exec -- mise run yral-ios-upload-testflight

      - name: Commit version changes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/yral-ios/iosApp.xcodeproj/project.pbxproj
          git commit -m "[skip ci] chore: bump iOS prod version to ${{ steps.version.outputs.version }}"
          git pull --rebase origin main
          git push origin main

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yral-ios-app-store-build-logs
          path: apps/yral-ios/build
          retention-days: 5
          if-no-files-found: ignore
