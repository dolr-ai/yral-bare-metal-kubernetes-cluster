[toolchain]
# Latest STABLE (not nightly: zero #![feature] gates workspace-wide, and
# nightly-2026-09-08 wasm codegen drifted into breaking `spacetime generate`).
# rustup resolves "stable" per machine; the mise.lock entry (mise-managed)
# is the reproducible pin a fresh checkout installs before cargo ever runs.
channel = "stable"
components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"]
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-musl"]
profile = "default"
