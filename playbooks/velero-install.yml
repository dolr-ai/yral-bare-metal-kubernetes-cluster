---
- name: Install Velero for cluster backups
  hosts: control_plane[0]
  become: true
  gather_facts: true

  vars:
    velero_version: "v1.14.1"
    velero_namespace: "velero"

  tasks:
    - name: Display Velero installation parameters
      debug:
        msg:
          - "Installing Velero {{ velero_version }}"
          - "S3 bucket: {{ hetzner_s3_bucket }}"
          - "S3 endpoint: {{ hetzner_s3_endpoint }}"
          - "S3 region: {{ hetzner_s3_region }}"
          - "Backup retention: 30 days"

    - name: Check if Velero is already installed
      command: kubectl get namespace {{ velero_namespace }}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: velero_ns_check
      changed_when: false
      failed_when: false

    - name: Skip if Velero is already installed
      debug:
        msg: "Velero is already installed"
      when: velero_ns_check.rc == 0

    - name: Install Velero
      when: velero_ns_check.rc != 0
      block:
        - name: Download Velero CLI
          get_url:
            url: "https://github.com/vmware-tanzu/velero/releases/download/{{ velero_version }}/velero-{{ velero_version }}-linux-amd64.tar.gz"
            dest: "/tmp/velero-{{ velero_version }}-linux-amd64.tar.gz"
            mode: "0644"

        - name: Extract Velero CLI
          unarchive:
            src: "/tmp/velero-{{ velero_version }}-linux-amd64.tar.gz"
            dest: /tmp/
            remote_src: yes

        - name: Install Velero CLI
          copy:
            src: "/tmp/velero-{{ velero_version }}-linux-amd64/velero"
            dest: /usr/local/bin/velero
            mode: "0755"
            remote_src: yes

        - name: Verify Velero CLI installation
          command: velero version --client-only
          register: velero_version_check
          changed_when: false

        - name: Display Velero CLI version
          debug:
            msg: "{{ velero_version_check.stdout_lines }}"

        - name: Create Velero credentials file
          copy:
            content: |
              [default]
              aws_access_key_id={{ hetzner_s3_access_key }}
              aws_secret_access_key={{ hetzner_s3_secret_key }}
            dest: /tmp/velero-credentials
            mode: "0600"

        - name: Install Velero in cluster
          command: >
            velero install
            --provider aws
            --plugins velero/velero-plugin-for-aws:v1.10.0
            --bucket {{ hetzner_s3_bucket }}
            --secret-file /tmp/velero-credentials
            --backup-location-config region={{ hetzner_s3_region }},s3ForcePathStyle=true,s3Url={{ hetzner_s3_endpoint }}
            --snapshot-location-config region={{ hetzner_s3_region }}
            --use-volume-snapshots=false
          environment:
            KUBECONFIG: /etc/kubernetes/admin.conf
          register: velero_install

        - name: Display Velero installation output
          debug:
            msg: "{{ velero_install.stdout_lines }}"

        - name: Remove credentials file
          file:
            path: /tmp/velero-credentials
            state: absent

        - name: Wait for Velero deployment to be ready
          command: kubectl wait --for=condition=available deployment/velero -n velero --timeout=180s
          environment:
            KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Create daily backup schedule
      command: >
        kubectl apply -f - <<EOF
        apiVersion: velero.io/v1
        kind: Schedule
        metadata:
          name: daily-backup
          namespace: velero
        spec:
          schedule: "0 3 * * *"
          template:
            includedNamespaces:
            - "*"
            excludedNamespaces:
            - velero
            - kube-system
            ttl: 720h0m0s
            storageLocation: default
            volumeSnapshotLocations:
            - default
        EOF
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: schedule_create
      changed_when: "'created' in schedule_create.stdout or 'configured' in schedule_create.stdout"

    - name: Get Velero status
      command: velero backup-location get
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: velero_status
      changed_when: false

    - name: Display Velero backup location status
      debug:
        msg: "{{ velero_status.stdout_lines }}"

    - name: Get backup schedules
      command: velero schedule get
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: schedules_output
      changed_when: false

    - name: Display backup schedules
      debug:
        msg: "{{ schedules_output.stdout_lines }}"

    - name: Create manual backup (test)
      command: velero backup create test-backup-{{ ansible_date_time.epoch }} --wait
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: test_backup
      changed_when: false
      failed_when: false

    - name: Display test backup result
      debug:
        msg: "{{ test_backup.stdout_lines }}"
      when: test_backup.rc == 0

    - name: List recent backups
      command: velero backup get
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: backups_list
      changed_when: false

    - name: Display recent backups
      debug:
        msg: "{{ backups_list.stdout_lines }}"

    - name: Create Velero usage documentation
      copy:
        content: |
          Velero Backup & Restore Guide
          ==============================

          Installation:
          - Version: {{ velero_version }}
          - Namespace: {{ velero_namespace }}
          - S3 Bucket: {{ hetzner_s3_bucket }}
          - S3 Endpoint: {{ hetzner_s3_endpoint }}

          Automatic Backups:
          - Schedule: Daily at 3 AM UTC
          - Retention: 30 days
          - Excludes: velero, kube-system namespaces

          Manual Backup Commands:

          # Create full cluster backup
          velero backup create manual-backup-$(date +%Y%m%d-%H%M%S) --wait

          # Backup specific namespace
          velero backup create my-namespace-backup --include-namespaces my-namespace

          # List all backups
          velero backup get

          # Describe a backup
          velero backup describe <backup-name>

          # Download backup logs
          velero backup logs <backup-name>

          Restore Commands:

          # Restore from latest backup
          velero restore create --from-backup <backup-name>

          # Restore specific namespace
          velero restore create --from-backup <backup-name> --include-namespaces my-namespace

          # List all restores
          velero restore get

          # Describe a restore
          velero restore describe <restore-name>

          Delete Backups:

          # Delete a specific backup
          velero backup delete <backup-name>

          # Delete backups older than 30 days (automatic via TTL)

          Important Notes:
          - Volume snapshots are disabled (using Hetzner Object Storage)
          - PersistentVolumes are backed up if using CSI snapshots
          - Test restore procedures regularly
          - Monitor backup success in S3 bucket
          - Check Velero logs: kubectl logs -n velero deployment/velero

          Monitoring:
          - Check backup status: velero backup get
          - Check schedule status: velero schedule get
          - View Velero logs: kubectl logs -n velero -l component=velero
        dest: /root/velero-usage.txt
        mode: "0644"

    - name: Display installation summary
      debug:
        msg:
          - "✅ Velero installation completed successfully"
          - ""
          - "Configuration:"
          - "  - Version: {{ velero_version }}"
          - "  - Namespace: {{ velero_namespace }}"
          - "  - S3 bucket: {{ hetzner_s3_bucket }}"
          - "  - Backup schedule: Daily at 3 AM UTC"
          - "  - Retention: 30 days"
          - ""
          - "Quick commands:"
          - "  - Create backup: velero backup create my-backup"
          - "  - List backups: velero backup get"
          - "  - Restore: velero restore create --from-backup <name>"
          - ""
          - "Documentation saved to /root/velero-usage.txt"
          - ""
          - "⚠️  Important:"
          - "  - Test restore procedure regularly"
          - "  - Monitor backup success in S3"
          - "  - Volume snapshots are disabled (using S3 only)"
