---
- name: Deploy kube-vip on control plane nodes
  hosts: control_plane
  become: true
  gather_facts: true

  roles:
    - kube-vip

  post_tasks:
    - name: Verify kube-vip manifest exists
      stat:
        path: /etc/kubernetes/manifests/kube-vip.yaml
      register: kube_vip_manifest_stat

    - name: Display verification result
      debug:
        msg: "✅ kube-vip manifest is ready at /etc/kubernetes/manifests/kube-vip.yaml"
      when: kube_vip_manifest_stat.stat.exists

    - name: Fail if manifest not created
      fail:
        msg: "❌ kube-vip manifest was not created successfully"
      when: not kube_vip_manifest_stat.stat.exists
